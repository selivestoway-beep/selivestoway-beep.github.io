 изменится так, чтобы лучше плавать и станет чем-то подобен рыбе; лесной тролль с легкостью замаскируется под поросший мхом валун, а снежный обрастет шерстью и сможет выжить даже в самых ужасных холодах. Известно, что в Горах Архимага вокруг Казакии обитает древний тролль, обросший кристаллами звездной пыли и обучившийся псевдозаклинаниям астромантии: преподаватели нередко ругают студентов, говоря, что даже эта образина справилась лучше.\n\nИх интеллект и характер очень сильно зависят от того, к каким именно условиям они адаптируются, но, в основном, оба качества оставляют желать лучшего. Очень сильно желать и гораздо лучшего. В конце-концов, какую бы форму они не приняли, им присуще еще одно качество: тролль никогда не перестает расти. Старейшие тролли застали рассвет Антерена, но, как назло, слишком тупы, чтобы рассказать о нем что-то путное.\n\nИменно так: как и у прочих потомков Гайанов, у них отсутствует естественный жизненный срок: тролль, со временем, становится только больше и сильнее. Однако же, и пропитания ему становится нужно все больше... конфликт интересов становится несколько предсказуем.\n\nСамые разные виды троллей считаются источником разнообразнейших же компонентов, крайне ценимых алхимиками.", "category": "Расы", "createdAt": 1793632093893, "order": 5, "summary": "Потомки каменных Гайанов: великаны, энты и тролли.", "title": "Род Гигантов", "updatedAt": 1793641859264, "updatedBy": null}, "raitriari": {"aliases": ["Совершенный Народ", "Фаргот Ур", "Король-Бог", "Технологии Источника", "Камень Душ"], "body": "Одна из трех эльфийских ветвей, образовавшихся после **Раскола** — события времен Эпохи Увядания, разделившего народ Адон-Тирлейдда на ушедших в Бездну последователей Таулендина — аэклари; последовавших в изгнание за Эланой ур-Синаран незетари и, собственно, райтриари, сохранивших верность идеалам Великого Дома Иллантар.\n\nРайтриари, во времена своего расцвета сил, были наиболее многочисленной и могущественной из всех эльфийских ветвей. **Технологии Источника**, правление Короля-Бога и жесткая, милитаризированная общественная структура позволили им совершить невозможное, вернуть бессмертие и на долгое время закрепиться как одна из двух крупнейших мировых сил.\n\n## История\n\nСвое название — райтриари (от эльф. raidra - совершенство и rae - народ) — ветвь получила лишь через четыре с половиной столетия после Раскола, уже после своего поражения в Войне Непокорства. До этого, основная часть эльфийского народа, не сбежавшая строить собственное королевство в Бездне и не объявившая себя \"единственными верными Древу\", продолжила называться как раньше — адонари, вечным народом.\n\nОсновной идеологией ветви стало сохранение этой самой \"вечности\" — Древа и своего собственного народа. Беспрестанно ученые трудились над самыми разными способами обратить [[Увядание]] вспять или продлить собственную жизнь, и множество открытий было сделано в ту эпоху, но ни одно не приблизило их к желаемой цели.\n\nОдним из таких открытий стали люди, deyneri. Созданная Институтом раса служителей, увы, никак не помогла в возвращении бессмертия или иных основных задача. Хуже того, именно они стали основной причиной дальнейшего изменения всего эльфийского общества.\n\nУпавшая Звезда, оставившая после себя Источник, разделила историю на до и после. Обреченное на провал восстание варварских королевств дейнари превратилось в Войну Непокорства: человечество повели пятеро Владык, овладевшие искусством черпать Невозможную Энергию из Источника. Для примитивной расы людей, они стали живыми богами.\n\nДо сих пор неизвестно, по какой именно причине эльфы не могли сделать то же самое напрямую. Невозможная Энергия была несовместима с ними, и, лишенные даже преимущества в чистой мощи, они были вынуждены отступить за Каалагон, в северный предел Готтлейда.\n\nТак началась [[Эра Владык]], эпоха безмерного, стремительного роста Антерена — основанной ими цивилизации, и его Великих Завоеваний.\n\nСуществует мнение, что антеренцы сами выковали своего грядущего соперника. Основываясь на Единой Теории Волшебства и описанных в ней фундаментальных принципах единой Таинственной Силы, глава Института — Ареллен ур'Иллантар, создал Центральный Столп Преобразования, позволявший конвертировать поступающую энергию Источника в обработанный и пригодный для использования вид. Это положило начало Невозможным Технологиям, или же, в более известном виде — **Технологиям Источника**.\n\nК счастью, разработка завершилась еще в те времена, когда живые боги Антерена еще не освоили Источник полностью: в ходе нескольких операций высшей секретности, адонари удалось настроить на Столп Преобразования пока еще свободные потоки, заполучив приблизительно 40% мощности Источника.\n\nПринцип бесконечной энергии, ограниченной лишь пропускной способностью Столпа, позволил реализовать многие проекты, которым до того было суждено навеки остаться заброшенными чертежами. Более того, создание Бесконечных Ретрансляторов позволило распространить невозможную энергию за пределы Второй Столицы — центрального адонарского города со времен прибытия на Срединный Континент.\n\nОднако, Ареллен, главный изобретатель и, в каком-то смысле, отец Технологий Источника не дожил до открытия его братом, Фарготом ур-Иллантаром, вершины Невозможных Технологий, позволившей исполнить главную цель адонари.\n\nУчение о духе и теле, перенятое Институтом, позволило вывести теорию Квантовой Модели Идентичности (далее - КМИ) — некой фундаментальной структуры, присущей каждому существу, остающейся даже после полного уничтожения его тела и развеивания духовной энергии. Иными словами, именно КМИ можно считать настоящим \"Я-ЕСТЬ\", существующим на более глубоком уровне чем алхимическое понимание тела, духа и разума.\n\nПринцип КМИ позволил Фарготу осознать всю структуру эльфийского естества и, используя Невозможные Технологии, кристаллизовать ее в многомерную структуру, известную как Камень Душ. Подобный Камень, помещенный в специализированный сосуд, известный как Вечное Тело, позволил добиться полного переноса не только личности, но самого естества в механическое тело, не подверженное старению и Увяданию: тогда как иные, более простые методы смены тел могли избавиться от первой проблемы, \"мягкий\" дух все еще мог был вытянут этим явлением. Кристаллизация КМИ же позволяла достичь истинного бессмертия.\n\nВозвращение бессмертия и открытие истинного потенциала Невозможных Технологий сплотило оставшихся адонари вокруг Фаргота и подняло до того практически раздавленную мораль народа. Эльфы, один за другим проходившие процедуру Перехода, вновь присягнули ему на верность — уже как Фарготу Уру, Королю-Богу. Сами же они, изменившись, взяли для себя имя райтриари — совершенного народа.\n\nНесмотря на сам факт открытия Технологий Источника, период между этим событием и открытием Кристаллизации КМИ известен как Век Печали, продлившийся примерно 140 лет.\n\nС изменением имени народа была значительно изменена и сама его структура. Концепция Малых Домов, издревле укрепившаяся в эльфийской культуре, была упразднена, а Великий Дом Иллантар ждали значительные изменения: формально, после становления Короля-Бога, каждого райтриари можно было назвать членом дома Иллантар.\n\nВ условиях военного времени, объявленного Королем-Богом, на споры между главами домов и обладателей тысячи разных эльфийских титулов времени не было. Вся власть была сосредоточена в его руках: впрочем, райтриари, обязанные ему возвращенной им вечностью, едва ли возражали. Иные реформы, начатые еще в Век Печали, были проведены в последовавшие десятилетия, однако об этом будет упомянуто в соответствующей главе. Упростив и суммировав их суть, все можно свести к тому, что среди райтриари статус и должность целиком зависели от способностей, а не происхождения.\n\nВ конце-концов, после завершения Перехода, райтриари предприняли попытку вернуть собственные территории на Мерклейде и предотвратить неизбежную экспансию Антерена в северные земли. Атака на Хен-Эдделман, также известную как Крепость Северного Предела, положила начало тому, что в Антерене известно как **Вторая Эльфийская Война**.\n\nВ ходе Второй Войны были протестированы многочисленные Невозможные Технологии: сервиторы И-КМИ, ряд моделей Вечных Тел, а также технология QAR-T, позволявшая использовать выделяемую Камнем Душ энергию для запитывания мощного энергетического оружия. Вершиной огневой мощи того времени стала технология Холмов: колоссальных орудийных комплексов, способных создавать разломы в ткани реальности и атаковать потоком энергии Бесконечных Царств, разрушающей связи между мельчайшими частицами материи.\n\nНа основе этой технологии позднее было создано одно из Высших Заклинаний Антерена: Разрушитель Крепостей.\n\nОднако, ни одна из сторон не добилась во Второй Войне особого успеха: величайшее мастерство в магии Источника столкнулось с совершенными технологиями, и ни один из путей не оказался сильнее другого. В итоге длительных сражений, был заключен мирный договор, в результате которого Готтлейд и еще 5% энергии Источника полностью отошли райтриари.\n\nТак начался продолжительный период шаткого мира, который едва не закончился ближе ко второй половине Эры Владык.\n\nСобытие, известное как Третья Война, или же Война Одного Дня, началась на почве уже забытого конфликта в северо-западных Каалагонских Горах. Эскалируйся конфликт, и это стало бы очередным катастрофическим сражением, но случившаяся в тот же день катастрофа прервала эту возможность в зародыше.\n\nНочь Расколотой Горы: так запомнился миру этап, когда Серебряный Царь Этередайна, используя скелет Древнего Дракона, совершил невозможное, позволив воплотиться в мире не простому созданию Бездны, но аватаре Архидемона: Короля Мертвых.\n\nСозданный им [[Туман Смерти]] практически мгновенно убивал любое живое существо и, к величайшему ужасу райтриари, заставлял ржаветь и рассыпаться металл.\n\nСобытия Расколотой Горы привели к единственному в истории союзу людей и эльфов: согласно архивам, в 939 году Э.В. [[Владыка Даниил]] Мидранмар вместе с Королем-Богом вел объединенные армии против Гхолдрета — аватара Отца Некромантии.\n\nПобеда была достигнута, однако Ночь привела к перманентной потере многочисленных Камней Душ, а также сделала непригодной для жизни центральные земли Мерклейда.\n\nБолее века понадобилось обеим цивилизациям, чтобы хотя бы частично оправиться и избавиться от последствий Ночи Расколотой Горы. И к концу этого периода, оба государства признали, что это было практически невозможно без усиленного использования Источника: создания ряда новых технологий и Ретрансляторов в случае райтриари; Увеличения силы Владык и коронации новых Наместников для Антерена.\n\nДаже архивам Института доподлинно неизвестно, по чьей инициативе было начато первое сражение и что было его поводом. Одно было известно: после провалившихся переговоров, приблизительно в 1088 году Э.В. была начата Четвертая Эльфийская Война, также известная как Последняя Война или Война Источника.\n\nК тому периоду, оба государства достигли своего абсолютного пика развития, когда дело касалось войны: в ход было пущено величайшее оружие с обеих сторон. Четверть всего Готтлейда была уничтожена и ушла под воду. Схожие разрушения ждали и [[Мерклейд]].\n\nВ ходе этой войны была доведена до совершенства технология И-КМИ, а Вечным Телам появилось две значительно улучшенных альтернативы: Доспехи Бессмертного, позволявшие пилотировать их из удаленной Гробницы на другом конце Континента, а также Доспехи Источника: колоссальное оружие класса Анти-Армия.\n\nС разными периодами интенсивности, Война Источника продолжалась около века. В конце-концов, финальное наступление сил Антерена под командованием Мидранмара, сопровождаемого Парящей Крепостью, позволило людям достичь Второй Столицы, где Камень Души Короля-Бога был, предположительно, раздроблен в дуэли с Владыкой Даниилом.\n\nВ ходе нескольких следующих лет, большая часть райтриарских войск была добита силами Антерена, а немногочисленные остатки были вынуждены скрываться.\n\nЕдинственным утешением последним из совершенного народа было то, что и победители в Войне Источника ненадолго пережили проигравших.\n\nСейчас, от райтриари остались руины — оскверненные, как и сам Центральный Столп Преобразования. Лишенные мастера И-КМИ продолжают ждать приказов, что никогда не будут отданы, и лишь горстка переживших Войну Бессмертных продолжает бродить по новому миру.\n\n## Устройство Совершенного Народа\n\nПосле реформации всего райтриарского общества в конце Века Печали, до того скорее негласная абсолютная власть Фаргота была формально утверждена всем народом. Видя различия в Домах и вытекающих из них статусах как вредоносный рудимент старого Вечного Королевства, он упразднил систему Малых Домов, формально вознося каждого эльфа до члена Великого Дома Иллантар.\n\nТак, в иерархии Дома, он стал известен как **[[Фаргот Ур]]** — без упоминания его первенства в конкретном Доме это читалось как \"первый среди всех\".\n\nПримечательно, что титул \"Король-Бог\" он заслужил гораздо позднее, и появился он среди антеренцев, слышавших о нем и видевших его на поле боя. Архивы гласят, что в народе райтриари эта традиция была подчерпнута сперва как некая шутка, но позднее вошла в общее употребление.\n\nФаргот Ур обладал абсолютной властью, но его знания и внимание имели свои пределы. Помимо него самого, верховный орган власти представлял собой **Cior Ionei**, что можно дословно перевести как Центральный Круг. Центральный Круг состоял из нескольких мастеров, за каждым из которых был закреплен отдельный аспект государства: **Мастером Войны**; **Мастером Теней** и, одновременно, главой Векс Вальтейн; **Мастером Знаний** и руководителем Института; **Мастером Башни**, заведовавшим строительством и инфраструктурой; **Мастером Стали**, заведовавшим вооружением и военной техникой; и **Мастером Путей**, в чьих обязанностях лежало снабжение и Бесконечные Ретрансляторы.\n\nТакже существовало две организации, которые необходимо упомянуть:\n\n- **Институт** — Основанная Арелленом ур-Иллантаром организация, существовавшая еще до Войны Непокорства и сохранившаяся практически без изменений. Основной целью Института после реформации стало совершенствование Невозможных Технологий.\n- **Векс Вальтейн** — Служба безопасности совершенного народа, занимавшаяся контрразведкой, обнаружением страдающих от девиации КМИ и предотвращением связанных с этим инцидентов, а также общим надзором за внутренними территориями.\n\n## Технология Бессмертных\n\nУсовершенствованная модель Вечного Тела, позволявшая беспилотное управление Доспехов: Камень Душ при этом находился в Гробнице — базе Бессмертного, также служившей Бесконечным Ретранслятором для Доспеха. Таким образом, даже пав на поле боя, после создания замены, они могли легко вернуться в бой, а смерть Вечного Тела не несла для них никаких серьезных рисков.\n\nСтановление Бессмертным требовало дальнейшей модификации Камня Душ, а также постройки Гробницы и Доспеха Бессмертного — даже на момент зенита райтриари, дорогостоящих и сложных устройств. Далеко не каждый обладал подходящей совместимостью, и из них не всякому удостаивалась честь совершить второй Переход.\n\n### Aedyr Fleankhait\n\nВ дословном переводе — Рыцари Левой Руки, названные в честь своего непосредственного лидера — Неретиль Иллантар, Мастера Тени на службе Короля-Бога, также называемой его левой рукой.\n\nЭлитный отряд Бессмертных раннего поколения, сперва существовавший для предотвращения инцидентов, связанных с девиацией КМИ, а затем, во времена войны, ставший спецотрядом, выполнявшим наиболее сложные миссии.\n\nНасчитывал шесть участников:\n\n- **A-1, \"Шеф\" Кавалорн** — Один из двоих участников, совершивших экспериментальный Переход нулевого поколения. Первый по силе и прямой эффективности в отряде, является тактическим лидером Эдир Флэнкхайт. Во времена Последней Войны пилотировал Доспех Источника, его AS - \"Повешенный\", был уничтожен в ходе битвы с Владыкой Леонидом.\n- **A-2 \"Драматург\" Галамар** — Второй Бессмертный нулевого поколения, первоклассный адепт ближнего боя и мастер взрывчатых веществ. Себя называет \"моральной поддержкой отряда\" Помимо того, орудует одним из последних сохранившихся силовых мечей.\n- **A-3 \"Созвездие\" Элиренн** — Была пилотом первых поколений Доспехов Источника, уничтожена в ходе Последней Войны, однако ее Камень Душ чудом сохранился. Отвыкшая от обычного тела, вместо Доспехов Бессмертного контролирует центральный дрон механического роя.\n- **A-4 \"Псарь\" Вэйлиор** — Инженер и создатель Печати Слуги — контролирующего разум механизма. Местонахождение неизвестно.\n- **А-5 \"Волшебник\" Каранайн** — Единственный райтриари, сумевший обойти негативную сторону Кристаллизации — полную невозможность касаться Таинственной Силы, с помощью личного Оружия Истока — перчатки-катализатора.\n- **А-6 \"Художник\" Хиоро** — Самый молодой из членов отряда, чьи Доспехи Бессмертного укомплектованы экспериментальным модулем продвинутой маскировки. Большую часть времени невидим.\n\n### Доспехи Источника\n\nНевозможная Технология класса \"Анти-Армия\", эта разработка Института представляла собой колоссальные Вечные Тела, достигавшие около десятка метров. Каждый Доспех Истока был оснащен запредельным количеством вооружения, а адамантиевая обшивка делала их практически неуязвимыми для конвенциального оружия.\n\nНаличие даже одного Доспеха Источника могло изменить исход проигранного сражения.\n\nБлиже к концу Последней Войны было разработано три Доспеха Источника серии ISA, созданных по технологии \"И-Оружие\". Известно лишь то, что им был присужден класс \"Анти-Владыка\", а применение двух ISA в последнем сражении уничтожило больше 35% всей армии Антерена. Судьба последнего неизвестна.\n\n## QAR-T\n\nТакже известная как технология Проекции КМИ, QAR-T позволяла направлять выделяемый Камнем Душ энергетический фон, запитывая мощное энергетическое оружие или QAR-T-батареи.\n\nПосле внедрения Модуля QAR-T Совместимости в большинство технологий 3+ поколения, практически все персональное вооружение и даже некоторый транспорт мог быть запитан с помощью таких энергоносителей. В условиях отсутствия питания Источника, к QAR-T могли быть подключены большинство компьютеров.\n\nQAR-T оружие включает в себя:\n\n- **Ускорители Изеры** — Оружие, генерирующее электромагнитные поля из КМИ-излучения и за их счет придающее огромное ускорение материальному снаряду. Один из немногочисленных видов кинетического оружия, сохранившийся в использовании у райтриарских солдат. Сверхскорости, на которые разгонялись снаряды, а также КМИ-излучение, позволяли преодолеть сопротивление к немагическому оружию, расхожее среди антеренских барьеров. Это, увы, шло в ущерб скорострельности такого оружия.\n- **Арканодинамическое оружие** — Оружие, основанное на принципе стимуляции хаотических кристаллов КМИ-излучением для создания лучей и полей Арканной Энергии. Мощное и не требующее никаких патронов, в персональных масштабах достаточно быстро отошло на второй план: идентичное по принципу волшебным стрелам и их производным заклинаниями, ему со слишком большой легкостью противодействовали маги Антерена. К этому же типу относятся генераторы структур \"твердого света\".\n- **[[Aias]]-оружие** — Также известное как Оружие Небес, этот тип оружия создает контролируемые молнии, способные сжечь несколько врагов за один выстрел.\n- **Плазменное оружие** — Оружие, способное стрелять сгустками или потоком плазмы, производимого с помощью Конвертера Изеры, преобразующего КМИ-Излучение в электричество.\n- (будет дополняться)\n\n## Единая Сеть\n\nКоммуникационная сеть, связывающая между собой практически все райтриарские компьютеры. Основана на системе Бесконечных Ретрансляторов и Центральном Столпе Преобразования.\n\nС ее помощью между отдельными компьютерами было возможно практически мгновенное сообщение.\n\nПомимо Единой Сети, компьютеры и прочие устройства могли быть объединены в отдельную систему уже физически — через провода или иными методами.\n\nВ настоящее время Единая Сеть, как и Центральный Столп, осквернена и недоступна стандартными методами.", "category": "Существа", "createdAt": 1793632093893, "order": 3, "summary": "Совершенный Народ: эльфы в механических телах, Технологии Источника и войны с Антереном.", "title": "Райтриари", "updatedAt": 1793641859264, "updatedBy": null}, "voina-chernoi-korony": {"aliases": ["Война Семерых", "Бандуриан", "Эдмунд Говнарион", "Чёрный Король", "Война Чёрной Короны"], "body": "Её также называют Войной Семерых. В 113 году В.Э. осквернитель Бандуриан, ученик основателя [[Круг Проклятых|Круга Проклятых]], объявил себя Чёрным Королём и пошёл войной на весь Мерклейд.\n\n## Герои\n- **Эдмунд Говнарион**, лирийский рыцарь, потерявший всё в битве за Скуффеншильд и ставший вожаком партизан и беженцев. Позже император.\n- **Пророк Пахом**, пришедший с востока проповедник. Исцелял, наставлял и сражался рядом с Эдмундом.\n- **Сэр Латимер Инланский, Сияющий Меч.** Друг Эдмунда, принявший на себя проклятие, предназначенное герою.\n- **Святой Дункан**, первый инквизитор.\n- **Миррдин эт-Анголвен**, алхимик, основатель Ордена Мудрых.\n- **Риордан-драконоборец** и риннский фейдмар Ригеллион, разбивший Готлока Разорителя.\n\nПятеро, включая Эдмунда и Пахома, вошли в тронный зал Дир-Анремайна и победили Чёрного Короля.\n\n## Последствия\n- Эдмунд основал Мерклейдскую Империю. Она пережила его всего на несколько лет, и из неё выросли Союзные Королевства.\n- Возникла [[Церковь Света]]. Пахом после битвы исчез, Латимер прожил три месяца и успел основать [[Орден Сияющего Меча]].\n- В [[Ведория|Ведории]] перед лицом войны собралось первое Большое Собрание в Эскаране.\n- Рыцарские ордена получили огромные земли в Эббелунде (см. [[Эблания]]).\n- Потомки гоблинской Орды Готлока до сих пор разоряют [[Золотое Побережье]].", "category": "История", "createdAt": 1793632093893, "order": 2, "summary": "Война 113–117 годов В.Э. против Чёрного Короля Бандуриана, создавшая нынешний Мерклейд.", "title": "Война Черной Короны", "updatedAt": 1793632093893, "updatedBy": null}, "orden-siyayushchego-mecha": {"aliases": ["паладины", "Серебряные Рыцари", "Латимер", "Лотар"], "body": "Наиболее обособленная из всех церковных структур, Орден Сияющего Меча был основан Святым Латимером — другом и боевым братом Эдмунда Говнариона, одним из отряда героев, что избавили мир от Черного Короля Бандуриана.\n\nЗадолго до появления Экзекуторов Инквизиции, паладины Сияющего Меча охотились на темных волшебников и оскверненных абоминаций.\n\nИх цель — нести свет, что горел в клинке Латимера, и защищать человечество от самых ужасных угроз.\n\nВ сравнении с прочими организациями, [[Сияющий Меч]] — самый малочисленный из всех. Однако, паладины являются более чем первоклассными бойцами, каждый из которых — опаснейший воин сам по себе, и вдвое более — сражаясь против избранных врагов Ордена.\n\nВ бою они полагаются на совершенную смесь чудес и ближнего боя, редко полагаясь на стрелковое оружие без необходимости. Чудеса Сияющего Меча, черпаемые ими из жития Латимера, позволяют им укреплять собственные тела, насыщать оружие Светом, карать чудовищ праведной силой и ограждать себя от всевозможных угроз.\n\nВ народе они известны как **Серебряные Рыцари**: в серьезных сражениях они используют освященные доспехи из особого серебристого сплава. Такую броню не пробить обычным оружием, она отлично защищает от мистических энергий, а чудовищам, что стремятся разгрызть или оцарапать ее, сперва придется справиться с ужасающей болью — священные благословления сжигают все признанное нечистым.\n\nКак и инквизиторы, паладины обладают значительной автономией: у них есть собственное подобие Права Первого Слова, а большинство представителей власти и вовсе не подумает останавливать паладина во время дела.\n\nВ отличие от многих изначальных организаций, Орден Сияющего Меча до сих пор повсеместно признается и за пределами Говнарии — его высокий статус не изменился во всех Союзных Королевствах и Золотом Побережье, а один из крупнейших Оплотов находится в Эббелунде.\n\nВ сравнении с прочими, иерархия Сияющего Меча крайне проста и не менялась со времен основания ордена:\n\n- **Грандмастер** — Хранитель Орденских знаний и реликвий, отвечающий, в том числе, за образование паладинов, их владение чудесами и знание собственных истоков. Грандмастером становится Генерал, слишком старый для активных сражений.\n- **[[Генерал Ордена]]** — Военный предводитель Ордена, имеющий право созвать всех его членов для определенной задачи. Он отвечает за стратегическую координацию и боевую подготовку Ордена.\n- **Паладин** — Полноправный член Ордена Сияющего Меча. Каждый паладин считается дворянином, достойным обращения \"лорд\" (или \"леди\" в случае редких паладинов-женщин)\n- **Послушник** — Новичок, не прошедший посвящения. Обучается в одном из Оплотов или сопровождает паладина как оруженосец.", "category": "Вера и ордена", "createdAt": 1793632093893, "epigraph": "И поднял он клинок к Солнцу, и зацепил луч Его так, что стал он оружьем его.", "epigraphBy": "Житие сэра Латимера", "order": 2, "summary": "Паладины, Серебряные Рыцари, основанные Святым Латимером.", "title": "Орден Сияющего Меча", "updatedAt": 1793641859264, "updatedBy": null}, "zolotoe-poberezhye": {"aliases": ["Альконде", "Свободные Города", "хасситы", "Штормовой Залив", "Пограничье"], "body": "Крупный участок Мерклейда к югу от Союзных Королевств, протяженный более чем на тысячу километров. Жизнь здесь в основном сосредоточена у моря, и чем дальше от него, тем меньше начинает оставаться от привычной человеку цивилизации.\n\nПримечательно, что название \"Золотое Побережье\" — не мерклейдское. Согласно легенде, торговцы из Восточной Империи, прибывшие к берегам в полночь, увидели бескрайние поля уникального для этого региона цветка голерента, светящегося тускло-желтым при лунном свете, и якобы решили, что сама земля здесь отлита из золота. Конечно, едва ли им была присуща подобная мнительность, но факт остается фактом: вид цветущего голерента остается одним из природных чудес Мерклейда.\n\nСам цветок, впрочем, чуть менее чем полностью бесполезен.\n\nСвободные Города и Алькондийская Республика все еще чтут Творца, но местные церкви еще труднее назвать едиными со Святым Престолом.\n\nХотя большая часть населения остается людьми мерклейдской расы, иногда здесь можно встретить сетийцев с Шема.\n\nПомимо них, вдали от городов и цивилизации обитают племена ург'ас и холхоров, а в глубинах якобы проживают морские народы.\n\n## Республика Альконде, острова Полумесяца\n\nКонечно, формально Альконде является частью Союзных Королевств. Однако *королевством* оно перестало быть еще в ходе распада Мерклейдской Империи, а его общая удаленность и особенная культура не дают так просто поставить Благородную Республику в один ряд с северными союзниками.\n\nТерритории Республики — Острова Полумесяца, крупный архипелаг к югу от морских границ Эблании.\n\nВерховную власть представляет собой Лорд-Адмирал, пожизненно избираемый среди членов Совета Капитанов *(далеко не каждый из которых хотя бы выходил в море на собственном корабле)* — высокопоставленных людей, а также глав пяти благородных домов. Каждый из последних, в свою очередь, управляет одним из пяти крупнейших островов архипелага. Конечно, Совет состоит далеко не из них одних: адмиралы, крупные торговцы, бывшие командующие, владельцы крупных портов и многие другие также заседают в нем.\n\nИменно алькондийцам [[Мерклейд]] обязан историями и товарами с самых дальних уголков Континента: отважные мореплаватели видели даже пески Восточной Империи и пепельных симмерийцев, и многие другие земли, о которых иные могут только перешептываться.\n\nОфициальной религией Альконде, как и во всех Союзных Королевствах, является пахомианство. Однако, на более удаленных островах странник может встретить многое — от ересей, отрицающих церковную иерархию, заканчивая древние культы Глубин, адепты которых якобы знаются с морскими народами и заклинают морских духов.\n\nЗлые языки говорят об алькондийцах как об эксцентричных авантюристах, склонных к всяческому риску — и далеко не всегда в уместных для этого случаях. Ситуации не слишком помогает то, что многие странники, пираты и прочие сомнительные личности начинали свой путь именно отсюда, а половина Мерклейдских азартных игр была изобретена именно на островах Полумесяца.\n\nОсобенно злые языки иногда вспоминают, что именно с Альконде на Континент попадает некий наркотик на основе островного мака. Торговлю им власти стараются пресечь, но умельцы находятся всегда.\n\nОткрытым секретом является существование алькондийской Гильдии Воров — полуофициальной организации, являющейся не только преступной шайкой, но и сборищем культистов Кого-То-Там, которому каждый из адептов, по собственному утверждению, как-то-там поклоняется.\n\nВ 383-384 годах Республика активно поддерживает Альянс ресурсами, а Лорд-Адмирал Гильермо Аррано Ригеро дель Андрада внес значительный вклад в победу над морскими силами Культа Червя с помощью \"Указа о Защите Моря\".\n\nУчитывая масштабы происходящего, слухи о том, что он объединился с армией морского народа, называющего себя \"нагами\" никого, в целом, уже не удивили.\n\n## Свободные Города\n\nВ старые времена крупная часть Золотого Побережья, что к западу от Островов Полумесяца, была территориями Алькондийского королевства. Пережив Готлока Разорителя, последние годы Войны Семерых и распад Империи, регион в конце концов обрёл независимость и ныне представляет собой множество, как ни странно, свободных городов и даже небольшую торговую республику Гильдеру.\n\nХодит шутка, что эти земли, не являясь частью Союзных Королевств, отлично показывают их в миниатюре: едва ли не каждый год с помощью наёмников пара городов устроит между собой небольшую войну, но любая попытка захватить этот регион извне гарантированно будет встречена объединенной силой, вместе способной поднять крупные армии.\n\nТрудно ткнуть в один город и назвать его примером всего региона. Один может контролироваться союзом старейших семей, другой — гильдиями, а в ином и вовсе последние пару поколений княжит старый род, в Королевства не вписавшийся из-за общей незначительности. Объединяет их, благодаря старому Монетному Договору, общая монета и упрямое нежелание уступать кому-либо собственную свободу.\n\nТорговля является основным источником богатства этих земель, являющихся своеобразным мостом между Севером и Югом Мерклейда. Вместе с тем, по Мерклейдскую сторону Внутреннего Океана мореплаватели Побережья уступают лишь алькондийцам, что, учитывая историю, неудивительно. Вина, специи, ткани и стекло из этих регионов высоко ценятся в Королевствах.\n\n[[Церковь Света]] имеет здесь не так много влияния, исключая северные города поближе к Союзу. Во многих городах нетрудно встретить официальные культы старых божеств Мерклейда, существовавшие еще со времен Темного Века. Запрет на магию здесь соблюдается ровно достаточно, чтобы не стать целью внезапного Похода Очищения, и в четырех городах даже существуют небольшие гильдии волшебников под покровительством местной власти. Злые языки говорят, что в половине из них волшебники и являются местной властью, эффективно контролируя своих \"покровителей\".\n\nДаже если бы все города в одночасье помирились, проблемы региона на этом совершенно не закончатся. Наследие Готлока — потомки гоблинских племен его Орды — продолжают нападать на путников и разорять деревни. Сколько бы ни пытались Города их истребить, последствие Войны Семерых только продолжает плодиться в густых лесах.\n\nСеверная граница с Каэд Феллом также не добавляет никому радости — кроме, пожалуй, наёмничьих капитанов, дерущих за сражение с мертвецами практически тройную оплату.\n\nМестные наёмники, в свою очередь — отдельный феномен Побережья, никогда не остающийся здесь без работы надолго. Иметь на своей стороне знаменитую компанию — дело в том числе и престижа, а города побогаче могут долго держать элитные отряды как что-то сродни регулярной армии. Примечательно, именно здесь зародилась гильдия Девяти Клинков, отделения которой можно было встретить практически во всем Союзе.\n\n## Пограничье, Ничейная Земля\n\nЮжнее Городов, как известно, цивилизация заканчивается. Ну или, по крайней мере, именно такое мнение ходит среди чуть менее чем всех жителей Союзных Королевств.\n\nЧестно сказать, иные регионы очень сильно стремятся убедить путешественника в их правоте.\n\nТам, где уже не встречаются прекрасные цветы голерента, но Степь еще не вступила в свои права, располагается Пограничье — холмистая местность, не без причины называемая Ничейными Землями. По сути, действительно, сей регион не принадлежит ни одному из крупных союзов или государств. Зато всевозможный \"сброд\" регулярно пытается основать там свое!\n\nБеженцы из Королевств, амбициозные разбойничьи князья и шайки авантюристов с мечтой, изгнанники Шема, гоблинские племена, айлы полуросликов, чудовища, мигрирующие подальше от цивилизации — все это и многое другое находит себе здесь пристанище, лишь чтобы оказаться уничтоженными следующими претендентами или близостью к [[Каэд Фелл]]. Но раз местечко снова свободно... можно попытаться снова?\n\nСколько ни пытайся, со времен Темного Века с перманентной цивилизацией здесь выходит достаточно плохо, и ни у кого так и не удалось выяснить точную причину: неудачливость прошлых претендентов, особенность географии или особенно гнусное проклятье с тех же времен. Впрочем, даже тех, кто не горит желанием играть в королей, также могут привлечь сюда старые антеренские руины, наверняка хранящие еще не разграбленные сокровища прошлой цивилизации.\n\n## Штормовой Залив\n\nСамая южная часть того, что еще можно назвать Золотым Побережьем, Штормовой Залив — непроходимый лес острых скал и голых деревьев, где почти никогда не прекращается ливень. Суровый край, он подарил Внутреннему Океану хасситов.\n\nМогучие, смуглые исполины, среди всех людей они выделяются великой физической мощью и попросту нечеловеческим ростом. Впрочем, не только и не столько внешний вид отличает их от \"цивилизованных людей\".\n\nБольше всего на свете эти люди ценят свободу. У них нет государств в прямом смысле этого слова — люди идут за тем, за кем хотят идти, и уходят, если того желают. Хасситы строят поселения, потому что хотят, и покидают их, если считают нужным.\n\nПодобный принцип прослеживается во всех аспектах их жизни: хасситская культура даже не включает в себя \"брак\" или саму идею привычной пахомианину \"семьи\". Ближайший перевод их схожего понятия означает \"те, с кем я делю огонь\", и может включать как кровных родственников, так и близких друзей. По уже понятному принципу, уйти из подобного объединения достаточно легко. Дети хасситов обычно воспитываются такой группой, хотя зачастую черпают мудрость от всей общины, в которой им выпало расти.\n\nПри этом, как ни странно, практически не найдется в мире человека, который не поверит обещанию хассита. Свобода — величайшая ценность, и оттого ценнее акт добровольного ее ограничения. Нельзя заставить хассита дать слово, но если уж дал — чего-то это стоит.\n\nВера хасситов тесно связана с Вечным Штормом — божественным феноменом, якобы бушующим в том, что они называют \"миром духов\". После смерти, душу хассита уносит Шторм, и о дальнейшей его судьбе ничего неизвестно. Незачем и гадать, и при жизни дел достаточно.\n\nОтдельно стоит выделить почитаемого ими бога Грандаля — Бога Борьбы, в различных версиях легенды являющегося как воплощением Шторма, так и реальным воином древности. Какая бы версия ни оказалась правдой, а в 383 году [[Грандаль]] — четырехметровый воин с громадным молотом — действительно явился и возглавил Лазурное Знамя Альянса. Историки и теологи, вероятно, готовятся прокомментировать это после Войны Червя.\n\nХотя, конечно, их северных соседей — Свободные Города и Альконде — не очень интересует их особенная культура. Куда лучше им запомнились исполинские \"драконьи корабли\" — громадные весельные чудовища, на которых хасситы промышляют своей излюбленной деятельностью: пиратством.\n\nВоистину, мало для моряка с Побережья зрелищ ужаснее, чем приближающаяся на горизонте деревянная громадина. Пожалуй, разве что морские змеи.\n\nС другой стороны, они же высоко ценятся как наёмники, охотники на чудовищ, а также великие мастера использовать каждую частичку этих чудовищ для чего-то полезного. На Штормовом Берегу полезные вещи просто так не валяются.", "category": "Земли", "createdAt": 1793632093893, "order": 8, "summary": "Южное побережье: Альконде, Свободные Города, Пограничье и Штормовой Залив хасситов.", "title": "Золотое Побережье", "updatedAt": 1793641859264, "updatedBy": null}, "pontifik-alister": {"aliases": ["Алистер", "Алистер фон Клифф", "Понтифик"], "body": "До 383 года — архиэнкантор Алистер фон Клифф. На похоронах короля Франца, умершего от Синей Чумы, произошло Второе Прикосновение Небес: Алистера объявили вторым Избранным, Пахомий Пятый снял с себя обязанности, и [[Говнария]] стала теократией.\n\nАлистер вернул старое правило: каждый жрец должен уметь творить чудеса. Орден Храма при нём вырос как никогда. Король Лирии Арктор III публично обвинил его в цареубийстве, но Лирия пала в [[Война Червя|Войне Червя]]. С Инланской церковью отношения у Понтифика холодные (см. [[Церковь Света]]).", "category": "Персонажи", "createdAt": 1793633557135, "group": "Правители нашего дня", "kind": "character", "order": 2, "role": "Глава Церкви Света и правитель Говнарии", "status": "Правит", "summary": "Бывший архиэнкантор, ставший Избранным и правителем Священного Королевства.", "title": "Понтифик Алистер", "updatedAt": 1793633557135, "updatedBy": null}, "latimer": {"aliases": ["Латимер", "Сияющий Меч"], "body": "Сэр Латимер Инланский родился на полуострове Лэн Шаранна, в землях, что сегодня славятся лучшим вином [[Эблания|Эблании]]. Он был ближайшим другом Эдмунда и в решающей битве принял на себя проклятие, предназначенное герою.\n\nГоворят, после войны он прожил три месяца на одной воле и успел почти всё: помог основать Церковь и создал [[Орден Сияющего Меча]], названный в честь собственного прозвища. Земли Тимеры Эдмунд передал ему неотменимым эдиктом.\n\nПочти все чудеса паладинов взяты из его жития. В одном эпизоде он поднял клинок к Солнцу и будто бы зацепил луч так, что тот стал его оружием. Так родилось Благословенное Оружие.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Герои былых времён", "kind": "character", "order": 3, "role": "Сияющий Меч, основатель Ордена", "status": "Мёртв", "summary": "Друг Эдмунда, принявший на себя проклятие Чёрного Короля.", "title": "Святой Латимер", "updatedAt": 1793633557135, "updatedBy": null}, "prorok-pahom": {"aliases": ["Пахом"], "body": "Пахом родился около 73 года В.Э. в Гахайеде близ Зендара, в Восточной Империи. Там же, по Книге Света, ему в медитации явился Архангел Аосар. Проповеди в столице успеха не имели, Пахома изгнали, и годы он бродил по пустыне Ал-а-Гидэ, помогая всем, кто нуждался.\n\nКак он попал в [[Мерклейд]], рассказывают по-разному: то ли по новому откровению, то ли спасаясь от имперских властей на корабле капитана, который всю дорогу над ним издевался. В лагере Эдмунда он исцелял, наставлял и сражался, а в последней битве с Чёрным Королём был рядом.\n\nПосле победы Пахом исчез. Верующие считают, что он ушёл в Небесные Чертоги и вернётся, когда понадобится миру. Его ученик основал [[Церковь Света]].", "category": "Персонажи", "createdAt": 1793633557135, "group": "Герои былых времён", "kind": "character", "order": 2, "role": "Основатель пахомианства", "status": "Исчез", "summary": "Проповедник с востока, принёсший Слово Творца и победивший Чёрного Короля рядом с Эдмундом.", "title": "Пророк Пахом", "updatedAt": 1793633557135, "updatedBy": null}, "numiratras": {"aliases": ["Нумиратрас"], "body": "Нынешний Архонт Войны [[Дол-ин-Аурос|Дол-ин-Ауроса]]. Как и все Архонты, он носит имя первого из своих предшественников и продолжает его дело, поэтому номеров к имени не прибавляют.\n\nВ 383 году после вмешательства нескольких искателей приключений он привёл легион в Альянс и показал миру огнестрельное оружие и паровые машины гномов (см. [[Война Червя]]).\n\nПогиб в битве при Винтерстейне от руки [[Амонгехет|Амонгехета]], первого из дерокку.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Альянс", "kind": "character", "order": 5, "role": "Архонт Войны Дол-ин-Ауроса", "status": "Погиб при Винтерстейне", "summary": "Гномий полководец, выведший Золотой Дальваг из тысячелетней изоляции.", "title": "Архонт Нумиратрас", "updatedAt": 1793637826813, "updatedBy": null}, "elfy": {"aliases": ["эльф", "адонари", "аэклари", "незетари", "наги", "Увядание"], "body": "Одна из Первых Рас, корни эльфов уходят в додревние времена, когда планета и близко не напоминала свой нынешний облик. Их история насчитывает более трех с половиной десятков тысяч лет.\n\nВсе они берут свое начало от Первых Эльфов — воплощенных духов Древа Вечности: Столпа самого мира и источника благодати.\n\nБлизость к Древу даровала им бессмертие и великие силы, и свой родной континент — Адон-Тирлейдд, Вечные Земли, они не делили ни с кем. Прикоснувшиеся к Вечности, Эпоха Древа была для них эрой бесконечного зенита: то была эпоха процветания и неизменности в равной мере.\n\nМедленная гибель Древа — Увядание, положило конец этой эпохе и вернуло ход времени, остановленному для вечного народа. Изменения, что последовали за этим, преобразили расу до неузнаваемости.\n\n## Адонари, Вечный Народ\n\nПрямые наследники Первых Эльфов, адонари жили в Эру Древа и были одарены его бесчисленными благословлениями. Вечная жизнь, прекрасный облик и возможность содрогать Основы одной лишь Песнью — иные могли бы сказать, что они были избраны самим миром.\n\nКрупицы истинных адонари, сохранившихся в современную эру, вынуждены скрываться в иных реальность: Увядание лишь набирает силы, и первее всего прочего оно жаждет забрать дары Древа назад. Вероятно, во всем мироздании таких осталось немногим больше десятка.\n\n## Аэклари, Лунные Эльфы\n\nПоследователи Таулендина ур-Аманетила, правителя Великого Дома Аманетил и Короля Ничего. Аэклари — потомки тех, кто под знаменем Изумрудной Луны отправился за своим королем в Бездну, незадолго до начала Увядания, где великий правитель отбил Осколок у Ониксового Трона и основал своё королевство — Дворец-Вне-Времен.\n\nКонечно же, лишь избранные сейчас живут в земле богов, где само время остановилось для своих обитателей. Большинство аэклари населяет Каэд-Диссен — колоссальный лес размером с крупное королевство, окружающий единственные в мире стабильные врата Реальности и Простора.\n\nБольшинство аэклари, связавших себя Ковенантом с Изумрудной Луной, ниже ростом и изящнее телосложением, чем люди. Их кожа разнится от оливкового до слегка зеленоватых оттенков, а волосы нередко имеют каштановые, черные или зелено-голубые тона. Глаза же их цветом почти всегда повторяют Луну или Небеса.\n\nХоть они и обладают чудесным восприятием и великой ловкостью, это - результат жизни в [[Плотнолесье]], а не врожденная способность. Настоящий их дар идет от самой сути Древа, что вырастил [[Таулендин]] в своем дворце.\n\nАэклари живут две жизни: одну, как лунные эльфы, и вторую — в виде бесплотных духов, принятых в своих объятьях Изумрудным Древом. Так их повелитель защищает их от Смертной Судьбы, уготованной эльфам после гибели истинного Древа. Нередко такие духи помогают потомкам: знающие мастера способны вселять их в предметы, а раз в году они имеют право обрести подобие плоти и одну единственную ночь пройти по миру живых.\n\nАэклари живут две жизни — обычно это бывает так. Но для наиболее сильных душ: героев и мудрецов, истинных хранителей Каэд-Диссена и его народа, существует еще одна жизнь. Прежде чем присоединиться к хору душ в Изумрудном Древе, они перерождаются как сильваны: камбионы Дворца-Вне-Времен, способные действовать и вне его пределов. Напоминающие себя же, но искаженные странными природными чертами, будь то рога, мшистые волосы, звериные уши или нечто иное, они проживают вторую жизнь как чемпионы Лесного Королевства.\n\n## Райтриари, Совершенный Народ\n\nСторонники Фаргота ур-Иллантара, впоследствии известного как [[Король-Бог]] [[Фаргот Ур]]. Когда откололись все прочие ветви, Древо погибло, а [[Антерен]] с каждым мгновеньем лишь усиливал свой натиск, сторонники Дома Иллантар объединились вокруг открытия своего владыки: методики кристаллизации Квантовой Модели Идентичности и создания Вечных Тел: механических оболочек, что позволили им переопределить Вечность.\n\nИстория, восхождение и конец Совершенного Народа описаны в соответствующем Кодексе.\n\nТак или иначе, от некогда могущественной мировой силе остались лишь забытые руины, фрагменты невозможных технологий и механические стражи, чья война никогда не закончится.\n\n## Незетари, Темный Народ\n\nПоследователи Эланы ур-Синаран, во времена Раскола незетари вслед за своей повелительницей отправились в изгнание: они покинули Адон-Тирлейдд и, в конце-концов, нашли свое пристанище в глубинах Подземного Мира.\n\nТам, когда угас свет Древа, они открыли новую силу, практически неизвестную на поверхности — псионику и, в ходе долгих экспериментов, смогли подчинить её себе, а также создать Нексус — единый псионический гештальт, вместилище для душ и источник псионической мощи, ставший искусственным Древом для темного народа.\n\nТакже известные как Малар Нок, темные эльфы были изменены тайными алхимическими ритуалами, позволившими им обуздать псионический дар. Их кожа разнилась от светло-серого до темно-голубого и фиолетового цветов. Известно, что они почти не выражали эмоций внешне, но вовсе не были холодными статуями: каждого незетари связывал эмпатической связью Нексус, позволявшим понимать чужие эмоции самым прямым и чистым образом.\n\nИх величайшими способностями был великий псионический дар, практически гарантированный для каждого незетари, и возможность перерождения: после смерти души уходили в Нексус, оставляли ему свои знания, и вновь перерождались в новом, подготовленном теле.\n\nОба этих дара были утрачены в ходе Кризиса Ложной Королевы (16 Извечной Тени, 383г. Второй Эры), закончившегося исчезновением Нексуса и работающих с ним технологий, а также утратой психического дара большей частью малар нок. И без того малочисленный народ в ходе одной недели оказался на грани вымирания.\n\n## Наги, Морские Эльфы\n\nПоследователи царя Саансибарта, чей путь отделился от прочих эльфов за тысячелетия до Раскола. Когда-то они были сейрентри, или вай-сет: расой, появившейся из союза адонари и змеелюдов. Считавшиеся гражданами второго сорта, многими чистокровными они считались даже ниже ахонши — присоединенных народов.\n\nЦарь [[Саансибарт]] Дреага Зен — Равный Драконам — был не согласен с таким положением дел. Он поднял восстание против Империи и, пусть война и была безнадежной, больше полувека сопротивлялся одному из их легионов.\n\nВ конце-концов, Саансибарт был повержен чародеем Черного Святилища, известным как Ашра-Кет, а сторонники царя были сброшены с утеса в глубокое море.\n\nРазные версии легенды гласят, что от гибели их защитила последняя воля Царя, Вечный Змей Изс, либо же неизвестные силы Тайного Океана. Так или иначе, сейрентри преобразились до неузнаваемости, адаптировавшись к новому миру.\n\nТеперь они — наги, морской народ. Их ноги сменились хвостами морских змеев, а сами они обрели силу дышать под водой. Никто из наземных рас не сравнится с ними в подвижности в воде. Их волосы обычно светлы, а наибольшим уважением пользуется огненно-рыжий цвет, подобный волосам царя из легенд.\n\nИх культура далека от привычного Срединному Континенту в современности, и они практически не контактируют с обитателями суши, исключая, редко, жителей Алькондийских Островов и Золотого Побережья.\n\nЖивущие в подводных городах-государствах, Океан они делят с глубоководными, кракенами, морскими змеями и созданиями, для которых у человечества еще нет названий: никто еще не странствовал так глубоко, чтобы их встретить.\n\nКак именно они избегают Увядания — вопрос открытый, но из всех эльфов, над нагами оно наименее властно.", "category": "Расы", "createdAt": 1793632093893, "order": 3, "summary": "Одна из Первых Рас, рождённая Древом Вечности и расколотая Увяданием на несколько ветвей.", "title": "Эльфы", "updatedAt": 1793641859264, "updatedBy": null}, "krug-proklyatyh": {"aliases": ["Чёрный Культ", "Потрошители", "Пилигримы Тьмы", "Наследники", "Нэриус", "Мар'агул"], "body": "Также известный как Черный Культ, Круг Проклятых — крупнейшее и наиболее могущественное из когда-либо существовавших объединений осквернителей. Влекомые жаждой власти и нечестивого могущества, темными желаниями или простой мечтой увидеть мир в огне, адепты Культа идут путем, проложенным Владыкой Скверны — полумифическим Темным Повелителем времен Эры Антерена.\n\nНе всегда Круг был таким, каким его знают сейчас: когда-то эта организация была лишь частью Легиона Тьмы — колоссальной армии темного Владыки. Нечестивые свитки провозглашают основателем сего братства Мар'агула, одного из Генералов Легиона — архистратега и могущественного темного мага, уступавшего в колдовстве лишь своему господину.\n\nТогда, во времена Войны Владык, Круг Проклятых значительно отличался от себя в современности: то было объединение восьми величайших колдунов Легиона: Мар'агул, его ученик, двое личей и четверо магов Скверны. Их темное волшебство было великим подспорьем в ходе Войны, что сменила эпохи.\n\nОкончание Войны Владык и начало Темного Века принесло изменение и в ряды Круга. Тогда как большая часть его участников, включая основателя, погибли или пропали без вести, трое из них пережили войну: [[Бандуриан]], ученик Мар'агула; Маэв Вортигерн, ведьма черного пламени; и [[Нэриус Пронзающий]], кровожадный ассасин и заклинатель теней.\n\nИх объединенные усилия преобразовали Круг Проклятых: призвав на свою сторону каждого служителя тьмы, что пережил Войну, небольшую группу они превратили в ту организацию, чье название и сейчас произносят с ужасом и ненавистью. Во многом благодаря их стараниям мудрецы также называют Темный Век иным названием — Золотой Век Осквернителей.\n\nНо трое осквернителей не могут быть равны друг другу без высшей силы, что сдерживала бы их натуру. Каждый из основателей \"нового\" Круга Проклятых имел свое видение того, каким должно быть их детище: какие цели и идеалы должны вести за собой наследников Легиона Тьмы. В конце-концов, ближе к концу Темного Века, разногласия достигли своего апогея и, не удивив этим никого, среди Круга произошла внутренняя война, расколовшая его на три основные философии.\n\nБандуриан желал возрождения Легиона и его истинного правителя. Он и его сторонники — **Унаследовавшие Скверну** — сохранили верность Владыке Скверны и священной цели его похода: Эре Галата, что настигнет всё Мироздание. Эта ветвь оставалась наиболее многочисленной до самой Войны Черной Короны, когда Бандуриан, объявивший себя Черным Королем и начавший войну против всего Мерклейда, был уничтожен силами Альянса Шести. К 383 году Второй Эры \"наследники\" малочисленны даже по меркам изрядно поредевшего Круга, но они почти всегда держатся крупными ячейками и могут похвастаться поразительной по меркам осквернителей внутренней стабильностью.\n\nВ противовес ему, Маэв отрицала величие Владыки Скверны: он был повержен, и потому был слаб. Путь Осквернения не терпит слабости. Последователи ее идей — **Пилигримы Тьмы** — превыше всего ставили тайное знание и могущество порчи, а их главной целью было не возродить Владыку Скверны, но узреть восхождение нового Темного Повелителя (и, конечно же, каждый первый видел себя единственным верным кандидатом). Несмотря на гибель Маэв в Войне Черной Короны, пилигримы, привыкшие полагаться на самих себя, до сих пор встречаются в мире куда чаще, чем многим того хотелось бы. Крайне редко можно встретить группу пилигримов, выходящую за рамки одного осквернителя и одного-двух аколитов.\n\nНэриус же, в ряде источников именуемый вампиром, не желал служить старому Темному Повелителю, не было ему дела и до становления новым. Он желал лишь одного: беспрестанного кровопролития и жестокости. Его фракция — **Братство Крови**, куда чаще именуемая **Потрошителями** — культ безумных убийц, наиболее стабильные члены которого представляют собой что-то вроде гильдии ассасинов, а худшие - невменяемых берсерков, едва способных функционировать вне битвы. Так или иначе, все они наслаждаются убийствами, редко преследуя высокие цели. Большинство потрошителей проходят через ужасающий ритуал посвящения, в котором неофит испивает оскверненной крови. Надо отметить, что среди выживших характерен ужасающий уровень адаптации к Элементу Галата и аберрантные способности. Основатель ветви, Нэриус Пронзающий, единственный из тройки не был повержен наверняка: хоть он и бесследно исчез после Войны Черной Короны, наиболее верные корням ассасины верят, что он лишь ждет своего часа: и во второй Золотой Век Осквернителей багровая тень древнего чудовища вновь затмит свет Луны и Звезд.\n\nК концу четвертого века Второй Эры, три фракции во многом утратили былое величие и едва ли контактируют между собой: последний раз, когда весь Круг Проклятых работал сообща, был во времена Войны Черной Короны. Походы Очищения, проводимые Церковью, раз за разом изничтожали хоть сколь-либо крупные ячейки.\n\nНаследники, утратившие армию и великого лидера, скрываются в тени, плетя планы по возвращению Темного Владыки.\n\nПилигримы идут своим одиноким путем, постигая порчу и стремясь к Восхождению.\n\nБратство Крови, потерявшее большую часть алых храмов, постепенно вырождается, \"возвышенные\" ассасины сменяются варбандами безумных варваров-потрошителей.\n\nНо величайшую ошибку допустит тот, кто сочтет Черный Круг побежденным, ибо [[Скверна]] была, есть и будет во веки веков: темный свет Галата продолжает манить за собой души смертных.\n\n## Иерархия\n\nВне зависимости от фракции, адепты Круга повсеместно следуют простому идеалу: \"кто сильнее, тот и прав\". Воистину, не может быть иначе среди осквернителей, сама природа сил которых неминуемо склоняет к безумию, невменяемым амбициям и попросту на редкость скверному характеру.\n\nВнутренняя иерархия может быть любой, будь то сложные структуры Наследников, стремящиеся воссоздать звания Легиона; отношения \"мастер-ученик\" среди Пилигримов; или \"саны\" жречества крови Потрошителей, любой статус в Круге должен быть поддержан силой.\n\nПочему же культисты еще не попереубивали друг друга?\n\nНаследники признают сильнейшим древнего Владыку, а его идеал — достойным того, чтобы за ним следовать. Вернуть его в мир живых — монументальная задача, и они признают необходимость командной работы.\n\nПилигримы вообще редко контактируют между собой, исключая разве что редкий обмен знаниями, торговлю и кооперацию ради особо сложных планов и ритуалов. Во многом они похожи на обычных волшебников, а ученики для них — в первую очередь ценные и привязанные к себе помощники.\n\nНаиболее разумные из потрошителей объединяются, дабы пролить еще больше крови. Остальные же, при встрече, именно что друг друга и убивают.\n\n## Методы инициации\n\nОсквернители не появляются из ниоткуда: в том числе и члены Круга Проклятых. Каждая фракция, так или иначе, имеет свои методы набора свежей крови.\n\nПрошли времена, когда Наследники могли взять одним только числом и воистину напоминали Легион древности. Сейчас скрытные культы вдумчиво выбирают наиболее полезных кандидатов, привлекая сладкими обещаниями или промывая мозги влиятельным людям: чародеям, дворянам, богатым купцам и тому подобным. Лишь немногие избранные узнают истину о культе Темного Владыки, и лишь после тщательных проверок достойный проходит посвящение, получая тайное имя и звание.\n\nВ Союзных Королевствах, пилигриму нетрудно найти ученика: в век запрещенной магии и повального невежества, обладатели магического таланта часто вынуждены скрываться в тени, и многое готовы отдать за знающего наставника... пусть даже обучаемые ими дисциплины ужасны — Храмовники все равно не заметят разницы. Предполагается, что торжественное посвящение в Пилигримы Тьмы наставник проводит по окончанию обучения. В доброй половине случаев, правда, победивший наставника ученик посвящает себя сам. Если ученик слаб — он умирает. Если учитель слаб — он умирает. Выживают сильнейшие, и именно они идут дальше по пути Тьмы.\n\nНередко к Пилигримам присоединяются и маги-отступники Казакии, вставшие на опасную дорогу темных искусств.\n\nМетоды вербовки Потрошителей разнятся столь же сильно, как они сами. Тогда как ассасины Братства Крови могут по достоинству оценить талант к убийствам и \"любовь к искусству\", и попросту пригласить потенциального кандидата пройти испытание, иные Потрошители могут поступить куда более грубо. Известны случаи, когда варбанды берсерков собирали пленных десятками, давая простой выбор: испить оскверненной крови или умереть: коль выжил — добро пожаловать. Назад пути уже нет.\n\n## Эра Галата\n\nКонечный этап \"Великого Делания\" осквернителей, а также мистическое понятие, загадочное уже по той причине, что даже в самом Круге никто так и не пришел к согласию, что же оно означает на самом деле.\n\nМногие считают, что Эра Галата означает всемирное господство Темного Повелителя: в зависимости от трактовки одной из фракций, возрожденного или нового, прошедшего восхождение.\n\nИные видят Эру Галата как окончательное разрушение мира — конец любого света и его проявлений, любых различий: конец самого существования.\n\nА некоторым попросту плевать: пока кровь льется рекой, а осквернитель может следовать желаниям своего черного сердца, жизнь стоит того, чтобы ее жить. Возможно, Эрой Галата такие адепты мнят день, когда океан пролитой ими крови затопит само Мироздание.", "category": "Вера и ордена", "createdAt": 1793632093893, "epigraph": "Ищи силу. Всё остальное последует.", "epigraphBy": "Философия Круга Проклятых", "order": 4, "summary": "Чёрный Культ осквернителей и его три ветви: Наследники, Пилигримы и Потрошители.", "title": "Круг Проклятых", "updatedAt": 1793641859264, "updatedBy": null}, "kaed-dissen": {"aliases": ["Плотнолесье", "аэклари", "Изумрудное Древо", "сильваны"], "body": "Существуют уголки природы, что никогда не уступят человечеству. Деревья, что не возьмет ни один топор. Темные чащи, куда не заводят людские тропы.\n\nКаэд Диссен — из таких. Громадный лес размером с крупное королевство, он занимает немалую часть восточных территорий Говнарии на севере, и Эблании — на юге.\n\nБлагоразумные люди давно отказались от своих претензий на Плотнолесье. Даже охотники и лесорубы прилегающих поселений, знающие эти леса с детства, испытывают к ним нечто между страхом и уважением.\n\nРеликтовые виды, давно исчезнувшие за пределами Каэд Диссен, встречаются здесь повсеместно. Племена зверолюдов, гигантские пауки, древние тролли и создания дикой магии: все то, что не нашло себе пристанища во внешнем мире, однажды осело здесь.\n\n[[Люди]], обитающие в Плотнолесье, нередко являются странными одиночками, изгнанниками или теми, кто стремится познать Природу целиком. Но настоящим домом эта земля служит не для них.\n\n\"Для кого же тогда?\" — сей вопрос мучал многих до самого 383 года Второй Эры, когда в ответ на Войну Червя к Альянсу присоединились воины народа, называвшего себя аэклари. Цивилизация эльфов, практически исчезнувшая на поверхности Термины, не вымерла окончательно.\n\nСтранный народ, разделенный на Двенадцать Кланов, аэклари воспринимаются многими как примитивные варвары: но их мастерство в бою и таинства магии уже успели оказать Альянсу великую услугу. Каждый из кланов представляет собой отдельную, сложную культуру, во многом чуждую Королевствам.\n\nПо собственным верованиям, аэклари живут по крайней мере дважды: прожив свою смертную жизнь, эльф становится бесплотным духом леса, оберегающим Плотнолесье и наставляющим тех из лесных эльфов, что способны его слышать. Сильнейшим же волей [[Король Ничего]] (кем бы он ни был) дарует возможность вернуться к жизни, частично слившись с Изумрудным Древом и обретя созданное его же силами тело. Такие полу-духи именуются сильванами и, пусть и не считаются отныне частью любого из кланов, равно уважаются каждым из них как прямые посланники и стражи Древа — лишь им, за редчайшими исключениями, дарован проход во Дворец-Вне-Времен.\n\nПока что человечество знает аэклари лишь как союзников в войне. К чему приведет такой союз, и что ждет Плотнолесье после гибели Пожирателя — открытый вопрос.", "category": "Земли", "createdAt": 1793632093893, "order": 6, "summary": "Плотнолесье: громадный реликтовый лес, дом лунных эльфов.", "title": "Каэд Диссен", "updatedAt": 1793641859264, "updatedBy": null}, "drevo-osnov": {"aliases": ["Основы", "Ort", "Deo", "Aias", "Isa", "Ethil"], "body": "Древо Основ, также известное как Древо Жизни или Мировая Башня, являет собой идею, ставшую важным элементом многих школ философии, а также краеугольным камнем алхимии и геомантии.\n\nМир — вовсе не бессмысленный кусок камня в космическом океане. Он — живое существо, наделенное Душой и Волей, Сердцем и ихором, что течет по его артериям — чистым Стихийным Светом.\n\nЕго Сердце и Душа едины — сей орган хранит в себе мировую суть. Как Сердце зародилось из **Пустоты** (Isa), так и в нем зарождается **Ethil** — Стихийный Свет, что питает жизнь планеты.\n\nСей **Свет** поднимается из Сердца, разливаясь по трем основам. Он разжигает подземный **Огонь** (Ort), насыщает воды, что питают **Древо** (Deo) и разливается по **Небесам** (Aias).\n\nСам сей подъем происходит сквозь мнимую структуру, в честь которой и названа сия теория — сквозь Древо Основ.\n\nЭти Основы — нечто большее, чем \"Огонь/Земля\", \"Вода/Растения\" и \"Воздух\". Они — потоки витальной энергии самого Мира, а также символизируют три его уровня — Подземный, Срединный и Верхний. Они же являются истоком Линий Силы, по которым стихийная энергия течет по миру.\n\nИскусство Геомантии заключается в контроле энергий трех Основ, а алхимики нередко изучают стихийные сущности, присущие материи.\n\n## Трактовка Основ\n\n- **Isa** есть элемент и отсутствие элемента, и единственный фрагмент мира, не имеющий в себе Света. Она сравнивается с Темным, Первородным Морем, в котором Сердце Мира, источник Света, волею привнесло само себя в реальность. Она - холод, отсутствие и тьма, но она же - возможность для начала. Она - холст, на котором Свет рисует своими красками.\n- **Ethil** есть первоэлемент и энергия Древа, происходящая напрямую от Сердца. Свет - жизнь, порядок и творение, сама информация о мире. Он - основа для любых прочих цветов, что образуют мир.\n- **Ort** есть первая из трех вытекающих стихий. Он ближе и чище всего к Свету. Огонь разгорается в глубинах земли и, остывая, формирует ее. Эта древняя сила творит и разрушает, определяя базовые формы. Ему больше всего соответствуют симмерийские элементы Огня и Земли. К Основе Ort относят Огонь, Землю и Металл.\n- **Deo** произрастает из земли и, омываемое водами жизни, возносится вверх. Вторая стихия, оно связывает между собою Огонь и Небо, представляет собой мир посреди них. Ему больше всего соответствует симмерийский элемент Воды. К Основе Deo относят элементы Растений, Воды и Соли.\n- **Aias** раскинулись над всеми прочими уровнями мира. Третья стихия, они бескрайни и свободны, им известно все. Они везде, но всегда далеки. Их благосклонность - легкость и озарение, их гнев - молнии и ледяные ветра. Им больше всего соответствует симмерийский элемент Воздуха. К Основе Небес относят элементы Молнии, Ветра и Холода.", "category": "Мир", "createdAt": 1793632093893, "order": 3, "summary": "Модель мира как живого существа: Сердце, Стихийный Свет и три Основы Ort, Deo и Aias.", "title": "Древо Основ", "updatedAt": 1793641859264, "updatedBy": null}, "eblaniya": {"aliases": ["Эббелунд", "Инлания", "Новый Лоран", "Дерзерт"], "body": "Одно из двух крупнейших королевств Союза, окончательно утвердившееся как величайшее из них в последние годы Второй Эры, Эблания также известна как Объединенные Королевства Эббелунда и Инлании. И действительно, несмотря на то, что уже который год этими землями правит единый король [[Дерзерт II Удачливый]] (принятое самим королем прозвище после семи неудачных покушений за один месяц), сын эббелундского короля Тристана и инланнской королевы Летиции, это никак не меняет того факта, что по всем законам и обычаям западный Эббелунд и восточная Инлания являются двумя разными государствами.\n\nВажно отметить, что отношения между этими двумя государствами были достаточно теплыми еще до Тристана, а в его эпоху окончательно были скреплены браком с королевой Летицией Ученой. К слиянию двух государств это не привело: в результате сложного договора, оба монарха стали со-правителями в землях супруга, а уже после смерти Летиции и отречения Тристана в пользу сына, обе короны унаследовал Дерзерт - старший из их четырех детей.\n\nВместе с обеими коронами, унаследовал он и все вытекающие проблемы: в первый же день он обнаружил, что имеет два разных королевства, два королевских совета, два свода законов и необходимость быть двумя королями сразу.\n\nЗа одиннадцать лет его правления, история видела многочисленные попытки монарха привести все к общему знаменателю, но, благодаря доблестным патриотам среди знати обеих стран, ему все еще предстоит долгая и тернистая дорога.\n\nПосле тяжелых разбирательств и долгих переговоров, столицей \"Эблании\" стал Новый Лоран — один из крупнейших мерклейдских городов, расположенный на острове посреди Лоранского озера примерно на стыке старых границ. Как это часто бывает, представляет собой во многом отреставрированные руины Антерена, и считается третьим красивейшим городом этой четверти Континента.\n\nРанее город и сам остров считался спорной территорией и причиной ряда старых конфликтов: превращение его в общую столицу считается одним из самых умелых ходов нового монарха.\n\nВ этом же городе находится всемирно известный Неолоранский Университет Всяческих Наук — одно из наиболее престижных учебных заведений, где собираются лучшие умы человечества, присягнувшие... всяческим наукам, от математики и натурфилософии до инженерного дела и медицины. Каждые три года, Университет проводит выставки, показывая новые достижения и стремясь убедить монарха, что деньги из бюджета они получают не просто так.\n\n## Эббелунд\n\nГоворят, что вместо воды в эббелундских реках течет рыцарская честь, а простой люд имеет обычай завтракать кашей из доблести.\n\nЕще говорят, что будь местные земли чуть плодороднее, простой люд смог бы чаще питаться чем-то более материальным.\n\nТак или иначе, стереотипы появились не на пустом месте. История Эббелунда тесно связана с рыцарскими орденами, получившими земли в этом регионе после изменившей саму историю Войны Семерых (или Войны Черной Короны, как ее нередко называют). Более чем треть всей территории королевства принадлежит тому или иному ордену. То, в свое время, было способом защитить практически опустевшие земли и заодно расплатиться с многими воинскими братствами, оказавшими помощь короне, и теперь потомкам приходится жить бок о бок с последствиями.\n\nНельзя, впрочем, назвать эти последствия ужасными. Да, каждый третий из этих орденов обладает каким-то странным правом из древности, от которого совершенно не намерен отказываться. Несомненно, иные из них до сих пор практически свободны от налогов за былые подвиги. Конечно, некоторые из этих объединений просто очень странные — взять тех же Рыцарей Сундука. Но, Дерзерт продолжает себя в этом убеждать, это оправдано.\n\nРыцарские земли нередко охраняются куда лучше обычных: чудовищ истребляют, а разбойники показывают себя отличной учебной практикой для оруженосцев, тренирующихся в Искусстве Оружия.\n\nПо очевидной причине, даже никак не относящейся к орденам знати нередко хочется соответствовать, и нередко дворяне за разговор упомянут известное \"Слово Чести!\" втрое больше, чем это сделает настоящий рыцарь. Иные города, с другой стороны - особенно вольные - частенько относятся к такому пафосу скептически.\n\nТехнически находясь под влиянием союзной Церкви Света, Эббелунд является домом для многих странных верований, многие из которых, скрепя зубами, признаются местными священниками как истории о святых и ангелах. Примером может послужить Нульнский культ Пречистой Девы, или же Прекраснейшей, считающейся божеством-защитницей одной из провинций.\n\nСоседям Эббелунд, помимо очевидных причин, известен особыми породами лошадей, способных с легкостью таскать всадника в латах, а также видом гигантского лука, достигающего нескольких человеческих ростов. Из этого странного продукта эббелундцы умудряются делать даже мармелад, нередко рассматривающийся иноземцами как что-то среднее между деликатесом и кулинарным извращением.\n\nСлавятся также и местные земные сокровища: эббелундским оружейникам редко приходится использовать некачественный металл.\n\nО самих же жителях ходят разные слухи, и многие отмечают верность эббелундцев своему слову. Ходит история, что однажды барон поклялся своему сюзерену построить мост через реку до конца года. Появление Гор Архимага изменило ее русло, но мост все равно был построен: так теперь он и стоит, в чистом поле.\n\n## Инлания\n\nВосточный сосед Эббелунда, Инлания славится мягким климатом, высокой культурой и прекрасными городами. Реки из доблести, перетекая через границу, без всякого сомнения меняют свой состав, превращаясь в реки разноцветных вин.\n\nВ этом тоже есть доля правды. Защищенная от большинства сухопутных угроз своим западным соседом, а также обладающая прекрасными условиями для морской торговли, Инлания современности представляет собой богатую державу, разделенную между благородными домами древности: большая часть из них имела схожие границы еще в первые годы Второй Эры.\n\nИздревле повелось, что носитель короны воспринимался местными марами скорее как первый среди относительно равных родов, и эта культурная особенность, конечно, не пропускает шанса напомнить о себе Дерзерту.\n\nКровь, семья, старые обиды и договоры — все это многое значит для инланца. Конечно, необразованный плебс может вопрошать, когда уже закончится файда с соседним Домом, но на то он и плебс. Мар, без сомнения, знает: оскорбление, нанесенное его пра-прадеду, не так легко простить.\n\nК тому же, подобное мероприятие здесь всегда имеет обговоренные правила: допустимые цели, запрет трогать слуг, условия сражений и обязательные перерывы на семейные и религиозные праздники.\n\nКультура Инлании не без причины упоминается её достоинством: королевство это считается законодательницей мод во всем Союзе (и даже за его пределами). Даже кулинария считается здесь достойной преподавания в Доме Искусств, что в Эстеро, и выходец оттуда может считать местечко на кухне какого-нибудь говнарского герцога заранее своим.\n\nЗаводя об этом речь, многие отчего-то забывают, что в список Благородных Искусств — тех, которым следует уделить внимание любому дворянину с претензией на самоуважение — здесь входит и фехтование.\n\nПрактически каждый знатный род хранит у себя дуэльный клинок характерной инланнской формы, обязательно имеющий имя и украшенный несколько щедрее, чем того требует здравый смысл. Владеть таким позволено только Первому Мечу Дома, и редкий воин решит в реальном бою проверить, за что дворянин удостоился такого титула.\n\nОтношение к таким забавам знати среди простолюдинов разнится от случая к случаю, и, зачастую, чем ближе к побережным городам, тем чаще \"я человек Дома Кастелли, ношу их цвета и участвую в их праздниках, и готов пойти сражаться в их файде\" сменяется \"они опять поубивали друг друга из-за аристократического идиотизма\".\n\nИнланская Церковь всегда достаточно обособленно держалась от Священного Королевства, и с приходом к власти Понтифика Алистера отношения только накалились.\n\nВ этом же славном королевстве, на окруженном горами полуострове Лэн Шаранна, находятся родные земли сэра Латимера Инланского, Сияющего Меча — Святого и легендарного спутника Эдмунда Говнариона. Тот же регион, находящийся во власти Дома Альмерро, известен лучшим (и баснословно дорогим) вином Мерклейда.", "category": "Земли", "createdAt": 1793632093893, "order": 2, "summary": "Объединённые королевства Эббелунда и Инлании под одним королём и двумя коронами.", "title": "Эблания", "updatedAt": 1793641859264, "updatedBy": null}, "dol-in-auros": {"aliases": ["Золотой Дальваг", "Оммсвальд", "Архонты"], "body": "Золотой Дальваг, Последний Оплот Гномов. Согласно древним хроникам Архонта Мудрости, этот город стоял под Каалагоном задолго до Союзных Королевств, Мерклейдской Империи, Темного Века и даже самого Антерена.\n\nЛюдям, конечно же, он эти хроники не покажет.\n\nДля гномов слово \"дальваг\" — всё. Город, королевство, оплот и дом: сей термин обозначает все эти вещи сразу. Издревле Дол-ин-Аурос стоял близ человечества, практически никак не взаимодействуя с ним, исключая времена величайшей нужды. Горные врата оставались закрыты.\n\nВ общем-то, ситуация изменилась мало. Благодаря Эдмунду, золотой народ мог начать осторожную торговлю с внешним миром, но до сих пор очень немногие могут похвастаться тем, что лично входили в дальваг.\n\nКуда чаще можно встретить золотых гномов, его временно покинувших... но и те даже под пытками откажутся выдать хоть крупицу действительно полезной информации.\n\nИзвестно, что у Дол-ин-Ауроса нет короля или иного единого правителя: дальваг управляется советом Архонтов, каждый из которых занимается собственной стезей. Очень немногие знают полный список Архонтов, но из многочисленных источников можно вывести следующих: Войны, Мудрости, Закона, Кузни, Жизни, Пара, Золота, Тайн и Народа.\n\nВ недавние времена, после присоединения легиона Дол-ин-Ауроса к силам Альянса, стало известно, что каждый из Архонтов берет имя первого из всех его предшественников. Таким образом, к примеру, Архонт Войны [[Нумиратрас]], помогающий Альянсу, является далеко не первым своего имени. [[Гномы]] не видят смысла добавлять \"Первый, Второй, Тридцатый\" и прочие числительные: каждый Архонт продолжает начатое задолго до них дело и, в каком-то смысле, жизнь первого из Архонтов.\n\n383 год поставил точку в их изоляции: легион Архонта Войны присоединился к Альянсу под после вмешательства нескольких искателей приключений, явив внешнему миру давно забытое огнестрельное оружие и паровые машины. Что бы ни произошло после Войны Червя, мир изменится до неузнаваемости...", "category": "Земли", "createdAt": 1793632093893, "epigraph": "Валлахтанг ирданш!", "epigraphBy": "Гномье восклицание на любой случай жизни", "order": 4, "summary": "Золотой Дальваг под Каалагоном, последний живой оплот гномов.", "title": "Дол-ин-Аурос", "updatedAt": 1793641859264, "updatedBy": null}, "daniil-midranmar": {"kind": "character", "title": "Даниил Мидранмар", "category": "Персонажи", "group": "Альянс", "role": "Зелёный Владыка, Бог Борьбы Грандаль", "status": "Воюет за Альянс", "summary": "Один из пяти Владык Антерена, вернувшийся в мир в облике хасситского бога.", "body": "Зелёный Владыка Даниил, Оплот Антерена и Повелитель Воинов — один из пяти живых богов [[Антерен|антеренской]] цивилизации, заслуживший каждое из своих прозвищ.\n\nЛегендарный воин и полководец, он стократ приумножил владения Антерена во время Великих Завоеваний и сразил Короля-Бога [[Райтриари|райтриари]]. Какое бы впечатление он ни производил своим видом, не стоит считать его обычным громилой: в мирные годы именно ему принадлежали некоторые из наиболее примечательных алхимических открытий.\n\n## Возвращение\n\nСражённый в дуэли с Анзором, рыцарем-предателем из собственного же ордена, Даниил был возрождён на Фестивале Грандаля, приняв мантию одноимённого хасситского божества.\n\nСчитаемый современными людьми грозным и непоколебимым воителем, «Бог Борьбы» давно устал от сражений и жестокости и не желает ни власти, ни боевой славы. И всё же против [[Пожиратель|Пожирателя]], угрозы всему мирозданию, он согласился поднять оружие вновь.\n\nИзвестно, что в ранние времена Антерена он и его воины носили иной цвет, но после судьбоносного поединка с [[Таулендин|Таулендином Аманетилом]] зелёный навеки закрепился за Мидранмаром.\n\nБольше всего прочего Даниил страшится, что божественный образ Грандаля, созданный народом хасситов вокруг антеренского владыки, начнёт влиять и на него самого, вернув к жизни давно отброшенную жажду битвы.", "aliases": ["Даниил", "Владыка Даниил", "Мидранмар", "Грандаль", "Бог Борьбы", "Зелёный Владыка"], "order": 4, "image": "images/daniil-midranmar.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793633557135, "updatedAt": 1793637826813, "updatedBy": null}, "voina-chervya": {"aliases": ["Пожиратель", "Червь", "Альянс", "Легион Голода", "Эоган", "Лорд Глубин"], "body": "Самое свежее и самое страшное событие Второй Эры. Сведения на конец 383 и начало 384 года.\n\n## Что известно\n- Война прокатилась по северу [[Мерклейд|Мерклейда]]. **Легион Голода** уничтожил почти всё герцогство Агдея и Лирию в [[Говнария|Говнарии]]. Король Лирии Арктор III, вероятно, погиб со столицей.\n- Против Пожирателя собрался **Альянс**. В него вошли силы, которые веками не воевали ни с кем рядом:\n  - легион [[Дол-ин-Аурос|Дол-ин-Ауроса]] под началом Архонта Войны Нумиратраса, впервые показавший миру огнестрельное оружие и паровые машины;\n  - аэклари из [[Каэд Диссен|Плотнолесья]] вместе с энтами;\n  - Совет Магистров [[Казакия|Казакии]], впервые вступивший во внешний союз;\n  - флот Альконде (см. [[Золотое Побережье]]), а по слухам и наги;\n  - ветераны Рейклейда под Железным Маршалом, который, предположительно, погиб или пропал;\n  - [[Даниил Мидранмар]], вернувшийся в мир в облике хасситского бога Грандаля;\n  - паладины и храмовники Жёлтого Знамени под началом [[Мериден]];\n  - эбланские войска [[Костанте Делаттре|Адамантового Маршала Делаттре]];\n  - [[Саансибарт]], древний царь сейрентри, с вивернами и алыми молниями.\n- Морские силы Культа Червя разбиты благодаря «Указу о Защите Моря» Лорда-Адмирала.\n\n## Враг\n[[Пожиратель]] ведёт войну руками своего Предвестника, [[Эоган|Эогана]], Лорда Глубин. Армия Червя — Легион Голода: [[Голодные]], их Капитаны и Рыцари, [[Дерокку|дерокку]], [[Умбральные Колоссы]] и [[Обитатели Глубин]].\n\nСамый сильный полководец Легиона, [[Амонгехет]], пал при Винтерстейне, успев убить Архонта Нумиратраса. Теперь силы Червя ведёт [[Кандри Хиш]], и Легион перешёл к обороне и диверсиям.\n\n## Последствия\nСудьба Рейклейда, беженцы с запада, открывшийся миру Дол-ин-Аурос, союз с эльфами — всё это решится после победы над Пожирателем.", "category": "История", "createdAt": 1793632093893, "order": 3, "summary": "Идущая в 383–384 годах война Альянса против Пожирателя и его Легиона Голода.", "title": "Война Червя", "updatedAt": 1793637826813, "updatedBy": null}, "valatrellen": {"aliases": ["Валатреллен"], "body": "Единственная достоверно известная представительница Древних Драконов (см. [[Род Драконов]]). Она спит долгим сном в далёком Сетлейде под охраной принятого ею народа, алокожих валлатрийцев, которые и назвали себя в её честь.\n\nВаллатрийцы почти не выходят во внешний мир: разве что рабами, наёмниками или в священное путешествие. Что увидит мир, когда Валатреллен проснётся, никто не знает.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Боги и великие силы", "kind": "character", "order": 1, "role": "Последний из Древних Драконов", "status": "Спит", "summary": "Живое божество валлатрийцев и, возможно, последний живой Древний Дракон.", "title": "Валатреллен Красная", "updatedAt": 1793633557135, "updatedBy": null}, "benedikt": {"kind": "character", "title": "Бенедикт Прокул Элегия", "category": "Персонажи", "group": "Загадочные личности", "role": "Вампир-Лорд, Владыка Крови", "status": "Перемирие с героями", "summary": "Последний вампир-лорд Тёмного Века, живущий в сотнях тел сразу.", "body": "Последний из вампиров-лордов Тёмного Века, переживший [[Война Черной Короны|Войну Чёрной Короны]]. Для Союзных Королевств считается чем-то средним между мифом и ходячим стихийным бедствием, каждые полвека устраивающим масштабную резню, чтобы утолить совершенно невменяемый при таком жизненном сроке Голод. Согласно древнейшим упоминаниям, отравляет этот м
