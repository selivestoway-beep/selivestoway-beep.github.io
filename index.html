и сородичами. Вопреки своему устрашающему виду, в большинстве своем они известны скорее как добродушный народ, а их мастерство в кузнечном деле известно даже за пределами Ведории.\n\nОсобым проявлением их навыков является секрет обработки иселита — подобного льду полупрозрачного металла, являющегося основой для первоклассных доспехов и оружия, что разит врага не только лезвием, но и гибельным холодом Готтлейда.\n\nОдни из самых близких к предгорьям Каалагона, вегиры боятся и почитают драконов. Помимо обычных виверн, встречающихся среди многих горных пиков, Долину Морозного Тумана считают одним из последних мест, где еще можно встретить Каалагонских Виверн — можно, но, как считают сами вегиры, совершенно не нужно.\n\n## Уклад Ведории\n\n### Владыка Войны\n\nТитул и должность, дающая князю право быть верховным главнокомандующим во времена войны, вести за собой объединенные Вольные Княжества. Такой Владыка выбирается из всех князей на Большом Конклаве, созываемом в Эскаране. Сей титул - величайшая честь и вершина амбиций для многих князей, и даже несмотря на все усилия Конклава процесс его выборов часто сопряжен с немалыми трудностями.\n\n## Духи Ведории\n\nВэллахани учат, что два типа духов населяет Ведорию: **духи мира** и **духи предков**.\n\nПервые рождаются из самого Мира, его Основ и стихий. Они возникают из его сущности и являются ее продолжением.\n\nВторые не рождаются — ими становятся. Миряне могут называть их призраками, ибо духи предков иногда возникают после смерти людей или зверей. Обычно не становясь чем-то больше низших духов, они возвращаются в Пустоту и естественный цикл мира, но мудрецы знают немало исключений.\n\nНа низшем уровне духи Ведории представляют собой не отдельных существ, а рассеянную духовную жизнь мира — бесчисленное множество слабых, почти бессознательных присутствий, наполняющих мир подобно полю.\n\nЧаще всего эти создания собираются вокруг Мест Силы и артерий Живого Камня.\n\nЧувствительные к Таинственной Силе способны ощущать их присутствие напрямую. Остальные воспринимают их как шелест листвы или сгущающиеся тени, странные интуитивные догадки, неясные сны на священных землях, ощущение давящего присутствия или взгляда.\n\nВ пределах этого духовного фона, различия между ними практически неощутимы.\n\nВ редкие часы и в особых местах, такие \"низшие\" духи могут стать видимы. Нередко их воспринимают в виде неисчислимого множества огоньков.\n\nВыше них — **Малые Духи**. Пусть это название не смущает читателя, ведь такой \"малый\" дух может оказаться, к примеру, каргой — могущественным духом-ведьмой, в своих владеньях способной погубить целую дружину. Сила их значительно разнится от одного к другому.\n\nБестелесные или же имеющие оболочку, такие создания обычно возникают и существуют вокруг некой основы: места, объекта, природного явления, предмета или чего-либо еще.\n\nТак рождаются духи рек и озер, деревьев и целых рощ, огня и грозы, зверей и птиц, кладбищ и гор, и много чего еще.\n\nОсобняком стоят феи — мелкие зловредные создания, напоминающие маленьких людей с крыльями насекомых. Большинство из них до неприличия мерзопакостны и приравниваются к вредителям вроде гоблинов или тараканов.\n\nНаконец, на вершине находятся **Старшие Духи** — древнейшие создания, иными считаемые малыми божествами или чем-то сравнимым с ними. Около десятка Старших Духов на Ведорской земле известно мудрецам вэллахани, и еще меньше из них заинтересованы в ведении дел с людьми: большая их часть находится в вечной дреме или погружена в некие собственные дела, неизвестные смертным.\n\nКак духи места, они пропитывают все свои обширные владения, насыщая их и являясь продолжением их сути. Как духи зверей, они превосходят и царят над всеми созданиями своего вида. Как духи стихий, они воплощают собственное явление стократ полнее и страшнее прочих духов. Простой контакт с подобным духом немыслим для кого-то кроме подготовленных старейшин-вэллахани или человека не меньшей силы, ибо далеко не каждый сможет выдержать присутствие Старшего Духа, сохранив рассудок или жизнь.\n\nДревние сказания и домыслы иных вэллахани предполагают существование **Великих Духов** — истинных повелителей духовного мира, чья власть и сила распространяется не просто на Ведорию, но ощутима во всем мире. Однако, ни одного из них так и не удалось отыскать в Ведории, и многие считают это либо сказкой, либо пустой схоластикой: зачем называть или мыслить о том, что все равно невозможно встретить или поговорить?\n\n## Винджен\n\nСреди всех воинов Мерклейда, мало кто обладает настолько же грозной репутацией, как свирепые винджен. Мастера оружия, их тела покрыты особой раскраской — символом покровительства самой Ведорской земли. Более всего их страшатся за умение входить в священную ярость: в этом состоянии они могут сражаться даже сквозь страшнейшие раны, их тела получают медвежью силу и ловкость саблезубого тигра. Редким реймам винджен в ярости открываются и иные сверхъестественные способности, считаемые помощью духов.\n\nВинджен — не одиночки. Объединение винджен называется \"рейма\", или же Братство. В пределах братства нет формального лидера — голос каждого важен, и любой вопрос решается равным голосованием. Братства формируются вокруг общей цели, из личной симпатии между винджен или по иным подобным признакам.\n\nС незапамятных времен, реймы винджен обладают Свободным Правом — они не служат ни одному из княжеств, но всегда должны помогать по мере возможности. Большинство братств поддерживает теплые отношения с Конклавом, и иные из них ставят своей целью защиту отдельных Рощ или помощь вэллахани.\n\nВинджен — лучшие из лучших воинов. От кандидата требуется соответствовать этому утверждению (или подавать надежды в глазах братства), а также внутренним требованиям отдельной реймы. Вопреки названию \"Братство\", женщины, подходящие под эти критерии, также свободно принимаются в винджен.\n\nСамими винджен рейма воспринимается не только как воинское братство, но как семья, узы которой воспринимаются крепче кровных, брачных или каких бы то ни было еще. В рейму принимают не столько тогда, когда человек научился сражаться рядом, а тогда, когда рядом с ним готовы жить.\n\nТрудно переоценить помощь, которую винджен оказывают Ведории: реймы помогали в войнах, сражали чудовищ и злых волшебников, сопровождали вэллахани в священных паломничествах и многое другое. Во многих поселениях знакомые местным реймы могут рассчитывать на бесплатное жилье и пропитание.\n\nНо также их и опасаются: священная ярость - не то, что можно использовать безрассудно, и иногда, поглощенный ею, винджен перестает отличать друзей от врагов. В худшем случае, начавший упиваться яростью винджен может сойти с ума и стать Потерянным, превращаясь в опасную угрозу всем вокруг. Потерявшись в ярости духов, трудно вернуться обратно, и во многих случаях, несмотря на все попытки, таких винджен ждет смерть от рук собственных братьев.", "category": "Земли", "createdAt": 1793632093893, "epigraph": "Мир не принадлежит никому.", "epigraphBy": "Истина Живой Земли", "order": 5, "summary": "Вольные Княжества Дальнего Запада, где живут духи и правит Конклав Зелёного Пути.", "title": "Ведория", "updatedAt": 1793641859264, "updatedBy": null}, "fargot-ur": {"aliases": ["Король-Бог", "Фаргот"], "body": "Фаргот ур-Иллантар, брат изобретателя Технологий Источника Ареллена. Он открыл Квантовую Модель Идентичности и научился кристаллизовать душу в Камень Душ, а Вечные Тела дали его народу настоящее бессмертие.\n\nЭльфы присягнули ему как Фарготу Уру, «первому среди всех». Прозвище Король-Бог придумали люди, видевшие его на поле боя, а райтриари сначала повторяли его в шутку.\n\nОн вёл четыре войны с [[Антерен|Антереном]] и однажды сражался рядом с Владыкой Даниилом. В Войне Источника тот же Даниил раздробил его Камень Душ. Подробнее в статье [[Райтриари]].", "category": "Персонажи", "createdAt": 1793633557135, "group": "Древние владыки", "kind": "character", "order": 2, "role": "Король-Бог райтриари", "status": "Камень Душ раздроблен", "summary": "Эльф, вернувший своему народу бессмертие в механических телах.", "title": "Фаргот Ур", "updatedAt": 1793633557135, "updatedBy": null}, "bandurian": {"aliases": ["Чёрный Король", "Черный Король"], "body": "Ученик основателя [[Круг Проклятых|Круга Проклятых]] Мар'агула, один из трёх колдунов, переживших Войну Владык. Вместе с Маэв Вортигерн и Нэриусом он превратил Круг в огромный культ, а после раскола возглавил Унаследовавших Скверну, верных старому Владыке.\n\nВ 113 году В.Э. объявил себя Чёрным Королём и пошёл войной на весь [[Мерклейд]]. Был уничтожен в тронном зале Дир-Анремайна Эдмундом, Пахомом и их спутниками (см. [[Война Черной Короны]]).", "category": "Персонажи", "createdAt": 1793633557135, "group": "Тьма и угрозы", "kind": "character", "order": 1, "role": "Чёрный Король", "status": "Уничтожен", "summary": "Ученик Мар'агула, развязавший Войну Чёрной Короны.", "title": "Бандуриан", "updatedAt": 1793633557135, "updatedBy": null}, "taulendin": {"aliases": ["Король Ничего", "Таулендин ур-Аманетил"], "body": "Таулендин ур-Аманетил был правителем Великого Дома Аманетил. Незадолго до Увядания он увёл своих людей под знаменем Изумрудной Луны в [[Бездна|Бездну]], отбил у Ониксового Трона Осколок и построил там Дворец-Вне-Времён, где время остановилось.\n\nЧтобы защитить народ от смертной судьбы, он вырастил Изумрудное Древо: каждый аэклари после смерти становится духом в его объятиях, а сильнейших Король возвращает сильванами (см. [[Эльфы]], [[Каэд Диссен]]). Сами аэклари зовут его Королём Ничего, и что значит это имя, люди так и не поняли.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Древние владыки", "kind": "character", "order": 3, "role": "Король Ничего, владыка лунных эльфов", "status": "Правит Дворцом-Вне-Времён", "summary": "Эльфийский король, отбивший у Ониксового Трона кусок Бездны для своего народа.", "title": "Таулендин", "updatedAt": 1793633557135, "updatedBy": null}, "derzert": {"aliases": ["Дерзерт"], "body": "Сын эббелундского короля Тристана и инланской королевы Летиции Учёной. Унаследовал обе короны и вместе с ними два королевских совета, два свода законов и обязанность быть двумя королями одновременно (см. [[Эблания]]).\n\nПрозвище он выбрал сам после семи неудачных покушений за месяц. Одиннадцатый год пытается свести два королевства к общему знаменателю. Самым удачным его ходом считают превращение спорного Нового Лорана в общую столицу.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Правители нашего дня", "kind": "character", "order": 3, "role": "Король Эблании", "status": "Правит", "summary": "Король двух корон, переживший семь покушений за один месяц.", "title": "Дерзерт II Удачливый", "updatedAt": 1793633557135, "updatedBy": null}, "cerkov-sveta": {"aliases": ["пахомианство", "Пахом", "Инквизиция", "Архангелы", "Ланвэ", "Орден Храма", "Пахомославие"], "body": "**Церковь Света**, также известная как **Пахомославная Церковь** — доминирующая на Мерклейде религиозная организация, основанная на поклонении Творцу — Создателю Света и этого мира.\n\nОснователем учения повсеместно признается **[[Пророк Пахом]]** — легендарный чудотворец и благой деятель времен Войны Черной Короны (113-117г. В.Э.). Согласно Книге Света — основополагающему священному писанию, в медитации Пахом повстречал Аосара, Архангела Мощи, что поведал ему **Слово Творца.**\n\nЦерковь Света оказала свое влияние практически на все страны пост-Мерклейдской Империи, но также эта вера укрепилась и на Восточном Востоке.\n\n## История Церкви\n\nКак организация, Церковь Света появилась только в 118г. Второй Эры, основанная Пахомием I, первым Понтификом, унаследовавшим имя и миссию Пророка. Однако, культ Света существовал задолго до этого.\n\nВопреки многочисленным заблуждениям, Пророк Пахом был рожден не на Мерклейде: исследования Неолоранского Университета позволили установить его местом рождения поселение Гахайед близ Зендара, столицы центральных земель Восточной Империи. Предполагаемая дата рождения — 73г. В.Э.\n\nРанняя жизнь Пророка неизвестна, равно как и конкретный момент судьбоносного откровения, известного как **Первое Прикосновение Небес**. Однако же, в первых текстах, рассказывающих о его проповедях, Пахом упоминается как молодой юноша.\n\nЕго проповеди в Зендаре и призывы оставить Речных Богов не сыскали большой популярности среди населения столицы — в конце-концов, имея при себе совсем небольшую горстку верных последователей, Пахом был изгнан из города, после чего долго странствовал по пустыне Ал-а-Гидэ, помогая страждущим и неся Слово Творца по миру.\n\nПо разным версиям легенды, после нескольких лет странствий Пахом либо получил следующее откровение, что направило его в [[Мерклейд]], либо же подвергся гонениям со стороны имперской власти и был попросту вынужден взять первый попавшийся корабль, заплатив капитану последним мирским имуществом. Во второй версии легенды, капитан представляется ужасающим бездуховным \"отморозком\", измывавшимся над Пахомом все путешествие: называя безумцем и издевательски допытываясь, сколько же у Творца было ангелов, раз ни один не явился переправить его через море.\n\nВновь о Пахоме становится известно в начале Войны Черной Короны, когда Пророк со сподвижниками явился в лагерь тогда еще простого предводителя ушедших в лес партизан и беженцев — Эдмунда Говнариона, лирийского рыцаря, потерявшего все в битве за Скуффеншильд. Пахом предложил герою свою помощь и тот, пусть с большим сомнением воспринял \"сброд бедняков и оборванцев\", но отказываться не стал.\n\nДальше всё известно: во времена Войны Пахом совершал великие деяния, исцеляя раненых, наставляя заблудших, карая слуг Тьмы и проповедуя Слово Творца.\n\nИзвестно, что Пахом был одним из пяти человек, включая самого Эдмунда, что прошли в тронную залу Дир-Анремайна и сразились с Черным Королем в решающей битве.\n\nПримечательно, что после судьбоносного боя Пророк исчез, и более никогда не являлся в мире. Пахомианцы верят, что его миссия была выполнена, и Пророк отправился в Небесные Чертоги — однако, если когда-нибудь он вновь понадобится миру, Творец позволит своему слуге вернуться и помочь человечеству.\n\n### Основание Церкви Света\n\nСама Церковь появилась уже после Войны Черной Короны: при полной поддержке императора Эдмунда, культу был придан официальный статус, после чего церковь была основана первым Понтификом, учеником Пахома, взявшим, с небольшими изменениями, его имя и поклявшимся продолжить миссию, а также Святым Латимером — ближайшим другом и помощником Эдмунда, во времена финальной битвы принявшим на себя ужасающее проклятье, предназначавшееся герою. Тот прожил лишь три месяца после войны — говорят, на чистой воле, однако за сей короткий срок сумел сделать все необходимое для поддержки Церкви и основания **Ордена Сияющего Меча** — в честь собственного прозвища.\n\nВскоре, вместе с расширением Мерклейдской Империи, учение Церкви Света было принято во всех землях современных Союзных Королевств. На пике могущества Империи, когда та практически контролировала весь континент, о Пахомославии знал весь Мерклейд: амбициозная мечта Эдмунда объединить все человечество под единой верой сплелась с целью Пахомославия — сделать так, чтобы Слово Творца звучало в каждом уголке света, и Создатель вернулся в мир.\n\nОднако, этому не суждено было состояться. После смерти императора Эдмунда, империю ждал скоропостижный крах: ни один из его потомков так и не смог достичь даже трети силы и харизмы первого из Говнарионов.\n\nПомимо того, весь континент о Пахомославии знал, но не обязательно стремился принять: в конце-концов, за пределами Союзных Королевств, вера по-настоящему прижилась только в городах Золотого Побережья.\n\nС расколом Империи, нечто подобное ждало и Церковь. Уже к 300 году Второй Эры, практически каждое из Королевств имело \"свою\" Церковь, формально признавая власть и статус Понтифика в Говнарии, но сохраняя значительную автономию.\n\nВ 383 году, после смерти короля Франца Говнариона, последнего из рода Эдмунда, в ходе события, известного как Второе Прикосновение Небес, правителем стал [[Понтифик Алистер]] — шестой Понтифик Церкви. В настоящее время, [[Священное Королевство]] Говнария считается теократией.\n\n## Устройство Церкви\n\nЦерковь Света можно разделить на три условные части: Белую Церковь, Инквизицию и [[Орден Сияющего Меча]].\n\nИз них, именно Белая Церковь является не только видимой частью Церкви Света, но и попросту основой, от которой все прочее произрастает, подобно ветвям. Говоря о Церкви Света, обычно имеют в виду именно эту организацию.\n\n### Иерархия Церкви\n\n- **Понтифик** — Верховный жрец и глава Церкви Света. Пожизненно выбирается Адеконом в ходе монструозно-сложного процесса.\n- **Архиэнкантор** — Энкантор, управляющий несколькими церковными областями. Из архиэнканторов выбираются участники **Адекона**, созываемого Понтификом для решения масштабных церковных вопросов.\n- **Энкантор** — Старший клирик, обычно руководящий отдельной областью из собора. Они могут проводить все церковные обряды. Название \"Энкантор\" происходит от антеренского слова Enqua - чудо, и в прочтении с упрощенного антэрина означает \"чудотворец\". Изначально этот сан был титулом, во времена Войны Черной Короны означавшим человека, достигшего мастерства в теургии. Позднее, уже во времена Мерклейдской Империи, он превратился в церковный сан со своими обязанностями и правами.\n- **Жрец** — Посвященный клирик, обученный проводить богослужения и основные священные ритуалы. Жрецы обычно заведуют отдельной церковью. До реформ Пахомия IV в период долгого мира, для становления жрецом послушник также был обязан иметь способности к теургии и уметь творить все пять основных чудес Книги Света. После реформ Понтифика Алистера, это требование восстановилось.\n- **Послушник** — Кандидат в монахи, пока еще не входящий в иерархию. Во время послушничества будущий клирик узнает Священный Язык и изучает святые писания, а также проходят испытательный срок, помогая при храме.\n\n### Орден Храма\n\nВоенное крыло Говнарской Церкви, злыми языками называемый не иначе как личной армией Понтифика. По сути, так и есть.\n\nВозглавляется Великим Магистром, назначаемым самим Понтификом, но обладающим достаточной свободой в тактических вопросах.\n\nИх задачи: защита Святого Престола и Понтифика, охрана святынь и поддержание порядка в церковных землях, а также участие в Светоносных Походах.\n\nВлияние Ордена Храма, ранее немногочисленного, значительно возросло во время правления Годрика II Говнариона и, наконец, практически взлетело до небес после прихода к власти Понтифика Алистера.\n\nДевиз: _«Пока стоит Храм»_, _«Огнем и мечом»_\n\n- **Великий Магистр** — Глава Ордена Храма, избираемый лично Понтификом до смерти Магистра или смены главой Церкви. Командует всеми силами ордена, имеет право назначать командоров и утверждать уставы. В военных кампаниях действует самостоятельно, но стратегические цели получает от Понтифика или Адекона.\n- **Маршал Ордена** — Заместитель Великого Магистра, отвечает за боевую подготовку, дисциплину, логистику.\n- **Рыцари-Командоры** — Главы крупных структурных единиц — **прецепторий**(укреплённых монастырей-крепостей), каждая из которых расположена в ключевом регионе Говнарии. Вдобавок к самой крепости, идет Дом Ордена — резиденция в ближайшем крупном городе, а также фермы, мастерские и прочие заведения, снабжающие Орден.\n- **Рыцари-Капитаны** — Командиры отрядов от нескольких десятков до сотни бойцов.\n- **Рыцари Ордена** — Полноправные храмовники, принесшие обеты и прошедшие посвящение.\n- **Сержанты** — Боевые братья, не прошедшие полное рыцарское посвящение. Не приносят обетов, но обязаны следовать уставу. В бою составляют вспомогательные отряды, охраняют обозы, несут гарнизонную службу.\n- **Оруженосцы** — Кандидаты в рыцари, проходящие обучение и испытательный срок. Служат при рыцарях, ухаживают за оружием и лошадьми.\n\nТакже отдельно выделяют следующий ранг:\n\n- **Капеллан Ордена** — Жрецы, не являющиеся боевыми членами, но прикомандированные к Ордену. Совершают богослужения, исповедуют рыцарей, в случае наличия теургических способностей творят поддерживающие чудеса.\n\n### Инквизиция\n\nЦерковная структура, как ни парадоксально, в каком-то смысле возникшая до самой Церкви.\n\nПервым Инквизитором считают Святого Дункана — одного из сподвижников Пророка, что, согласно канонам, искоренил сотни противников Его задолго до того, как сам Пахом мог о них узнать. В ходе Войны Черной Короны, по легенде, именно он спас армию Эдмунда от нескольких крупных заговоров и лично запечатал не одного демона, принявшего облик союзника.\n\nКогда после войны Пахом исчез, а его ученик Пахомий I начал строить Церковь Света как иерархическую структуру, Дункан отказался войти в неё на правах подчинения. Он сказал (согласно житиям): _«Пророк не учил нас строить соборы и собирать десятины. Он учил нас различать Свет и Тьму там, где другие не видят. Это и будет моим делом»_.\n\nТак возникла **Инквизиция** — изначально как братство «тех, кто видит», неформально связанное с Понтификом, но сохранявшее полную автономию. Формальный статус Инквизиция получила спустя целое десятилетие, доказав свою полезность императору Эдмунду, который даровал ей хартию, позволявшую действовать на всей территории Империи без оглядки на местные власти.\n\nФормально это называется **Право Первого Слова**: если инквизитор раскрыл ересь или угрозу, он действует немедленно, не дожидаясь разрешения от Белой Церкви или светских властей.\n\nОт любого верующего Инквизитор может потребовать содействия в расследовании под угрозой отлучения.\n\nИх девиз — \"Враг многолик\"\n\nПримерная иерархия Инквизиции такова:\n\n- **Первый Инквизитор** — Представитель Инквизиции в Адеконе и формальный глава всей организации. Избирается среди Великих Инквизиторов, но кандидатура должна быть утверждена Понтификом.\n- **Великие Инквизиторы** — Главы крупных территориальных отделений, координирующие целые группы инквизиторов.\n- **Инквизиторы** — Основная единица Инквизиции. Каждый — полноправный, самостоятельный оперативник, имеющий значительную автономию: каждый волен сам вести следствие, нанимать агентов, выносить приговор и использовать те меры, которые он считает необходимыми.\n- **Исповедники** — \"Послушники\" организации, обучающиеся под крылом отдельно взятого инквизитора.\n- **Агенты** — Осведомители, мастера маскировки, члены инквизиторской свиты и иные специалисты, не состоящие в официальных рядах, но работающие на Инквизицию. Часто это бывшие преступники, получившие шанс искупить вину, или талантливые миряне.\n\nТакже выделяют отдельную \"организацию внутри организации\":\n\n- **Экзекуторы** — Боевое крыло Инквизиции, не обладающее следственными полномочиями. Отряды, специализирующиеся на уничтожении магов, демонов, чудовищ и прочих сверхъестественных угроз. Обычно избегают тяжелого снаряжения, предпочитая ему мобильность и специализированное под конкретного врага оружие (алхимическое серебро, сталь, хитрое оружие, бомбы и прочие алхимические составы). Малочисленны, однако каждый экзекутор является элитным бойцом высочайшего класса. Для наиболее опасных миссий Инквизиция может снабжать Экзекуторов священными реликвиями.", "category": "Вера и ордена", "createdAt": 1793632093893, "epigraph": "Враг многолик.", "epigraphBy": "Девиз Инквизиции", "order": 1, "summary": "Пахомославная Церковь: вера в Творца, Пророк Пахом, иерархия, Архангелы и Инквизиция.", "title": "Церковь Света", "updatedAt": 1793641859264, "updatedBy": null}, "govnariya": {"aliases": ["Пахомия", "Священное Королевство", "Понтифик Алистер", "Тимера"], "body": "До недавнего времени крупнейшее Союзное Королевство, располагающееся близ Каалагонских Гор. Прямой потомок Лирии и Мерклейдской Империи, все правители которой до недавнего времени были прямыми потомками легендарного Эдмунда Говнариона. До смерти короля все еще имело претензии на название \"Говнарская Империя\".\n\nПосле трагической смерти Франца Говнариона от Синей Чумы в 383 году Второй Эры и снятия с себя обязанностей Понтифика Пахомия Пятого, правителем стал [[Понтифик Алистер]], ранее архиэнкантор Алистер фон Клифф, объявленный вторым Избранным в ходе \" Второго Прикосновения Небес\", произошедшего на похоронах Франца.\n\nКак королевство, Говнария переживала зенит славы при деде Франца, Годрике I Говнарионе, являясь в те времена наиболее технически-развитой человеческой страной, активно торговавшей с гномами Золотой Горы и принимавшей у себя мастеров Блуждающего Народа, способной выставить почти 60 тысяч человек войска и имевшей взаимовыгодные отношения со всеми прочими членами старого Альянса и Сасаем.\n\nПри правлении Годрика II уступила Эблании многочисленные территории на теперешнем Рейклейде, чуть не потеряла Северный Предел и сократила армию практически втрое. Конец правления Годрика II пришелся на начало Ведорской Войны, разбираться с которой он, подавившись рыбной костью, оставил молодого Франца.\n\nИменно королем Годриком II, в час скуки, были изобретены правила игры в деорин — стратегическую настольную игру, разлетевшуюся по высшему обществу всех Союзных Королевств, и то было единственным его достойным деянием.\n\nХотя когда-то Говнария и могла похвастаться званием крупнейшего из Союзных Королевств, его никогда нельзя было назвать монолитным государством. Купец может трижды пересечь границы крупных владений и трижды заплатить пошлину, так и не покинув пределы одного королевства, а большинство жителей окраин никогда в жизни не видели Говнарской Столицы. Можно выделить девять крупнейших областей:\n\n## Священная земля\n\nТакже известные как Королевский Домен, эти земли напрямую подчиняются Говнарской короне — или же Понтифику, в современных реалиях. Ключевой достопримечательностью стоит назвать Говнарскую Столицу: один из самых впечатляющих городов Мерклейда, насчитывающий более шестидесяти тысяч постоянных жителей.\n\nЗдесь же находится Пахомия — ранее считавшийся независимым государством город внутри города, правителем которого считался Понтифик Церкви Света. По очевидной причине, различий в 383 году поубавилось.\n\nЗемли королевского домена богаты и плодородны, а знать, церковники и торговцы стекаются сюда из самых разных уголков королевства. Иные считают, что здесь и вовсе нет простых и бедных жителей: конечно, этот миф раскололся вместе с наплывом беженцев с Войны Червя.\n\n## Тимера\n\nНебольшая территория к северу от Священной Земли, Тимера является суверенными владениями Святого Латимера, переданными ему неотменимым эдиктом самого Эдмунда Говнариона. После смерти Святого, Тимера перешла в управление его наследию: Ордену Сияющего Меча.\n\nГоворят, нет места безопаснее. Действительно, люди, проживающие рядом с Оплотом, пользуются защитой Серебряных Рыцарей. Начинающие паладины нередко патрулируют дороги округа, и даже до самых отмороженных бандитов доходит, что свой промысел следует вести где-нибудь в другом месте.\n\nУправление Тимерой — одна из бесчисленных задач Грандмастера Ордена. За свою защиту жители окрестных поселений снабжают паладинов всем необходимым, формируя тесные и взаимовыгодные отношения.\n\n## Герцогство Дония\n\nЗемля к востоку от Королевского Домена, более всего она известна как родина Эдмунда Говнариона — легендарного героя Войны Семерых. Город-крепость Скуффеншильд, возведенный на руинах антеренского замка, пережил одни из самых ужасных битв того времени, но, в конце-концов, был восстановлен и перестроен, дабы всю вечность быть северным щитом Говнарии.\n\nКонечно, на самом же деле эту роль выполняет Хен-Эддельман, Стена Северного Предела, но репутацию следует поддерживать. Донийские рыцари сопровождали королевское войско во многих конфликтах, а сама герцогская семья водила с Говнарионами добрую дружбу.\n\nАнсельм мар Дония, герцог, является одним из самых усердных представителей Говнарии в Альянсе, а в его отсутствие герцогством правит жена правителя, Элизабет мар Дония. Об их любви и трех поручениях, которые молодой Ансельм исполнил для родителей герцогини, драматурги написали несколько пьес, каждая из которых запрещена к показу в донийских землях.\n\nСчитается, что в каждом поселении найдется повар, стремящийся назвать свое блюдо \"любимым рецептом Эдмунда Говнариона\", передавшегося ему по наследству. Большинство таких историй противоречат друг другу.\n\n## Северный Округ\n\nОдна из двух областей Говнарии, чьи странности в административном устройстве сохранились еще с имперских времен. Виновником тому является Хен-Эддельман, Крепость Северного Предела: колоссальная стена, стоящая здесь с Первой Эры и закрывающая единственный крупный проход в Готтлейд.\n\nЕё правитель, неизменно из народа северных следопытов, не входя в дворянскую структуру Говнарии до сих пор считается высокородным лордом, чье слово имеет заметно больший вес, чем даже у пяти правящих поблизости баронов: и если по южную сторону этот факт ими нередко оспаривается, то для бледных людей Севера такая фигура мнится единственным. с кем вообще имеет смысл вести какой-либо разговор.\n\nИзвестно, что во времена предыдущего Генерала Ордена, Лотара, Лорд Предела был весьма тепло настроен к паладинам, и даже предлагал построить прецепторию прямиком в Поселении у Стены.\n\nО жителях Северного Округа ходит разная молва: иные говорят, что даже юных девочек здесь обучают владеть копьем и луком, а у седоусых дедов есть чему поучится даже опытным воинам. Другие молвят, что от северного ветра, набегов варваров и сомнительной пищи седоусыми дедами здесь считаются те, кому в других землях еще жениться рано.\n\n## Герцогство Фланнское\n\nПрибрежные территории на востоке Говнарии, эти земли по праву считаются одними из богатейших в королевстве: на юге оно граничит с Инланией, а восточная дорога из столицы рано или поздно приведет путника в Сасай, Город в Центре Мира.\n\nМестный народ считается более открытым к новому и дружелюбным к путникам, а в лавках можно заметить товары с самого Варлейда.\n\nСтолицей считается Фланорн — дословно \"красный город\", считающийся одним из красивейших в Королевствах.\n\nГраничит с наиболее опасными территориями Плотнолесья. Следопыты, способные проредить популяцию лесных чудовищ, здесь всегда найдут работу.\n\nГерцогская семья вот уже многие десятилетия водит добрую дружбу с Сасайским правительством, а злые языки говорят, что и сама была бы не прочь повторить путь Сасая, отделившись от королевства.\n\nБлиз него находится вольный город Тальмонт, когда-то часть герцогских земель, получивший независимость при Годрике II Говнарионе.\n\n## Копские Земли\n\nНикто уже и не вспомнит, что когда-то эти земли славились военными победами Копских князей над Эбланской кавалерией во времена войны, и активной торговлей между двумя королевствами в эпоху мира. Полвека назад, это место изменилось до неузнаваемости.\n\nПоявление Гор Архимага полностью изменило ландшафт прилегающей земли, превратив её в практически непроходимые болота. Тут же облюбованные гигантскими пауками Плотнолесья, Копские Земли стали на редкость неприятным местом для жизни. Знать окрестных земель, впрочем, в свое время смотрела на это позитивно: зато теперь Эбланская армия здесь точно не пройдет.\n\nЭто место было бы совсем никому не нужно, но все же Аттеркоп остается местом добычи полезнейших болотных трав, руды из Гор Архимага, а также контрабанды магических артефактов.\n\nСтолица, Аттеркоп, считается самым отвратительным для жизни городом в Говнарии. В этом, пожалуй, есть зерно истины.\n\nСчитается, что каждый второй копец хотя бы раз пробовал наркотики из болотных трав. Домысливается, что остальные в этом просто не признаются.\n\n## Оммский округ\n\nРегион, чьей жемчужиной является [[Оммсвальд]], Город у Горы: один из редких примеров человеческих городов, построенный не на руинах Антерена, но имперскими мастерами после Войны Семерых. Возведенный практически у самих ворот Дол-ин-Ауроса, этот город является крупнейшим центром торговли с гномами, издревле поставляющим им то, что невозможно получить под землей, и получающий взамен то, чего не отыскать под Оком Творца.\n\nИмеет статус вольного города, который вынужден уважать местный лорд: гномы, как издревле повелось, ведут свои дела только с городским Советом, и совершенно не хотят менять партнера. Самому же Совету это дает свои преимущества и рычаги давления, ставшие причиной многих свобод, которыми пользуются горожане.\n\nОкружают город суровые северные земли, покрытые крутыми холмами и непроходимыми лесами. Большая часть поселений живет за счет горных богатств Каалагона, и нередко нуждается в защите от того, до чего докапывается...\n\n## Герцогство Агдея\n\nОдна из крупнейших областей Говнарии, находившаяся к западу от центральных земель. Разделенная между многочисленными вассалами герцога и двумя архиэнканторствами, территория Агдеи с давних времен славилась плодородными землями, высокими соборами и внушительным количеством караванов Блуждающего Народа.\n\nЗдесь же находилось баронство Гессерн, известное тайным рецептом полулегендарной наливки \"Чемпион\"\n\nПрактически все герцогство было уничтожено Легионом Голода в ходе Войны Червя. Выжившие жители стали беженцами в восточных регионах, а большинство знатных родов прекратило свое существование.\n\n## Старая/Новая Лирия\n\nНесмотря на достаточно холодные отношения королевской семьи Лириенов с Эдмундом после становления частью Империи, в бытность её уже королевством Говнарией старые обиды оказались забыты, и именно они уже являлись одними из самых ценных союзников короны, чему лишь способствовала свадьба Франца Говнариона и Амелии Лириен, дочери Арктора III.\n\nВесь Запад был потрясен тем, что вскоре после смерти короля от Синей Чумы Арктор III публично обвинил Понтифика в цареубийстве и, в связи с древней клятвой служить королевскому роду, а не \"Церкви Света и безумным фанатикам\", заявил о возвращении независимости Лирии, собрав вокруг себя всех недовольных новой властью дворян.\n\nУвы, королевству не суждено было возродиться. В ходе Войны Червя, Лирия была уничтожена под натиском Легиона Голода, и Арктор III, вероятно, погиб вместе со столицей.", "category": "Земли", "createdAt": 1793632093893, "order": 1, "summary": "Союзное королевство, ставшее теократией Понтифика Алистера; родина Пахомии и Ордена Сияющего Меча.", "title": "Говнария", "updatedAt": 1793641859264, "updatedBy": null}, "termina": {"aliases": ["Мир", "планета"], "body": "Термина — вторая планета от Солнца и дом для всех рас и народов этого мира. Она примерно на 15% больше Земли, но во многом полая, поэтому сила тяжести почти привычная. Классического ядра у неё нет: тепло Подземью даёт основа Ort из [[Древо Основ|Древа Основ]], а над планетой лежит плотное поле внутренней реальности, которое и задаёт законы вроде самих Основ.\n\n## Континенты\n- **Адон-Тирлейдд** на Северном полюсе, древняя родина эльфов.\n- **Срединный Континент**, где живут все известные цивилизации. Он делится на четыре части: [[Мерклейд]] на западе, Варлейд на востоке, Готтлейд на севере и Сетлейд на юге.\n- Огромный пустынный массив на обратной стороне планеты. Цивилизаций там не замечено.\n\n## Подземный Мир\nПод Срединным Континентом лежат Великие Полости, колоссальные каверны, связанные сетью тоннелей. Всё это вместе называют Подземным Миром. Там живут глубинные гномы, кобольды, ящеролюды и твари вроде псевдодраконов.\n\n## Луны\n- **Муна Нераманция**, Луна Чародеев. Бледно-голубая, её цикл длится ровно 37 дней, один месяц антеренского календаря. Из неё черпают силу астроманты.\n- **Алый Близнец**, кроваво-красная луна, внезапно появившаяся в 383 году Второй Эры. Подробнее в статье [[Небесные тела]].", "category": "Мир", "createdAt": 1793632093893, "epigraph": "Прекрасный и многострадальный дом для бесчисленных рас и народов.", "epigraphBy": "Кодекс", "order": 1, "summary": "Планета, на которой происходит действие Mudila Quest: полый мир с тремя континентами и Подземьем.", "title": "Термина", "updatedAt": 1793632093893, "updatedBy": null}, "kazakion": {"kind": "character", "title": "Архимаг Казакион", "category": "Персонажи", "group": "Внешний космос", "role": "Архимаг, Предвестник Всеведущего", "status": "Затворник", "summary": "Основатель Казакии, сильнейший волшебник Термины и гость из Внешнего Космоса.", "body": "Бессменный лидер академии и государства имени себя, почти не участвующий в жизни ни одного, ни второго. Предположительно, сильнейший волшебник Термины, ответственный за появление Гор Архимага (см. [[Казакия]]).\n\nФактически направил изначальную троицу героев [[Война Червя|Войны Червя]] в их поход: сперва за истиной, а затем и против Пожирателя.\n\nБудучи Предвестником [[Всеведущий|Всеведущего]], по рукам и ногам скован в своих возможностях, как из-за методов своего покровителя, так и из-за риска ответных действий других Великих. Несмотря на это, ближе к концу Войны Червя начал активнее участвовать в жизни Героев Багерта, помогая им набрать силу к битве с [[Эоган|Эоганом]].\n\n## Характер\n\nЗа редкими исключениями немногословен и предпочитает отвечать наводящими вопросами, дабы собеседник пришёл к какому-нибудь ответу самостоятельно. Обычно сохраняет отстранённое спокойствие, иными принимаемое за безразличие ко всему вокруг.\n\nКак Предвестник Всеведущего явно осведомлён о гораздо большем количестве вещей, чем говорит, в том числе и полезных героям. Из-за политики невмешательства насчёт подобных знаний вынужден ограничиваться размытыми намёками и излюбленным «Архимаг Казакион этого не знает». Внимательные умы могут заметить, что Казакион сильно разграничивает себя как Предвестника и себя как... себя.\n\nПо своим словам, родом из Внешнего Космоса. Как-то обмолвился [[Тав'глаас|Тав'глаасу]], что его родной мир называется Шаннам.\n\nПредпочитает чай и однажды изобрёл элементалистское заклятье, создающее его в чайнике из псевдоматерии. Это говорит как о необычайной искусности архимага в Основах, так и о нежелании Совета Магистров тратить бюджет на закупки из Варлейда. Потрясающая неблагодарность.\n\nКазакион хорошо знаком с [[Конрад Селекаф|Конрадом Селекафом]], хотя последний явно относится к архимагу куда лучше, чем он к нему.", "aliases": ["Казакион"], "order": 1, "image": "images/kazakion.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793633557135, "updatedAt": 1793637826813, "updatedBy": null}, "urgas": {"aliases": ["орки", "гоблины", "огры", "кобольды", "зеленокровные"], "body": "Также известны как гоблиноиды, дикие народы и зеленокожие — хотя последний термин уж точно ошибочен. Расы ург'ас разительно отличаются друг от друга, и все же обладают единым истоком: немногие в наши дни помнят об Анурианской Империи, и еще меньшие знают об экспериментах Белого Святилища, закончившихся созданием вида рабов и солдат.\n\nПрошли тысячелетия, Империя пала и была дважды забыта. Рабы пережили мастеров и до сих пор ищут свое место в мире, считающем их чудовищами.\n\nХотя термин \"зеленокожие\" и ошибочен — иные ург'ас обладают серыми и бурыми оттенками кожи — их вполне логично называть зеленокровными — при всех многочисленных различиях, народы ург'ас обладают темно-зеленой кровью.\n\nВ среднем, все ург'ас взрослеют быстрее людей. Орки живут примерно столько же, сколько и люди, гоблины — около 50 лет (хотя обычно не доживают из-за внешних факторов), а огры — пока кто-нибудь их не прибьет. В ином случае, жить они могут столетиями.\n\n## Орки\n\nВ буквальном смысле прирожденные воины, орки были выведены для сражений. Исполины, средний рост которых приблизительно равен 235см, они на голову превосходят самых высоких их людей — и с легкостью пересиливают.\n\nДаже \"нонкомбатант\" орков может за счет чистой силы победить вооруженного и превосходящего себя в навыке человеческого бойца. Толстая, прочная кожа орков нередко оказывается надежнее иных доспехов, а удар их кулака следует блокировать щитом, а не руками.\n\nНе стоит также считать их и неповоротливыми громилами — их природный атлетизм отлично распространяется и на скорость. Недаром, выходя на бой с зеленокровными, командиры определяют одного орочьего бойца в десять человеческих.\n\nТам, где для людей владение оружием — искусство, для орков эти знания вложены напрямую в природные инстинкты. Орк, не умеющий сражаться, лишь немногим распространённее птицы, не умеющей летать.\n\nДалек от правды и стереотип о том, что орки непроходимо тупы — вовсе нет. Интеллектом они мало уступают человеку, пусть и образ их мысли довольно отличен.\n\nОднако, всю свою жизнь любой орк, желающий заняться чем-либо кроме боя, вынужден бороться с собственными инстинктами: они созданы для войны, и все кроме нее дается им ощутимо тяжелее остальных. Редкие орки, полностью пересилившие этот инстинкт, часто становятся шаманами — духовными лидерами племени.\n\n## Гоблины\n\nСамая распространенная раса зеленокровных, гоблинов иногда называют зелеными тараканами — завестись эти твари могут весьма незаметно и где угодно, плодятся быстро, вывести поможет разве что огонь и надежда на лучшее будущее.\n\nРостом примерно с гнома, тощие и слабые по одиночке, гоблины обладают сверхъестественной способностью действовать сообща. Они — прирожденные эмпаты, формирующие крайне крепкие связи со своей \"семьей\" — племенем или иной группой, с которой те проводят длительное время. Это — единственная их поистине удивительная сила: гоблин в племени из тысячи зеленокровных будет помнить каждого по имени и, вероятно, неплохо понимать характер и привычки.\n\nВ бою действуют большими группами, а еще лучше — не вступают вовсе, оставляя дело за ловушками, прочими боевыми хитростями или более ориентированными на бой ург'ас.\n\nКак показали эксперименты Университета, гоблины психологически адаптируются под группу, частью которой себя считают. Помести достаточно юного гоблина в человеческую семью и город, и получишь нечто весьма далекое от привычного образа \"ленивого, хитрого и гнусного зеленого карлика\".\n\nОтдельно выделяют кобольдов: гоблинов Подземного Мира. Их кожа ближе к угольным и темно-серым тонам, а глаза зачастую красных оттенков. Кобольды более высоки, физически развиты и самодостаточны, чем их надземные сородичи. Также называемые черными гоблинами, закаленные нелегкой жизнью в Подземье, они обычно более жестоки и враждебны к окружающим.\n\n## Огры\n\nГиганты, с легкостью достигающие в среднем трех с половиной метров ростом, огры — самые редкие и опасные из зеленокровных. Их силу не следует мерять человеческими мерками: по своей природе они ближе к великим зверям и троллям. Помимо роста, их также отличает более бурый оттенок кожи и, часто, шерсть, которой покрыта значительная часть их тел. У огров-мужчин также нередко встречаются мощные бивни — еще одно естественное оружие.\n\nКак ни странно, огры — наиболее миролюбивая раса зеленокровных, впадающая в ярость только по причине голода или сильной угрозы жизни. И вот в таком случае — пиши пропало. Огра практически невозможно убить: наделенные тролльей регенерацией, они способны с легкостью оправиться от любых ран, за недели восстановить утраченные конечности и полчаса жить с отрубленной головой. У них два сердца, и, коль даже одно перестанет биться, второе продолжит работать, пока эта помеха не будет исправлена.\n\nИ это при условии, что ранение вообще будет нанесено: шкура у них будет многим попрочнее орочьей.\n\nТаким образом, огр — живое, несколько туповатое и весьма прожорливое осадное орудие, в мирное время содержащийся племенами как совершенная рабочая сила.\n\nИзвестна, пусть и исключительно редка, особая, ныне вымирающая порода огров — кроги, результат смешения интеллекта и боевых инстинктов орка с физикой огра. Эти создания, лишь немногим уступая своим сильным предкам в физической мощи, являются наиболее ужасающими представителями ург'ас, живущими ради войны и наделенные всеми качествами, чтобы являться небольшой армией из одного существа. Большая их часть была истреблена еще во времена Антерена, а новые не могут быть созданы. Те, что остались — обладатели биологического бессмертия, живущие со времен давно погибшей Империи.", "category": "Расы", "createdAt": 1793632093893, "order": 4, "summary": "Зеленокровные народы: орки, гоблины, огры, когда-то выведенные как рабы и солдаты.", "title": "Ург'ас", "updatedAt": 1793641859264, "updatedBy": null}, "merkleid": {"aliases": ["Западные Земли"], "body": "Мерклейд — в дословном переводе, Западные Земли, представляет собой, как ни странно, западную и крупнейшую четверть Срединного Континента. При своих колоссальных размерах, вмещает широкую палитру климатических зон: от субарктических тундр севера Ведории, заканчивая бескрайними болотами Великой Топи и ржавыми степями Шема. Большая же его часть представляет собой различные вариации умеренного климата, и именно там цивилизация общепринято считается наиболее развитой.\n\nМерклейд отделен от Северных Земель цепью Каалагонских Гор — крупнейшими из известных гор Континента, своей площадью превышающие иные королевства. Небольшое ущелье, закрытое крепостью Северного Предела, является вратами в Белую Марку.\n\nС Варлейдом он соединен прибрежной полосой у Каалагона, переходящей в полуостров Рикарда — связующее звено между двумя частями материка, а также местонахождение Сасая, Города в Центре Мира.\n\nИстория Мерклейда неразрывно связана с Антереном — крупнейшей из когда-либо существовавших человеческих цивилизаций, контролировавшей практически весь материк. Промежуток времени от его основания до падения современными историками называется Первой Эрой — или же Эрой Владык.\n\nКак известно, трагическим концом эпохи Антерена стала [[Великая Катастрофа]], о природе которой до сих пор ведутся многочисленные споры. В течение многих лет фрагменты некогда великой цивилизации терзали доселе невиданные чудовища и магические аномалии, а попыткам восстановить порядок никак не способствовали ни голод, ни болезни, ни постоянные войны между оставшимися людьми, ради выживания сбивавшихся в примитивные кланы.\n\nОднако, Темный Век, продлившийся, на самом деле, от ста двадцати до ста семидесяти лет (сей вопрос остается немалой головной болью для многих ученых), все же закончился: как принято считать, в день основания северного королевства Лирии королем Арктором. Это событие завершило пятерку предшественников современных Союзных Королевств, и стало общепринятой точкой начала Второй Эры.\n\nЕдиножды во Второй Эре и на краткий в исторических масштабах срок, значительная часть Мерклейда вновь была объединена под единым флагом: герой Войны Семерых, [[Эдмунд Говнарион]], стремился принести человечеству мир и единство. Мерклейдская Империя, увы, лишь на несколько лет пережила своего основателя, хотя и оставила глубокий след на культуре своих прежних участников.\n\nСовременный Мерклейд можно разделить на четыре крупнейшие зоны: Союзные Королевства на северо-востоке, самое прямое наследие развалившейся Империи; [[Золотое Побережье]]; Шем на юге, включающий в себя Бескрайнюю Степь и Великую Топь; и Дальний Запад, большую часть которого относят к территории Ведорских Княжеств.\n\nИнформация в этом тексте актуальна на конец 383—начало 384 года Второй Эры.\n\n## Союзные Королевства\n\nНаследие Мерклейдской Империи, Союзные Королевства, как принято считать, представляют собой вершину западной цивилизации. Иные же говорят, что им повезло жить в сердце земель старого Антерена: и верно, девять из десяти крупных городов неизменно окажутся восстановленными по мере сил руинами, соединенные между собой антеренскими же дорогами, которые никто не может воссоздать.\n\nПодавляющее большинство населения — люди, мерклейдцы. Редко можно встретить караваны Блуждающего Народа или укрытые в высоких холмах айлы полуросликов.\n\n[[Пахомославие]] Церкви Света остается доминирующей религией Королевств, уступая дорогу старым культам лишь в далеких от сердца цивилизации регионах.\n\nТрижды успела устареть шутка о том, что Союзные Королевства не такие уж и союзные, учитывая регулярные конфликты Говнарии и Эблании, да и Королевствами в полной мере не являются: [[Говнария]] претендует на имперское прошлое, [[Эмден]] - княжество, а Альконде - республика.", "category": "Мир", "createdAt": 1793632093893, "order": 2, "summary": "Западная и самая большая четверть Срединного Континента, где разворачивается большая часть кампании.", "title": "Мерклейд", "updatedAt": 1793641859264, "updatedBy": null}, "ligorden": {"aliases": ["Железный Маршал", "Лигорден"], "body": "Полководец Годрика II, сосланный после Ведорской Войны. Уважение он заслужил и у своих солдат, и у противников. Когда война кончилась, объявил Нодесские равнины независимыми от [[Говнария|Говнарии]] и [[Эблания|Эблании]]: Рейклейд, «вольная земля». Его поддержали ветераны обеих сторон и ривачежский князь (см. [[Ведория]]).\n\nПеред лицом [[Война Червя|Войны Червя]] Маршал заключил мир с королём и Понтификом и снова повёл ветеранов в бой. По последним сведениям, он пропал или погиб, а с ним и цвет рейклейдского воинства.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Правители нашего дня", "kind": "character", "order": 6, "role": "Железный Маршал Рейклейда", "status": "Пропал", "summary": "Опальный полководец, объявивший Нодесские равнины свободной землёй.", "title": "Бокаверде Лигорден", "updatedAt": 1793633557135, "updatedBy": null}, "gnomy": {"aliases": ["гаркамму", "полурослики", "Блуждающий Народ", "Дальваг", "дварфы"], "body": "Гномы, также известные как garkamei (eд.ч. garkam) на антэрине и го-ди на симмерийском — низкорослый, крепкий народ, издали напоминающий низкорослых людей.\n\nСреднестатистический гном и впрямь низкоросл по человеческим меркам: их средний рост равен примерно 140см, хотя, от природы широкие в плечах и обладающие выдающейся силой, зачастую они выглядят куда больше, чем можно предположить.\n\nГаркамы (или гаркамму, при гномьем прочтении) отличаются уникальным по меркам прочих рас слухом. Гному очень легко услышать журчание ручья в сотнях метров от него, и еще легче распознать малейшие изменения в тоне собеседника. Их язык отличается от всех прочих известных мерклейдцам: одно и то же слово, одна и та же фраза может иметь кардинально иное значение в зависимости от ударений и интонаций, часть которых совершенно неразличима человеческим ухом. Именно из гномьего пошло расхожее выражение \"валлахтанг ирданш!\", способное выразить одновременно крайнюю степень одобрения, удивления, негодования и многих других эмоций.\n\nGarkam — заимствованное слово, не родное для антэрина. Дословно, в переводе с гномьего, оно означает \"рожденный глиной\", либо же, в ином прочтении, \"оживленный огнем\". Первородная, холодная глина, что есть основа их тел и всего мира, и Первое Пламя, что рождает Дух и придает глине Суть, являются двумя первостихиями в современной гномьей философии. Такая школа мысли достаточно легко соотносится с концепцией Древа Основ, и многими мистиками признается как иной взгляд на одну и ту же вещь.\n\nВ этой вере нет полноценных божеств, однако гномы почитают Совершенных Предков — тех гаркамму, что при жизни культивировали внутреннее пламя до тех пор, пока оно практически не перестало нуждаться в глиняном сосуде, после его разрушения (смерти) обретя форму бессмертия. Прожившие великую жизнь, Совершенные Предки почитаются своей семьей и пребывают в глубинах Дальвагов, но в час нужды, как гласит гномье учение, они способны явиться к своим потомкам.\n\nУченые Союзных Королевств склонны считать подобное явление либо поэтической фигурой речи, либо обыкновенными призраками.\n\nОднако, при третьем прочтении, \"garka\" означает просто \"слово\". Менее известная и утратившая популярность, но все еще остающаяся живой альтернативная традиция склонна видеть первооснову мира как вибрации Звучания Сотворения, чьим источником было непознаваемое Начало Всего. В разных трактовках оригинального выражения, непередаваемого полностью на языке людей, Всё Есть Звук, либо же все связано со звуком. Волны Сотворения являются основополагающей тканью реальности, и все в мире является результатом определенной вибрации.\n\nИз этой сложной философии выходит несколько мистических идей: Истинное Имя, что означает колебание Сотворения, полностью описывающее тот или иной объект, явление или понятие; и Тональную Магию, стремящуюся с помощью привычного нам звука и вибрации пытаться изменить Звук Сотворения. Для того гномами Дол-ин-Ауроса собираются исключительно сложные механизмы, издающие выходящие за пределы стандартного восприятия звучания. Результаты сих экспериментов людям уж точно неизвестны.\n\nЭто учение не обременяет себя вопросами того, откуда всё явилось — Начало Всего произошло в додревние времена, взглянуть на которые уже невозможно и бессмысленно.\n\nОно лишено понятия абсолютной божественности — безличное Начало Всего уже произошло, перестало быть в миг своего появления. Всё прочее равно по статусу.\n\nОно не смотрит на то, что будет после смерти — Звук Сотворения вечен, и значит что-то быть должно, но живя в мире, который ты сам до конца не понимаешь, и живя жизнью, не зная понятие \"жизни\", глупо задумываться о смерти и том, что будет за ее пределами.\n\nГлавным его смыслом является объяснение основополагающей природы настоящего и предположение о том, как можно подчинить ее своей воле.\n\nПримечательно, что в современности это учение особо любимо либо гномьими мастерами и учеными, стремящимися познать и подчинить себе мир, либо законченными пофигистами, которых привлекает общее отсутствие нравоучений и предустановленного смысла происходящего.\n\n## Дальваг\n\nДом. Город. Оплот. В человеческом языке отсутствует одно-единственное понятие, которое бы полностью передавало смысл этого слова.\n\nДальваг — классическое гномье поселение, вокруг которого строится практически вся жизнь отдельно-взятой гномьей цивилизации. Помимо этого, они не склонны строить множество внешних поселений, ограничиваясь редкими, связанными с Дальвагом крепостями.  Можно сказать, что Дальваг — и есть гномье королевство.\n\nСам же Дальваг — укрепленный, многоярусный город, обычно построенный и разрастающийся внутри горы. Мало известно об устройстве дальвагов, однако, исходя из немногочисленных сведений, все самые важные постройки, подобно большинству человеческих городов, построены ближе к центру, где для удобного перемещения между ярусами оборудованы массивные подъемники.\n\nДальваг является одновременно удобным, построенным на тысячелетия и постоянно совершенствуемым городом и неприступной фортификацией, оборудованной множеством как естественных, так и рукотворных защитных механизмов.\n\nЛюбому говорившему со знающим гномом известно, что существует три самых значимых Дальвага: [[Дол-ин-Аурос]], [[Этередайн]] и Безымянный Дальваг. Первый — столица одноименного королевства и родина золотых гномов. Второй — полумифический, давно утраченный чертог Блуждающего Народа. О третьем же знает каждый мудрец, но, по неизвестным причинам, каждый отказывается говорить.\n\n## Расы Гномов\n\n### Золотые Гномы\n\nКоренные жители Дол-ин-Ауроса, их выдает кожа цвета бледного золота, пусть при определенном освещении некоторые ее оттенки можно даже спутать с человеческой.\n\nТакже их выделяют темные волосы: светловолосых золотых гномов пока еще никто ни разу не видел.\n\nЗолотые гномы очень нечасто покидают Дол-ин-Аурос, и за пределами примыкающего к нему Оммсвальда люди редко могут увидеть кого-то кроме редких торговцев.\n\n### Блуждающий Народ\n\nСамый распространенный из гномьих народов, чье самоназвание можно перевести как серебряные гномы. Внешностью они больше напоминают людей: их кожа схожего цвета, а волосы могут быть любой человеческой окраски. Однако, их выделяет другая черта: глаза цвета холодного серебра.\n\nУ Блуждающего Народа, объединенного легендой о потерянном Дальваге, нет места, что они могли бы назвать домом: большинство из них либо скитается по миру, торгуя и предлагая различные услуги, либо же постепенно вливается в чужие культуры.\n\n### Глубинные Гномы\n\nИзвестные лишь жителям Подземного Мира, эти гномы скорее напоминают своих золотых собратьев. Различие идет скорее на культурном уровне: в противовес идее Дальвага, часть из них живет в островном королевстве Гортоэн, что в Северном Подземном Океане, а часть давно уже разбрелась по всему свету, формируя свои поселения и сливаясь с чужими.\n\nОт золотых гномов их все же отличает куда более хорошая способность к темному зрению, полученная в ущерб возможности выносить солнечный свет.\n\nТакже, они обычно несколько выше своих сородичей.\n\n### Полурослики\n\nСогласно Неолоранскому Университету, эта непохожая, с виду, раса является близким родственником гаркамму.\n\nВ сравнении со своими подземными сородичами, полурослики обычно обитают в горах Каалагона и пещерным сводам предпочитают открытое небо. Они живут т.н. айлами (ед.ч. айл) — поселениями из нескольких семей, обычно сохраняющих между собой близкие отношения. Многие такие айлы могут быть значительно удалены друг у друга, а их население - никогда не покидать родных краев, но в некоторых случаях многочисленные поселения полуросликов находятся в относительной доступности. Между ними могут быть как дружеские отношения, так и кровавые войны, продолжающиеся поколениями.\n\nБольшинство полуросликов спокойно пасут овец и занимаются иными собственными делами вдали от остального мира. Однако, в редких случаях, в случайном полурослике, зачастую под неким внешним воздействием, просыпается таинственный инстинкт, заставляющий его или ее отправиться на поиски всевозможных приключений, игнорируя даже самые страшные опасности. Внутри айлов таких полуросликов именуют \"джигитами\" и уважают, но стараются держаться подальше до тех пор, пока те не перебесятся. А вот потом, соседи с большим удовольствием выслушают все многочисленные истории, что успели произойти с джигитом во время пути.\n\nОтдельной известностью пользуется гостеприимство полуросликов. Говорят так: из айла путник может уйти мертвым, но не голодным.\n\nМногие замечают, что полуросликам по странной причине всегда сопутствует удача: айлы обычно обходят стороной любые крупные бедствия, ни разу еще их не затягивало в крупные войны, а странствующим джигитам обычно везет натыкаться на приключения и ценные находки в них.\n\nБольшую роль в культуре полуросликов, по неизвестной причине, играют шляпы. Чем больше шляпа - тем богаче душа — такое выражение ходит среди них. Возможно, по этой причине джигиты имеют странную привычку увязываться за первым попавшимся волшебником.\n\n## Дол-ин-Аурос\n\nНесмотря на то что гномы всегда говорят о многочисленных Дальвагах, Дол-ин-Аурос остается единственным живым и известным человечеству по сей день.\n\nУвы, помимо самого факта его существования, крайне немногое известно жителям внешнего мира: Золотой Город, как он известен в Оммсвальде, до 383 года Второй Эры сохранял крайне жесткую закрытую политику.\n\nДаже жители вышеупомянутого Оммсвальда, Города-у-Горы, знают немногим большее. И это при том, что со времен раннего правления Эдмунда Говнариона в 119 году ВЭ, Оммсвальд был построен практически впритык к золотым воротам, и с тех пор поддерживал взаимовыгодную торговлю.\n\nИзвестно, что у Дол-ин-Ауроса нет короля или иного единого правителя: дальваг управляется советом Архонтов, каждый из которых занимается собственной стезей. Очень немногие знают полный список Архонтов, но из многочисленных источников можно вывести следующих: Войны, Мудрости, Закона, Кузни, Жизни, Пара, Золота, Тайн и Народа.\n\nВ недавние времена, после присоединения легиона Дол-ин-Ауроса к силам Альянса, стало известно, что каждый из Архонтов берет имя первого из всех его предшественников. Таким образом, к примеру, Архонт Войны [[Нумиратрас]], помогающий Альянсу, является далеко не первым своего имени. Гномы не видят смысла добавлять \"Первый, Второй, Тридцатый\" и прочие числительные: каждый Архонт продолжает начатое задолго до них дело и, в каком-то смысле, жизнь первого из Архонтов.", "category": "Расы", "createdAt": 1793632093893, "epigraph": "Из айла путник может уйти мёртвым, но не голодным.", "epigraphBy": "Присказка полуросликов", "order": 2, "summary": "Гаркамму, народ с необычайным слухом, Дальвагами и верой в Первое Пламя.", "title": "Гномы", "updatedAt": 1793641859264, "updatedBy": null}, "velikaya-top": {"aliases": ["Топь", "Загнивающие Земли", "Драконья Гниль", "саутваны"], "body": "Подтверждая все представления северян, на юге Мерклейда привычная цивилизация действительно заканчивается. Ржавая Степь, риннские тропики — в конце концов, все уступает Великой Топи. Превосходя размерами даже [[Плотнолесье]], Топь, как ни странно, является громадным болотом, существовавшим еще в самых старых хрониках Темного Века.\n\nЗемля эта до сих пор остается покрытой туманом неизвестности для всех, кроме различных групп болотников — изгнанников, чародеев-отступников, беглых преступников и еретиков, которые не нашли пристанища ни в одном другом уголке Мерклейда.\n\nПрирода Топи не поддается разумному объяснению: всё здесь живет. Жизнь эта хаотична, изменчива — уснувший у дерева путник может по пробуждению обнаружить, что древесный мох поселился и на его одежде... или, если тот неудачлив, лице.\n\nКатегоризировать местную живность — задача интересная, но бессмысленная. Исследователь может обнаружить сотни неизвестных ранее видов птиц и насекомых, громадные цветы в человеческий рост и светящиеся в ночи грибы, но через полвека справочник уже едва ли можно будет считать актуальным.\n\nТочно также никто не пытается категоризировать народы Шема, поселившиеся здесь — большинство из них кочует по Болотам вместе с изменениями ландшафта и выживает за счет глубокого понимания местной природы.\n\nНе только люди обитают в Топях. Соседом, врагом, союзником и партнером для топских народов нередко становятся саутваны — прямоходящие болотные ящеры, считающие Топь священной землей. Большая часть их племен совершенно нетерпима к чужакам, но куда лучше относится к тем, чей образ жизни не так уж и отличается от их собственного. Даже подобным людям, впрочем, на их территории лучше не лезть.\n\nОдним из немногих крупных и постоянных поселений в Топи долгое время считался Знак Амара, что в Долине Ланшира. Державшийся на шатком союзе Искателей из Ринны, преступной шайки Гансода \"Кинжала\" и топского народа, город в конце-концов был эвакуирован в 383 году Второй Эры, когда Долина по неизвестной причине начала проваливаться под землю.\n\nКак ни странно, спустя неделю процесс остановился.\n\nПримерно в то же время Топи, почему-то, начали разрастаться на север, захватывая степные территории и заставляя многих шемцев мигрировать севернее. В тот же период, как ни в чем не бывало, болота отступили обратно. Странное место.\n\nДаже тех, кому во внешнем мире, в общем-то, рады, тоже нередко влечет в глубины Топи. Алхимиков влекут уникальные травы и реагенты, не имеющие аналогов в других странах. Магов — уникальная местная среда, вдохновившая не одно и не два заклинания. Но, конечно же, самые увлеченные исследователи точно встречали слухи о погребенных в болотах руинах цивилизации, значительно отличавшейся от Антерена, существуя с ним в одну эпоху. Известный риннский ученый, Ледерман, пропал в Топи более чем полвека назад, предварительно опубликовав свой труд \"По следам Шем'Тола\". Человеком, как говорят, он был довольно неприятным, так что скучать по нему никто не стал.\n\n## Загнивающие Земли\n\nФормально — часть Великой Топи, и, если считать её таковой, то болото превращается в колоссальную область, немногим уступающую всей территории Союзных Королевств. Топь меняет любую цивилизацию под себя. Загнивающие Земли говорят её остановиться.\n\nВсе эти места заражены феноменом, известным как Драконья Гниль. Иномирная болезнь, поражающая материю и дух, перестраивающая саму жизнь под себя, ассоциируется с Гниющим, Седьмым Архидемоном.\n\nАлые равнины, покрытые гнилостными грибами и фрагментами древних руин — вот единственное, что могут рассмотреть болотники издалека, уже рискуя быть затронутыми тем, от чего нет лечения.\n\nНичего об этом богами забытом месте неизвестно. Только самые безумные из культистов Гниющего приходят сюда в святом паломничестве, но и они ненадолго сохраняют человеческий облик.\n\nКак ни парадоксально, от распространения Загнивающих Земель естественным барьером служит Топь — её постоянно меняющаяся жизнь не дает Гнили времени адаптироваться.", "category": "Земли", "createdAt": 1793632093893, "order": 10, "summary": "Живое болото юга, где всё меняется, и Загнивающие Земли Гниющего за ним.", "title": "Великая Топь", "updatedAt": 1793641859264, "updatedBy": null}, "hronologiya": {"aliases": ["История", "таймлайн", "Вторая Эра"], "body": "Даты Второй Эры обозначаются как В.Э.\n\n## Эра Древа\nПервые [[Эльфы]] живут бессмертными на Адон-Тирлейдде. Увядание Древа Вечности кончает эпоху и приводит к Расколу эльфийского народа.\n\n## Первая Эра, Эра Владык\n- Упавшая Звезда и Источник, Владыки поднимают людей против эльфов.\n- Расцвет [[Антерен|Антерена]] и четыре эльфийские войны.\n- Ночь Расколотой Горы и рождение [[Каэд Фелл|Земель Теней]].\n- Великая Катастрофа и Война Владык с Легионом Тьмы.\n\n## Тёмный Век\nОколо 120–170 лет хаоса, чудовищ и войн кланов. Это же Золотой Век Осквернителей, когда разрастается [[Круг Проклятых]].\n\n## Вторая Эра\n- **0 В.Э.** Король Арктор основывает Лирию. Отсчёт Второй Эры.\n- **113–117.** [[Война Черной Короны|Война Чёрной Короны]] против Бандуриана. Эдмунд Говнарион, Пророк Пахом, сэр Латимер.\n- **118.** Основана [[Церковь Света]].\n- После войны — Мерклейдская Империя Эдмунда, которая быстро распадается на Союзные Королевства.\n- **322.** Парад Туманов, Земли Теней поглощают Рейтенорн.\n- **333.** Четвёртый Поход Очищения, Архимаг Казакион основывает [[Казакия|Казакию]].\n- **Около 333.** Появляются Горы Архимага, ландшафт [[Говнария|Говнарии]] меняется.\n- Ведорская Война Союзных Королевств с [[Ведория|Ведорией]], потом восстание Рейклейда под Железным Маршалом.\n- **383.** Смерть короля Франца от Синей Чумы, Второе Прикосновение Небес и приход к власти Понтифика Алистера. В небе появляется Алый Близнец. Начинается [[Война Червя]].", "category": "История", "createdAt": 1793632093893, "order": 0, "summary": "Главные эпохи и события от Эры Древа до Войны Червя.", "title": "Хронология", "updatedAt": 1793632093893, "updatedBy": null}, "zveroracy": {"aliases": ["холхоры", "ящеролюды", "змеелюды", "пикси", "феи"], "body": "Представители этих народов зачастую примитивны, малочисленны, или примитивны и малочисленны. Они — реликты предшествовавших Антерену и людям времен, когда сотни дивных рас имели свое место в мире. Нельзя сказать что-то конкретное обо всей этой категории: разные расы значительно отличаются друг от друга. Ниже упомянуты далеко не все зверорасы: лишь те, что еще активно действуют и известны на Континенте. И то, список будет дополняться.\n\n### Холхоры\n\nМогучие кабанолюды, холхоры являются одними из представителей Свиного Рода наравне со свиными медведями и, собственно, обычными свиньями.\n\nРостом обычно несколько выше людей, они напоминают покрытого жесткой щетиной человека с кабаньей головой, чья спина покрыта гривой похожих на иглы волос.\n\nДалекие от цивилизации, они обычно живут сплоченными племенами, направляемыми вождем и шаманом — хотя, в некоторых случаях, эту роль выполняет один и тот же свин.\n\nНаселяют почти весь Север и восточное побережье Мерклейда, печально известны и на Восточном Востоке.\n\nЖестко-территориальны и не терпят вторжения на незалежные земли, хотя и сами обычно не покидают родных земель без особой нужды.\n\nИх религия — довольно примитивный анимизм, холхоры считают все в мире обладающим собственным духом: стихии, места, вещи, предков и многое другое. И выше всех для них стоит Свиной Дух — Великий Дух всего кабаньего рода. Ему они возносят жертвы и хвалу на самых священных своих ритуалах, хотя и не ограничиваются им: по мнению холхора, имеет смысл быть в хороших отношениях с каждым духом, с которым ты хоть сколько-то часто контактируешь. Да и остальных обижать не следует.\n\n### Вил'Зигур\n\nПотомки давно забытого даже собственным народом затонувшего континента, известного как Зигур. Эта загадочная земля, чье название сохранилось только в самоназвании этой расы, ушла на дно океана больше десяти тысяч лет назад.\n\nПрочим же народам они более известны как ящеролюды. Если им и была когда-то присуща цивилизация и высокая культура, она ушла туда же, куда и их родные земли: современные зигуранты живут варварскими племенами, населяя, в основном, Подземный Мир и Великую Топь.\n\nЭту расу отличает великая скорость, ловкость и подвижность, а также умение десятки минут обходиться без воздуха. Отдельно стоит отметить и иную их особенность: их разум устроен совершенно иначе, чем у большинства иных рас, и они практически неуязвимы к воздействиям менталистов иных видов.\n\n### Змеелюды\n\nОдна из древнейших рас этого мира, змеелюды с легкостью доживают до 600 лет. Этот народ, ныне практически вымерший, когда-то был доминирующей расы Анурианской Империи, что властвовала над Континентом во времена задолго до первых людей.\n\nХолодные создания, они, вопреки расхожему мнению, чувствуют эмоции: пусть и испытывают их совершенно иначе. Для них нет пиков — бушующих, переполняющих чувств. Однако, каждую эмоцию они испытывают куда дольше людей: радость, гнев и печаль для них — размазанные по времени состояния души.\n\nОни также наделены абсолютной памятью: все то, что змеелюд однажды запомнил, он запомнит до самой своей смерти. По этой же причине Анурианская Империя знала многих величайших ученых и волшебников.\n\nНыне, тысячелетия спустя краха Империи, змеелюды находятся на грани вымирания. Вынужденные прятаться в руинах своих древних городов, темных пещерах и, скрываясь, среди чуждых им цивилизаций, большинство из них беспрестанно трудится, готовя почву для возрождения Империи из мифов и легенд, переданных им предками.\n\nВ зависимости от ряда факторов при рождении, могут принимать разные формы:\n\nВай-шиа, обладающих змеиным хвостом, гуманоидным торсом и головой змеи,\n\nИ вай-ша — обладающих, в отличие от прочих, подобными человеческим ногами.\n\n## Вне категорий\n\n### Пикси\n\nПоганые летучие крысы, также известные как пикси или феи. Эти создания, напоминающие миниатюрных людей немногим больше ладони с инсектоидными крыльями, встречаются во всем Срединном Континенте, Бездне и, если высшие силы глухи к любым молитвам, даже за пределами обеих Завес, во Внешнем Космосе.\n\nВ большинстве цивилизованных обществ считаются паразитами. Ленивые, похотливые и обладающие извращенным чувством юмора, эти создания живут для удовлетворения своих сиюминутных желаний, не задумываясь не то что о завтрашнем дне, но даже о следующем часе.\n\nИ это не является основной бедой. Беда в том, что эти создания способны возникать в буквальном смысле из ниоткуда. А если точнее — если где-то высока концентрация магии, может появиться и пикси. Конечно, если в каком-то месте побывала еще и фейская пыльца, то шанс на печальный исход только увеличивается.\n\nОбычно связаны с тем атрибутом магии, из которого родились. Так появляются \"звездные\", \"древесные\", \"огненные\" и прочие пикси.\n\nНередко издеваются и вводят людей в заблуждение себе на потеху. Их шутки разнятся от смены местами правого и левого тапка до приманивания к человеческому поселению опасных чудовищ, просто чтобы посмотреть, что из этого выйдет.\n\nЕдинственной ценностью является фейская пыльца, используемая в алхимии и волшебстве.\n\nНекоторыми магами зачем-то используются как фамильяры.", "category": "Расы", "createdAt": 1793632093893, "order": 7, "summary": "Холхоры, ящеролюды, змеелюды, пикси и другие реликтовые народы.", "title": "Зверорасы и прочие", "updatedAt": 1793641859264, "updatedBy": null}, "antieren": {"aliases": ["Первая Эра", "Эра Владык", "Владыки", "Даниил Мидранмар", "Великая Катастрофа"], "body": "Антерен — крупнейшая человеческая цивилизация в истории, когда-то державшая почти весь Срединный Континент. Время от его основания до падения называют Первой Эрой или Эрой Владык.\n\n## Начало\nПо архивам [[Райтриари|райтриари]], люди были созданы эльфийским Институтом как раса слуг. Всё изменила Упавшая Звезда, оставившая после себя Источник. Пятеро людей научились черпать из него Невозможную Энергию и стали для человечества живыми богами, Владыками. Они повели людей в Войну Непокорства и вытеснили эльфов за Каалагон.\n\n## Владыки и войны\nСреди Владык известны Даниил Мидранмар, родоначальник Стиля Сокрушения, и Леонид, автор «Единой Теории Волшебства» (см. [[Таинственная Сила]]). Антерен четыре раза воевал с райтриари. Четвёртая, Война Источника, длилась около века и закончилась тем, что Даниил в дуэли раздробил Камень Душ Короля-Бога. Однажды обе стороны всё же сражались вместе: против аватары Короля Мёртвых в Ночь Расколотой Горы (см. [[Каэд Фелл]]).\n\n## Падение\nЭру завершила Великая Катастрофа, о природе которой спорят до сих пор. С ней связано рождение [[Скверна|Скверны]] и Война Владык с Легионом Тьмы. Потом наступил Тёмный Век.\n\n## Что осталось\nПочти все крупные города [[Мерклейд|Мерклейда]] стоят на восстановленных руинах Антерена и соединены его дорогами, которые никто не умеет повторить. От Антерена идут язык антерин, календарь с месяцами по 37 дней, Формы Эгиды (см. [[Искусства Боя]]) и основы современной магии.", "category": "История", "createdAt": 1793632093893, "order": 1, "summary": "Величайшая человеческая цивилизация Первой Эры, которой правили пятеро Владык.", "title": "Антерен", "updatedAt": 1793632093893, "updatedBy": null}, "lyudi": {"aliases": ["человек", "мерклейдцы", "хасситы", "нейды", "сетийцы", "симмерийцы"], "body": "Наиболее распространенная раса, населяющая практически весь Срединный Континент. Живут они, в среднем, три четверти века, и, обычно, не обладают какими-либо сверхъестественными способностями в чем-то конкретном. Несмотря на это, скорость их развития поистине поражает: будучи самой молодой из известных миру рас, они успели создать великие империи, разрушить их к чертям и начать сначала.\n\nО себе люди могут говорить как обладателях \"непоколебимого духа человечества\", способных адаптироваться к чему угодно. Иные старшие расы несколько переиначивают эти слова, именуя их слишком уж быстро плодящимися тараканами, которые переживут даже конец света.\n\nТак или иначе, не самый короткий людской век заставляет их умело распоряжаться своим временем.\n\n## Мерклейдцы\n\nСамая распространенная раса Мерклейда — Западной половины Срединного Континента. Светлокожи, волосы разнятся от русого до иссиня-черного. Наследники центральных земель Антерена, они пережили Великую Катастрофу, Темный Век, Войну Семерых и прочие события, тесно связавшие их историю со Скверной. В современные дни, мерклейдцы обладают значимой устойчивостью к элементу Галата, но, коль та уступает, на них же проявляются одни из наиболее ужасающих шрамов Скверны.\n\n## Варлейдцы\n\nЛюди Восточной Стороны, варлейдцев также нередко называют народом Солнца за весьма темную кожу. Несмотря на это, чертами лица они скорее напоминают своих западных сородичей. Среди них чаще встречаются носители темных волос, но изредка можно встретить и исключения.\n\nИм привычно палящее Солнце, и многие представители этого народа могут похвастаться отличной выносливостью.\n\n## Сетийцы\n\nРаса, чаще всего встречаемая на юге Мерклейда: в землях Шема и Великой Топи, но также известная и в Иллуге, одной из имперских сатрапий. Их сразу отличает достаточно низкий рост и особый, узкий разрез глаз. Нередко их кожа принимает желтоватый, пергаментный оттенок.\n\nИзвестно, что сетийцев с большим трудом берут яды.\n\n## Нейды\n\nУникальная для Ринны раса людей, обладающая куда более светлой кожей и такими же волосами — практически поголовно они блондины, либо же имеют волосы цвета серебра. Их также выделяют чуть заостренные кончики ушей.\n\nОбладая, в основном, слабым здоровьем и не самой впечатляющей физической силой, нейды отлично чувствуют Таинственную Силу. Их век чуть короче обычного человека, но, по поверьям риннцев, каждому из них суждена особая судьба.\n\n## Хасситы\n\nЖители Штормового Берега, хасситы отличаются высоким ростом, смуглой кожей и, в каком-то смысле, сверхъестественной физической силой. Адаптировавшиеся к суровым условиям Залива Бурь, хасситы по праву считаются одними из лучших воинов и мореплавателей Континента.\n\nКрайне свободолюбивы и вспыльчивы, хасситов считают едва ли не наименее цивилизованным из людских народов. Поклоняясь Вечному Шторму, они не приемлют лидера кроме как имеющего достаточную харизму, чтобы вести за собой племя — из которого, правда, любой может выйти, если сочтет что его пути с главой должны разойтись.\n\nНесмотря на это, с большой серьезностью относятся к любым добровольным ограничениям этой самой свободы - к примеру, договорам и клятвам. Хасситские наёмники считаются если не лучшими, то уж точно надежнейшими: пока контракт не расторгнут, наниматель в полной безопасности.\n\n## Бледные Люди Севера\n\nСеверные исполины Готтлейда, немногие из них хоть сколько-то ниже двух метров. Они сильно отличаются от мерклейдских людей: их белоснежная кожа практически лишена цвета, и волосы самых разных оттенков белого и серого подходят под такое же описание. Многие из них обладают характерным \"взглядом мертвой рыбы\", как это описывают южане, а их бледные зрачки часто сливаются с белками.\n\nИзвестны своей практически чудесной живучестью и регенеративными способностями. Более того, готтлейдцы адаптированы к холодам своей родины, и устойчивы к любым морозам.\n\nОбитатели острова Маркдор также отличаются от остальных бледных людей достаточно распространенными огненно-рыжими волосами.\n\n## Пепельные Люди Симмерии\n\nЖители далекого Сетлейда, южных земель Континента. В любой толпе их можно узнать по серой, пепельной коже и таким же волосам: их словно бы покинул цвет. Выделяются лишь их глаза, имеющие обычно лиловый, красный или желтый оттенки. Разрез глаз чем-то напоминает сетийцев.\n\nИм привычны условия Серой Земли: симмерийцы легко переносят жар и практически невосприимчивы для большинства известных миру болезней, что разносят пепельные бури Эшленда.\n\nВ Мерклейде и Варлейде обладают сомнительной репутацией хитрых демонопоклонников. Реальность мало противоречит этим обвинениям.\n\n## Валлатрийцы\n\nТакже происходящие из Южных Земель, валлатрийцы — один из самых малочисленных людских народов, и один из самых чуждых внешне. Их отличает не только алая кожа, но и редкие чешуйки, в основном растущие на плечах. Лицом схожи с симмерийскими соседями, а волосы у них преимущественно темных тонов.\n\nИх женщины ничуть не слабее мужчин, а самих валлатрийцев также отличает впечатляющая подвижность и скорость, пусть и в ущерб долгосрочной выносливости. Как и симмерийцы, они практически невосприимчивы к большинству болезней.\n\nНазывают себя в честь своего живого божества — [[Валатреллен]] Красной — предположительно, последнего из живых древних драконов.\n\nВо внешнем мире появляются весьма редко: в основном как рабы, наёмники или проходя священное путешествие.", "category": "Расы", "createdAt": 1793632093893, "order": 1, "summary": "Самая многочисленная и самая молодая раса континента и её народы.", "title": "Люди", "updatedAt": 1793641859264, "updatedBy": null}, "kaed-fell": {"aliases": ["Земли Теней", "Туман Смерти", "Расколотая Гора", "Этередайн"], "body": "*\"...Уже на второй день нас... **заметили**. Десятки, может сотни голодных мертвяков - откуда они только встали — охотились за нами день и ночь, сожрали троих. Они тоже восстали, всего за пару мгновений... А потом погас этот епифанов светильник. Туман... кажется, за час в нем я постарел лет на десять, и не знаю, каким чудом вообще выбрался. Я не видел, что Туман сделал с остальными, но... видит Творец, надеюсь, я никогда больше их не увижу.\"*\n\n— Отчет о второй экспедиции Серебряной Мастерской, 257 год Второй Эры, княжество [[Эмден]]. Выдержка из книги \"Страна Мертвых\" Айдена из Эмденбурга.\n\nРасположившись практически в самом центре Мерклейда, Земли Теней остаются шрамом Первой Эры, причины которому известны лишь в старых легендах Блуждающего Народа. Немногих волнуют эти легенды, но всех без исключения волнует регион с крупное королевство, покрытый Туманом Смерти.
