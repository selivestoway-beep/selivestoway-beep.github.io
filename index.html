<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta property="og:type" content="website"><meta property="og:site_name" content="Кодекс Термины"><meta property="og:title" content="Кодекс Термины"><meta property="og:description" content="Закрытая вики мира Mudila Quest: земли, народы, магия, герои и чудовища Второй Эры."><meta property="og:image" content="https://selivestoway-beep.github.io/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:url" content="https://selivestoway-beep.github.io/"><meta name="twitter:card" content="summary_large_image"><meta name="description" content="Закрытая вики мира Mudila Quest."><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Кодекс Термины</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23172030%27/%3E%3Cg fill=%27none%27 stroke=%27%23D0AF68%27 stroke-width=%271.6%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2710%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274.5%27/%3E%3C/g%3E%3Ccircle cx=%2722.5%27 cy=%279.5%27 r=%272.3%27 fill=%27%23E2665A%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#14181B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ночное небо с двумя лунами открывает кодекс; ниже спокойные «листы» на туманном фоне, колонка статьи ~68 знаков и карточка сведений справа */
:root{
  --bg:#14181B; --surface:#1B2125; --ink:#DCE1DD; --muted:#919C99; --line:#2C3539;
  --accent:#8DBBC7; --accent-soft:#21303A; --gold:#D0AF68; --ember:#E08573;
  --night:#172030; --night-2:#0E1420; --night-ink:#E6EBEE; --night-muted:#A9B4BE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-blue:#7FA8EC; --c-gold:#DDB65C; --c-red:#E2665A;
  --c-hero:#5FCB9C; --c-worm:#AEC456; --c-great:#B592E6; --c-myst:#D0628A; --c-outer:#B9CCDA;
  --f-display:"Forum","Cormorant Garamond",Georgia,serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:36px;--s7:56px;--s8:88px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
/* Светлая тема: тёплый пергамент, цвета знамён и фракций притушены, чтобы держать контраст */
:root[data-theme="light"]{
  --bg:#EDE7DA; --surface:#F7F2E7; --ink:#2A251E; --muted:#6C6354; --line:#D9CEBA;
  --accent:#2C5C70; --accent-soft:#E4DECF; --gold:#8A6720; --ember:#A13C2E;
  --night:#1B2433; --night-2:#111722;
  --shadow:0 1px 2px rgba(70,55,30,.08),0 8px 24px rgba(70,55,30,.10);
  --c-blue:#2F5FA6; --c-gold:#946F1C; --c-red:#A9372C;
  --c-hero:#22795A; --c-worm:#66761C; --c-great:#6B47A0; --c-myst:#93304F; --c-outer:#4C6476;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.65;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1200px;margin:0 auto}

/* Шапка */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:var(--s4);padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px;color:var(--gold);flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative;font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:8px 9px;border-radius:6px;white-space:nowrap}
.tabs a:hover{color:var(--ink);background:var(--accent-soft)}
.tabs a.cur{color:var(--ink)}
.tabs a.cur::after{content:"";position:absolute;left:9px;right:9px;bottom:2px;height:2px;border-radius:2px;background:var(--gold);animation:grow .35s var(--ease)}
@keyframes grow{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.search{flex:1 1 200px;position:relative;min-width:0;max-width:360px;margin-left:auto}
.search input[type=text]{width:100%;font:inherit;font-size:14.5px;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:11;animation:drop .18s var(--ease)}
@keyframes drop{from{opacity:.3;transform:translateY(-4px)}to{opacity:1;transform:none}}
.results a{display:block;padding:10px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.results a:last-child{border-bottom:0}
.results a:hover,.results a.sel{background:var(--accent-soft)}
.r-cat{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-right:6px}
.r-sum{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.btn{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.03em;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s,transform .15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--ember);border-color:var(--ember)}
.btn.rnd{display:inline-flex;align-items:center;gap:6px}.btn.rnd svg{width:15px;height:15px}
@media (max-width:1360px){.btn.rnd span{display:none}.btn.rnd{padding:8px 10px}}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.banner{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:14px}
.banner .inner{padding-block:8px}

/* Звёздное небо */
.sky{position:relative;background:linear-gradient(180deg,var(--night-2),var(--night));color:var(--night-ink);overflow:hidden;isolation:isolate}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.sky .inner{padding-block:var(--s8) var(--s7)}
.sky .eyebrow{color:var(--gold)}
.sky h1{color:var(--night-ink)}
.sky p{color:var(--night-muted)}
.sky .lede{color:#C9D2D8;font-style:normal}
.sky .lede em{color:var(--night-ink)}
.sky.small .inner{padding-block:var(--s6) var(--s5)}

/* Общие тексты */
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,5.2vw,58px);line-height:1.04;margin:var(--s2) 0 var(--s4);text-wrap:balance;letter-spacing:.005em}
.lede{font-size:18.5px;color:var(--muted);margin:0 0 var(--s5);max-width:62ch;font-style:italic}
h2.sec{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:0 0 var(--s4);display:flex;align-items:baseline;gap:var(--s3)}
h2.sec small{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
section.block{padding-block:var(--s7) 0}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Анимация смены вида */
.view{animation:rise .45s var(--ease)}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}

/* Путь чтения */
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s4);counter-reset:step}
.step{position:relative;display:block;padding:var(--s4) var(--s4) var(--s4) 56px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}
.step::before{counter-increment:step;content:counter(step);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font-family:var(--f-display);font-size:17px;display:grid;place-items:center}
.step b{display:block;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15}
.step span{font-size:14px;color:var(--muted);line-height:1.45;display:block;margin-top:4px}
.step:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}

/* Карточки разделов и статей */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s4)}
.card{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card .sig{flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.card .sig img{width:100%;height:100%;object-fit:cover}
.card .sig svg{width:40px;height:40px}
.card b{display:block;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15}
.card small{display:block;color:var(--muted);font-size:14px;line-height:1.45;margin-top:3px}
.card .meta{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
.chip:hover{color:var(--ink);border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tag{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.filters{margin:var(--s5) 0}

/* Персонажи */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--s4)}
.person{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.person:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.portrait{aspect-ratio:4/5;max-width:100%;background:var(--night);color:var(--night-ink);position:relative;overflow:hidden;display:grid;place-items:center}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 22%;transition:transform .5s var(--ease)}
.person:hover .portrait img,.person:hover .portrait svg{transform:scale(1.04)}
.portrait svg{width:100%;height:100%;transition:transform .5s var(--ease)}
.person .txt{padding:var(--s3) var(--s4) var(--s4)}
.person b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1}
.person small{display:block;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:4px}
.pill{display:inline-block;margin-top:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.dead{border-color:var(--ember);color:var(--ember)}
.pill.live{border-color:var(--accent);color:var(--accent)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,190px);gap:var(--s4);overflow-x:auto;padding-bottom:var(--s3);scroll-snap-type:x mandatory}
.strip .person{scroll-snap-align:start}

/* Статья */
.hero-art{position:relative;height:clamp(150px,22vw,230px);background:var(--night);color:var(--night-ink);overflow:hidden}
.hero-art img{width:100%;height:100%;object-fit:cover;opacity:.92;animation:fadein .8s var(--ease)}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.hero-art .mark{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);opacity:.6}
.hero-art .mark svg{position:static;width:min(220px,50%);height:auto;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,color-mix(in srgb,var(--bg) 85%,transparent))}
@keyframes fadein{from{opacity:.3}to{opacity:.92}}
.page{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:var(--s7);align-items:start;padding-block:0 var(--s8)}
.page-head{margin-top:calc(-1 * var(--s6));position:relative;z-index:1}
article{min-width:0;max-width:68ch}
.epigraph{margin:0 0 var(--s5);padding:var(--s3) 0 var(--s3) var(--s5);border-left:2px solid var(--gold);font-style:italic;font-size:18px;color:var(--ink)}
.epigraph cite{display:block;margin-top:6px;font-style:normal;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.prose h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15;margin:var(--s6) 0 var(--s3);text-wrap:balance}
.prose h2::after{content:"";display:block;width:44px;height:2px;margin-top:8px;background:var(--gold);border-radius:2px}
.prose h3{font-size:18px;margin:var(--s5) 0 var(--s2)}
.prose p{margin:0 0 var(--s4)}
.prose>p:first-of-type::first-letter{font-family:var(--f-display);float:left;font-size:3.4em;line-height:.82;padding:6px 8px 0 0;color:var(--gold)}
.prose ul{margin:0 0 var(--s4);padding-left:22px}
.prose li{margin-bottom:7px}
.prose li::marker{color:var(--gold)}
.prose blockquote{margin:0 0 var(--s4);padding:var(--s2) var(--s4);border-left:2px solid var(--gold);color:var(--muted);font-style:italic}
a.wl{color:var(--accent);text-decoration-style:solid}
a.wl.missing{color:var(--ember);text-decoration-style:dotted}
.actions{display:flex;gap:var(--s2);flex-wrap:wrap;margin:0 0 var(--s5)}
.readtime{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:var(--s4)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s7);padding-top:var(--s5);border-top:1px solid var(--line)}
.pager a{display:block;text-decoration:none;color:var(--ink);padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .2s,transform .2s var(--ease)}
.pager a:hover{border-color:var(--accent);transform:translateY(-2px)}
.pager span{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pager b{font-family:var(--f-display);font-weight:400;font-size:20px}
.pager .next{text-align:right;grid-column:2}
aside.info{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14.5px;box-shadow:var(--shadow);margin-top:var(--s5)}
aside.info .portrait{aspect-ratio:4/5}
aside.info .body{padding:var(--s4)}
aside.info h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 var(--s3);line-height:1.15}
aside.info dl{margin:0;display:grid;gap:var(--s3)}
aside.info dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
aside.info dd{margin:2px 0 0}
aside.info .tags{display:flex;flex-wrap:wrap;gap:5px}
.backlinks a{display:block;line-height:1.55}
.caption{font-size:13px;color:var(--muted);font-style:italic;padding:8px var(--s4) 0}

/* Хроника */
.timeline{position:relative;max-width:760px;margin:0 auto;padding:var(--s6) 0 var(--s8)}
.timeline::before{content:"";position:absolute;left:19px;top:var(--s6);bottom:var(--s8);width:2px;background:linear-gradient(var(--gold),var(--line))}
.era{position:relative;padding-left:56px;margin-bottom:var(--s6)}
.era::before{content:"";position:absolute;left:10px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);box-shadow:0 0 0 5px var(--bg)}
.era h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 var(--s3);line-height:1.1}
.era p{margin:0 0 var(--s3)}
.era ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2)}
.era li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:var(--s3) var(--s4);transition:border-color .2s,transform .2s var(--ease)}
.era li:hover{border-color:var(--accent);transform:translateX(3px)}
.era li strong{font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--gold);letter-spacing:.04em;margin-right:6px}

/* Последние правки */
.recent ol{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.recent li{display:flex;gap:var(--s3);align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.recent time{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:100px}

/* Редактор */
.editor{max-width:920px;padding-block:var(--s6) var(--s8)}
.form{display:grid;gap:var(--s4)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
label{display:grid;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text],select,textarea{font:inherit;font-family:var(--f-body);font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{font-family:var(--f-mono);font-size:14px;line-height:1.6;min-height:420px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{font-family:var(--f-mono);font-size:12px;border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.imgfield{display:flex;gap:var(--s4);align-items:center;flex-wrap:wrap;padding:var(--s3);border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.imgfield .thumb{width:96px;height:96px;border-radius:8px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:none}
.imgfield .thumb img{width:100%;height:100%;object-fit:cover}
.imgfield .thumb svg{width:70px;height:70px}
.hint{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:var(--s3);line-height:1.75;text-transform:none;letter-spacing:0}
.hint code{background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.wtabs{display:flex;gap:4px}
.wtabs button{font-family:var(--f-mono);font-size:12px;padding:6px 12px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px 8px 0 0;cursor:pointer}
.wtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);border-bottom-color:var(--surface)}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:var(--s5);min-height:420px}
.notice{padding:var(--s3) var(--s4);border-radius:8px;border:1px solid var(--gold);background:var(--accent-soft);font-size:14.5px}
.notice.err{border-color:var(--ember)}
.confirm{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;font-size:14px}
.empty{max-width:62ch;padding-block:var(--s8)}
footer{border-top:1px solid var(--line);padding-block:var(--s5);font-size:13px;color:var(--muted)}
footer .inner{display:flex;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
footer a{color:var(--muted)}
.gm{max-width:640px;padding-block:var(--s6) var(--s8)}
.gm ol{padding-left:22px;line-height:1.7}
.gm code{font-family:var(--f-mono);font-size:13px;background:var(--accent-soft);padding:1px 6px;border-radius:4px}
.gm-min{padding-block:var(--s8);max-width:420px}
.gm-min input{width:100%;font:inherit;font-family:var(--f-mono);font-size:16px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.gm-min input::placeholder{color:var(--muted);opacity:.7}
.gmbar{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-top:var(--s4)}
.heroes .people{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

/* Фракции: --fc основной цвет, --fg заливка рамок (у Альянса перелив трёх знамён) */
.fx{--fc:var(--gold);--fg:linear-gradient(var(--fc),var(--fc))}
.f-hero{--fc:var(--c-hero)}
.f-worm{--fc:var(--c-worm)}
.f-great{--fc:var(--c-great)}
.f-myst{--fc:var(--c-myst)}
.f-outer{--fc:var(--c-outer)}
.f-ally{--fc:var(--c-gold);--fg:linear-gradient(125deg,var(--c-blue) 5%,var(--c-gold) 50%,var(--c-red) 95%)}
.f-blue{--fc:var(--c-blue);--fg:linear-gradient(var(--c-blue),var(--c-blue))}
.f-gold{--fc:var(--c-gold);--fg:linear-gradient(var(--c-gold),var(--c-gold))}
.f-red{--fc:var(--c-red);--fg:linear-gradient(var(--c-red),var(--c-red))}

/* Единая рамка портретов: тонкая линия внутри и уголки, в цвет фракции */
.portrait::before,.portrait::after{content:"";position:absolute;pointer-events:none;z-index:2;background:var(--fg,linear-gradient(var(--gold),var(--gold)))}
.portrait::before{inset:7px;padding:1px;opacity:.75;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.portrait::after{inset:3px;-webkit-mask:
  linear-gradient(#000 0 0) top left/18px 2px no-repeat,linear-gradient(#000 0 0) top left/2px 18px no-repeat,
  linear-gradient(#000 0 0) top right/18px 2px no-repeat,linear-gradient(#000 0 0) top right/2px 18px no-repeat,
  linear-gradient(#000 0 0) bottom left/18px 2px no-repeat,linear-gradient(#000 0 0) bottom left/2px 18px no-repeat,
  linear-gradient(#000 0 0) bottom right/18px 2px no-repeat,linear-gradient(#000 0 0) bottom right/2px 18px no-repeat;
  mask:
  linear-gradient(#000 0 0) top left/18px 2px no-repeat,linear-gradient(#000 0 0) top left/2px 18px no-repeat,
  linear-gradient(#000 0 0) top right/18px 2px no-repeat,linear-gradient(#000 0 0) top right/2px 18px no-repeat,
  linear-gradient(#000 0 0) bottom left/18px 2px no-repeat,linear-gradient(#000 0 0) bottom left/2px 18px no-repeat,
  linear-gradient(#000 0 0) bottom right/18px 2px no-repeat,linear-gradient(#000 0 0) bottom right/2px 18px no-repeat}
.portrait img.bg{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(18px) brightness(.7) saturate(1.15);display:none}
.portrait.wide img.bg{display:block}
.portrait.wide img.fg{position:relative;z-index:1;object-fit:contain;object-position:center}
.portrait img.fg{position:relative}

/* Карточки персонажей в цвете фракции */
.person.fx{border-color:color-mix(in srgb,var(--fc) 28%,var(--line))}
.person.fx:hover{border-color:var(--fc);box-shadow:0 10px 30px color-mix(in srgb,var(--fc) 22%,transparent)}
.person.fx .txt{position:relative}
.person.fx .txt::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--fg)}
.fx .pill:not(.dead){border-color:var(--fc);color:var(--fc)}
h2.sec.fx{color:var(--ink)}
h2.sec.fx::before{content:"";width:10px;height:10px;border-radius:2px;transform:rotate(45deg);background:var(--fg);flex:none;align-self:center}

/* Шапка страницы персонажа: размытый портрет на всю ширину и крупный портрет поверх */
.chead{position:relative;overflow:hidden;background:var(--night-2);color:var(--night-ink);isolation:isolate}
.chead .blur{position:absolute;inset:-40px;background-size:cover;background-position:center 25%;filter:blur(36px) brightness(.45) saturate(1.2);z-index:-2;transform:scale(1.1)}
.chead{--c-blue:#7FA8EC;--c-gold:#DDB65C;--c-red:#E2665A;--c-hero:#5FCB9C;--c-worm:#AEC456;--c-great:#B592E6;--c-myst:#D0628A;--c-outer:#B9CCDA}
.chead::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 35%,color-mix(in srgb,var(--night-2) 80%,transparent) 100%),radial-gradient(80% 120% at 20% 40%,color-mix(in srgb,var(--fc) 30%,transparent),transparent 70%)}
.chead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--fg)}
.chead .inner{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:var(--s7);align-items:end;padding-block:var(--s7) var(--s6)}
.chead .portrait{border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.45);cursor:zoom-in}
.chead .portrait.noimg{cursor:default}
.chead .inner:has(.portrait.wide){grid-template-columns:minmax(300px,520px) minmax(0,1fr)}
.chead .portrait.wide{aspect-ratio:16/10}
.chead .eyebrow{color:var(--fc)}
.chead h1{color:var(--night-ink);margin-bottom:var(--s3)}
.chead .role{font-size:19px;color:#D3DADF;font-style:italic;margin:0 0 var(--s4)}
.chead .pill{font-size:11.5px;padding:4px 12px;background:color-mix(in srgb,var(--fc) 14%,transparent)}
.chead .lede{color:#C2CBD1;margin-top:var(--s4)}
.zoomhint{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--night-muted);margin-top:8px;text-transform:uppercase}

/* Полноэкранный просмотр арта */
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(6,8,12,.92);display:grid;place-items:center;padding:24px;cursor:zoom-out;animation:fadeinbox .2s var(--ease)}
.lightbox img{max-width:min(100%,1400px);max-height:calc(100vh - 48px);object-fit:contain;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lightbox button{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer}
@keyframes fadeinbox{from{opacity:0}to{opacity:1}}

/* Герои Багерта: свой изумрудный стиль, геральдический щит вместо портрета, крупные карточки */
.heroes .people{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.person.f-hero{background:linear-gradient(180deg,color-mix(in srgb,var(--c-hero) 9%,var(--surface)),var(--surface));border-radius:18px}
.person.f-hero b{font-size:25px}
.sky.bagert{background:radial-gradient(70% 90% at 50% 0%,color-mix(in srgb,var(--c-hero) 22%,transparent),transparent 70%),linear-gradient(180deg,var(--night-2),var(--night))}
.sky.bagert .eyebrow{color:var(--c-hero)}
.chead.f-hero{background:radial-gradient(90% 120% at 15% 30%,color-mix(in srgb,var(--c-hero) 28%,var(--night-2)),var(--night-2))}
.chead.f-hero .inner{grid-template-columns:minmax(200px,280px) minmax(0,1fr)}
.crest{width:100%;height:100%}

/* Переключатель темы */
.btn.theme{padding:8px 10px;display:inline-flex;align-items:center}
.btn.theme svg{width:15px;height:15px}

@media (max-width:1000px){
  .chead .inner,.chead.f-hero .inner{grid-template-columns:minmax(0,1fr);gap:var(--s5)}
  .chead .portrait{max-width:300px}
}

/* Эрих Аскариос: латунь его лат, винный плащ, синие глаза и грозы, трещина Нихилоса */
.s-erih-askarios{--fc:#D2A55A;--fg:linear-gradient(125deg,#E3BE72 0%,#B8862F 35%,#7A2236 68%,#6E9FD6 100%)}
:root[data-theme="light"] .page.s-erih-askarios,:root[data-theme="light"] aside.s-erih-askarios,:root[data-theme="light"] .person.s-erih-askarios{--fc:#8E6420}
.chead.s-erih-askarios{background:radial-gradient(60% 110% at 16% 40%,rgba(210,165,90,.30),transparent 62%),radial-gradient(50% 90% at 88% 15%,rgba(110,159,214,.24),transparent 65%),radial-gradient(40% 60% at 55% 105%,rgba(122,34,54,.45),transparent 70%),linear-gradient(180deg,#1B1114,#110B0E)}
.chead.s-erih-askarios .blur{opacity:.35}
.chead .deco{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.chead.s-erih-askarios h1{background:linear-gradient(95deg,#F6E7C8 0%,#E3BE72 45%,#C98A5A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.chead.s-erih-askarios .eyebrow{color:#E3BE72}
.chead.s-erih-askarios .role{color:#E7D7C3}
.chead.s-erih-askarios .portrait{box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 1px rgba(227,190,114,.25),0 0 60px rgba(122,34,54,.35)}
.page.s-erih-askarios .prose h2::after{width:64px;background:linear-gradient(90deg,#D2A55A,#7A2236 70%,#6E9FD6)}
.page.s-erih-askarios .prose>p:first-of-type::first-letter{color:var(--fc)}
.page.s-erih-askarios .prose li::marker{color:#9E3B4E}
.artimg{background:radial-gradient(circle at 50% 45%,#2A2F36,#0E1216);padding:var(--s4);cursor:zoom-in;border-bottom:1px solid var(--line)}
.artimg img{width:100%;height:auto;display:block;border-radius:6px}
aside.info.s-erih-askarios::before{content:"";display:block;height:3px;background:var(--fg)}
.person.s-erih-askarios{background:linear-gradient(180deg,rgba(122,34,54,.16),var(--surface) 60%)}
.tag s,dd s{opacity:.7}

/* Календарь */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:var(--s5);box-shadow:var(--shadow);--re:#2CAF88;--ki:#CECB73;--fa:#95C0D5}
:root[data-theme="light"] .cal{--re:#1E8366;--ki:#8C8420;--fa:#3E7590}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s4)}
.cal-year{display:flex;align-items:center;gap:var(--s2)}
.cal-year label{display:flex;align-items:baseline;gap:8px;text-transform:none;letter-spacing:0;font-size:13px}
.cal-year input{width:96px;font-family:var(--f-display);font-size:30px;line-height:1;text-align:center;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:2px 0;-moz-appearance:textfield}
.cal-year input::-webkit-inner-spin-button{display:none}
.cal-seasons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.cal-season{--c:var(--re);border-top:2px solid var(--c);padding-top:8px}
.cs-ki{--c:var(--ki)}.cs-fa{--c:var(--fa)}
.cal-sn{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin-bottom:6px}
.cal-ms{display:grid;gap:4px}
.cal-m{display:flex;justify-content:space-between;align-items:center;font:inherit;font-size:14.5px;text-align:left;padding:6px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer}
.cal-m:hover{background:var(--accent-soft)}
.cal-m[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.cal-m i{font-style:normal;font-family:var(--f-mono);font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:var(--bg)}
.cal-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--s6);margin-top:var(--s5)}
.cal-mt{font-family:var(--f-display);font-size:24px;margin-bottom:var(--s3)}
.cal-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.cal-wd{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px;overflow:hidden;text-overflow:ellipsis}
.cal-wd.holy{color:var(--gold)}
.cal-d{aspect-ratio:1;font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;position:relative;transition:transform .15s,border-color .15s}
.cal-d:hover{transform:translateY(-2px);border-color:var(--accent)}
.cal-d.holy{background:color-mix(in srgb,var(--gold) 10%,var(--bg))}
.cal-d.ev::after{content:"";position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ember)}
.cal-d[aria-pressed="true"],.cal-moon[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.cal-moon{grid-column:1/-1;display:flex;align-items:center;gap:10px;justify-content:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(90deg,transparent,color-mix(in srgb,#9FC4D4 16%,transparent),transparent);color:var(--ink);font-family:var(--f-mono);font-size:12px;cursor:pointer}
.cal-moon svg{width:18px;height:18px;fill:#DDEBF2;filter:drop-shadow(0 0 6px #9FC4D4)}
.cal-moon.ev span::after{content:" •";color:var(--ember)}
.cal-day{margin-top:var(--s3);padding:var(--s3) var(--s4);border-left:2px solid var(--gold);background:var(--bg);border-radius:0 8px 8px 0;font-size:15px}
.cal-day p{margin:4px 0 0}.cal-day ul{margin:6px 0 0;padding-left:18px}
.cal-yearbox h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 var(--s3)}
.cal-yearbox ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cal-yearbox li{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px;line-height:1.5}
.cal-yearbox li strong{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--gold);margin-right:4px}
.cal-jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s4)}
@media (max-width:800px){.cal-body{grid-template-columns:minmax(0,1fr)}.cal-seasons{grid-template-columns:minmax(0,1fr)}}

/* Оглавление */
.toc{margin:0 0 var(--s5);border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:46ch}
.toc summary{cursor:pointer;padding:10px 16px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
.toc summary::-webkit-details-marker{display:none}
.toc summary span{color:var(--gold)}
.toc ol{margin:0;padding:0 16px 12px 36px;counter-reset:t}
.toc li{margin:2px 0;color:var(--muted)}
.toc li::marker{color:var(--gold);font-family:var(--f-mono);font-size:12px}
.toc button{font:inherit;font-size:15px;background:none;border:0;padding:3px 0;color:var(--ink);cursor:pointer;text-align:left}
.toc button:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.prose h2{scroll-margin-top:88px}

/* Спойлеры и секреты ГМа */
.sp{background:var(--ink);color:transparent;border-radius:4px;padding:0 3px;cursor:pointer;transition:color .2s,background .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sp a{color:transparent;text-decoration:none;pointer-events:none}
.sp.open{background:color-mix(in srgb,var(--gold) 16%,transparent);color:inherit}
.sp.open a{color:var(--accent);pointer-events:auto;text-decoration:underline}
.spoiler-b{margin:0 0 var(--s4);border:1px dashed color-mix(in srgb,var(--gold) 55%,var(--line));border-radius:10px;background:color-mix(in srgb,var(--gold) 5%,var(--surface))}
.spoiler-b summary{cursor:pointer;padding:10px 14px;font-size:15px;color:var(--muted)}
.spoiler-b summary span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.spoiler-b[open] summary{border-bottom:1px dashed var(--line)}
.sp-in{padding:var(--s3) var(--s4) 2px}
.gm-secret{margin:0 0 var(--s4);padding:var(--s3) var(--s4) 2px;border-left:3px solid var(--ember);background:color-mix(in srgb,var(--ember) 8%,var(--surface));border-radius:0 10px 10px 0}
.gm-tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ember);margin-bottom:6px}

/* Нужные статьи */
.wl-list{margin:0;padding:0 0 0 24px;display:grid;gap:8px}
.wl-list li{line-height:1.55}
.wl-list li::marker{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.wantbtn{display:inline-block;text-decoration:none;margin-top:4px}
.lock-row{display:flex;gap:var(--s2);max-width:440px;margin-top:var(--s4)}
.lock-row input{flex:1;min-width:0;font:inherit;font-family:var(--f-mono);font-size:15px;padding:10px 14px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(0,0,0,.25);color:var(--night-ink)}
.lock-err{color:#F0A090;margin-top:var(--s3);font-family:var(--f-mono);font-size:13px}
.foot-links{display:flex;gap:18px;align-items:baseline}

/* Поиск по тексту */
.results mark{background:color-mix(in srgb,var(--gold) 30%,transparent);color:inherit;border-radius:2px;padding:0 1px}
/* Подсказка при наведении */
.pv{position:fixed;z-index:40;width:340px;max-width:calc(100vw - 16px);display:flex;gap:12px;padding:12px;background:var(--surface);border:1px solid color-mix(in srgb,var(--fc,var(--gold)) 40%,var(--line));border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);pointer-events:none;animation:drop .16s var(--ease)}
.pv-fig{flex:none;width:72px;height:72px;border-radius:8px;overflow:hidden;background:var(--night);color:var(--gold);display:grid;place-items:center}
.pv-fig.tall{height:90px}
.pv-fig img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.pv-fig svg{width:100%;height:100%}
.pv-txt{min-width:0;font-size:13.5px;line-height:1.45}
.pv-txt .eyebrow{font-size:10px;color:var(--fc,var(--gold))}
.pv-txt b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.15;margin:2px 0}
.pv-txt i{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.pv-txt p{margin:0;color:var(--ink);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
/* Шаблон карточки */
.facts-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:-8px}
.facts-head .btn{text-transform:none;letter-spacing:.03em}
.sr-only>textarea{margin-top:0}
.sr-only{font-size:0;gap:0}
/* Связи */
.rels{margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--line)}
.rels h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 var(--s4)}
.rel-g{margin-bottom:var(--s3);display:grid;grid-template-columns:150px minmax(0,1fr);gap:var(--s3);align-items:center}
@media (max-width:640px){.rel-g{grid-template-columns:minmax(0,1fr);gap:6px}}
.rel-l{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rel-row{display:flex;flex-wrap:wrap;gap:8px}
.rel-chip{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border:1px solid color-mix(in srgb,var(--fc,var(--gold)) 30%,var(--line));border-radius:999px;background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .2s,transform .2s var(--ease)}
.rel-chip:hover{border-color:var(--fc,var(--accent));transform:translateY(-2px)}
.rel-av{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;background:var(--night);color:var(--gold);display:grid;place-items:center}
.rel-av img,.rel-av svg{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.rel-t b{display:block;font-weight:400;font-size:15px;line-height:1.2}
.rel-t small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.rel-chip.missing{border-style:dashed;color:var(--ember)}
/* Статья дня и факты */
.today{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--s4)}
.aotd{display:flex;gap:var(--s4);padding:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s}
.aotd:hover{transform:translateY(-3px);border-color:var(--gold)}
.aotd-fig{flex:none;width:150px;border-radius:10px;overflow:hidden;background:var(--night);color:var(--gold);display:grid;place-items:center;aspect-ratio:4/5}
.aotd-fig img{width:100%;height:100%;object-fit:cover}
.aotd-fig.sig svg{width:80%;height:auto}
.aotd-txt b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:6px 0 8px}
.aotd-txt p{margin:0 0 var(--s3);color:var(--muted);font-size:15.5px}
.aotd .more{font-family:var(--f-mono);font-size:12px;color:var(--gold)}
.dyk{padding:var(--s4) var(--s5);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.dyk ul{margin:var(--s3) 0;padding-left:18px;display:grid;gap:10px}
.dyk li{font-size:15.5px;line-height:1.5}
.dyk li::marker{color:var(--gold)}
.dyk-bar{display:flex;align-items:center;gap:var(--s3)}
@media (max-width:860px){.today{grid-template-columns:minmax(0,1fr)}.aotd-fig{width:110px}}

/* Таблицы */
.tbl{overflow-x:auto;margin:0 0 var(--s4);border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface) 55%,transparent)}
article:has(.tbl){max-width:none}
.page:has(.tbl) article .prose>p,.page:has(.tbl) article .prose>ul{max-width:68ch}
/* Учебный стол */
.rt{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.rt-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:6px 6px 0;overflow-x:auto}
.rt-tabs button{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;padding:10px 16px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
.rt-tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold)}
#rt-body{padding:var(--s5)}
.rt-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:var(--s6)}
.rt-form{display:grid;gap:var(--s3);align-content:start}
.rt-form.wide{max-width:none}
.rt-form input[type=number],.rt-form select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.rt-l{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rt-out{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:var(--s4)}
.dice{display:flex;gap:12px;margin-bottom:var(--s3)}
.die{width:74px;height:74px;display:grid;place-items:center;font-family:var(--f-display);font-size:38px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--muted);transform:rotate(-4deg)}
.die.pick{color:var(--ink);border-color:var(--gold);transform:none;animation:dieIn .45s var(--ease)}
.die.crit{color:#1B2125;background:var(--gold);border-color:var(--gold)}
.die.fumble{color:#fff;background:var(--ember);border-color:var(--ember)}
.die.idle{font-family:var(--f-mono);font-size:16px}
@keyframes dieIn{from{transform:rotate(-40deg) scale(.6);opacity:.3}to{transform:none;opacity:1}}
.total{font-family:var(--f-mono);font-size:15px;color:var(--muted);margin-bottom:6px}
.total b{color:var(--ink);font-size:20px}
.v{margin:6px 0;font-size:15.5px}.v.ok b{color:var(--c-hero)}.v.bad b,.v.bad{color:var(--ember)}
.rt-log{display:flex;gap:6px;flex-wrap:wrap;margin:var(--s3) 0}
.rt-log span{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.rt-log .ok{border-color:var(--c-hero);color:var(--c-hero)}.rt-log .bad{border-color:var(--ember);color:var(--ember)}
.hint-s{font-size:13.5px;color:var(--muted);margin:var(--s3) 0 0;line-height:1.5}
.st-box{display:grid;gap:6px;margin-top:4px}
.st-row{display:grid;grid-template-columns:1fr auto 40px auto auto;align-items:center;gap:8px}
.st-row .btn{padding:4px 12px;font-size:16px}
.st-row b{text-align:center;font-family:var(--f-display);font-size:24px}
.st-n small{font-family:var(--f-mono);font-size:10.5px;color:var(--gold)}
.st-def{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:76px;text-align:right}
.sh-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:var(--s4)}
.sh-grid>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.sh-grid span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sh-grid b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1}
.sh-grid small{display:block;font-size:11.5px;color:var(--muted)}
.feat{margin:6px 0 0;padding-left:18px;font-size:14.5px;display:grid;gap:4px}
.rd-top{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.rd-od{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px}
.rd-od input{width:64px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.rd-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin:var(--s4) 0}
.rd-col{min-height:120px;border:1px dashed var(--line);border-radius:12px;padding:var(--s3);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start;transition:border-color .15s,background .15s}
.rd-col.on{border-style:solid;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,transparent)}
.rd-h{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rd-col.on .rd-h{color:var(--gold)}
.rd-act{font:inherit;font-size:14px;padding:5px 12px;border-radius:999px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);cursor:pointer}
.rd-act small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rd-pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.path-t{display:grid;gap:8px}
.path-r{display:grid;grid-template-columns:110px minmax(0,1fr);gap:var(--s3);align-items:start}
.path-n b{display:block;font-family:var(--f-display);font-size:26px;line-height:1;color:var(--gold)}
.path-n small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.path-r textarea{min-height:56px;font-family:var(--f-body);font-size:15px}
.rule-card .sig{background:var(--night);color:var(--gold)}
.rnum{font-family:var(--f-display);font-size:26px}
@media (max-width:860px){.rt-grid{grid-template-columns:minmax(0,1fr)}.sh-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rd-cols{grid-template-columns:minmax(0,1fr)}.path-r{grid-template-columns:minmax(0,1fr)}}

/* Стойка */
.rack .rack-card{position:relative;align-items:center}
.rack-card .cover{position:absolute;inset:0;border-radius:12px;z-index:1}
.rack-card .btn{position:relative;z-index:2;margin-top:8px}
.rack-card.empty{border-style:dashed;opacity:.85}
.rk-por{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:var(--accent-soft);display:grid;place-items:center}
.rk-por img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.rk-por svg{width:56px;height:56px}
.tally{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tally .t{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tally .t.err{border-color:var(--ember);color:var(--ember)}
.tally .t.warn{border-color:var(--gold);color:var(--gold)}
.tally .t.ok{border-color:color-mix(in srgb,var(--c-hero) 60%,var(--line));color:var(--c-hero)}
.howto{margin:0;padding-left:22px;display:grid;gap:8px;max-width:72ch;line-height:1.6}
.howto li::marker{color:var(--gold);font-family:var(--f-mono)}
.sh-head{display:flex;gap:var(--s5);align-items:center}
.sh-por{flex:none;width:120px;height:120px;border-radius:50%;overflow:hidden;border:2px solid color-mix(in srgb,var(--gold) 60%,transparent);display:grid;place-items:center;background:rgba(0,0,0,.2)}
.sh-por img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.sh-por svg{width:100px;height:100px}
.sh-head .eyebrow a{color:inherit}
.sheet-page{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:var(--s6);padding-top:var(--s6);padding-bottom:var(--s8);align-items:start}
.sh-side{position:sticky;top:80px;display:grid;gap:var(--s4);max-height:calc(100vh - 100px);overflow:auto;padding-right:2px}
.sh-box{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:var(--s3) var(--s4)}
.sh-box>.rt-l{margin-bottom:8px}
.sheet-prose table{font-size:14.5px}
.review .prose>p:first-of-type::first-letter,.sheet-prose>p:first-of-type::first-letter{float:none;font-size:inherit;padding:0;color:inherit;font-family:inherit;line-height:inherit}
.sheet-prose p{margin-bottom:.55em}
.sheet-prose h3{margin-top:1.4em}
.rack-card>div:last-child{flex:1}
.sh-head .tally{margin-bottom:var(--s3)}
.review{margin:0 0 var(--s5);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--accent) 6%,var(--surface));padding:0 var(--s4)}
.review summary{cursor:pointer;padding:12px 0;color:var(--muted);font-size:15px}
.review summary span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.review .prose{padding-bottom:var(--s2)}
.ck-sec{padding:6px 0 4px;border-top:1px solid var(--line)}
.ck-sec:first-child{border-top:0}
.ck-h{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0}
.ck{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:5px 0;font-size:14px;line-height:1.4}
.ck b{font-weight:600;font-size:14px}
.ck-i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px;border:1px solid currentColor}
.ck.ok .ck-i{color:var(--c-hero)}.ck.err .ck-i{color:var(--ember)}.ck.warn .ck-i{color:var(--gold)}.ck.na .ck-i{color:var(--muted)}
.ck.err b{color:var(--ember)}
.ck-v{display:block;color:var(--ink);font-size:13.5px}
.ck-v code{font-family:var(--f-mono);font-size:12.5px;background:var(--accent-soft);padding:0 5px;border-radius:4px}
.ck small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ck.ok small{display:none}
.pass{display:grid;gap:4px;font-size:14px}
.pass-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:3px 0}
.pass-row span{color:var(--muted)}
.pass-st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.pass-st>div{border:1px solid var(--line);border-radius:8px;padding:4px 6px;text-align:center}
.pass-st span{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pass-st b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1}
.pass-st small{display:block;font-size:11px;color:var(--muted)}
.pass-path{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;font-size:13.5px}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:9px;height:9px;border-radius:2px;border:1px solid var(--gold);transform:rotate(45deg)}
.pips i.on{background:var(--gold)}
.sbx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s5);padding-top:var(--s5)}
.sbx-in{display:grid;gap:var(--s3)}
.sbx-in label{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sbx textarea{display:block;margin-top:6px;box-sizing:border-box;height:auto;width:100%;min-height:340px;font-family:var(--f-mono);font-size:13px;line-height:1.5;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical;text-transform:none;letter-spacing:0}
.sbx-out{display:grid;gap:var(--s3);align-content:start}
@media (max-width:1000px){.sheet-page,.sbx{grid-template-columns:1fr}.sh-side{position:static;max-height:none}}
@media (max-width:640px){.sh-head{flex-direction:column;align-items:flex-start;gap:var(--s3)}.sh-por{width:88px;height:88px}}

/* Скрытая механика */
.btn.mechbtn{gap:6px;padding:8px 12px}
.mechbtn span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.mechbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.nomech #tabs a[data-r="pravila"],.nomech #tabs a[data-r="stoyka"]{display:none}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.mech-b{margin:0 0 var(--s4);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:10px;padding:var(--s3) var(--s4) 2px;background:color-mix(in srgb,var(--gold) 4%,var(--surface))}
.mech-tag,.mech-b summary span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.mech-tag{margin-bottom:6px}
details.mech-b{padding:0}
.mech-b summary{cursor:pointer;padding:10px 14px;color:var(--muted);font-size:15px}
.mech-b summary small{font-size:12.5px;opacity:.8}
details.mech-b[open] summary{border-bottom:1px solid var(--line)}

/* История, лента, предложения */
.art-actions{flex-wrap:wrap}
.hist{display:grid;grid-template-columns:300px minmax(0,1fr);gap:var(--s5);padding-top:var(--s5);align-items:start}
.hv-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.hv{display:grid;gap:2px;width:100%;text-align:left;font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);cursor:pointer}
.hv.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--surface))}
.hv time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.hv b{font-weight:600;font-size:14.5px}
.hv small{color:var(--muted);font-size:12.5px}
.hv-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.diff{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14.5px;line-height:1.55;background:var(--surface)}
.df{padding:4px 12px;white-space:pre-wrap;word-break:break-word;border-left:3px solid transparent}
.df.del{background:color-mix(in srgb,var(--ember) 13%,transparent);border-left-color:var(--ember);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ember) 60%,transparent)}
.df.ins{background:color-mix(in srgb,var(--c-hero) 13%,transparent);border-left-color:var(--c-hero)}
.df.mod{border-left-color:var(--gold)}
.df del{background:color-mix(in srgb,var(--ember) 22%,transparent);text-decoration:line-through}
.df ins{background:color-mix(in srgb,var(--c-hero) 24%,transparent);text-decoration:none}
.df.gap{color:var(--muted);font-family:var(--f-mono);font-size:11.5px;background:var(--bg);text-align:center}
.df.eq{color:var(--muted)}
.fds{display:grid;gap:8px;margin-bottom:var(--s3)}
.fd{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;font-size:14.5px}
.fd>span{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.fd del{background:color-mix(in srgb,var(--ember) 22%,transparent)}.fd ins{background:color-mix(in srgb,var(--c-hero) 24%,transparent);text-decoration:none}
.news-l{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.news-l li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;border-bottom:1px dotted var(--line);padding-bottom:8px}
.news-l time{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:44px}
.na{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.na.create{color:var(--c-hero);border-color:var(--c-hero)}.na.delete{color:var(--ember);border-color:var(--ember)}.na.revert,.na.accept{color:var(--gold);border-color:var(--gold)}
.sec .more{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-left:10px;color:var(--accent)}
.pe-out{border:1px solid var(--gold);border-radius:12px;padding:var(--s3) var(--s4);background:color-mix(in srgb,var(--gold) 6%,var(--surface));display:grid;gap:8px}
.pe-out textarea{min-height:90px;font-family:var(--f-mono);font-size:12px;word-break:break-all}
.prop{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:var(--s3) var(--s4);margin-bottom:var(--s3)}
.prop.ok{opacity:.7}.prop.no{opacity:.55}
.prop-h p{margin:6px 0 0;font-size:15px}
.prop details{margin:var(--s3) 0}
.prop summary{cursor:pointer;color:var(--muted);font-size:14px}
.inbox .form{margin:var(--s5) 0}
.inbox .block{display:block}.inbox .prop{max-width:900px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s3)}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:14.5px;color:var(--muted);cursor:pointer}
/* Плашки */
.navboxes{display:grid;gap:10px;margin-top:var(--s6)}
.navbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}

let skyStop=null;
function sky(canvas){
  if(skyStop)skyStop();
  const ctx=canvas.getContext("2d");if(!ctx)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);let w=0,h=0,stars=[],raf=0,t0=performance.now();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
    stars=Array.from({length:Math.round(w*h/2600)},()=>({x:rnd()*w,y:rnd()*h,r:rnd()*1.3+.2,p:rnd()*6.28,s:.4+rnd()*1.2}))}
  function moon(x,y,r,core,glow){const g=ctx.createRadialGradient(x,y,r*.2,x,y,r*3.2);g.addColorStop(0,glow);g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3.2,0,7);ctx.fill();
    const c=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);c.addColorStop(0,core[0]);c.addColorStop(1,core[1]);ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
  function draw(now){const t=(now-t0)/1000;ctx.clearRect(0,0,w,h);
    for(const s of stars){const a=.35+.45*Math.sin(s.p+t*s.s);ctx.fillStyle=`rgba(225,232,240,${a})`;ctx.fillRect(s.x,s.y,s.r,s.r)}
    const big=Math.max(26,Math.min(64,w*.05));
    moon(w*.82+Math.sin(t*.05)*8,h*.32+Math.cos(t*.04)*4,big,["#F2F7FA","#9FC4D4"],"rgba(150,200,220,.22)");
    moon(w*.70+Math.cos(t*.07)*12,h*.18+Math.sin(t*.06)*5,big*.32,["#F0A090","#8E2F28"],"rgba(220,80,60,.18)");
    if(!reduce)raf=requestAnimationFrame(draw)}
  size();const ro=new ResizeObserver(()=>{size();if(reduce)draw(t0)});ro.observe(canvas);
  raf=requestAnimationFrame(draw);skyStop=()=>{cancelAnimationFrame(raf);ro.disconnect();skyStop=null};
}

const CAL_MONTHS=["Путеводной Звезды","Зелёного Рассвета","Водопада","Огненной Песни","Золотой Короны","Последнего Торжества","Покрова Туманов","Заката Солнца","Извечной Тени"];
const CAL_STEMS=["путеводн","зелен","водопад","огнен","золот","последн","покров","закат","извечн"];
const CAL_SEASONS=[["Сезон Возрождения","re"],["Сезон Царства","ki"],["Сезон Угасания","fa"]];
const CAL_WEEK=["Энеас","Дерас","Тирас","Нирос","Фетрас","Экзос","Эптос","Оттас","Эретас"];
const cal={y:383,m:null,d:null};
function calEvents(){
  const yearEv=[],dated=[],idx=nameIndex();
  for(const b of blocks(articles.hronologiya?.body||"")){const items=b.t==="ul"?b.v:b.t==="p"?[b.v]:[];
    for(const it of items){const m=it.match(/\*\*(?:Около\s+)?(\d{1,4})(?:\s*[–-]\s*(\d{1,4}))?[^*]*\*\*\s*(.*)/);if(m)yearEv.push({from:+m[1],to:+(m[2]||m[1]),text:m[3],src:"hronologiya"})}}
  const cb=String(articles.kalendar?.body||""),i=cb.search(/^##\s+Даты/m);
  if(i>=0)for(const ln of cb.slice(i).split("\n")){const m=ln.match(/^\s*-\s*(.+?)\s+[—–-]\s+(.+)$/);if(!m)continue;
    const head=m[1].trim(),text=m[2].trim();
    if(/^\d{1,4}$/.test(head)){yearEv.push({from:+head,to:+head,text,src:"kalendar"});continue}
    const dm=head.match(/^(\d{1,2})\s+(.+?)(?:\s+(\d{1,4}))?$/);if(!dm)continue;
    const mi=CAL_STEMS.findIndex(st=>norm(dm[2]).includes(st));if(mi<0)continue;
    dated.push({d:+dm[1],m:mi,y:dm[3]?+dm[3]:null,text})}
  return{yearEv,dated,idx};
}
function calHtml(){
  const{yearEv,dated,idx}=calEvents(),y=cal.y;
  const inYear=dated.filter(e=>e.y===y),every=dated.filter(e=>e.y===null);
  if(cal.m===null)cal.m=inYear.length?inYear[0].m:0;
  const ofMonth=m=>[...inYear,...every].filter(e=>e.m===m);
  const seasons=CAL_SEASONS.map(([n,k],si)=>`<div class="cal-season cs-${k}"><div class="cal-sn">${n}</div><div class="cal-ms">${[0,1,2].map(j=>{const m=si*3+j,c=ofMonth(m).length;return `<button type="button" class="cal-m" data-calm="${m}" aria-pressed="${cal.m===m}"><span>${CAL_MONTHS[m]}</span>${c?`<i>${c}</i>`:""}</button>`}).join("")}</div></div>`).join("");
  const me=ofMonth(cal.m),evd=new Map();for(const e of me){if(!evd.has(e.d))evd.set(e.d,[]);evd.get(e.d).push(e)}
  let grid=CAL_WEEK.map((w,k)=>`<div class="cal-wd${k===8?" holy":""}">${w}</div>`).join("");
  for(let d=1;d<=36;d++){const ev=evd.get(d);grid+=`<button type="button" class="cal-d${(d-1)%9===8?" holy":""}${ev?" ev":""}" data-cald="${d}" aria-pressed="${cal.d===d}">${d}</button>`}
  const fe=evd.get(37);
  grid+=`<button type="button" class="cal-moon${fe?" ev":""}" data-cald="37" aria-pressed="${cal.d===37}"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/></svg><span>37 · Ведьмина Ночь, полнолуние</span></button>`;
  const sel=cal.d?evd.get(cal.d)||[]:null;
  const dayInfo=cal.d?`<div class="cal-day"><b>${cal.d} ${CAL_MONTHS[cal.m]}${cal.d<=36?`, ${CAL_WEEK[(cal.d-1)%9]}`:""}</b>${cal.d===37?`<p>День Полнолуния вне недели. Подводят счета, работать не принято, лунная магия особенно сильна.</p>`:cal.d%9===0?`<p>Эретас, святой день Церкви Света. Работать запрещено.</p>`:""}${sel.length?`<ul>${sel.map(e=>`<li>${inline(e.text,idx)}${e.y===null?` <span class="status">каждый год</span>`:""}</li>`).join("")}</ul>`:(cal.d===37||cal.d%9===0?"":`<p class="status">В этот день ничего не записано.</p>`)}</div>`:"";
  const ye=[...yearEv.filter(e=>e.from<=y&&y<=e.to).map(e=>({when:e.from===e.to?"":`${e.from}–${e.to}`,text:e.text})),...inYear.sort((a,b)=>a.m-b.m||a.d-b.d).map(e=>({when:`${e.d} ${CAL_MONTHS[e.m]}`,text:e.text}))];
  return `<div class="cal-top"><div class="cal-year"><button type="button" class="btn" data-caly="-1" aria-label="Предыдущий год">‹</button><label><input id="cal-y" type="number" value="${y}" aria-label="Год Второй Эры"><span>год В.Э.</span></label><button type="button" class="btn" data-caly="1" aria-label="Следующий год">›</button></div><span class="status">333 дня · 9 месяцев по 37 дней · неделя из 9 дней</span></div>
  <div class="cal-seasons">${seasons}</div>
  <div class="cal-body"><div><div class="cal-mt">Месяц ${CAL_MONTHS[cal.m]}</div><div class="cal-grid">${grid}</div>${dayInfo}</div>
  <div class="cal-yearbox"><h3>${y} год Второй Эры</h3>${ye.length?`<ul>${ye.map(e=>`<li>${e.when?`<strong>${esc(e.when)}</strong> `:""}${inline(e.text,idx)}</li>`).join("")}</ul>`:`<p class="status">Хроники об этом годе молчат. Даты добавляются в статье <a href="#kalendar">«Календарь Термины»</a> и в <a href="#hronologiya">«Хронологии»</a>.</p>`}
  <div class="cal-jump">${[0,113,322,333,353,383].map(v=>`<button type="button" class="chip" data-calset="${v}" aria-pressed="${v===y}">${v}</button>`).join("")}</div></div></div>`;
}

function relationsHtml(slug,a){

  const own=relList(a).map(g=>`<div class="rel-g"><div class="rel-l">${esc(g.label)}</div><div class="rel-row">${g.items.map(it=>{const s=idx.get(norm(it.name));if(s)mine.add(s);return relChip(s,s?articles[s]:null,s?articles[s].title:it.text)}).join("")}</div></div>`).join("");
  const rev=new Map();for(const[s,x]of entries()){if(s===slug||mine.has(s))continue;for(const g of relList(x))for(const it of g.items)if(idx.get(norm(it.name))===slug){if(!rev.has(s))rev.set(s,[]);rev.get(s).push(g.label.toLowerCase())}}
  if(!own&&!rev.size)return"";
  return `<section class="rels"><h2>Связи</h2>${own}${rev.size?`<div class="rel-g"><div class="rel-l">Указан в связях других</div><div class="rel-row">${[...rev].map(([s,l])=>relChip(s,articles[s],articles[s].title,"для них: "+[...new Set(l)].join(", "))).join("")}</div></div>`:""}</section>`;
}

function dayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}

function dykFacts(){const a=articles["znaete-li-vy"];if(!a)return[];const out=[];for(const b of blocks(a.body))if(b.t==="ul")out.push(...b.v);return out}

  return Array.from({length:n},(_,i)=>`<li>${inline(f[(start+i)%f.length],idx)}</li>`).join("")}

}

const rt={tab:"roll",roll:{mod:3,dc:15,mode:"norm",extra:0,last:null,log:[]},ch:{race:"human",lvl:2,st:{m:0,l:0,r:0,v:0}},rd:{phase:1,od:2,acts:[[],[],[]],msg:""},path:null};

 aek:{n:"Эльф-аэклари",hp:8,en:3,sp:6,bonus:"l",slow:"l",feat:["Эльфийская грация: +1 Ловкость, порог стоимости Ловкости растёт каждые 4 уровня","Лёгкий Шаг: Скорость +1","Зелёный Пакт: помеха в металлических доспехах, −2 с металлическим оружием","Родство с Природой: сопротивление природному урону 50%"]},
 nez:{n:"Эльф-незетари",hp:8,en:4,sp:5,bonus:"l",slow:"l",nez:true,feat:["Эльфийская грация: +1 Ловкость","Пси-Пробуждение в одной дисциплине","Прирождённые менталисты: доп. бонус Энергии от половины Разума и половины Воли","Антимагия"]},
 ado:{n:"Эльф-адонари",hp:6,en:6,sp:5,bonus:"r",slow:"r",feat:["Мудрость Адон-Тирлейдда: +1 Разум, порог стоимости Разума растёт каждые 4 уровня","Наследие Первых Эльфов: Пробуждённый, но слабость к немагическим металлам"]}};
const STN={m:"Мощь",l:"Ловкость",r:"Разум",v:"Воля"};
function pointCost(i,slow){return Math.ceil(i/(slow?4:3))}
function charCalc(){const c=rt.ch,R=RACES[c.race];let spent=0;const val={};let lowered=0;
  for(const k in STN){const b=c.st[k],bonus=R.bonus===k?1:0;val[k]=b+bonus;if(b<0)lowered++;for(let i=bonus+1;i<=bonus+Math.max(0,b);i++)spent+=pointCost(i,R.slow===k)}
  const budget=c.lvl+(lowered?1:0);const{m,l,r,v}=val;
  const hp=R.hp+m+l+r+v*2,en=R.nez?R.en+m+l+r+v+Math.floor(r/2+v/2):R.en+m+l+r*2+v;
  return{val,spent,budget,lowered,hp,en,heal:Math.floor(hp/5),kz:10+l,sp:R.sp+Math.floor(Math.max(0,l)/2),carry:3+m,init:l,R,orp:c.lvl+(c.race==="human"?1:0),oo:c.race==="human"?5:0}}
function rollHtml(){const r=rt.roll,L=r.last;
  const dice=L?L.dice.map((d,i)=>`<span class="die${i===L.pick?" pick":""}${d===20?" crit":d===1?" fumble":""}">${d}</span>`).join(""):`<span class="die idle">d20</span>`;
  const verdict=!L?`<p class="status">Задайте модификатор и Класс Сложности, затем бросьте.</p>`:L.nat===20?`<p class="v ok"><b>Критический успех.</b> Натуральная 20: атака гарантированно попадает, урон ×1.5 и критический эффект своего типа урона. Эффект длится на ход дольше, его КС растёт на половину характеристики.</p>`:L.nat===1?`<p class="v bad"><b>Критический провал.</b> Натуральная 1: атака автоматически промахивается.</p>`:L.total>=r.dc?`<p class="v ok"><b>Успех.</b> ${L.total} против КС ${r.dc}.</p>`:`<p class="v bad"><b>Провал.</b> ${L.total} против КС ${r.dc}.</p>`;
  return `<div class="rt-grid"><div class="rt-form">
    <label>Модификатор броска<input type="number" data-rr="mod" value="${r.mod}"></label>

    ${r.mode!=="norm"?`<label>Ещё ${r.mode==="adv"?"преимуществ":"помех"} сверх первого (каждое ±2)<input type="number" min="0" max="5" data-rr="extra" value="${r.extra}"></label>`:""}
    <button class="btn primary" type="button" id="rt-roll">Бросить d20</button></div>
  <div class="rt-out"><div class="dice">${dice}</div>${L?`<div class="total">${L.nat}${r.mod?(r.mod>0?" + ":" − ")+Math.abs(r.mod):""}${L.ex?(L.ex>0?" + ":" − ")+Math.abs(L.ex):""} = <b>${L.total}</b></div>`:""}${verdict}
    ${r.log.length?`<div class="rt-log">${r.log.map(x=>`<span class="${x.ok?"ok":"bad"}">${x.total}</span>`).join("")}</div>`:""}
    <p class="hint-s">С преимуществом бросаются две кости и берётся большая, с помехой меньшая. Второе и следующие преимущества или помехи дают +2 или −2. Подробнее в статье <a href="#mqrp-vvedenie">«Введение»</a>.</p></div></div>`}
function doRoll(){const r=rt.roll,d=()=>1+Math.floor(Math.random()*20);let dice=[d()],pick=0;if(r.mode!=="norm"){dice.push(d());pick=r.mode==="adv"?(dice[1]>dice[0]?1:0):(dice[1]<dice[0]?1:0)}
  const nat=dice[pick],ex=r.mode==="norm"?0:(r.mode==="adv"?2:-2)*Math.max(0,r.extra|0),total=nat+(r.mod|0)+ex;
  r.last={dice,pick,nat,ex,total};r.log=[{total,ok:nat===20||(nat!==1&&total>=r.dc)},...r.log].slice(0,8)}

    <p class="hint-s">Цена очка: с 1 по 3 значение по 1 ОХ, с 4 по 6 по 2, с 7 по 9 по 3, дальше по 4. Одну характеристику можно опустить до −1 и получить свободное очко.</p></div>
  <div class="rt-out sheet"><div class="sh-grid">

const RULES_VER="Книга правил MQRP, сверка 03.11.2026";
const RACE_ALIAS={"человек":"human","люди":"human","аэклари":"aek","лесной эльф":"aek","эльф-аэклари":"aek","незетари":"nez","темный эльф":"nez","эльф-незетари":"nez","адонари":"ado","высший эльф":"ado","эльф-адонари":"ado"};
const ST_KEYS={"мощь":"m","ловкость":"l","разум":"r","воля":"v"};
const ST_GEN={m:"Мощи",l:"Ловкости",r:"Разума",v:"Воли"};
const BON_T=[[/^(оз|здоровье)/,"hp"],[/^энерги/,"en"],[/^(рейтинг )?исцелени/,"heal"],[/^(кз|класс защиты)/,"kz"],[/^защита мощ/,"dm"],[/^защита ловк/,"dl"],[/^защита разум/,"dr"],[/^защита вол/,"dv"],[/^защиты/,"dall"],[/^скорость/,"sp"],[/^(нагрузка|переносимый вес)/,"cr"],[/^броня/,"arm"],[/^барьер/,"bar"],[/^точность ближ/,"acm"],[/^точность дальн/,"acr"],[/^ячейк/,"slots"],[/^мощь/,"m"],[/^ловкость/,"l"],[/^разум/,"r"],[/^воля/,"v"]];
const sheetOf=slug=>entries().find(([,a])=>isSheet(a)&&a.hero===slug);
const numOf=s=>{const m=String(s||"").replace(",",".").match(/-?\d+(?:\.\d+)?/);return m?+m[0]:null};
const sgn=n=>(n>=0?"+":"−")+Math.abs(n);

function parsePass(txt){
  const P={race:"",rid:null,rov:{},lvl:null,leg:null,st:{},xox:0,xor:0,paths:[],armor:null,items:[],slots:[],bon:[],said:{},bad:[]};
  for(const raw of String(txt||"").split("\n")){const ln=raw.trim();if(!ln||ln.startsWith("#"))continue;
    const i=ln.indexOf(":");if(i<0){P.bad.push(ln);continue}
    const k=norm(ln.slice(0,i)),v=ln.slice(i+1).trim(),parts=v.split("|").map(x=>x.trim());
    if(k==="раса"){P.race=parts[0];P.rid=RACE_ALIAS[norm(parts[0])]||null;for(const p of parts.slice(1)){const n=numOf(p),q=norm(p);if(n==null)continue;if(/^здоров/.test(q))P.rov.hp=n;else if(/^энерг/.test(q))P.rov.en=n;else if(/^скор/.test(q))P.rov.sp=n;else if(/^(вес|нагруз|перенос)/.test(q))P.rov.cr=n}}
    else if(k==="уровень")P.lvl=/\d/.test(v)?numOf(v):null;
    else if(/^легендарн/.test(k))P.leg=/\d/.test(v)?numOf(v):null;
    else if(ST_KEYS[k])P.st[ST_KEYS[k]]=numOf(v)??0;
    else if(/^доп\.?\s*ох/.test(k))P.xox=numOf(v)||0;
    else if(/^доп\.?\s*ор/.test(k))P.xor=numOf(v)||0;
    else if(k==="путь")P.paths.push({name:parts[0],lvl:numOf(parts[1])||0});
    else if(k==="доспех"){const A={name:parts[0],kz:0,t:0,arm:0,bar:0,heavy:false};for(const p of parts.slice(1)){const q=norm(p),n=numOf(p);if(/^(кз|класс)/.test(q))A.kz=n||0;else if(/^тяжест/.test(q))A.t=n||0;else if(/^брон/.test(q))A.arm=n||0;else if(/^барьер/.test(q))A.bar=n||0;else if(/тяж[её]л/.test(q))A.heavy=true}P.armor=A}
    else if(k==="предмет"){const t=parts.slice(1).map(p=>/тяжест/i.test(p)?numOf(p):null).find(x=>x!=null);P.items.push({name:parts[0],t:t||0})}
    else if(k==="ячейка"){const ef=parts.slice(1).find(p=>/^эффект/i.test(p));P.slots.push({name:parts[0],eff:ef?norm(ef.replace(/^эффект\s*:?\s*/i,"")):""})}
    else if(k==="бонус"){const m=parts[0].match(/^(.+?)\s*([+\-−]\s*\d+(?:[.,]\d+)?|[×xх*]\s*\d+(?:[.,]\d+)?)$/i);if(!m){P.bad.push(ln);continue}
      const tn=norm(m[1]),tt=(BON_T.find(([re])=>re.test(tn))||[])[1];if(!tt){P.bad.push(ln);continue}
      const op=/^[×xх*]/i.test(m[2])?"mul":"add",val=+m[2].replace(/[×xх*\s]/gi,"").replace("−","-").replace(",",".");
      const src=parts[1]||"";P.bon.push({t:tt,op,val,src,sup:/сверх/i.test(parts[2]||"")||/сверхъестеств/i.test(src),label:m[1].trim()})}
    else if(k==="указано"){for(const p of parts){const m=p.match(/^(.+?)\s+(-?\d+)$/);if(!m)continue;const tn=norm(m[1]),tt=(BON_T.find(([re])=>re.test(tn))||[])[1];if(tt)P.said[tt]=+m[2]}}
    else P.bad.push(ln);
  }
  return P;
}

/* что написано в самом листе */
function parseSaid(body){
  const b=String(body||""),S={st:{},paths:[],slots:0,slotLines:0},g=(re,f)=>{const m=b.match(re);return m?f(m):undefined};
  const N=x=>/^\d+$/.test(x||"")?+x:null;
  S.hpCur=g(/\*\*ОЗ\*\*\s*:\s*([\dxх]+)\s*\/\s*([\dxх]+)/i,m=>N(m[1]));S.hp=g(/\*\*ОЗ\*\*\s*:\s*([\dxх]+)\s*\/\s*([\dxх]+)/i,m=>N(m[2]));
  S.arm=g(/\*\*Броня\*\*\s*:\s*([\dxх]+)\s*\/\s*([\dxх]+)/i,m=>N(m[2]));
  S.en=g(/\*\*Энергия\*\*\s*:\s*([\dxх]+)\s*\/\s*([\dxх]+)/i,m=>N(m[2]));
  S.heal=g(/Рейтинг Исцеления\*\*\s*:\s*(\d*)/i,m=>N(m[1]));
  S.kz=g(/\*\*Класс Защиты\*\*\s*[—–:-]\s*(\d+)/i,m=>+m[1]);
  S.sp=g(/\*\*Скорость\*\*\s*[—–:-]\s*(\d+)/i,m=>+m[1]);
  g(/\*\*(?:Переносимый Вес|Нагрузка)\*\*\s*[—–:-]\s*(\d+)\s*\/\s*(\d+)/i,m=>{S.crUsed=+m[1];S.cr=+m[2]});
  for(const[n,k]of Object.entries(ST_KEYS)){const m=b.match(new RegExp("\\*\\*"+n+"\\*\\*\\s*[—–:-]\\s*(-?\\d+)(?:\\s*\\((-?\\d+)\\))?","i"));if(m)S.st[k]={base:+m[1],eff:m[2]!=null?+m[2]:+m[1]}}
  for(const[k,n]of Object.entries({dm:"Мощи",dl:"Ловкости",dr:"Разума",dv:"Воли"})){const m=b.match(new RegExp("Защита\\s*\\**\\s*"+n+"\\s*\\**\\s*:?\\s*(\\d+)","i"));if(m)S[k]=+m[1]}
  S.acm=g(/Атака в ближнем бою\s*[—–:-]\s*([+\-−]?\d+)/i,m=>+m[1].replace("−","-"));
  S.acr=g(/Атака в дальнем бою\s*[—–:-]\s*([+\-−]?\d+)/i,m=>+m[1].replace("−","-"));
  /* Пути: жирное название, под ним таблица «Уровень Пути» */
  let name="",inT=false,cur=null;
  for(const raw of b.split("\n")){const ln=raw.trim();let m;
    if(/^#/.test(ln)){name="";inT=false;cur=null;continue}
    if((m=ln.match(/^(?:[*-]\s+)?\*\*([^*]{2,80})\*\*\s*$/))){name=m[1].trim();inT=false;cur=null;continue}
    if(ln.startsWith("|")){const cells=ln.split("|").slice(1,-1).map(c=>c.trim());
      if(/^уровень/i.test(cells[0]||"")){inT=!!name;if(inT){cur={name,lvl:0,max:0};S.paths.push(cur)}continue}
      if(inT&&cur){const lv=numOf(cells[0]);if(lv&&/^\d/.test(cells[0])){cur.max=Math.max(cur.max,lv);const d=(cells[1]||"").replace(/[.\s]/g,"");if(!/не\s*получ/i.test(cells[0])&&d)cur.lvl=Math.max(cur.lvl,lv)}}continue}
    if(ln&&!/^[-|]/.test(ln)&&inT){inT=false}
  }
  S.paths=S.paths.filter(p=>p.max&&p.lvl);
  for(const m of b.matchAll(/\*\*Ячейка[ \t]*\d+\*\*[ \t]*[—–:-]?[ \t]*(.*)/gi)){S.slotLines++;if(m[1].trim())S.slots++}
  S.orSaid=g(/Основные Пути\s*\((\d+|[XxХх]+)\s*Очк/i,m=>N(m[1]));
  S.holes=(b.match(/\b[xх]\s*\/\s*[xх]\b|\([XХ]\s*Очк|\|\s*\.\.\.\s*\|/g)||[]).length;
  S.extra=[["Путь Восхождения","восхождени"],["Героические Способности","героическ"],["Очки Легенды","очк[иао]в? легенд"],["Сверхъестественный Атрибут","сверхъестественн"],["Урон Равновесию","равновеси"]].filter(([,re])=>new RegExp(re,"i").test(b)).map(([n])=>n);
  return S;
}

function pathCost(lvl,human){let c=0;for(let i=0;i<Math.min(lvl,7);i++)c+=PATH_COST[i];return c+(human&&lvl>=7?2:0)}
function statCost(v,bonus,slow){let c=0;const parts=[];for(let i=bonus+1;i<=v;i++){const p=pointCost(i,slow);c+=p;parts.push(p)}return{c,parts}}

function sheetCheck(a){
  const P=parsePass(a.calc),S=parseSaid(a.body);for(const k in P.said)S[k]=P.said[k];

  if(!P.race)add("Основа","err","Раса не указана",{why:"Без расы не посчитать Здоровье, Энергию, Скорость и Нагрузку. Строка паспорта: «Раса: Человек»."});
  else if(!base&&[R.hp,R.en,R.sp,R.cr].some(x=>x==null))add("Основа","err",`Раса «${P.race}» не из книги правил`,{why:"Для своей расы допишите стартовые значения: «Раса: "+P.race+" | Здоровье 10 | Энергия 2 | Скорость 5 | Вес 3»."});
  else if(!base)add("Основа","na",`Раса «${P.race}» не из книги правил`,{why:"Стартовые значения взяты из паспорта, сверьте их с ГМом."});
  for(const s of P.bad)add("Основа","warn","Строка паспорта не разобрана",{got:s,why:"Проверьте написание: «Ключ: значение», части через «|»."});
  const zr=v=>v==null?0:v;

  for(const k in STN){st[k]=P.st[k]!=null?P.st[k]:(S.st[k]?.base??0);const bs=P.bon.filter(b=>b.t===k&&b.op==="add");eff[k]=st[k]+bs.reduce((s,b)=>s+b.val,0);acc[k]=st[k]+bs.filter(b=>!b.sup).reduce((s,b)=>s+b.val,0);src[k]=bs}
  for(const k in STN){const sd=S.st[k];if(!sd)continue;
    if(sd.base!==st[k])add("Характеристики","err",`${STN[k]}: основа`,{key:"st:"+k,got:sd.base,want:st[k],why:"Значение в листе не совпадает с паспортом."});
    else if(sd.eff!==eff[k])add("Характеристики","err",`${STN[k]} с бонусами`,{key:"st:"+k,got:sd.eff,want:eff[k],why:`${st[k]}${src[k].map(b=>" "+sgn(b.val)+" ("+b.src+")").join("")} = ${eff[k]}`});

  for(const k in STN){const{c,parts}=statCost(st[k],bonusOf(k),R.slow===k);spent+=c;if(parts.length)br.push(`${STN[k]} ${st[k]}: ${parts.join("+")} = ${c}`)}
  if(neg.length>1||neg.some(k=>st[k]<-1))add("Очки","err","Понижение характеристик",{why:"Понизить можно только одну характеристику и только до −1, это даёт одно свободное ОХ."});
  const oxB=P.lvl!=null?P.lvl+P.xox+(neg.length===1?1:0):null;
  if(oxB==null)add("Очки","warn","Очки Характеристик: уровень не указан",{got:spent+" потрачено",want:`уровень ${Math.max(1,spent-P.xox-(neg.length===1?1:0))} или выше`,why:br.join(" · ")+". По 1 ОХ за уровень, порог цены каждые 3 значения."});
  else add("Очки",spent>oxB?"err":spent<oxB?"warn":"ok","Очки Характеристик",{got:spent,want:oxB,why:(spent<oxB?`Не потрачено ${oxB-spent}. `:spent>oxB?`Перерасход ${spent-oxB}. `:"")+br.join(" · ")});

  if(P.paths.length)for(const sp of S.paths){const pp=P.paths.find(p=>norm(p.name).includes(norm(sp.name).replace(/^путь\s+/,""))||norm(sp.name).includes(norm(p.name).replace(/^путь\s+/,"")));
    if(!pp)add("Пути","warn",`«${sp.name}» есть в листе, но нет в паспорте`,{got:`уровень ${sp.lvl}`});else if(pp.lvl!==sp.lvl)add("Пути","err",`${sp.name}: уровень`,{got:sp.lvl,want:pp.lvl,why:"В таблице Пути получено другое число уровней, чем в паспорте."});else add("Пути","ok",`${sp.name}`,{got:`уровень ${sp.lvl}`})}

    else add("Очки",orS>orB?"err":orS<orB?"warn":"ok","Очки Развития",{got:orS,want:orB,why:(orS<orB?`Не потрачено ${orB-orS}. `:orS>orB?`Перерасход ${orS-orB}. `:"")+pb.join(" · ")+(human?". Людям +1 ОР на старте.":"")});
    if(S.orSaid==null&&/Основные Пути/i.test(a.body||""))add("Очки","warn","В заголовке Путей не вписано число ОР",{want:orS})}

  const B=t=>P.bon.filter(b=>b.t===t),sum=t=>B(t).filter(b=>b.op==="add").reduce((s,b)=>s+b.val,0),mul=t=>B(t).filter(b=>b.op==="mul").reduce((s,b)=>s*b.val,1);

    cmp("Атрибуты","Здоровье","hp",S.hp,hp,`${R.hp} (раса) + ${m} + ${l} + ${r} + ${v}×2 = ${raw}${tail("hp")}${mul("hp")!==1?", дробь отброшена":""}`);
    const heal=Math.floor(hp/5)+sum("heal");cmp("Атрибуты","Рейтинг Исцеления","heal",S.heal,heal,`1/5 от Здоровья ${hp}, дробь отброшена${tail("heal")}`);
