<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}#banner{display:none!important}</style></head><body><title>Кодекс Термины</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ночное небо с двумя лунами открывает кодекс; ниже спокойные «листы» на туманном фоне, колонка статьи ~68 знаков и карточка сведений справа */
:root{
  --bg:#ECEEE9; --surface:#F8F9F6; --ink:#262C2F; --muted:#646E6C; --line:#D2D7D1;
  --accent:#3B6878; --accent-soft:#DDE7E7; --gold:#9C7A32; --ember:#A5473D;
  --night:#172030; --night-2:#0E1420; --night-ink:#E6EBEE; --night-muted:#A9B4BE;
  --shadow:0 1px 2px rgba(30,40,45,.06),0 8px 24px rgba(30,40,45,.07);
  --f-display:"Forum","Cormorant Garamond",Georgia,serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:36px;--s7:56px;--s8:88px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181B; --surface:#1B2125; --ink:#DCE1DD; --muted:#919C99; --line:#2C3539;
  --accent:#8DBBC7; --accent-soft:#21303A; --gold:#D0AF68; --ember:#E08573;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181B; --surface:#1B2125; --ink:#DCE1DD; --muted:#919C99; --line:#2C3539;
  --accent:#8DBBC7; --accent-soft:#21303A; --gold:#D0AF68; --ember:#E08573;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.65;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1200px;margin:0 auto}

/* Шапка */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:var(--s4);padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px;color:var(--gold);flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:6px;white-space:nowrap}
.tabs a:hover{color:var(--ink);background:var(--accent-soft)}
.tabs a.cur{color:var(--ink)}
.tabs a.cur::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;border-radius:2px;background:var(--gold);animation:grow .35s var(--ease)}
@keyframes grow{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.search{flex:1 1 200px;position:relative;min-width:0;max-width:360px;margin-left:auto}
.search input[type=text]{width:100%;font:inherit;font-size:14.5px;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:11;animation:drop .18s var(--ease)}
@keyframes drop{from{opacity:.3;transform:translateY(-4px)}to{opacity:1;transform:none}}
.results a{display:block;padding:10px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.results a:last-child{border-bottom:0}
.results a:hover,.results a.sel{background:var(--accent-soft)}
.r-cat{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-right:6px}
.r-sum{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.btn{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.03em;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s,transform .15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--ember);border-color:var(--ember)}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.banner{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:14px}
.banner .inner{padding-block:8px}

/* Звёздное небо */
.sky{position:relative;background:linear-gradient(180deg,var(--night-2),var(--night));color:var(--night-ink);overflow:hidden;isolation:isolate}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.sky .inner{padding-block:var(--s8) var(--s7)}
.sky .eyebrow{color:var(--gold)}
.sky h1{color:var(--night-ink)}
.sky p{color:var(--night-muted)}
.sky .lede{color:#C9D2D8;font-style:normal}
.sky .lede em{color:var(--night-ink)}
.sky.small .inner{padding-block:var(--s6) var(--s5)}

/* Общие тексты */
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,5.2vw,58px);line-height:1.04;margin:var(--s2) 0 var(--s4);text-wrap:balance;letter-spacing:.005em}
.lede{font-size:18.5px;color:var(--muted);margin:0 0 var(--s5);max-width:62ch;font-style:italic}
h2.sec{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:0 0 var(--s4);display:flex;align-items:baseline;gap:var(--s3)}
h2.sec small{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
section.block{padding-block:var(--s7) 0}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Анимация смены вида */
.view{animation:rise .45s var(--ease)}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}

/* Путь чтения */
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s4);counter-reset:step}
.step{position:relative;display:block;padding:var(--s4) var(--s4) var(--s4) 56px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}
.step::before{counter-increment:step;content:counter(step);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font-family:var(--f-display);font-size:17px;display:grid;place-items:center}
.step b{display:block;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15}
.step span{font-size:14px;color:var(--muted);line-height:1.45;display:block;margin-top:4px}
.step:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}

/* Карточки разделов и статей */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s4)}
.card{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card .sig{flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.card .sig img{width:100%;height:100%;object-fit:cover}
.card .sig svg{width:40px;height:40px}
.card b{display:block;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15}
.card small{display:block;color:var(--muted);font-size:14px;line-height:1.45;margin-top:3px}
.card .meta{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
.chip:hover{color:var(--ink);border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tag{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.filters{margin:var(--s5) 0}

/* Персонажи */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--s4)}
.person{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.person:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.portrait{aspect-ratio:4/5;max-width:100%;background:var(--night);color:var(--night-ink);position:relative;overflow:hidden;display:grid;place-items:center}
.portrait img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.person:hover .portrait img,.person:hover .portrait svg{transform:scale(1.04)}
.portrait svg{width:100%;height:100%;transition:transform .5s var(--ease)}
.person .txt{padding:var(--s3) var(--s4) var(--s4)}
.person b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1}
.person small{display:block;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:4px}
.pill{display:inline-block;margin-top:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.dead{border-color:var(--ember);color:var(--ember)}
.pill.live{border-color:var(--accent);color:var(--accent)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,190px);gap:var(--s4);overflow-x:auto;padding-bottom:var(--s3);scroll-snap-type:x mandatory}
.strip .person{scroll-snap-align:start}

/* Статья */
.hero-art{position:relative;height:clamp(150px,22vw,230px);background:var(--night);color:var(--night-ink);overflow:hidden}
.hero-art img{width:100%;height:100%;object-fit:cover;opacity:.92;animation:fadein .8s var(--ease)}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.hero-art .mark{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);opacity:.6}
.hero-art .mark svg{position:static;width:min(220px,50%);height:auto;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,color-mix(in srgb,var(--bg) 85%,transparent))}
@keyframes fadein{from{opacity:.3}to{opacity:.92}}
.page{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:var(--s7);align-items:start;padding-block:0 var(--s8)}
.page-head{margin-top:calc(-1 * var(--s6));position:relative;z-index:1}
article{min-width:0;max-width:68ch}
.epigraph{margin:0 0 var(--s5);padding:var(--s3) 0 var(--s3) var(--s5);border-left:2px solid var(--gold);font-style:italic;font-size:18px;color:var(--ink)}
.epigraph cite{display:block;margin-top:6px;font-style:normal;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.prose h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15;margin:var(--s6) 0 var(--s3);text-wrap:balance}
.prose h2::after{content:"";display:block;width:44px;height:2px;margin-top:8px;background:var(--gold);border-radius:2px}
.prose h3{font-size:18px;margin:var(--s5) 0 var(--s2)}
.prose p{margin:0 0 var(--s4)}
.prose>p:first-of-type::first-letter{font-family:var(--f-display);float:left;font-size:3.4em;line-height:.82;padding:6px 8px 0 0;color:var(--gold)}
.prose ul{margin:0 0 var(--s4);padding-left:22px}
.prose li{margin-bottom:7px}
.prose li::marker{color:var(--gold)}
.prose blockquote{margin:0 0 var(--s4);padding:var(--s2) var(--s4);border-left:2px solid var(--gold);color:var(--muted);font-style:italic}
a.wl{color:var(--accent);text-decoration-style:solid}
a.wl.missing{color:var(--ember);text-decoration-style:dotted}
.actions{display:flex;gap:var(--s2);flex-wrap:wrap;margin:0 0 var(--s5)}
.readtime{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:var(--s4)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s7);padding-top:var(--s5);border-top:1px solid var(--line)}
.pager a{display:block;text-decoration:none;color:var(--ink);padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .2s,transform .2s var(--ease)}
.pager a:hover{border-color:var(--accent);transform:translateY(-2px)}
.pager span{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pager b{font-family:var(--f-display);font-weight:400;font-size:20px}
.pager .next{text-align:right;grid-column:2}
aside.info{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14.5px;box-shadow:var(--shadow);margin-top:var(--s5)}
aside.info .portrait{aspect-ratio:4/5}
aside.info .body{padding:var(--s4)}
aside.info h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 var(--s3);line-height:1.15}
aside.info dl{margin:0;display:grid;gap:var(--s3)}
aside.info dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
aside.info dd{margin:2px 0 0}
aside.info .tags{display:flex;flex-wrap:wrap;gap:5px}
.backlinks a{display:block;line-height:1.55}
.caption{font-size:13px;color:var(--muted);font-style:italic;padding:8px var(--s4) 0}

/* Хроника */
.timeline{position:relative;max-width:760px;margin:0 auto;padding:var(--s6) 0 var(--s8)}
.timeline::before{content:"";position:absolute;left:19px;top:var(--s6);bottom:var(--s8);width:2px;background:linear-gradient(var(--gold),var(--line))}
.era{position:relative;padding-left:56px;margin-bottom:var(--s6)}
.era::before{content:"";position:absolute;left:10px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);box-shadow:0 0 0 5px var(--bg)}
.era h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 var(--s3);line-height:1.1}
.era p{margin:0 0 var(--s3)}
.era ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2)}
.era li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:var(--s3) var(--s4);transition:border-color .2s,transform .2s var(--ease)}
.era li:hover{border-color:var(--accent);transform:translateX(3px)}
.era li strong{font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--gold);letter-spacing:.04em;margin-right:6px}

/* Последние правки */
.recent ol{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.recent li{display:flex;gap:var(--s3);align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.recent time{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:100px}

/* Редактор */
.editor{max-width:920px;padding-block:var(--s6) var(--s8)}
.form{display:grid;gap:var(--s4)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
label{display:grid;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text],select,textarea{font:inherit;font-family:var(--f-body);font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{font-family:var(--f-mono);font-size:14px;line-height:1.6;min-height:420px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{font-family:var(--f-mono);font-size:12px;border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.imgfield{display:flex;gap:var(--s4);align-items:center;flex-wrap:wrap;padding:var(--s3);border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.imgfield .thumb{width:96px;height:96px;border-radius:8px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:none}
.imgfield .thumb img{width:100%;height:100%;object-fit:cover}
.imgfield .thumb svg{width:70px;height:70px}
.hint{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:var(--s3);line-height:1.75;text-transform:none;letter-spacing:0}
.hint code{background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.wtabs{display:flex;gap:4px}
.wtabs button{font-family:var(--f-mono);font-size:12px;padding:6px 12px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px 8px 0 0;cursor:pointer}
.wtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);border-bottom-color:var(--surface)}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:var(--s5);min-height:420px}
.notice{padding:var(--s3) var(--s4);border-radius:8px;border:1px solid var(--gold);background:var(--accent-soft);font-size:14.5px}
.notice.err{border-color:var(--ember)}
.confirm{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;font-size:14px}
.empty{max-width:62ch;padding-block:var(--s8)}
footer{border-top:1px solid var(--line);padding-block:var(--s5);font-size:13px;color:var(--muted)}

@media (max-width:1000px){
  .page{grid-template-columns:minmax(0,1fr);gap:var(--s5)}
  aside.info{position:static;max-width:520px;order:-1;margin-top:0}
  aside.info .portrait{aspect-ratio:16/10}
}
@media (max-width:700px){
  .top-in{gap:var(--s2)}
  .search{order:3;max-width:none;flex-basis:100%}
  .brand b{font-size:21px}
  .row,.row3{grid-template-columns:minmax(0,1fr)}
  .pager{grid-template-columns:minmax(0,1fr)}
  .pager .next{grid-column:1}
  .sky .inner{padding-block:var(--s7) var(--s6)}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){

<script type="application/json" id="snapshot">{"at": 1793633903387, "articles": {"lotar": {"aliases": [], "body": "Прежний Генерал [[Орден Сияющего Меча|Ордена Сияющего Меча]]. При нём Лорд Северного Предела относился к паладинам так тепло, что предлагал построить прецепторию прямо в Поселении у Стены (см. [[Говнария]]).\n\nЭту статью стоит дополнить тем, что знают о Лотаре игроки.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Правители нашего дня", "kind": "character", "order": 4, "role": "Прежний Генерал Ордена Сияющего Меча", "status": "", "summary": "Генерал паладинов, при котором Орден дружил даже с Лордом Северного Предела.", "title": "Лотар", "updatedAt": 1793633557135, "updatedBy": null}, "demony": {"aliases": ["Архидемоны", "экзотай", "дьяволы", "Король Мёртвых", "Ониксовый Лорд", "Пламя Хаоса"], "body": "Экзо'тай, «Иные Духи», — обитатели [[Бездна|Бездны]]. Тело демона состоит из энергии Бездны, материя для него вторична. Поэтому демону так трудно задержаться в Реальности: нужно огромное количество магии, иначе форма распадётся. Чаще они прибегают к одержимости или создают себе оболочку. Зато почти любой демон сильнее человека в магии и биологически бессмертен.\n\nДемоны зациклены на одной идее, и в этом их сила и слабость. Почти каждый развивает **Личную Магию** — выражение своей сути, — поэтому демоны-волшебники большая редкость.\n\n## Категории\n- **Низшие** — от бесов до солдат тэйн'рэ и демонических зверей.\n- **Старшие** — верхняя граница «обычного» демона.\n- **Высшие**, они же дьяволы — уникальные существа. Сильнейшие побеждают пару магистров.\n- **Демоны-Лорды** — подчинили себе Осколок, убить их окончательно можно только там.\n- **Архидемоны** — боги Бездны. Их Власть кончается там, где начинается Власть другого.\n\n## Семь Архидемонов\n- **Ониксовый Лорд**, Власть — Доминация. Цель — Эра Чёрного Солнца.\n- **Король Мёртвых**, Власть — Нежизнь. Отец некромантии.\n- **Господин в Маске**, без царства и известной Власти. Заключает сделки, плата за которые трижды напомнит о себе.\n- **Пламя Хаоса**, Жёлтый Огонь. Сжечь мир, чтобы родился лучший.\n- **Хранитель Тайн**, Власть — Сокрытие. Знание убивает потенциал.\n- **Алая Звезда**, Немесса. Почувствовать всё, что можно почувствовать.\n- **Гниющий**, Мегенред, самый молодой. Принять всех отверженных; с ним связана Драконья Гниль (см. [[Великая Топь]]).\n\nПервые трое — Изначальные. Среди павших Архидемонов — Тивилдормин, Повелитель Безумия, ушедший «в отпуск» в Страну Чудес.", "category": "Существа", "createdAt": 1793632093893, "order": 1, "summary": "Экзо'тай, обитатели Бездны, их категории и семь Архидемонов.", "title": "Демоны", "updatedAt": 1793632093893, "updatedBy": null}, "tainstvennaya-sila": {"aliases": ["магия", "волшебство", "Дар", "заклинания", "Личная Магия"], "body": "Больше всего на свете образованные маги любят спорить, что же такое магия. Общего ответа к концу IV века Второй Эры нет.\n\n## Единая Теория\nТермин «Таинственная Сила» ввёл Владыка Леонид в «Единой Теории Волшебства» (см. [[Антерен]]). Клирики черпают Сияние Творца, геоманты — токи [[Древо Основ|Основ]], демонопоклонники — силу Бездны. Леонид показал, что у всех этих сил есть общие черты, и объединил их одним понятием. Казацкий магистр Лиорен Арканист пошёл дальше: сила одна, а различия задают её **Аспекты**.\n\n## Дар\nПо антеренским открытиям, Дар есть почти у каждого. Вопрос в том, сколько лет уйдёт на простейшую чувствительность: у большинства десятилетие, а кто-то случайно сжигает родовое поместье. Откуда берётся одарённость, неизвестно.\n\n## Заклинание\nТри этапа: **Прикосновение** (взять Силу под контроль), **Формирование** (задать структуру) и **Воплощение** (проявить в мире). Жесты, слова и благовония — лишь опоры. Ошибка грозит ожогами, а то и **аномалией**: огоньками над полем или огненным элементалем через месяц на месте боя.\n\n## Катализаторы\nПосох или палочка не обязательны, но без них маг работает только своими силами и сам принимает весь удар магии. Хороший катализатор фокусирует, усиливает и хранит силу, но лучше всего работает сделанный под конкретного мага.\n\n## Личная Магия\nСпособности, связанные с самим существом, а не выученные. Человек, родившийся среди аномалий Ort, управляет огнём, не умея объяснить как. Рыбак чувствует окуней в десяти метрах. Король Годрик II не брался никаким ядом. Сюда же учёные сваливают всё, что не могут классифицировать.", "category": "Магия", "createdAt": 1793632093893, "epigraph": "Враг начинающего мага — недостаток знаний, великого — уверенность в том, что он знает всё.", "epigraphBy": "Казацкая присказка", "order": 1, "summary": "Что такое магия, Дар, заклинание, катализатор и Личная Магия.", "title": "Таинственная Сила", "updatedAt": 1793632093893, "updatedBy": null}, "kazakiya": {"aliases": ["Казакион", "Мерклейдская Ассоциация Магов", "Горы Архимага", "Академия"], "body": "Казакия, она же Мерклейдская Ассоциация Магов, — крупнейшее объединение волшебников континента.\n\n## Основание\nВ 333 году В.Э. Церковь объявила Четвёртый Поход Очищения, чтобы покончить с магией. Архимаг **Казакион** явился в Новую Пахомию и предложил прекратить преследования. Получив отказ, он занял Священный Город, созвал туда магов со всего запада и, когда пришла армия, за один день окружил город горной цепью. Битвы не случилось. С тех пор Горы Архимага стоят до сих пор.\n\nНи одного упоминания о Казакионе до 333 года не найдено. Управлять он не стал: заперся в башне на месте собора и передал власть Совету Магистров.\n\n## Принцип\n«Маг не должен служить своей силе». Магия — это знание, дисциплина и контроль, а не поклонение, сделка или зависимость. Демонопоклонников и осквернителей здесь не терпят.\n\n## Академия\nУчит одарённых со всего [[Мерклейд|Мерклейда]], в том числе детей дворян, громко осуждающих колдовство. Шесть факультетов описаны в статье [[Магические традиции]]. Элита Казакии — Кристальные Рыцари (см. [[Искусства Боя]]).\n\n## Сейчас\nВ 383 году Совет впервые вступил во внешний союз и воюет в [[Война Червя|Войне Червя]].", "category": "Земли", "createdAt": 1793632093893, "epigraph": "Маг не должен служить своей силе.", "epigraphBy": "Архимаг Казакион", "order": 3, "summary": "Город-государство магов за Горами Архимага, основанный загадочным Казакионом в 333 году.", "title": "Казакия", "updatedAt": 1793632093893, "updatedBy": null}, "drakony": {"aliases": ["драконы", "виверны", "Валатреллен"], "body": "Из всех первенцев мира драконов не забудут никогда. Род идёт от **Древних Драконов**, они же Высшие или Первородные. Их оружием была Власть над Небесами: взмах крыла становился ураганом, удар хвоста — молнией. Чешуя Бессмертия искажала время вокруг них, и гарантированно пробить её мог только звёздный металл.\n\nПочему их эпоха закончилась, неизвестно. Сегодня достоверно известна одна из них: **Валатреллен Красная**, живое божество Сетлейда, спящая под охраной валлатрийцев (см. [[Люди]]).\n\n## Низшие драконы\nИх ещё зовут цветными драконами или Каалагонскими Вивернами, потому что большинство живёт в Каалагонских горах. Власть почти утрачена, зато они приспосабливаются к стихиям и обретают Цвет: красные дышат огнём, синие стали морскими змеями, жёлтые — песчаными драконами. Живут тысячелетиями, умны и способны к ментальной речи, но с «однодневками» разговаривают редко.\n\n## Вирмы\n- **Виверны** — частая добыча охотников Ринны, их кровь ценна.\n- **Дрейки** — нелетающие дракониды, от стайных хищников до гигантов.\n- **Псевдодраконы** Подземья, почти слепые и дышащие кислотой.\n- **Драконьи черепахи** Варлейда размером с дом.", "category": "Расы", "createdAt": 1793632093893, "order": 6, "summary": "Древние Драконы, их выродившиеся потомки и вирмы.", "title": "Род Драконов", "updatedAt": 1793632093893, "updatedBy": null}, "konklav": {"aliases": ["вэллахани", "друиды", "Рощи", "Шесть Истин", "Вааленполь", "винджен", "духи"], "body": "Древнее объединение вэллахани, адептов дикой магии [[Ведория|Ведории]]. На риннский манер их зовут друидами. Они не правят князьями, но их Рощи веками служат местами суда, исцеления и совета, а сами они — посредники между людьми и духами.\n\n## Рощи\nСтроятся вокруг Мест Силы, обычно столпов Живого Камня. В каждой есть Сердце Рощи, Круг Собраний, сады и дома лекарей, жильё для странников. Главная — **Эскаран**, где проходят Великие Собрания.\n\n**Круги** — не подразделения, а группы общих взглядов: Странники, Смотрители Рощи, Круг Камней. Выше всех ценятся **Архидруиды**, признанные одним из Старших Духов.\n\n## Шесть Истин\n- **Живая Земля.** Мир жив и никому не принадлежит.\n- **Течение.** Мир в движении, порча — это застой.\n- **Завершение.** Конец нужен для начала, но не раньше срока.\n- **Связь.** Ранишь корень — отзовётся в ветви.\n- **Суть.** У всего свой образ и место.\n- **Баланс.** Ничто не должно брать сверх меры.\n\n**Вааленполь**, Путь Света — цикл самопознания: Пустота, Свет, Огонь, Древо, Небеса и снова Пустота.\n\n## Духи\nДухи мира рождаются из Основ, духи предков появляются после смерти. Бывают рассеянные низшие духи, Малые Духи (вплоть до опасной карги), десяток Старших Духов, почти божеств, и легендарные Великие Духи, которых никто не встречал.\n\n## Винджен\nВоинские братства-реймы со Свободным Правом. Входят в священную ярость, получая медвежью силу. Иные не возвращаются из ярости и становятся Потерянными.", "category": "Вера и ордена", "createdAt": 1793632093893, "order": 3, "summary": "Вэллахани, друиды Ведории: Рощи, Шесть Истин, Вааленполь и духи.", "title": "Конклав Зеленого Пути", "updatedAt": 1793632093893, "updatedBy": null}, "giganty": {"aliases": ["гиганты", "тролли", "энты", "Гайаны", "великаны"], "body": "Великаны происходят от **Гайанов**, Каменных Колоссов, одной из Первых Рас наравне с Первыми Эльфами и Древними Драконами. Если кто-то из Гайанов ещё жив, он спит сном, похожим на смерть.\n\n## Гиганты\nДревнейшие из потомков, ростом от пяти метров. Естественного срока жизни у них нет: тысячелетия спустя, устав от мира, они превращаются в каменные деревья. Их глаза видят больше измерений и саму суть вещей, а лучшие из них владели Словами Силы, вносящими Истину в мир. Гиганты не лгут и могут беседовать годами просто ради беседы. Циклопы с единственным глазом были ещё сильнее.\n\n## Энты\nРодня деревьев, а не камня. Срастаются с лесом корнями на десятки метров. Считались вымершими, пока не вышли из [[Каэд Диссен|Плотнолесья]] в [[Война Червя|Войну Червя]]. Многие в ней погибли.\n\n## Тролли\nСамые распространённые и одичавшие. Серебряная кровь даёт им **Адаптацию**: горный тролль обрастает каменной шкурой, речной становится похож на рыбу, снежный покрывается мехом. Тролль никогда не перестаёт расти, так что с годами ему нужно всё больше еды. В Горах Архимага живёт тролль, обросший звёздной пылью и выучивший азы астромантии. Части троллей очень ценят алхимики.", "category": "Расы", "createdAt": 1793632093893, "order": 5, "summary": "Потомки каменных Гайанов: великаны, энты и тролли.", "title": "Род Гигантов", "updatedAt": 1793632093893, "updatedBy": null}, "raitriari": {"aliases": ["Совершенный Народ", "Фаргот Ур", "Король-Бог", "Технологии Источника", "Камень Душ"], "body": "Одна из трёх ветвей [[Эльфы|эльфов]] после Раскола, когда-то самая многочисленная и сильная.\n\n## Путь к вечности\nЭльфы Великого Дома Иллантар пытались остановить Увядание. Их Институт, кроме прочего, создал людей. Когда Упавшая Звезда оставила Источник, люди получили Владык, и эльфы бежали за Каалагон (см. [[Антерен]]).\n\nАреллен ур-Иллантар построил Центральный Столп Преобразования, переводивший энергию Источника в пригодный вид, и эльфы перехватили около 40% его мощности. Так родились **Технологии Источника**. Брат Ареллена, Фаргот, открыл Квантовую Модель Идентичности, истинное «я» существа, и научился кристаллизовать её в **Камень Душ**. Камень в механическом **Вечном Теле** давал настоящее бессмертие. Фаргот стал **Фарготом Уром, Королём-Богом**, а народ назвал себя райтриари, «совершенными».\n\n## Войны\nЧетыре войны с Антереном. Во Второй появились огромные орудия-Холмы, на их основе Антерен создал заклинание «Разрушитель Крепостей». Единственный раз обе стороны сражались вместе в Ночь Расколотой Горы (см. [[Каэд Фелл]]). Последняя, Война Источника, длилась около века и закончилась тем, что Владыка Даниил раздробил Камень Короля-Бога.\n\n## Что осталось\nОсквернённые руины, Единая Сеть и Столп, механические стражи, ждущие приказов, и горстка Бессмертных, управлявших доспехами из далёких Гробниц. Среди них отряд Рыцарей Левой Руки, Эдир Флэнкхайт.", "category": "Существа", "createdAt": 1793632093893, "order": 3, "summary": "Совершенный Народ: эльфы в механических телах, Технологии Источника и войны с Антереном.", "title": "Райтриари", "updatedAt": 1793632093893, "updatedBy": null}, "voina-chernoi-korony": {"aliases": ["Война Семерых", "Бандуриан", "Эдмунд Говнарион", "Чёрный Король", "Война Чёрной Короны"], "body": "Её также называют Войной Семерых. В 113 году В.Э. осквернитель Бандуриан, ученик основателя [[Круг Проклятых|Круга Проклятых]], объявил себя Чёрным Королём и пошёл войной на весь Мерклейд.\n\n## Герои\n- **Эдмунд Говнарион**, лирийский рыцарь, потерявший всё в битве за Скуффеншильд и ставший вожаком партизан и беженцев. Позже император.\n- **Пророк Пахом**, пришедший с востока проповедник. Исцелял, наставлял и сражался рядом с Эдмундом.\n- **Сэр Латимер Инланский, Сияющий Меч.** Друг Эдмунда, принявший на себя проклятие, предназначенное герою.\n- **Святой Дункан**, первый инквизитор.\n- **Миррдин эт-Анголвен**, алхимик, основатель Ордена Мудрых.\n- **Риордан-драконоборец** и риннский фейдмар Ригеллион, разбивший Готлока Разорителя.\n\nПятеро, включая Эдмунда и Пахома, вошли в тронный зал Дир-Анремайна и победили Чёрного Короля.\n\n## Последствия\n- Эдмунд основал Мерклейдскую Империю. Она пережила его всего на несколько лет, и из неё выросли Союзные Королевства.\n- Возникла [[Церковь Света]]. Пахом после битвы исчез, Латимер прожил три месяца и успел основать [[Орден Сияющего Меча]].\n- В [[Ведория|Ведории]] перед лицом войны собралось первое Большое Собрание в Эскаране.\n- Рыцарские ордена получили огромные земли в Эббелунде (см. [[Эблания]]).\n- Потомки гоблинской Орды Готлока до сих пор разоряют [[Золотое Побережье]].", "category": "История", "createdAt": 1793632093893, "order": 2, "summary": "Война 113–117 годов В.Э. против Чёрного Короля Бандуриана, создавшая нынешний Мерклейд.", "title": "Война Черной Короны", "updatedAt": 1793632093893, "updatedBy": null}, "orden-siyayushchego-mecha": {"aliases": ["паладины", "Серебряные Рыцари", "Латимер", "Лотар"], "body": "Самый обособленный орден [[Церковь Света|Церкви]]. Его основал **Святой Латимер Инланский, Сияющий Меч**, друг Эдмунда Говнариона, принявший на себя проклятие Чёрного Короля. После победы он прожил три месяца, но успел всё устроить.\n\nПаладины охотились на тёмных магов и осквернённых чудовищ задолго до Экзекуторов. Их мало, но каждый — опаснейший воин, а против избранных врагов Ордена вдвое опаснее.\n\n## Как сражаются\nЧудеса из жития Латимера: укрепить тело, наполнить оружие Светом, покарать нечисть, оградиться от зла. Чаще всего паладины используют Стиль Сокрушения или Оплота (см. [[Искусства Боя]]). Сильнейшие духом приносят Священные Клятвы, гейсы: больше силы в обмен на принципы до конца жизни.\n\nВ народе их зовут **Серебряными Рыцарями** из-за освящённых доспехов серебристого сплава, которые не берёт обычное оружие, держат мистические энергии и обжигают нечисть.\n\n## Статус\nСвоё Право Первого Слова, признание во всех Союзных Королевствах и на [[Золотое Побережье|Золотом Побережье]]. Орден правит Тимерой в [[Говнария|Говнарии]], крупный Оплот есть в Эббелунде.\n\n## Иерархия\n- **Грандмастер** — хранитель знаний и реликвий, бывший Генерал.\n- **Генерал Ордена** — военный глава. Прежним Генералом был Лотар.\n- **Паладин** — считается дворянином, обращение «лорд» или «леди».\n- **Послушник** — учится в Оплоте или служит оруженосцем.", "category": "Вера и ордена", "createdAt": 1793632093893, "epigraph": "И поднял он клинок к Солнцу, и зацепил луч Его так, что стал он оружьем его.", "epigraphBy": "Житие сэра Латимера", "order": 2, "summary": "Паладины, Серебряные Рыцари, основанные Святым Латимером.", "title": "Орден Сияющего Меча", "updatedAt": 1793632093893, "updatedBy": null}, "zolotoe-poberezhye": {"aliases": ["Альконде", "Свободные Города", "хасситы", "Штормовой Залив", "Пограничье"], "body": "Полоса больше тысячи километров к югу от Союзных Королевств. Название дали восточные купцы: ночью поля цветка голерента светятся жёлтым, и земля кажется золотой. Сам цветок почти бесполезен.\n\n## Альконде\nРеспублика на Островах Полумесяца. Правит пожизненный Лорд-Адмирал, избранный Советом Капитанов (многие из которых в море не выходили). Отсюда в [[Мерклейд]] приходят вещи и истории со всего континента, а ещё азартные игры, островной мак и полуофициальная Гильдия Воров. В 383 году Лорд-Адмирал Гильермо помог разбить флот Культа Червя, по слухам вместе с нагами.\n\n## Свободные Города\nБывшие алькондийские земли, а теперь множество независимых городов и торговая республика Гильдера. Друг с другом воюют чуть ли не каждый год, но против чужака встают вместе. Общая монета, богатая торговля, сильные наёмничьи компании вроде Девяти Клинков. На юге досаждают гоблины, потомки Орды Готлока, на севере — [[Каэд Фелл]].\n\n## Пограничье\nНичейные холмы между городами и Степью. Беглецы, разбойничьи князья и искатели приключений вечно пытаются основать тут своё королевство и вечно гибнут. Зато руины [[Антерен|Антерена]] здесь не разграблены.\n\n## Штормовой Залив\nСкалы под непрерывным ливнем, родина **хасситов**. У них нет государств и брака: люди идут за тем, за кем хотят, и уходят, когда хотят. Именно поэтому их слово стоит так дорого. Поклоняются Вечному Шторму и богу борьбы Грандалю. Соседям они запомнились драконьими кораблями и пиратством.", "category": "Земли", "createdAt": 1793632093893, "order": 8, "summary": "Южное побережье: Альконде, Свободные Города, Пограничье и Штормовой Залив хасситов.", "title": "Золотое Побережье", "updatedAt": 1793632093893, "updatedBy": null}, "pontifik-alister": {"aliases": ["Алистер", "Алистер фон Клифф", "Понтифик"], "body": "До 383 года — архиэнкантор Алистер фон Клифф. На похоронах короля Франца, умершего от Синей Чумы, произошло Второе Прикосновение Небес: Алистера объявили вторым Избранным, Пахомий Пятый снял с себя обязанности, и [[Говнария]] стала теократией.\n\nАлистер вернул старое правило: каждый жрец должен уметь творить чудеса. Орден Храма при нём вырос как никогда. Король Лирии Арктор III публично обвинил его в цареубийстве, но Лирия пала в [[Война Червя|Войне Червя]]. С Инланской церковью отношения у Понтифика холодные (см. [[Церковь Света]]).", "category": "Персонажи", "createdAt": 1793633557135, "group": "Правители нашего дня", "kind": "character", "order": 2, "role": "Глава Церкви Света и правитель Говнарии", "status": "Правит", "summary": "Бывший архиэнкантор, ставший Избранным и правителем Священного Королевства.", "title": "Понтифик Алистер", "updatedAt": 1793633557135, "updatedBy": null}, "latimer": {"aliases": ["Латимер", "Сияющий Меч"], "body": "Сэр Латимер Инланский родился на полуострове Лэн Шаранна, в землях, что сегодня славятся лучшим вином [[Эблания|Эблании]]. Он был ближайшим другом Эдмунда и в решающей битве принял на себя проклятие, предназначенное герою.\n\nГоворят, после войны он прожил три месяца на одной воле и успел почти всё: помог основать Церковь и создал [[Орден Сияющего Меча]], названный в честь собственного прозвища. Земли Тимеры Эдмунд передал ему неотменимым эдиктом.\n\nПочти все чудеса паладинов взяты из его жития. В одном эпизоде он поднял клинок к Солнцу и будто бы зацепил луч так, что тот стал его оружием. Так родилось Благословенное Оружие.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Герои былых времён", "kind": "character", "order": 3, "role": "Сияющий Меч, основатель Ордена", "status": "Мёртв", "summary": "Друг Эдмунда, принявший на себя проклятие Чёрного Короля.", "title": "Святой Латимер", "updatedAt": 1793633557135, "updatedBy": null}, "prorok-pahom": {"aliases": ["Пахом"], "body": "Пахом родился около 73 года В.Э. в Гахайеде близ Зендара, в Восточной Империи. Там же, по Книге Света, ему в медитации явился Архангел Аосар. Проповеди в столице успеха не имели, Пахома изгнали, и годы он бродил по пустыне Ал-а-Гидэ, помогая всем, кто нуждался.\n\nКак он попал в [[Мерклейд]], рассказывают по-разному: то ли по новому откровению, то ли спасаясь от имперских властей на корабле капитана, который всю дорогу над ним издевался. В лагере Эдмунда он исцелял, наставлял и сражался, а в последней битве с Чёрным Королём был рядом.\n\nПосле победы Пахом исчез. Верующие считают, что он ушёл в Небесные Чертоги и вернётся, когда понадобится миру. Его ученик основал [[Церковь Света]].", "category": "Персонажи", "createdAt": 1793633557135, "group": "Герои былых времён", "kind": "character", "order": 2, "role": "Основатель пахомианства", "status": "Исчез", "summary": "Проповедник с востока, принёсший Слово Творца и победивший Чёрного Короля рядом с Эдмундом.", "title": "Пророк Пахом", "updatedAt": 1793633557135, "updatedBy": null}, "numiratras": {"aliases": ["Нумиратрас"], "body": "Нынешний Архонт Войны [[Дол-ин-Аурос|Дол-ин-Ауроса]]. Как и все Архонты, он носит имя первого из своих предшественников и продолжает его дело, поэтому номеров к имени не прибавляют.\n\nВ 383 году после вмешательства нескольких искателей приключений он привёл легион в Альянс и показал миру огнестрельное оружие и паровые машины гномов (см. [[Война Червя]]).", "category": "Персонажи", "createdAt": 1793633557135, "group": "Правители нашего дня", "kind": "character", "order": 5, "role": "Архонт Войны Дол-ин-Ауроса", "status": "Воюет за Альянс", "summary": "Гномий полководец, выведший Золотой Дальваг из тысячелетней изоляции.", "title": "Архонт Нумиратрас", "updatedAt": 1793633557135, "updatedBy": null}, "elfy": {"aliases": ["эльф", "адонари", "аэклари", "незетари", "наги", "Увядание"], "body": "Корни эльфов уходят на 35 тысяч лет назад. Все они ведут род от Первых Эльфов, воплощённых духов Древа Вечности, которое было столпом самого мира. Близость к Древу давала бессмертие и великую силу, а родной континент Адон-Тирлейдд эльфы ни с кем не делили.\n\nМедленная гибель Древа, **Увядание**, вернула ход времени для вечного народа и раскололо его.\n\n## Ветви\n- **Адонари, Вечный Народ.** Прямые наследники Эры Древа. Их осталось едва больше десятка, и они прячутся в иных реальностях, потому что Увядание хочет забрать дары Древа назад.\n- **Аэклари, Лунные Эльфы.** Пошли за Королём Ничего Таулендином в [[Бездна|Бездну]], где он построил Дворец-Вне-Времён. Большинство живёт в [[Каэд Диссен|Плотнолесье]]. Каждый аэклари живёт дважды: как эльф и как дух Изумрудного Древа. Сильнейшие возвращаются в третий раз сильванами, чемпионами леса.\n- **[[Райтриари]], Совершенный Народ.** Пошли за Фарготом Уром и обрели бессмертие в механических телах. От них остались руины.\n- **Незетари, Тёмный Народ.** Ушли в Подземье за Эланой ур-Синаран и открыли псионику. Их общий разум Нексус пропал в 383 году вместе с даром у большей части народа.\n- **Наги, Морские Эльфы.** Потомки сейрентри, восставших против Анурианской Империи под началом царя Саансибарта. Сброшенные в море, они стали морским народом с хвостами морских змеев. Увядание над ними почти не властно.", "category": "Расы", "createdAt": 1793632093893, "order": 3, "summary": "Одна из Первых Рас, рождённая Древом Вечности и расколотая Увяданием на несколько ветвей.", "title": "Эльфы", "updatedAt": 1793632093893, "updatedBy": null}, "krug-proklyatyh": {"aliases": ["Чёрный Культ", "Потрошители", "Пилигримы Тьмы", "Наследники", "Нэриус", "Мар'агул"], "body": "Крупнейшее объединение [[Скверна|осквернителей]] в истории, идущее путём Владыки Скверны.\n\n## История\nСначала это был круг восьми величайших колдунов Легиона Тьмы во главе с архистратегом **Мар'агулом**. После Войны Владык выжили трое: его ученик **Бандуриан**, ведьма чёрного пламени **Маэв Вортигерн** и ассасин **Нэриус Пронзающий**. Они превратили Круг в огромный культ, и Тёмный Век стал Золотым Веком Осквернителей. К концу века они рассорились и разделили Круг на три ветви.\n\n## Три ветви\n- **Унаследовавшие Скверну.** Бандуриан хотел вернуть Владыку и Эру Галата. Он объявил себя Чёрным Королём и погиб в [[Война Черной Короны|Войне Чёрной Короны]]. Сейчас их мало, но держатся крупными стабильными ячейками.\n- **Пилигримы Тьмы.** Маэв считала, что Владыка был слаб, раз проиграл, и нужен новый Тёмный Повелитель. Каждый пилигрим видит им себя. Ходят поодиночке с одним-двумя учениками, учеников часто ищут среди гонимых магов.\n- **Братство Крови, Потрошители.** Нэриусу нужна была только кровь. Лучшие из них — гильдия ассасинов, худшие — бешеные берсерки. Посвящение — испить осквернённой крови. Нэриус единственный не погиб наверняка.\n\n## Порядок\nКто сильнее, тот и прав. Наследники держатся вместе ради общей цели, пилигримы почти не общаются, а потрошители при встрече друг друга обычно убивают.\n\n## Эра Галата\nЦель, о которой сам Круг так и не договорился: власть Тёмного Повелителя, конец всего существования или просто океан крови.", "category": "Вера и ордена", "createdAt": 1793632093893, "epigraph": "Ищи силу. Всё остальное последует.", "epigraphBy": "Философия Круга Проклятых", "order": 4, "summary": "Чёрный Культ осквернителей и его три ветви: Наследники, Пилигримы и Потрошители.", "title": "Круг Проклятых", "updatedAt": 1793632093893, "updatedBy": null}, "kaed-dissen": {"aliases": ["Плотнолесье", "аэклари", "Изумрудное Древо", "сильваны"], "body": "Громадный лес размером с крупное королевство на востоке [[Говнария|Говнарии]] и [[Эблания|Эблании]]. Разумные люди давно отказались от претензий на него.\n\nЗдесь водится всё, что не нашло места во внешнем мире: реликтовые звери, племена зверолюдов, гигантские пауки, древние тролли и создания дикой магии. Следопыты Фланнского герцогства всегда найдут работу.\n\n## Аэклари\nКто здесь хозяин, люди узнали только в 383 году, когда в ответ на [[Война Червя|Войну Червя]] к Альянсу вышли **аэклари**, лунные [[Эльфы|эльфы]]. Их Двенадцать Кланов многие считают варварами, но в бою и магии они уже оказали Альянсу огромную услугу.\n\nАэклари живут дважды: после смерти эльф становится духом леса. Сильнейшим Король Ничего даёт вернуться сильваном, полудухом в теле от Изумрудного Древа. Только сильваны, за редким исключением, проходят во Дворец-Вне-Времён.\n\nВ Плотнолесье стоят единственные в мире стабильные врата между Реальностью и [[Бездна|Простором]].", "category": "Земли", "createdAt": 1793632093893, "order": 6, "summary": "Плотнолесье: громадный реликтовый лес, дом лунных эльфов.", "title": "Каэд Диссен", "updatedAt": 1793632093893, "updatedBy": null}, "grandal": {"aliases": ["Бог Борьбы"], "body": "В легендах [[Золотое Побережье|Штормового Залива]] Грандаль то воплощение Вечного Шторма, то великий воин древности. В 383 году вопрос стал практическим: четырёхметровый воин с огромным молотом явился и возглавил Лазурное Знамя Альянса в [[Война Червя|Войне Червя]].\n\nИсторики и теологи обещают всё прокомментировать после войны.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Боги и великие силы", "kind": "character", "order": 2, "role": "Бог Борьбы хасситов", "status": "Ведёт Лазурное Знамя", "summary": "Четырёхметровый воин с молотом, которого хасситы почитали как бога, и который действительно пришёл.", "title": "Грандаль", "updatedAt": 1793633557135, "updatedBy": null}, "drevo-osnov": {"aliases": ["Основы", "Ort", "Deo", "Aias", "Isa", "Ethil"], "body": "Древо Основ, его ещё называют Древом Жизни или Мировой Башней, — главная идея геомантии и алхимии. Мир здесь понимается как живое существо с Душой, Волей и Сердцем, по артериям которого течёт Стихийный Свет.\n\nСердце мира родилось из Пустоты, и в нём зарождается Свет. Поднимаясь, он разливается по трём Основам, а Основы дают начало Линиям Силы, по которым стихийная энергия течёт по планете.\n\n## Пять элементов\n- **Isa, Пустота.** Холод, отсутствие и тьма, единственная часть мира без Света. Но это и холст, на котором Свет рисует.\n- **Ethil, Свет.** Первоэлемент от самого Сердца: жизнь, порядок, информация о мире.\n- **Ort, Огонь.** Ближайшая к Свету стихия, разгорается в глубинах и формирует землю. Сюда относят огонь, землю и металл.\n- **Deo, Древо.** Связывает Огонь и Небо, это мир посередине: растения, вода, соль.\n- **Aias, Небеса.** Бескрайние и свободные: молния, ветер, холод.\n\nОсновы — это не просто «огонь, вода и воздух». Они отвечают ещё и трём уровням мира: Подземному, Срединному и Верхнему. Конклав [[Ведория|Ведории]] строит на них своё учение, а алхимики описывают через них суть вещей (см. [[Алхимия]]).", "category": "Мир", "createdAt": 1793632093893, "order": 3, "summary": "Модель мира как живого существа: Сердце, Стихийный Свет и три Основы Ort, Deo и Aias.", "title": "Древо Основ", "updatedAt": 1793632093893, "updatedBy": null}, "eblaniya": {"aliases": ["Эббелунд", "Инлания", "Новый Лоран", "Дерзерт"], "body": "Ныне крупнейшее из Союзных Королевств. Королю Дерзерту II Удачливому (прозвище он взял сам, пережив семь покушений за месяц) от родителей достались две короны, два совета, два свода законов и обязанность быть двумя королями сразу. Объединить их он пытается уже одиннадцать лет.\n\nСтолица — **Новый Лоран** на острове посреди Лоранского озера, бывшая спорная территория. Здесь стоит Неолоранский Университет Всяческих Наук, раз в три года показывающий королю, что деньги ему дают не зря.\n\n## Эббелунд\nЗапад королевства, земля рыцарских орденов. После [[Война Черной Короны|Войны Чёрной Короны]] больше трети земель отдали орденам, и многие до сих пор держат странные древние права. Говорят, что в реках здесь течёт рыцарская честь. Славится лошадьми, способными носить всадника в латах, хорошим металлом и словом, которое держат буквально: однажды барон достроил мост, хотя река уже ушла в сторону.\n\n## Инлания\nВосток, мягкий климат, вина и мода. Здесь правят древние дома, а король для них лишь первый среди равных. Родовые распри, файды, идут по строгим правилам с перерывами на праздники. Фехтование — благородное искусство, и у каждого дома есть именной дуэльный клинок для Первого Меча. На полуострове Лэн Шаранна родился сэр Латимер (см. [[Орден Сияющего Меча]]). Инланская церковь всегда держалась отдельно, а при Понтифике Алистере отношения стали ещё холоднее.", "category": "Земли", "createdAt": 1793632093893, "order": 2, "summary": "Объединённые королевства Эббелунда и Инлании под одним королём и двумя коронами.", "title": "Эблания", "updatedAt": 1793632093893, "updatedBy": null}, "dol-in-auros": {"aliases": ["Золотой Дальваг", "Оммсвальд", "Архонты"], "body": "Золотой Дальваг, Последний Оплот Гномов. По хроникам Архонта Мудрости, он стоял под Каалагоном задолго до [[Антерен|Антерена]]. Людям эти хроники, конечно, не показывают.\n\nВеками ворота оставались закрыты. Благодаря Эдмунду началась осторожная торговля через вольный город **Оммсвальд**, выстроенный прямо у ворот (см. [[Говнария]]). Внутри дальвага побывали считанные люди.\n\n## Власть\nКороля нет. Правит совет Архонтов, у каждого своя стезя. Известны Архонты Войны, Мудрости, Закона, Кузни, Жизни, Пара, Золота, Тайн и Народа. Каждый новый Архонт берёт имя самого первого и продолжает его дело, поэтому номеров к именам гномы не добавляют.\n\n## 383 год\nПосле вмешательства нескольких искателей приключений легион Архонта Войны Нумиратраса вступил в Альянс в [[Война Червя|Войне Червя]] и показал миру забытое огнестрельное оружие и паровые машины. Изоляции пришёл конец.\n\nПодробнее о народе — в статье [[Гномы]].", "category": "Земли", "createdAt": 1793632093893, "epigraph": "Валлахтанг ирданш!", "epigraphBy": "Гномье восклицание на любой случай жизни", "order": 4, "summary": "Золотой Дальваг под Каалагоном, последний живой оплот гномов.", "title": "Дол-ин-Аурос", "updatedAt": 1793632093893, "updatedBy": null}, "daniil-midranmar": {"aliases": ["Даниил", "Владыка Даниил", "Мидранмар"], "body": "Один из пятерых людей, научившихся черпать Невозможную Энергию Источника и ставших для человечества живыми богами (см. [[Антерен]]). С его Львиными Рыцарями связан Стиль Сокрушения, основа многих современных [[Искусства Боя|боевых искусств]].\n\nВ Ночь Расколотой Горы он вместе с Королём-Богом Фарготом вёл союзные армии людей и эльфов против аватары Короля Мёртвых (см. [[Каэд Фелл]]). В Последней Войне именно он дошёл до Второй Столицы [[Райтриари|райтриари]] и в дуэли раздробил Камень Душ Короля-Бога.\n\nВ 383 году Второй Эры Даниил вернулся в мир и нанёс поражение Эогану, Предвестнику Пожирателя (см. [[Война Червя]]).", "category": "Персонажи", "createdAt": 1793633557135, "group": "Древние владыки", "kind": "character", "order": 1, "role": "Владыка Антерена", "status": "Вернулся в 383 году", "summary": "Один из пяти Владык Антерена, основатель Стиля Сокрушения, вернувшийся в мир.", "title": "Даниил Мидранмар", "updatedAt": 1793633557135, "updatedBy": null}, "voina-chervya": {"aliases": ["Пожиратель", "Червь", "Альянс", "Легион Голода", "Эоган", "Лорд Глубин"], "body": "Самое свежее и самое страшное событие Второй Эры. Сведения на конец 383 и начало 384 года.\n\n## Что известно\n- Война прокатилась по северу [[Мерклейд|Мерклейда]]. **Легион Голода** уничтожил почти всё герцогство Агдея и Лирию в [[Говнария|Говнарии]]. Король Лирии Арктор III, вероятно, погиб со столицей.\n- Против Пожирателя собрался **Альянс**. В него вошли силы, которые веками не воевали ни с кем рядом:\n  - легион [[Дол-ин-Аурос|Дол-ин-Ауроса]] под началом Архонта Войны Нумиратраса, впервые показавший миру огнестрельное оружие и паровые машины;\n  - аэклари из [[Каэд Диссен|Плотнолесья]] вместе с энтами;\n  - Совет Магистров [[Казакия|Казакии]], впервые вступивший во внешний союз;\n  - флот Альконде (см. [[Золотое Побережье]]), а по слухам и наги;\n  - ветераны Рейклейда под Железным Маршалом, который, предположительно, погиб или пропал;\n  - хасситский бог Грандаль, лично возглавивший Лазурное Знамя.\n- Морские силы Культа Червя разбиты благодаря «Указу о Защите Моря» Лорда-Адмирала.\n\n## Предвестник\nГлавный полководец Пожирателя — Эоган, Предвестник и Лорд Глубин, ведущий Легион Голодных. В 383 году в мир вернулся Владыка Даниил Мидранмар и нанёс ему поражение.\n\n## Последствия\nСудьба Рейклейда, беженцы с запада, открывшийся миру Дол-ин-Аурос, союз с эльфами — всё это решится после победы над Пожирателем.", "category": "История", "createdAt": 1793632093893, "order": 3, "summary": "Идущая в 383–384 годах война Альянса против Пожирателя и его Легиона Голода.", "title": "Война Червя", "updatedAt": 1793632093893, "updatedBy": null}, "valatrellen": {"aliases": ["Валатреллен"], "body": "Единственная достоверно известная представительница Древних Драконов (см. [[Род Драконов]]). Она спит долгим сном в далёком Сетлейде под охраной принятого ею народа, алокожих валлатрийцев, которые и назвали себя в её честь.\n\nВаллатрийцы почти не выходят во внешний мир: разве что рабами, наёмниками или в священное путешествие. Что увидит мир, когда Валатреллен проснётся, никто не знает.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Боги и великие силы", "kind": "character", "order": 1, "role": "Последний из Древних Драконов", "status": "Спит", "summary": "Живое божество валлатрийцев и, возможно, последний живой Древний Дракон.", "title": "Валатреллен Красная", "updatedAt": 1793633557135, "updatedBy": null}, "benedikt": {"aliases": ["Бенедикт", "Элегия"], "body": "Последний Пожиратель Душ, носящий титул Вампира-Лорда (см. [[Вампиры]]). Такие существа живут в нескольких телах сразу, собирают себя из мельчайших фрагментов и командуют легионами Опустошённых и даже вампиров до пятого ранга.\n\nПротив Вампира-Лорда, по оценке Инквизиции, нужна профессиональная армия и весь [[Орден Сияющего Меча]].", "category": "Персонажи", "createdAt": 1793633557135, "group": "Тьма и угрозы", "kind": "character", "order": 3, "role": "Вампир-Лорд", "status": "Активен", "summary": "Единственный ныне живущий вампир седьмого ранга. Его Идея Крови — Реки Крови.", "title": "Бенедикт Прокул Элегия", "updatedAt": 1793633557135, "updatedBy": null}, "edmund-govnarion": {"aliases": ["Эдмунд", "император Эдмунд"], "body": "Эдмунд был простым лирийским рыцарем и потерял всё в битве за Скуффеншильд. В лесу он собрал беженцев и ушедших в партизаны солдат, а потом к нему пришёл странный проповедник с горсткой оборванцев. Эдмунд принял их с большим сомнением. Этим проповедником был Пахом.\n\nОн стал одним из пятерых, кто вошёл в тронный зал Дир-Анремайна и сразил Чёрного Короля (см. [[Война Черной Короны]]). После войны он объединил почти весь [[Мерклейд]] в Мерклейдскую Империю и мечтал собрать человечество под одной верой. Империя пережила его лишь на несколько лет.\n\nРодом из Донии. Каждый второй повар герцогства уверяет, что знает его любимый рецепт, и рецепты эти друг другу противоречат. Его потомки правили [[Говнария|Говнарией]] до смерти короля Франца в 383 году.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Герои былых времён", "kind": "character", "order": 1, "role": "Император, герой Войны Чёрной Короны", "status": "Мёртв", "summary": "Лирийский рыцарь, который из вожака партизан стал императором всего запада.", "title": "Эдмунд Говнарион", "updatedAt": 1793633557135, "updatedBy": null}, "nebesnye-tela": {"aliases": ["Солнце", "Луна", "Алый Близнец", "Муна Нераманция", "Завеса", "Луна Чародеев"], "body": "## Солнце\nЗолотая звезда, Око Творца. На самом деле настоящее солнце этой системы погибло несколько столетий назад, а нынешнее целиком состоит из Невозможной Энергии Великого, известного как Сияющий.\n\n## Планеты\n- **Закатон.** Первая планета, почти сплошная пустыня. Вокруг него ходят две «низшие звезды», огненные шары. Мудрецы зовут его Планом Земли и Огня.\n- **[[Термина]].** Наш мир.\n- **Иллигарт.** Замёрзшая планета, покрытая металлическими конструкциями неизвестного происхождения и чёрными облаками [[Скверна|Галата]]. Астрологи называют её Планом Скверны.\n- **Эфия.** Самая крупная планета, предположительно из зелёного газа.\n- **Шивгорот.** Белый гигант с вечными льдами и горами, рядом с которыми высочайшие вершины Термины кажутся холмами. Отсюда родом ледяные элементали. Примерно на 60% затронут Скверной.\n- **Амакена.** Пустынный шар камня и металла, осквернённый полностью.\n\n## Луны Термины\n- **Муна Нераманция**, Луна Чародеев, с циклом в 37 дней.\n- **Алый Близнец**, появившийся в 383 году. Это луна-вампир, которая высасывает вим планет. Поле реальности Термины этот эффект блокирует.\n\n## Завеса и Бездна\nПримерно в 3 а.е. за Амакеной начинается Завеса, барьер из неизвестной формы Таинственной Силы. Завес две: между Внутренней и Внешней лежит [[Бездна]]. Внутреннюю с трудом можно пересечь, о пересечении Внешней не известно ни одного свидетельства.\n\nЗвёзды — не небесные тела. По трактату Высшего Мага Улума аль-Бишкека, это сгустки силы на ткани Завесы, места, где она истончена.", "category": "Мир", "createdAt": 1793632093893, "order": 4, "summary": "Солнце, планеты системы, луны Термины, Завеса и природа звёзд.", "title": "Небесные тела", "updatedAt": 1793632093893, "updatedBy": null}, "vampiry": {"aliases": ["Пожиратели Душ", "Бенедикт", "Опустошённые", "Идея Крови"], "body": "Пожиратели Душ — одни из самых опасных существ Второй Эры. Ими становятся осквернители, погибшие от своей силы, или жертвы вампира, которые не умерли до конца. Расплодились они в Тёмный Век. Вампиры не нежить, но [[Скверна|Галат]] переделал их сущность.\n\n## Опустошённые\n- **I. Оболочка** — безмозглое новообращённое создание.\n- **II. Охотник** — сам ищет пищу и легко убивает человека.\n- **III. Ревенант** — почти личность, справится с несколькими солдатами.\n\n## Вампиры\nИз обрывков съеденных душ Опустошённый может собрать новую личность.\n- **IV. Низший вампир.** Сир держит у себя часть его сущности.\n- **V. Пожиратель Душ.** Свободный вампир с особыми техниками.\n- **VI. Высший вампир.** Угроза городам, обладает **Идеей Крови**, особой формой Личной Магии.\n- **VII. Вампир-Лорд.** Живёт в нескольких телах, собирает себя из фрагментов, командует армиями. Сейчас он один: **Бенедикт Прокул Элегия**, его Идея — Реки Крови.\n\n## Силы и слабости\nСолнце смертельно только для I и II рангов и ослабляет III–IV. Вампир укрепляет и восстанавливает тело Скверной, а древние развивают псионику и мутации. Против них работает всё, что работает против Скверны, особенно **Свет**. Чем сильнее вампир, тем больше ему нужно: высший может месяцами не есть, а потом выпить десяток человек. Сильнее всего его насыщают души, похожие на него самого.", "category": "Существа", "createdAt": 1793632093893, "order": 2, "summary": "Пожиратели Душ: семь рангов от Опустошённого до Вампира-Лорда.", "title": "Вампиры", "updatedAt": 1793632093893, "updatedBy": null}, "magicheskie-tradicii": {"aliases": ["Академия", "факультеты", "чудеса", "Аль-Хазиф", "Орден Мудрых", "Магия Хаоса"], "body": "## Казацкая традиция\nШкола [[Казакия|Казакии]], собранная из сотен разрозненных традиций. Шесть факультетов Академии:\n- **Серенитос** — лунная магия и астрология, холод и иллюзии.\n- **Мистриос** — боевая магия. Отсюда набирают Кристальных Рыцарей.\n- **Транготеус** — элементализм и геомантия трёх Основ. Его основатель Кантар Дымящийся стал демонопоклонником Пламени Хаоса.\n- **Виктерис** — артефакторика лунного камня. Самые увлечённые заменяют тело камнем и становятся Бескровными.\n- **Сарантес** — магия жизни и вима. Большинство выпускников — обычные лекари.\n- **Балерикус** — демонология «для противодействия». Им никто не верит.\n\n## Башня Слоновой Кости\nОрден Мудрых из Ринны (см. [[Шем]]). Маги и одновременно учёные, историки, советники. Сильны в [[Алхимия|алхимии]], стихиях и големах.\n\n## Чудеса Церкви\nКлирики не называют своё искусство магией. Чудо актуализирует историю из жития святого: прочитав строки о Латимере, паладин наполняет меч светом. Пять Архангелов Книги Света — в статье [[Церковь Света]].\n\n## Аль-Хазиф\nВосточная школа бога Каламоса посреди пустыни. Чтобы поступить, надо в одиночку пройти пустыню. Специализация — кольца и артефакты, перенос свойств вещей и заключение демонов в предметы.\n\n## Симмерийская Магия Путей\nМаг выбирает одного из шести Драконов Запределья (так в Серой Земле зовут Архидемонов) и учится у него, стремясь стать равным. Чаще становится демоном-прозелитом.\n\n## Особые случаи\n- **Магия [[Круг Проклятых|Круга Проклятых]]** оскверняет любую традицию [[Скверна|Галатом]].\n- **Магия Хаоса** от Лорда Безумия Тивилдормина. Большинство адептов не переживают первые три-четыре заклинания.", "category": "Магия", "createdAt": 1793632093893, "order": 2, "summary": "Казакия, Башня Слоновой Кости, чудеса Церкви, Аль-Хазиф, Магия Путей и Магия Хаоса.", "title": "Магические традиции", "updatedAt": 1793632093893, "updatedBy": null}, "iskusstva-boya": {"aliases": ["Формы Эгиды", "боевые стили", "Путь Шторма", "Сокрушение", "Оплот"], "body": "## Наследие Антерена\n**Кэль Ариатэ**, Искусство Тысяч, — строевая доктрина солдат, прикрывавших магов. **Формы Эгиды** — шесть стилей одиночного воина, на которых построено большинство современных искусств:\n- **Сокрушение.** Тяжёлое оружие и доспехи, создавать момент натиском. Основал Владыка Даниил.\n- **Клинок и Посох.** Лёгкий меч и чары, универсально, но без вершин.\n- **Оплот.** Щит важнее оружия, лучшее нападение — защита.\n- **Ночь и Солнце.** Дуэльный стиль: финты и проверки ради одного решающего удара.\n- **Горизонт.** Стрельба в движении и держание дистанции.\n- **Исток.** Боевая магия как боевое искусство.\n\n## Мерклейд\n- **Путь Сияющего Меча** — Сокрушение или Оплот плюс чудеса (см. [[Орден Сияющего Меча]]).\n- **Кэль Фиретэ** Экзекуторов — честного боя с магом не бывает.\n- **Инланская дуэльная школа** — длинный одноручный клинок и финты.\n- **Формы Тьмы** Нэриуса — сила из ярости и боли, полная мощь только со [[Скверна|Скверной]] в крови.\n- **Кристальный Меч** Казакии — оружие и есть катализатор.\n- **Путь Шторма** хасситов — Сокрушение без доспехов, абсолютное наступление. Мастера призывают Вечный Шторм.\n- **Танцующий Меч Шема** — парные сабли.\n- **Искусство драконоборцев** Ринны — крестовое копьё против вирмов.\n\n## Варлейд и Сетлейд\nПесчаная Буря, Кольцо Воды с посохом, Звериное Сердце с когтями, ассасины Гаитина, Алмазное Тело голых рук и валлатрийская Пляска Огненной Крови.\n\n## Гномы\nКороткий доркий со щитом в туннелях, длинное древковое на просторе, сильнейший отрядный бой и автоматоны. Полурослики непревзойдённы с пращой.\n\n## Эльфы\nСовершенные Искусства адонари: **Паттерны Истинного Меча** (семнадцать тысяч движений, человеку не выучить) и **Эн'Каэ'Та**, ритуальный поединок с кодексом чести. Обе включали Формы Огня, Древа и Небес.", "category": "Бой", "createdAt": 1793632093893, "epigraph": "Враг вряд ли что-то тебе сделает, если он мёртв.", "epigraphBy": "Принцип Пути Шторма", "order": 1, "summary": "Формы Эгиды Антерена и выросшие из них стили людей, гномов и эльфов.", "title": "Искусства Боя", "updatedAt": 1793632093893, "updatedBy": null}, "skverna": {"aliases": ["Галат", "осквернители", "Губительная Сила", "Владыка Скверны"], "body": "Скверна, она же элемент **Галат**, Губительная Сила или «Всё Зло Этого Мира», — магия, враждебная самому мирозданию. Она разрушает и искажает всё, чего касается, и, что хуже всего, умеет осквернять саму Таинственную Силу. Любая традиция в руках осквернителя становится чудовищным близнецом себя.\n\nПо Книге Света, Скверна родилась при падении [[Антерен|Антерена]]. Её связывают с полумифическим **Владыкой Скверны**, Тёмным Повелителем Эры Антерена, и его Легионом Тьмы.\n\n## Осквернители\nИх считают худшими магами мира: нигилисты, безумцы, мегаломаны. Рано или поздно сила берёт своё, и адепт гибнет или превращается в нечто хуже. Погибшие от собственной силы могут стать Опустошёнными, первой ступенью [[Вампиры|вампира]].\n\n## Шрамы и мутации\n[[Люди|Мерклейдцы]] устойчивы к Галату, но если он побеждает, шрамы у них самые страшные. Даже вампиры, использующие Скверну как родную, при перегрузке получают мутации.\n\n## Где ещё\nЦелые планеты системы затронуты Галатом (см. [[Небесные тела]]). Тёмный стиль Форм Тьмы питается им (см. [[Искусства Боя]]). Конечная цель культа — Эра Галата, см. [[Круг Проклятых]].", "category": "Магия", "createdAt": 1793632093893, "order": 3, "summary": "Галат, Губительная Сила: враждебная мирозданию магия, осквернители и их судьба.", "title": "Скверна", "updatedAt": 1793632093893, "updatedBy": null}, "vedoriya": {"aliases": ["Вольные Княжества", "Истар", "Эскаран", "винджен", "Устакол"], "body": "Ведория никогда не была единым государством, и местные этому только рады. Её делят многочисленные княжества, у каждого свой князь, свой уклад и длинный список причин считать соседей сомнительными людьми.\n\nЕдинство пришло в 113 году В.Э., когда перед лицом [[Война Черной Короны|Войны Чёрной Короны]] в священном **Эскаране** собралось первое Большое Собрание. Его договоры до сих пор гарантируют свободу княжеств и взаимопомощь против внешней угрозы. В тяжёлые времена князья выбирают из своих **Владыку Войны**.\n\n## Княжества\n- **Истар** с белокаменной столицей на антеренских руинах. Единственная магическая гильдия вне Конклава.\n- **Устакол**, лесной край, где действует Старый Договор с духами и ездит Дикая Охота.\n- **Исмирал**, угрюмый край, больше всех воевавший с Союзными Королевствами.\n- **Саргот**, лучшие мореходы и морские налётчики. Говорят, их князь бессмертен.\n- **Дармосс**, Речное Княжество с Озёрным Городом и очень дорогими перевозками.\n- **Ривачег**, всадники с саблями, бердыш и любовь к горячительному.\n- **Алерот**, молодой вольный город гномов и ушедших из леса эльфов.\n- **Сентир**, Страна Тысячи Гор, кланы и ненависть к некромантии.\n- **Вегир** на самом севере, бледные кузнецы, мастера ледяного металла иселита.\n\n## Духи, друиды и воины\nЗдесь верят, что земля жива, а у реки, горы и поля есть свой дух. Посредники между людьми и духами — [[Конклав Зеленого Пути]]. Самые грозные воины Ведории — винджен, братства священной ярости.", "category": "Земли", "createdAt": 1793632093893, "epigraph": "Мир не принадлежит никому.", "epigraphBy": "Истина Живой Земли", "order": 5, "summary": "Вольные Княжества Дальнего Запада, где живут духи и правит Конклав Зелёного Пути.", "title": "Ведория", "updatedAt": 1793632093893, "updatedBy": null}, "fargot-ur": {"aliases": ["Король-Бог", "Фаргот"], "body": "Фаргот ур-Иллантар, брат изобретателя Технологий Источника Ареллена. Он открыл Квантовую Модель Идентичности и научился кристаллизовать душу в Камень Душ, а Вечные Тела дали его народу настоящее бессмертие.\n\nЭльфы присягнули ему как Фарготу Уру, «первому среди всех». Прозвище Король-Бог придумали люди, видевшие его на поле боя, а райтриари сначала повторяли его в шутку.\n\nОн вёл четыре войны с [[Антерен|Антереном]] и однажды сражался рядом с Владыкой Даниилом. В Войне Источника тот же Даниил раздробил его Камень Душ. Подробнее в статье [[Райтриари]].", "category": "Персонажи", "createdAt": 1793633557135, "group": "Древние владыки", "kind": "character", "order": 2, "role": "Король-Бог райтриари", "status": "Камень Душ раздроблен", "summary": "Эльф, вернувший своему народу бессмертие в механических телах.", "title": "Фаргот Ур", "updatedAt": 1793633557135, "updatedBy": null}, "bandurian": {"aliases": ["Чёрный Король", "Черный Король"], "body": "Ученик основателя [[Круг Проклятых|Круга Проклятых]] Мар'агула, один из трёх колдунов, переживших Войну Владык. Вместе с Маэв Вортигерн и Нэриусом он превратил Круг в огромный культ, а после раскола возглавил Унаследовавших Скверну, верных старому Владыке.\n\nВ 113 году В.Э. объявил себя Чёрным Королём и пошёл войной на весь [[Мерклейд]]. Был уничтожен в тронном зале Дир-Анремайна Эдмундом, Пахомом и их спутниками (см. [[Война Черной Короны]]).", "category": "Персонажи", "createdAt": 1793633557135, "group": "Тьма и угрозы", "kind": "character", "order": 1, "role": "Чёрный Король", "status": "Уничтожен", "summary": "Ученик Мар'агула, развязавший Войну Чёрной Короны.", "title": "Бандуриан", "updatedAt": 1793633557135, "updatedBy": null}, "taulendin": {"aliases": ["Король Ничего", "Таулендин ур-Аманетил"], "body": "Таулендин ур-Аманетил был правителем Великого Дома Аманетил. Незадолго до Увядания он увёл своих людей под знаменем Изумрудной Луны в [[Бездна|Бездну]], отбил у Ониксового Трона Осколок и построил там Дворец-Вне-Времён, где время остановилось.\n\nЧтобы защитить народ от смертной судьбы, он вырастил Изумрудное Древо: каждый аэклари после смерти становится духом в его объятиях, а сильнейших Король возвращает сильванами (см. [[Эльфы]], [[Каэд Диссен]]). Сами аэклари зовут его Королём Ничего, и что значит это имя, люди так и не поняли.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Древние владыки", "kind": "character", "order": 3, "role": "Король Ничего, владыка лунных эльфов", "status": "Правит Дворцом-Вне-Времён", "summary": "Эльфийский король, отбивший у Ониксового Трона кусок Бездны для своего народа.", "title": "Таулендин", "updatedAt": 1793633557135, "updatedBy": null}, "derzert": {"aliases": ["Дерзерт"], "body": "Сын эббелундского короля Тристана и инланской королевы Летиции Учёной. Унаследовал обе короны и вместе с ними два королевских совета, два свода законов и обязанность быть двумя королями одновременно (см. [[Эблания]]).\n\nПрозвище он выбрал сам после семи неудачных покушений за месяц. Одиннадцатый год пытается свести два королевства к общему знаменателю. Самым удачным его ходом считают превращение спорного Нового Лорана в общую столицу.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Правители нашего дня", "kind": "character", "order": 3, "role": "Король Эблании", "status": "Правит", "summary": "Король двух корон, переживший семь покушений за один месяц.", "title": "Дерзерт II Удачливый", "updatedAt": 1793633557135, "updatedBy": null}, "cerkov-sveta": {"aliases": ["пахомианство", "Пахом", "Инквизиция", "Архангелы", "Ланвэ", "Орден Храма", "Пахомославие"], "body": "Главная религия [[Мерклейд|Мерклейда]], основанная на поклонении Творцу, Создателю Света. Основатель учения — **Пророк Пахом**. По Книге Света, в медитации ему явился Аосар, Архангел Мощи, и передал Слово Творца.\n\n## Пророк\nПахом родился около 73 года В.Э. в Гахайеде у Зендара, в Восточной Империи. Из столицы его изгнали, годы он странствовал по пустыне, а потом оказался в Мерклейде, в лагере Эдмунда Говнариона. Он был одним из пятерых, кто победил Чёрного Короля (см. [[Война Черной Короны]]), а после битвы исчез. Верующие ждут, что он вернётся, когда понадобится миру.\n\n## История\nЦерковь основал в 118 году его ученик Пахомий I вместе со Святым Латимером. Вместе с Империей вера распространилась по всем Союзным Королевствам, а после её распада почти в каждом королевстве появилась «своя» церковь. В 383 году Понтификом и правителем [[Говнария|Говнарии]] стал Алистер. Цель Церкви — чтобы Слово звучало в каждом уголке, и тогда Творец, ушедший из-за первородного греха, вернётся.\n\n## Архангелы\n- **Аосар**, Мощь, вождь небесных воинств.\n- **Иммора**, Истина, срывает покровы и колдовство.\n- **Целестина**, Исцеление.\n- **Ориат**, Правосудие, обличает и сковывает.\n- **Ланвэ**, Слава, Посланник Создателя, помогает в пути и вселяет решимость.\n\n## Иерархия\nПонтифик, архиэнканторы (из них собирается Адекон), энканторы, жрецы, послушники. Энкантор значит «чудотворец». Понтифик Алистер вернул правило, что жрец обязан творить чудеса.\n\n## Три ветви\n- **Белая Церковь** — собственно храмы.\n- **Орден Храма** — личная армия Понтифика, девиз «Пока стоит Храм».\n- **Инквизиция**, основанная Святым Дунканом, девиз «Враг многолик». Имеет Право Первого Слова: инквизитор действует сразу, ни у кого не спрашивая. Её боевое крыло — Экзекуторы.\n- Отдельно стоит [[Орден Сияющего Меча]].", "category": "Вера и ордена", "createdAt": 1793632093893, "epigraph": "Враг многолик.", "epigraphBy": "Девиз Инквизиции", "order": 1, "summary": "Пахомославная Церковь: вера в Творца, Пророк Пахом, иерархия, Архангелы и Инквизиция.", "title": "Церковь Света", "updatedAt": 1793632093893, "updatedBy": null}, "govnariya": {"aliases": ["Пахомия", "Священное Королевство", "Понтифик Алистер", "Тимера"], "body": "До недавнего времени крупнейшее из Союзных Королевств, наследник Лирии и Мерклейдской Империи. Все его короли были потомками Эдмунда Говнариона (см. [[Война Черной Короны]]).\n\n## Нынешняя власть\nВ 383 году король Франц умер от Синей Чумы. На его похоронах случилось «Второе Прикосновение Небес», и правителем стал **Понтифик Алистер**, бывший архиэнкантор фон Клифф. Говнария теперь теократия, Священное Королевство. Король Лирии Арктор III обвинил Понтифика в цареубийстве и объявил независимость, но Лирию уничтожила [[Война Червя]].\n\n## История\nПик пришёлся на деда Франца, Годрика I: самое развитое человеческое королевство, торговля с гномами, почти 60 тысяч войска. Годрик II потерял земли в пользу [[Эблания|Эблании]], сократил армию втрое, начал Ведорскую Войну и подавился рыбной костью. Его единственное достойное наследие — настольная игра деорин.\n\n## Области\n- **Священная Земля** со Столицей (60 тысяч жителей) и **Пахомией**, городом в городе, бывшей резиденцией Понтифика.\n- **Тимера**, земля Ордена Сияющего Меча. Говорят, безопаснее места нет.\n- **Герцогство Дония** с крепостью Скуффеншильд, родина Эдмунда.\n- **Северный Округ** со стеной Хен-Эддельман. Её Лорд был дружен с Генералом Ордена Лотаром.\n- **Герцогство Фланнское** с красным городом Фланорном, торговые ворота на восток.\n- **Копские Земли** с Аттеркопом, превратившиеся в болота после появления Гор Архимага.\n- **Оммский округ** с вольным городом Оммсвальдом у ворот [[Дол-ин-Аурос|Дол-ин-Ауроса]].\n- **Агдея**, почти уничтоженная Легионом Голода.\n- **Лирия**, павшая в войне.", "category": "Земли", "createdAt": 1793632093893, "order": 1, "summary": "Союзное королевство, ставшее теократией Понтифика Алистера; родина Пахомии и Ордена Сияющего Меча.", "title": "Говнария", "updatedAt": 1793632093893, "updatedBy": null}, "termina": {"aliases": ["Мир", "планета"], "body": "Термина — вторая планета от Солнца и дом для всех рас и народов этого мира. Она примерно на 15% больше Земли, но во многом полая, поэтому сила тяжести почти привычная. Классического ядра у неё нет: тепло Подземью даёт основа Ort из [[Древо Основ|Древа Основ]], а над планетой лежит плотное поле внутренней реальности, которое и задаёт законы вроде самих Основ.\n\n## Континенты\n- **Адон-Тирлейдд** на Северном полюсе, древняя родина эльфов.\n- **Срединный Континент**, где живут все известные цивилизации. Он делится на четыре части: [[Мерклейд]] на западе, Варлейд на востоке, Готтлейд на севере и Сетлейд на юге.\n- Огромный пустынный массив на обратной стороне планеты. Цивилизаций там не замечено.\n\n## Подземный Мир\nПод Срединным Континентом лежат Великие Полости, колоссальные каверны, связанные сетью тоннелей. Всё это вместе называют Подземным Миром. Там живут глубинные гномы, кобольды, ящеролюды и твари вроде псевдодраконов.\n\n## Луны\n- **Муна Нераманция**, Луна Чародеев. Бледно-голубая, её цикл длится ровно 37 дней, один месяц антеренского календаря. Из неё черпают силу астроманты.\n- **Алый Близнец**, кроваво-красная луна, внезапно появившаяся в 383 году Второй Эры. Подробнее в статье [[Небесные тела]].", "category": "Мир", "createdAt": 1793632093893, "epigraph": "Прекрасный и многострадальный дом для бесчисленных рас и народов.", "epigraphBy": "Кодекс", "order": 1, "summary": "Планета, на которой происходит действие Mudila Quest: полый мир с тремя континентами и Подземьем.", "title": "Термина", "updatedAt": 1793632093893, "updatedBy": null}, "kazakion": {"aliases": ["Казакион"], "body": "В 333 году В.Э. он явился в Новую Пахомию в день объявления Похода Очищения и предложил Церкви оставить магов в покое. Получив отказ, занял город, созвал туда волшебников со всего запада, а когда пришла объединённая армия, окружил город горной цепью. Так появились Горы Архимага и [[Казакия]].\n\nНи разведки королевств, ни сами маги не нашли о нём ни одного упоминания до 333 года. Править он не стал: заперся в башне на месте собора и передал всё Совету Магистров. Вживую его видели немногие.\n\nЕму приписывают главный принцип Ассоциации: маг не должен служить своей силе.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Правители нашего дня", "kind": "character", "order": 1, "role": "Основатель Казакии", "status": "Затворник", "summary": "Маг, который за один день поднял горы вокруг Священного Города и остановил армию без боя.", "title": "Архимаг Казакион", "updatedAt": 1793633557135, "updatedBy": null}, "urgas": {"aliases": ["орки", "гоблины", "огры", "кобольды", "зеленокровные"], "body": "Их называют гоблиноидами и зеленокожими, хотя кожа у многих серая или бурая. Общее у всех — тёмно-зелёная кровь и общее происхождение: эксперименты Белого Святилища Анурианской Империи, создавшие расу рабов и солдат. Империя пала и была дважды забыта, а рабы пережили хозяев. Взрослеют все ург'ас быстрее людей.\n\n## Орки\nСредний рост около 235 см. Выведены для войны, и боевые навыки у них в инстинктах: «нонкомбатант» орк может одолеть обученного человеческого бойца. Кожа прочнее иных доспехов. Командиры считают одного орка за десятерых людей. Глупыми их считают зря, но любое занятие кроме войны даётся им тяжело. Те, кто преодолел инстинкт, часто становятся шаманами.\n\n## Гоблины\nСамые многочисленные. Слабые поодиночке, но прирождённые эмпаты: гоблин из племени в тысячу помнит каждого по имени. Если вырастить гоблина среди людей, он подстроится под них. В Подземье живут кобольды, чёрные гоблины, крупнее и злее.\n\n## Огры\nВеликаны около трёх с половиной метров, ближе к великим з
