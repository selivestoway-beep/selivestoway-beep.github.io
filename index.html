легкое раздражение.\n\n— Обижаешь. На любимые владения моего дорогого брата нападает коварный враг - где я, по-твоему, должен находиться?\n\n— И?\n\n— Что \"и\"?\n\n— Что \"что и\"? Меня, обычно, интересуют правдивые ответы.\n\nШироко улыбнувшись, Таулендин Аманетил взглянул Азериану прямо в глаза.\n\n— Наверное, начать следует с поздравлений.\n\nБеседа длилась долго: к тому моменту, когда братья закончили говорить, объединенные войска из трехтысячного войска Изумрудных Всадников и двухсотенного гарнизона Тейрн-Арагонда закончили как с основной армией противника, так и тайным отрядом, что, как оказалось, планировал под шумок пробраться вглубь эльфийских владений. Позднее отметят, что проделанное этими разведчиками расстояние - одно из рекордных, на которые когда-либо заходили анурианские солдаты в Вечное Царство.\n\nОднако, беседа, что шла в покоях Азериана, была многим важнее любых подобных баталий.\n\n— Так значит, приказ снят?\n\n— Более чем. Назначишь следующего правителя - и можешь делать что хочешь. Приятно, правда?\n\n— Приятно. И оттого верится с трудом. Данахир бы никогда...\n\n— Эй, братец, повежливее. По крайней мере \"царственный отец Данахир\".\n\n— Да-да. Так вот, он бы...\n\n— О мертвых, знаешь ли, либо хорошо, либо никак. — Словно не услышав слов Азериана, закончил его брат.\n\nНа какое-то время - с того мига, как маг осознал смысл этих слов, повисло молчание.\n\n—... Что?\n\n— Я сказал что сказал, братец. — Пожал плечами Таулендин. — Наш царственный отец Данахир ур-Аманетил - и знай, печаль разрывает моё сердце, когда я говорю эти слова - ушел из жизни.\n\nМаг выдохнул.\n\n— И?\n\n— Что \"и\"?\n\n— Не будем повторяться, Таулендин. Он - ур. Очевидно, если кому и гарантировано возрождение, то это кому-то вроде нашего отца.\n\nПрактически не дослушав, его собеседник резко поднял палец вверх и покачал головой. Жесты практически не изменились - но отчего-то Азериану показалось, что лишь сейчас он по-настоящему помрачнел.\n\n— Ты не понимаешь. Он... не просто умер. Никто из Певцов не может обнаружить даже следа его души. Пока есть лишь одно объяснение - его душа не вернулась к Древу.\n\n— Бред, и ты это знаешь. Либо он жив, либо плохо искали.\n\n— Знаю, знаю, но я уверен в своих словах. И меня это удивляет не меньше твоего.\n\n— Меня это вовсе не \"удивляет\", брат. Это попросту невозможно - никогда не случалось такого, чтобы душа не достигала чертогов Древа.\n\n— И все же случилось - со времени его гибели на Анурианской Войне прошло уже слишком долго, чтобы мыслить иначе. И здесь... — на этих словах эльф ткнул мага в плечо — так скажем, на этом моменте, когда кое-кто объяснял мне эту же суть дела, я вспомнил про тебя.\n\nНе ответив, Азериан скептически приподнял бровь.\n\n— Видишь ли, волей нового ур-Аманетила, ты свободен, а твой небольшой... проступок...\n\n— Который, я напомню, был полностью оправдан.\n\n— Несомненно. — отмахнулся Таулендин. — Так вот, он прощен. А вот насчет анурианского искусства... Как бы тебе сказать...\n\n— Для начала - постаравшись не ранить моё хрупкое сердце.\n\n— В таком случае добытые тобой сведения Лестрендор использует максимально разумно и с пользой.\n\n— Новым уром выбрали Лестрендора!? — Едва ли не выкрикнул Азериан: в глазах его читалась жгучая смесь неверия и возмущения - и, если бы он присмотрелся, нотку понимания он смог бы найти и в братском взгляде. — Этого... не важно. А теперь скажи правду.\n\n— Он боится этих сил и считает их искажением порядка Древа - но... Кое-кто - один загадочный, харизматичный, удивительный незнакомец - сумел уговорить его изменить свое мнение... если единственный практик этого искусства кое-что сделает.\n\n— Дай-ка угадаю....\n\n— Не дам. — Перебил он Азериана. — Мы отправляемся в Орн-Аманетил, и оттуда ты начнешь расследование того, как то, что недавно случилось - случилось. Преуспеешь - ура Первому Чародею Адон-Тирлейдда. Провалишься... все останется, как есть. Итак, ты едешь со мной или да?\n\nНикогда в своей жизни Азериан не думал, что будет колебаться, коль дело дойдет до ухода из Тейрн-Арагонда. Он и не колебался: в течение часа не успевший даже осознать происходящее Толдир был вознесен до нового правителя крепости и долины Арагонд. И, уже к концу этого часа, двое эльфов стояли на пороге тропы, раскрывающейся Песнью Таулендина.\n\n— Напомни-ка еще раз... — Задумчиво произнес Азериан, делая первый шаг в промежуточное измерение, — А почему тебя-то эта ситуация так сильно волнует? В последнюю нашу встречу ты едва ли не разорвал все связи с остальными и планировал основать собственный Малый Дом...\n\n— Причины. — Развел руками Певец.\n\n— Что \"причины\"?\n\n— Они есть. — Покачал он головой и быстро перевел тему — Ты мне лучше скажи - я, конечно, все понимаю насчет инцидента с... добровольно-принудительным уходом на этот край света, но почему тебе так всё равно? Данахир умер, а тебя здесь явно интересует лишь узаконить свою магию да разобраться в странном событии.\n\n— А почему тебе? Ты скорее умрешь, чем поможешь Лестрендору, и уж точно не отправился бы возвращать душу отца, разве что... — Задумавшись на мгновенье, чародей удивленно раскрыл глаза, уставившись на беловолосого — Брат, неужели ты...?\n\n— Азериан... — Прервал его Таулендин.\n\n— Что?\n\n— Я скучал.\n\n## Глава 3\n\n— Вирм на пять тир. Огненное дыхание... одиннадцать, неплохо! Но что ответит на это лучший полководец Вечной Земли?\n\n— Очевидно, скомандую бойцам поднять щиты, а лучники, тем временем...\n\n— А лучников я сжег, забыл?\n\n— Вот как.\n\n— Вот так.\n\nАзериан смотрел на доску для шатрата с едва скрываемой неприязнью. В отличие от эльфийских игр, представлявших собой чистое соревнование интеллекта, эта имперская новоделка отличалась ключевой деталью: результат броска двух шестигранных костей здесь определял исход практически любого действия.\n\nИ если, впервые встретив эту игру на Эстренлейде, эта особенность показалась ему интересным нововведением, сейчас, когда пятая стратегия - без лишнего хвастовства, неплохая - рушилась из-за неудачных бросков, по старым и приевшимся когда-то играм он начинал скучать.\n\nДаже обвинить брата в жульничестве не получалось: не потому что Азериан был уверен в его честности, вовсе нет - тот точно хитрил. Он просто не мог пока понять, каким именно образом, и эта задача была для него гораздо интереснее самого сражения.\n\n— Между прочим, если задуматься, то ты совершенно не понимаешь суть игры.\n\n— Напротив, я прекрасно её понял. В первую очередь то, что она идиотская. Совершенно не отражает реальность. Все зависит от броска костей.\n\n— Я попрошу! — Усмехнулся Таулендин, — Шатрат, пусть и придуман чешуйчатыми, отражает суть дела куда как лучше наших игр. Стратегия, тактика, хитрые планы - это все, конечно, прекрасно, и определяет многое. Но, в конце-концов, исход решает чистая удача: хитрейший план распадается из-за совершенно неожиданных мелочей. И срабатывает, если задуматься, по тем же причинам.\n\n— Мхм. Вот только эти \"мелочи\" определяет не бросок костей и случай, а цепочка точно таких же событий. Предскажи их, повлияй на них заранее, и твоя победа практически гарантирована. Конечно же, в масштабе сражения ты это не покажешь ни в одной игре. Потому, если задуматься, все они идиотские.\n\n— Хм... может и так.\n\nАзериан уставился на брата неверящим взглядом — таким, словно бы тот только что нарушил некий закон самого мироздания. Таулендин поднял бровь в негласном вопросе.\n\n— Ты упустишь шанс ввязаться в бесполезный спор? Заболел?\n\nПринц добродушно рассмеялся.\n\n— Нет, мы просто приехали.\n\nСквозь проём окна кареты впервые за долгие часы виднелось не море деревьев, а белокаменные шпили, пронзающие золотистую дымку рассвета. Орн-Аманетил.\n\nАзериан не мог сказать, что он скучал по родовой столице в частности: скорее, по любому месту, которое не являлось Арагондом. И все же, он не мог не улыбнуться, взглянув из окна на приближающийся Город Воды.\n\nОправдывая его второе название, часть сего города располагалась прямо на огромном озере — оформленные и поднятые на поверхность Песнью каменные здания усеивали воды. Не новшество даже в Империи, повторившей многие чудеса мира своими чарами. Чего они повторить не смогли, так это настоящей особенности града.\n\nПодъезжая к дворцовой площади, карета двигалась не по дороге — сама водная гладь уподоблялась тверди под колесами кареты и копытами славных оленей. Остальные жители города не были исключением: все улицы Орн-Аманетила, по сути, были уплотнившейся водой.\n\nМаг находил это ужасно неудобным.\n\n— Но эффектность ты отрицать не можешь.\n\n— Не могу. — Ответил Азериан без раздумий. — Красиво.\n\nТаулендин довольно улыбнулся. С большой гордостью он относил себя к тем двум эльфам, чьим ушам было дозволено услышать столь редкие моменты честности. Тем временем, карета остановилась пред высоким дворцом с куполообразной крышей: ряд статуй пред величественными воротами изображал прославленных Уров Дома с левой стороны, и прекрасных ундин с правой, символизируя древние ковенанты.\n\n\"Да здравствуют вернувшиеся принцы!\"\n\nХор нескольких десятков дворцовых солдат и слуг раздался снаружи. Улыбка сползла с лица Таулендина в одночасье, сменившись задумчивой миной.\n\n— Удивительно. Едва ли я предупреждал кого-то о своем возвращении...\n\nОн открыл дверь - и лучезарная улыбка вернулась на его лицо быстрее, чем иной успел бы моргнуть.\n\nА потом он увидел, кто стоит впереди стражи. Практически неуловимую разницу между отработанной столетиями маской, сменившейся искренней, настоящей теплотой, мог отличить только сидевший рядом брат.\n\n— Элана, свет очей моих! — Воскликнул он, раскинув руки в стороны, — Воистину, я не мог и мечтать, что Древо благословит наше возвращение подобным приемом.\n\nАзериан едва заметно улыбнулся и, тут же скрыв это недоразумение, вылез вслед за братом.\n\n— Ты шутишь ради красоты слов, милый брат, но сам не знаешь, как близок к правде: его песнь вошла в резонанс с моею, поведала о вашем скором визите. Я скучала. По тебе, Азериан, вдвойне.\n\nСребровласая эльфийка, ступавшая босыми ногами по затвердевшей воде, была младшей не только из их троицы, но и всего многочисленного потомства Данахира: как маг припоминал, не иначе как два месяца назад ей должно было исполниться сто восемьдесят. Удобная мантия голубых тонов и изогнутый клинок на поясе выдавали в ней Певицу Меча, а достаточно короткая прическа с небольшой косичкой сбоку подходила скорее воину, чем жрице Древа.\n\n— Обидно. Несмотря на его ссылку, с тобой мы не виделись дольше. — С наигранной досадой протянул старший из Аманетилов.\n\n— Я тоже рад тебя видеть. — Азериан кивнул. — Не успел соскучиться, но рад всё равно. Нужно ли было собирать всю эту толпу?\n\nЭлана улыбнулась одними лишь уголками губ.\n\n— Эта \"толпа\" собрала себя сама. Весть о приказе Лестрендора и твоем возвращении разлетелась быстро.\n\nОна сделала паузу.\n\n— А ещё я хотела, чтобы ты понял: тебя здесь ждали.\n\nВпрочем, кем ты ни были те, кто, по словам Эланы, ждали Азериана, им об этом сообщить точно забыли. Либо, по крайней мере, не уточнили, с какими его нужно ждать эмоциями.\n\nНе раз и не два Азериан, идя по роскошным садам, ловил на себе мрачные взгляды проходящих мимо членов Дома: старые советники Ура, помнящие его эдикт; молодые воины и жрецы, верящие слухам. Недоверие, недоумение, явно не самый положительный интерес: всё это, учитывая его репутацию, было ожидаемо.\n\nС другой же стороны - кто сказал, что сейчас магу было до этого дело?\n\nГоворят, вечность для эльфа - не срок. Неспешно идя вместе с родней, беседуя обо всем и ни о чем одновременно, он задумался о правоте этого выражения. Казалось, не было ни этой проклятой ссылки, ни восьми злополучных лет до нее: казалось, схожую беседу они вели двадцать, тридцать, пятьдесят, сотню лет тому назад. Эту теплую цикличность нельзя было назвать неприятной.\n\nК тому моменту как каменные врата раскрылись пред ними, троица успела обсудить многое: ссылку Азериана и его злоключения, участие Таулендина в Анурианской Войне, обучение Эланы и ее путь меча. Лишь одна тема и одно имя не затрагивалась никем из них: каждый знал, что одно лишь упоминание Данахира положит конец этому моменту.\n\nИ все же, конец приходит всему.\n\n— Ох, мои дорогие братья. Сестра.\n\nСидевший на резном троне мужчина мягко улыбнулся. Его голос, как всегда, сохранял нотки легкой, мирной отстраненности. Задумавшись немного, Азериан осознал, что ни разу не слышал Лестрендора говорящим громче такого голоса.\n\n— Вы двое добрались быстро? Без происшествий на пути?\n\nТекущий Ур-Аманетил, сидящий в окружении четверых высших советников и двух рыцарей, был особенным эльфом. Можно даже сказать, уникальным. По крайней мере, ни разу больше за все свои двести девяносто шесть лет Азериану не доводилось видеть... по самой мягкой мере, упитанного эльфа. Либо встретить еще одного из них, чье имя маг был бы вынужден запомнить.\n\n— Без единой помехи, дражайший брат, мы добрались в скорейший срок. — Поклонился Таулендин, скорее театрального жеста ради, чем в знак уважения. Кто-то в зале одобрительно усмехнулся, кто-то, напротив, зашептал о наглости: так или иначе, а равнодушных к себе эта персона не оставляла.\n\n— Ох, это ведь прекрасно. И насчет положения дел...\n\n— Я узнал все необходимое от Таулендина. Мои соболезнования и благодарность.\n\nАзериан не желал тратить слишком много времени на то, что уже было обговорено. Особенно здесь и сейчас. Одной фразой он решил как посочувствовать о смерти отца, так и поблагодарить за отмену его решения: в конечном счете, значения не имел ни один из этих жестов.\n\n— И...\n\n— О благочестивый Ур, не изволь беспокоиться. — Отвечал Таулендин, угадав следующие слова Лестрендора в тот же миг. — Я передал брату твое сердечное предложение и получил ожидаемый ответ. Стоит нам закончить с формальностями, и я посвящу его во все необходимые детали. А заодно и покажу временные покои.\n\n— Ох, чудно... Тогда...\n\n— Да не иссякнет благодать Древа, дражайший брат!\n\nВновь Таулендин поклонился, и тот же поклон, следуя ритуалу, повторили двое его спутников. Не нарушив ни одно из сотен правил и рекомендаций этикета, они удалились в направлении жилого крыла.\n\n— Но ведь я хотел пригласить их на ужин... Как думаешь, Ахалан, брат и это понял?\n\n— Без всякого сомнения, мой повелитель.\n\n— Ох... Чудно....\n\n## Глава 4\n\nВстреча, от которой Азериан ожидал многим худшего - и многим большего в плане затраченного времени - пролетела за считанные мгновенья. И сейчас, идея по широкому коридору, обставленному искусственно-выращенными деревьями, он с некоторой благодарностью смотрел на виновника этого случая.\n\n— Живое доказательство тому, что \"Ур\" - это просто красивая приставка. Ничуть не изменился. — Маг вынес свой вердикт, едва ли заботясь о том, услышат ли его лишние уши. Не тот жест, который Таулендин мог оценить, но и не тот, которого он не ожидал. Не ругать же ветер за то что тот дует?\n\n— Ты излишне жесток. Он...\n\nЖрица замялась, пытаясь подобрать контраргумент.\n\n— Стал ответственней? Похудел немного?\n\n— Дорогая сестрица, ты спрашиваешь или стремишься нам это сообщить?\n\nОставив эту ремарку без комментариев, эльфийка, склонив голову вбок, ответила вопросом на вопрос.\n\n— Вы забыли что-то в гостевом крыле?\n\nАзериан огляделся по сторонам. И верно. Сейчас, за очередным поворотом, открывалось ответвление на первом этаже: роскошный внутренний дворик с висящим садом; украшенные двери, ведущие в лучшие из покоев... из гостевых покоев.\n\n— Мы? Нет, вовсе нет. — Покачал головой Таулендин. — Мы здесь разве что кое-что найдем. А вот дворцовый управляющий явно забыл о том, кого именно и где конкретно он решил разместить.\n\nПроизнесены эти слова были самым дружелюбным и жизнерадостным тоном из возможных, но отчего-то управляющему Азериан явно не завидовал. Не то чтобы маг завидовал кому-либо из живущих, но ему - в особенности.\n\n— Не волнуйся, братец, я вмиг исправлю этот недосмотр. В худшем случае, этот миг затянется на пару-тройку дней, пока идет реновация Восточной Башни.\n\n— Можешь не торопиться, я не привередлив.\n\n— Блеск! В таком случае, коль вы не возражаете, я уделю свое внимание чуть менее важным вещам. Загляну в свои покои; объясню Лестрендору, что ты занят важной подготовкой и не сможешь прийти на ужин, хотя, без сомнения, очень хотел бы; устрою несколько важных встреч...\n\n— С кем же? — Азериан приподнял бровь. Насчет прочего у него возражений не было: напротив, стоило в очередной раз похвалить навык Таулендина без слов угадывать его решения.\n\n— С теми, кто должен знать, что я вернулся. И с теми, кто хотел бы, чтобы я подольше не возвращался.\n\n— Разве не разумно предположить, дорогой брат, что последние не желали бы тебя видеть?\n\n— И именно потому я собираюсь их навестить!\n\nСтарший из троицы Аманетилов удалился бодрой походкой, оставляя брата с сестрой обживаться во временных покоях.\n\n\"Обжиться в покоях\" не заняло много времени. Имея привычку не иметь больше, чем удобно носить с собой, маг получил ключ от гостевых покоев, запомнил их примерное расположение и... на это, собственно, весь процесс и закончился.\n\n— С возвращением. Теперь, думаю, это точно уместно.\n\nАзериан кивнул, улыбнувшись.\n\n— Спасибо. Воистину, я полагал что этот момент настанет еще через пару десятилетий, зная отца. В каком-то смысле, мне на редкость...\n\nОн осекся, не закончив фразу. По укоризненному взгляду сестры можно было понять, что этим его мыслям лучше остаться невысказанными.\n\nПожалуй, он слишком привык к их с Таулендином перспективе.\n\n— Прости. Ты, предположу, собираешься на вечернюю церемонию?\n\n— О чем ты, дорогой брат? Ты, верно, помнишь - до нее еще пара часов.\n\n— Безусловно.\n\nКонечно же, того маг не помнил. Хотя одной из его обязанностей в Тейрн-Арагонде было проведение утреннего и вечернего восславлений, за все десять лет он не свершал их ни разу. Солдаты, честности ради, отчего-то не спешили напоминать, и так было заключено очередное молчаливое соглашение. Что сказать, окрестные регионы не славились той же высокой духовностью, что и центральные земли.\n\nБудь его воля, Древо бы восхваляли раз в полгода - основной световой цикл Адон-Тирлейдда, а не каждый раз, когда ветви соизволят потускнеть и засветиться вновь. Только после удобных, двадцатичетырехчасовых суток Эстренлейда он осознал, насколько по-идиотски все устроено в Вечных Землях.\n\n— Так или иначе... церемонию все еще проводят на Коралловой Площади?\n\n— Разумеется.\n\n— Проводить? Прибудем незадолго до начала.\n\nЭлана удивленно вскинула брови.\n\n— Неужели ты решил поучаствовать? Арагонд явно пошел на пользу твоей душе, дорогой брат.\n\nПоследние слова, никак не отличаясь тоном, конечно же, были просто беззлобным уколом.\n\n— *Проводить*. Участвовать вместе с тобой я не предлагал. Не найду занятий получше - посмотрю со стороны.\n\nЖрица не стала спорить. Иного ответа она все равно не могла и представить: петь Азериан не умел совершенно. Оставив позади гостевые покои, они неспешно направились на выход.\n\nИх путь пролегал по высоким дворцовым стенам: не самый быстрый маршрут, но один из самых красивых, без сомнения. С одной стороны открывался прекрасный вид на Город Озера, а с другой - его берега, изумрудные леса с редкими кристаллическими шпилями, и высокие, покрытые редкими деревьями горы вдали. Золотистый свет колоссальных ветвей, раскинувшихся над долиной, медленно тускнел: довольно скоро, в Адон-Тирлейдде настанут обе ночи: полярная и древесная.\n\n— Вопрос. — Прервал внезапно их молчаливое шествие маг. — Почему ты все еще здесь?\n\n— Ха? Это... странный вопрос, не находишь?\n\n— Уточню. Не в этой конкретной ситуации, сейчас в город, наверное, съехалась большая часть всех Аманетилов., \"Здесь\" вообще. Меч, Песнь - обе эти вещи ты планировала применять в чуть менее далеком захолустье.\n\nОна задумчиво вгляделась в небеса.\n\n— Я не думаю, что Орн-Аманетил можно назвать захолустьем...\n\n— И в итоге?\n\n— Я всё еще планирую. Ты можешь смотреть на это как хочешь и сколько угодно скептично вздыхать, но, всё еще, в моих планах получить право основать Малый Дом.\n\nАзериан, пользуясь разрешением, скептично вздохнул.\n\n— Просто... Один мой план провалился.\n\n— Что-то достойное Таулендина?\n\n— Нет, Древо упаси! — рассмеялась та, — Я просто задумалась... Легче всего получить такое право на Войне, не так ли?\n\n— Ага. И репутация будет соответствующая: еще один Дом, родившийся в бесполезной войне, которая идет в никуда. Тридцатый? Пятидесятый? Я не считаю. Полезным бы чем занялась. Если кто-нибудь когда-нибудь победит Империю, это будем не мы... и, вероятно, никто другой, кроме самой Империи.\n\n— По-твоему, защищать границы вообще не нужно? Благословления Древа щедры и многочисленны, но они не сделают ничего за нас.\n\n— Не буду спорить. Так что у тебя был за план?\n\n— Чрез наши земли проходил Мелек, мастер меча. И, кажется, был совершенно не против взять себе ученика... Сам понимаешь, что можно сделать с такими навыками.\n\n— О. Кажется, из Древнейших? И что?\n\n— Догадаешься, раз я еще здесь?\n\n— Кому-то повезло больше?\n\n— Какому-то мальчишке вдвое младше меня. Тебе интересно?\n\n— Нет. Твой следующий план?\n\n— Я... обдумываю этот вопрос.\n\n— Вот как.\n\nОстаток пути они шли молча.\n\nИскомая ими площадь была, по мнению многих, одним из красивейших мест одного из красивейших городов. Здесь, в центре круглого участка в пять эке (~90м) радиусом, возвышалось одно из Малых Древ - благословленных потомков Вечности, дарующих великую благодать любому месту, в котором находятся. Азериан как-то открыл для себя, что таких на всем континенте существует всего восемь, три из них - в родовых столицах.\n\nСамо собой разумеется, что священные церемонии будут проводить именно в подобных местах.\n\nПри всем своем скептицизме насчет любых вопросов духовности, смотря на вечернее восславление с высоты внешней стены, с одним Азериан должен был согласиться. Это звучало красиво.\n\nИ выглядело, честности ради, тоже: более тысячи эльфов, многие из которых посвятили себя пути Древа, Пели на площади, оживляя сумерки искрами естественной, мировой магии. Вода вокруг них принимала образы мистических существ, и духи глубин, над которыми стоял город, вселялись в высокие мраморные статуи, напоминающие кораллы: от того те загорались прекрасными огнями.\n\nЭтот процесс никогда не длился долго: лишь краткий миг перехода между циклами. Волшебный миг, лишь более красивый своею мимолетностью.\n\nАзериан наблюдал за церемонией тысячи раз. Именно потому, даже не имя никаких сил к Песни, он мог отметить, что Песнь многих в сей раз колебалась. Вызвала ли то гибель Данахира, или же её последствия? Нечто совершенно иное? Элана обладала экстраординарными способностями чувствовать подобные колебания - завтра, к началу расследования, её нужно будет расспросить. Хотя она, вероятно, всё скажет сама.\n\n— Прошу прощения? Имею ли я честь говорить с Азерианом Аманетилом?\n\nМаг отвлекся от зрелища, нахмурившись. Жест недовольства и удивления в равной мере: он полагал себя единственным склонным смотреть на такое издалека.\n\n— Имеешь. — Коротко ответил он, поворачиваясь к собеседнику. Высокий эльф с короткими волосами слоновой кости стоял неподалеку, опираясь на резные бортики стены. Изумрудная тога на серебристой тунике, церемониальный скипетр из бледного дерева - Азериан мог поклясться, что где-то видел этого эльфа. Мог бы, но не стал: у него была никудышная память на лица.\n\n— Прекрасно. Вероятно, первее всего мне следует выразить мои соболезнования. Смерть Данахира - великая утрата. Не всё любили прошлого Ура, но уважал - каждый.\n\n— Не следует. Я не поклонник ритуализированных формальностей.\n\n— Это приятно слышать. — Ничуть не изменился в лице и тоне собеседник. — Ахалан ан Аманетил. Верховный советник текущего Ура.\n\n— Моё имя ты знаешь.\n\n— Знаю, конечно же знаю. О нем сейчас только и говорят.\n\nМаг устало выдохнул. Вот оно что.\n\n— Знаешь, за сегодняшний день я наслушался этого вдоволь. Планируешь обвинить меня в шпионаже, предательстве, назвать чешуйчатым колдуном или что-то вроде - вперед, но встань в очередь до завтра. Утром ты будешь первым.\n\nАхалан тихо рассмеялся, качая головой.\n\n— Нет-нет, боюсь, эту очередь предстоит занять кому-то другому. Я не испытываю к вам неприязни или недоверия - по крайней мере, не по этой причине. Напротив, ваше взаимодействие с Империей принесло огромную пользу нашим воином. Понимание того, что может вражеское колдовство, каким законам подчиняется... Это дало нам многое.\n\n— Вот как.\n\n— Без сомнения.\n\n— Тогда, вопрос. Ахалан, зачем ты пришел ко мне подлизываться? Чего надеешься получить?\n\n— Не совсем точный выбор слов. В данный момент я проявляю элементарную вежливость и стараюсь расположить к себе того, с кем мне предстоит активно взаимодействовать.\n\n— А тебе предстоит?\n\n— Воистину. Вы же собираетесь расследовать гибель прошлого Ура, не так ли? Что бы ни стало причиной *окончательной смерти* одного из адонари, я, как преданный служитель Великого Дома, должен узнать истину.\n\n— Я полагал, мои \"помощники\" уже определены.\n\n— О, на эту роль я не претендую. Не могу похвастаться ни полезными для следователя качествами, ни свободным временем.\n\n— Тогда, напомни, зачем ты мне нужен?\n\n— Если вам понадобится информация, я её предоставлю. Если вам потребуется куда-то попасть или с кем-то встретиться - я помогу это устроить. Если потребуются бойцы или компоненты для ваших... методов - они у вас будут. Всё от имени Ура.\n\n— Солидно. А разве с этим мне не должен помогать сам Ур?\n\n— Вы имеете в виду благочестивого господина Лестрендора ур-Аманетила?\n\nОба посмотрели друг на друга с пол-минуты. Следы до ужаса похожей улыбки промелькнули на лицах обоих.\n\n— До завтра, Ахалан.\n\n— Доброй ночи, мастер Азериан.\n\n## Глава 5\n\n*Продолжение следует…*", "aliases": ["Азериан", "Азериан Аманетил"], "order": 1, "epigraph": "", "epigraphBy": "", "image": "", "caption": "", "createdAt": 1793641859264, "updatedAt": 1793641859264, "updatedBy": null}, "vstrecha-i-proshchanie": {"title": "Встреча и Прощание", "category": "Сказания", "summary": "Две сцены: годдха, нашедшая не тот разум, и последний разговор Бенедикта Прокула Элегии с Конрадом Селекафом.", "body": "## Случайная Встреча\n\nСоздание ползло. С самого рождения не слышавшее шелеста листвы и не видевшее солнечного света, оно было лишено многих ощущений, принимаемых человеком за должное. Возможно, спадись застилающая их глаза завеса ненависти, в их сердцах промелькнуло бы что-то похожее на жалость.\n\nОсобь испытывала жалость к самой себе. Мир существа — темный, холодный, подобный ЕГО глубокому морю — был всем, что оно чувствовало, но с самого рождения оно помнило отблески чего-то большего. Была ли это его собственная память? Память Старшего Мозга? Ощущения собратьев? Оно не могло сказать. У него не было времени об этом думать.\n\nСреди этого темного моря, только существо его рода могло увидеть бесчисленные, разноцветные огни. Наполненные надеждой и отчаяньем, страхом и молчаливой решимостью, болью и грустью... Люди. Рожденное влиять на их умы, создание понимало людей. Понимало их так, как не понимали друг друга даже их ближайшие соратники.\n\nВозможно, оно хотело бы присоединиться к ним. Стать одним из бесчисленных огней, горящих против общей угрозы.\n\nПеснь давала ему такой шанс. О, прекрасная Песнь! Разделить её с кем-то из них — смысл его жизни и предел мечтаний. Они будут учиться друг у друга, ради прекрасной эры.\n\nОдин из шатров не был укреплен, в нем не горели отпугивающие благовония. Прекрасно. Создание юркнуло внутрь, незамеченное никем из засидевшихся допоздна солдат.\n\nБлизко, так близко! Проползя по холодной земле, оно оказалось близ одного из огней. Этот был достаточно тусклым, приглушенным — огонь, кажется, глубоко и удивительно безмятежно спал. Ничего. Они успеют познакомиться, когда он проснется.\n\nГоддха ловко проползла по теплой оболочке огня. Оно не могло увидеть, что представляла из себя оболочка — его лицо, возраст, цвет одежд, в которые тот кутался от холода. Все это годдхе только предстояло узнать, когда с ней поделятся зрением, но найти проход к огню было нетрудно: Песнь подсказывала всё, что нужно было знать. И вот, проход найден. Тепло окружило особь. И до огня можно было просто докоснуться... Конечно же, оно начало слияние в тот же миг. Зачем медлить?\n\nГоддха присоединилась к мозгу, становясь почти неотъемлемой его частью. Ощущения огня — всё то, чего оно было лишено — хлынули в маленькое сознание, впуская свет в темное море. Запахи лагеря, оглушительный храп соседей по шатру, треск костров за его пределами, непривычный стук собственного сердца. Как чудесно! Глубже! С кем же особи довелось повстречаться?\n\nГраница между телами расплывалась, и разум были следующим. Его ментальное влияние скользило внутрь, сквозь поверхностные мысли и то, что должно было быть фрагментами снов.\n\nНо огонь не видел сна. Создание удивилось. Опыт Песни подсказывал, что что-то не так, но это не могло остановить любопытства. Годдха ползла глубже. Мысли окружали особь. Говорили разными голосами, общаясь друг с другом. Почему? Опыт Песни подсказывал, что так быть не должно. Неужели огонь... уже был частью Песни, но чуждой ЕМУ?\n\nВнимание Старшего Мозга не могло это проигнорировать. Создание почувствовало еще одно прикосновение — материнское, ласковое касание. И в этот момент огонь разгорелся.\n\n— Ах, так вот как это должно ощущаться?\n\nОгонь говорил уверенными, довольными голосами. Существу было приятно чувствовать чужую радость, но это чувство чем-то отличалось. Материнское присутствие за его спиной напряглось. Годдха не знала, чего здесь бояться, но от этого факта ей стало как-то очень не по себе. Наверное, Старший Мозг просто чего-то не понял. Или Мать, говорящая с ним.\n\nГоддха искренне попыталась успокоить их. Прежде чем огонь сказал что-то еще, она ускорила слияние.\n\nНо там, где должен был быть \"центр\" огня, начинался другой. За ним — еще один, и еще. На мгновенье особи показалось, что она вновь ползет по лагерю людей: ее окружало необъятное темное море.\n\nИ все огни в нем горели одним цветом.\n\nГоддха повернулась назад, стремясь что-то уточнить. Но материнское присутствие уже исчезло, прежде чем чужеродный огонь сумел коснуться его.\n\n— Жаль. Теперь это бесполезно.\n\nПрежде чем Идея Крови уничтожила тельце особи, впервые в жизни она почувствовала свой собственный страх.\n\n## Прощание\n\nБенедикт внезапно расхохотался. Среди тех немногих, кто знал настоящее существо за сотнями человеческих масок, никто не удивился бы подобному: вампир нередко позволял основному телу реагировать на события, происходившие за тысячу лиг от него.\n\nСейчас основным телом был молодой, среброволосый выходец из Ринны, облаченный в роскошную, свободную мантию. Будучи фактическим правителем Города в Центре Мира, он мог позволить себе жить на широкую ногу.\n\n— Что-то стоящее?\n\nЕго собеседник, сидевший у камина в кресле напротив, приподнял бровь, в его глубоком голосе проскользнула нотка любопытства. Опрятно выглядящего мужчину средних лет, больше напоминающего обитателя Союзных Королевств, выделял разве что старый шрам у левого глаза и странный костюм с длинным пальто. Бенедикт мог поклясться, что ни одно его тело в западных землях ни разу не видело таких одежд.\n\n— Нет, едва ли. — покачал головой риннец. — Наверное, так мне её все же не выловить.\n\n— Я не так уж удивлен. Верховной жрице, кажется, хватает мастерства и осторожности. К тому же, ты склонен действовать излишне грубо.\n\nБенедикт скорчил недовольную гримасу — скорее для вида. Ему, откровенно говоря, не было дела до того, провалился он или преуспел. Повернувшись в кресле, тот перевел взгляд на одну из двух слуг и приказал отправиться за второй бутылкой вина. Обойтись можно было бы и без слов: в этот момент правитель Сасая говорил с самим собой.\n\n— Грубо, мягко... я мог бы постараться, если бы в этом был хоть какой-то смысл. Но, ты говоришь, в этом нет нужды?\n\n— Да, и это последняя моя просьба. Я хочу, чтобы все твои глаза смотрели в сторону Шпиля.\n\n— Скучно.\n\n— Большая часть. Не смею мешать тебе подглядывать за миром, но до самого конца держи свои боевые оболочки здесь, в городе.\n\n— А когда Шпиль будет достроен, и война на Западе закончится?\n\n— Делай что пожелаешь.\n\nВсе три оболочки одновременно уставились на мужчину, почти синхронно похлопав глазами. Вампир знал, сколь многое значила эта фраза из уст его собеседника. Основное тело расплылось в неуверенной, но хищной улыбке.\n\n— Ты уверен? А если я, к примеру, решу поубивать твоих любимчиков еще на подходе к Шпилю?\n\n— Твой выбор. — Мужчина оставался совершенно невозмутим. — Если дискуссия не состоится, она не имела смысла с самого начала. Тогда Желание останется твоим собственным, если ты решишь его загадать.\n\nВампир махнул рукой и лениво поднялся с кресла. Почти двести лет с их последней встречи, и вывести этого человека из равновесия у него все еще не получалось. Риннец подошел к приоткрытому окну. Вечерний Сасай, раскинувшийся почти на весь полуостров, дышал жизнью. Прикрыв глаза, Бенедикт мог бы почувствовать десятки себя, живущие вместе с городом.\n\nВдалеке, на одиноком островке среди залива, недостроенный Шпиль почти достиг облаков.\n\n— А в этом будет великий смысл? Думаешь, мой друг, я не заметил, **что** ты посадил в центральную конструкцию? — в голосе вампира не было слышно ни угрозы, ни обвинения.\n\n— \"Кого\", возможно. — мужчина ухмыльнулся. — Иные говорят, что даже у созданий Шифра есть душа.\n\n— Шифра?\n\n— Забудь. Я не знаю, станет ли Нихилос твоим врагом и, честно, меня это не интересует. Но Желание действительно. Я даю тебе свое слово.\n\nБенедикт кивнул, не оборачиваясь. Сомневаться у него не было повода.\n\n— Тогда... дальше все известно. Не останешься подождать финала здесь, в Сасае? Тут скучно, знаешь ли. С тобой будет немного веселее.\n\n— Нет. Когда я завершу все дела, мне придется временно покинуть Термину. С недавних пор моего общества очень активно ищет один старый друг, но время для встречи еще не пришло.\n\n— Всего-то? Я могу его убить, если хочешь.\n\n— Нет. — его собеседник позволил себе снисходительную улыбку. \"Не сможешь\" — достроил Бенедикт в тот же миг. Эту мысль он встретил с интересом и раздражением в равной мере.\n\n— Ладно... Значит, это последняя наша встреча?\n\n— С большой вероятностью.\n\nТишина повисла в зале на несколько долгих минут. Лишь одна из служанок вновь наполнила оба бокала.\n\n— Наверное, здесь мне стоит расплакаться. Но обойдемся без сантиментов. Раз ты уходишь... уезжаешь? Улетаешь? Не важно, я рассчитываю на аванс.\n\n— Аванс?\n\n— Или ты тогда шутил?\n\nС десяток секунд мужчина молча всматривался в глаза вампира и лишь затем понимающе кивнул. Это был первый раз на памяти Бенедикта, когда этот человек что-то забывал.\n\n— Ах да, конечно. Я обещал тебе \"твое\" прошлое, и я сдержал слово. Хотя, ты найдешь информацию на редкость разочаровывающей.\n\nОттянув рукав, он аккуратно провел пальцами по поверхности серебристого браслета. Тот ответил мягким гулом, и в воздухе слева от кресла появилась искрящаяся голубым трещина в пространстве. Покопавшись там какое-то время, мужчина достал старый обрывок бумаги. Наследие Антерена, сообразил Бенедикт. Лишь в редких уголках Континента Второй Эры производят что-то такого качества. Ни в одном из них нет печатных станков.\n\n— Это еще что?\n\n— Только один способ узнать.\n\nНесколько неуверенных шагов. Вампир взял протянутый лист и погрузился в чтение. Затем, словно ища хоть какого-то подтверждения, поднял взгляд обратно на собеседника. Тот молчаливо кивнул, выдавая собственные мысли лишь приподнятыми уголками губ.\n\nРаздался тихий смешок. Затем еще один. Спустя мгновения, Бенедикт Прокул Элегия, правитель Сасая и вампир-лорд Второй Эры, смеялся так, словно прочитал самую искрометную шутку за все четыре сотни лет своей жизни. Пожалуй, для него так оно и было.\n\n— Я исполнил уговор? — поинтересовался его собеседник.\n\n— Более чем! Это... вдохновляет, в своем собственном роде.\n\n— Тогда... — он поднялся с кресла.\n\n— Конечно. Я буду очень удивлен, если это действительно случится, но... До встречи, Конрад Селекаф.\n\n— Прощай, Бенедикт.", "aliases": [], "order": 2, "epigraph": "", "epigraphBy": "", "image": "", "caption": "", "createdAt": 1793641859264, "updatedAt": 1793641859264, "updatedBy": null}, "lord-glubin": {"title": "Лорд Глубин", "category": "Сказания", "summary": "Эоган, Предвестник Пожирателя, после битвы, в которой в мир вернулся Даниил Мидранмар.", "body": "Тихий всплеск донесся из темной залы — высоты донжона Дир Орикан. ОН никогда бы не подумал, что похвалит предателя, но установленный когда-то змеиной полукровкой портальный круг сейчас спас ЕГО от ужасающей своей сложностью задачи.\n\nВысокая фигура в вороненых латах медленно поднялась из холодного, склизкого бассейна. Мерзкие капли темной эссенции, прилипшие к доспеху, испарялись зловонным синим паром, не смея омрачать доспех своего Повелителя.\n\nМужчина не замечал ничего из этого.\n\nПокачиваясь, свершая каждый шаг подобно монументальному подвигу, он отошел от круга и медленно сполз по стенку.\n\n\"Почему?\"\n\nЭти слова не были предназначены никому из живущих.\n\nКвази-материя доспеха рушилась по линии многочисленных вмятин и кислотных ожогов, распадалась обратно на ЕГО силу. Седые, выцветшие волосы опали на его плечи, и впервые за многие годы он смотрел на мир не через прорези в черном забрале. Под ним, Предвестник Пожирателя напоминал скорее больного человека, чем живое божество. Этот факт вызывал у него отвращение.\n\nНо сейчас, до этого ему не было никакого дела. Сейчас, его взгляд все еще пребывал в недавнем прошлом.\n\n\"Почему?\"\n\nПровернутый клинок, брызги ало-золотистой крови — дракон был повержен его мечом, её Атана пожрана Ворткрестом. Молния Тысячелетия, уничтожившая пятую часть войска Амонгехета: как легко он ушел от нее, прикрывшись Левиафаном. Пьянящее чувство победы и превзойденных лимитов... Она была достойным противником, и научила его многому.\n\nВсё это прервал удар с небес.\n\n\"Почему?\"\n\nФантазм? Гомункул? Нежить? Одна за другой самые безумные догадки рушились, не выдерживая проверки реальностью; еще более безумной, чем домыслы. Непобедимый Воин, Живой Бог давно ушедшей эпохи, Даниил Мидранмар вернулся в мир живых во плоти. Слабее, иначе, но это был... он. Ты можешь пройти любой путь, но антеренцу, выращенному в пиетете пред Владыками, невозможно было представить себя побеждающим его.\n\nЭТО СТРАХ, ЧТО Я ОЩУЩАЮ?\n\nЕГО \"голос\" — если так можно было это назвать, — звук рвущейся плоти, воя глубинных китов, хриплого гарканья и глотающей пасти. Смысл, который должна была передать эта какофония, слышавшие понимали без слов.\n\nКогда-то, впервые услышал сей голос, Эоган боялся.\n\n\"...Я не знаю.\"\n\nДа. Таков был настоящий ответ, но Червь его не заслуживал.\n\nВ начале Войны, он был стойко уверен, что услышит Голос Червя лишь единожды. Быть может, когда Война будет закончена, а то, что Сжасс называл Вознесением, свершится. Тогда, наверное, он услышал бы нечто, что не мог вообразить. И после, всё бы закончилось.\n\nСейчас, когда Пробуждение близилось, он давно разочаровался в этом представлении. Боги, Владыки, даже эта тварь — сорви маску, и ты не найдешь многих отличий от смертного. Признаться, ОН не был даже мудрейшим из них. Если бы их мысли действительно были едины, сейчас ОН не стерпел бы такого оскорбления.\n\nНО ВЕДЬ ЭТО ОН... ПОЧЕМУ?\n\nДействительно. Эоган сделал глубокий вдох... и тут же схватился за вопящий болью бок. ...Болью?\n\nС момента становления Предвестником, он не ощущал этого чувства. Сталь и пламя, чары и даже холодная пустота Космоса — ничто не могло ранить его. Он все еще не понимал принцип: ни один из известных ему физических законов не могло объяснить это явление. ОН говорил ему страшиться лишь одной вещи — звездного металла, редкого как кровь богов. Только у одного из них было нечто схожее.\n\nНо всё, чего касался Владыка Воинов, становилось не менее страшным оружием. Его самый обычный молот, стволы деревьев, подхваченное у трупов снаряжение — он мог ранить его всем.\n\nОчередная волна чуждого богам чувства прокатилась по его телу.\n\nЯ ЗАДАЛ ВОПРОС.\n\nИ чего только не понимает эта прожорливая тварь? Он — сильнейшее существо современного мира, Избранный и Предвестник, Лорд Глубин, был побежден. ОН вытащил его, но какое значение это вообще имеет? И это только половина беды.\n\nАмонгехет, что был столь близок к Избранию, не отвечает на команды. Вероятно, он уже мертв. Армия, что он собрал, разбита, и у Альянса появился шанс укрепить позиции. Сжасс Тар, которого он считал единственным незаменимым союзником, покинул их ряды, а его ученица едва ли стоит одного ногтя учителя.\n\nКастагар, Король Жуков, Сигимар, многие прочие — побеждены ими, и они становятся лишь сильнее с каждым днем. Что бы за сила их не вела, Бандуриан, кажется, был сражен чем-то схожим: словно самой Судьбой, правящей чужими руками.\n\nМНЕ КАЗАЛОСЬ, ТЫ ЖЕЛАЛ ЧЕГО-ТО ПОДОБНОГО? ЗА ТЕМ ПРЕДЛОЖИЛ СВОЙ\n\nМЕЧ?\n\nОткуда он... Нет, очевидно. Их мысли, в конце-концов, соприкоснулись. Даже он изредка, в часы простоя, видел ЕГО прошлое.\n\nС тех пор, Эоган всегда старался себя чем-нибудь занять.\n\n\"Но вернулся он. Темный Повелитель здесь лишь отголоском себя, а он — во плоти. Какой шанс мы имеем, если-\"\n\nЭТО СМЕШНО СЛЫШАТЬ.\n\nОн недовольно хмыкнул. Для заточенного, спящего в цепях Империи червя он на редкость самоуверен. Неужели... запасной план, о котором не знает даже Предвестник? НЕТ. У МЕНЯ ЛИШЬ ОДНО ОРУЖИЕ. И ОНО ОДОЛЕЛО БЫ ТО, ЧТО ТЫ НАЗЫВАЕШЬ\n\n\"ВЛАДЫКОЙ\", ЕСЛИ БЫ ЕГО НЕ СКОВАЛИ СМЕРТНЫЕ ПРЕДРАССУДКИ.\n\nЭоган поднялся. Раскрошенные ребра собрались обратно одним усилием подсознания. Частицы глубинной божественности вспомнили форму материи и вновь облачили своего Лорда в доспех.\n\n\"О чем ты?\" — произнес он, наконец, заинтересованно. \"Ты наблюдал тот бой.\" И ПОТОМУ Я ЗНАЮ, ЧТО ТЫ НЕ ИСПОЛЬЗОВАЛ ДАЖЕ ШЕСТОЙ ЧАСТИ ТОГО, ЧТО\n\nТВОЕ ПО ПРАВУ. НО ЭТО НЕ ВАЖНО. У ТЕБЯ ЕСТЬ ВРЕМЯ ОБУЧИТЬСЯ. Я\n\nИСПОЛНИЛ ТВОЮ ПРОСЬБУ.\n\nСтены из кости и камня не могли скрыть гула, что доносился снаружи. Эоган спешно направился к винтовым ступеням на крышу башни — в его бледных глазах явное любопытство.\n\nЕму едва ли верилось в ЕГО слова, но если ОН прав...\n\nГлубочайшие инстинкты подсказывали, что это было так. Душа, получившая катализатор в лице невозможного противника, с поразительной скоростью адаптировалась к новым Ша. Но, быть может, дело было даже в ней, но в чем-то куда более приземленном? У него не было времени на долгие раздумья. Совершенное тело в рекордные сроки донесло его до вершины.\n\n\"Вот как...\"\n\nУЗРИ.\n\nГород, давно обращенный в крепость камня и костей. Небо, покрытое черно-синими пустулами. Серый снег, падающий наземь липкими хлопьями.\n\nИ Легион, что ждал своего полководца.\n\nОзеро, затронутое ИМ, покрылось рябью. Владения Старшего Духа Воды пали под ЕГО волей, и скоро станут истинным проходом в Глубины.\n\nМерзкие создания, напоминающие насекомых и глубоководных тварей, вылезали из земельных каверн. Остатки Культа Червя, собранные Кандри Хиш, исправно делали свою работу.\n\nСиний пар шел из колдовских кузен. Последний легион Голодных, созданный из последних жителей окрестных земель. Он будет экипирован лучше, чем когда либо. Эоган выдохнул. Он оставался при своем мнении. Этот прожорливый червяк наивен и слишком самоуверен. Их враг сильнее, чем когда-либо. Эта Война уже давно перестала быть односторонней.\n\nИ все же, в одном ОН прав.\n\nЭта Война еще не закончена.\n\nПоглощающая любой свет дыра в пространстве, именуемая Ворткрестом, вошла в камень почти по рукоять. Водоворот усилился.\n\n\"Пожиратель, нашей волей.\"\n\nСодрогающий землю рев раздался из Глубин, заставив каждого человека и каждую тварь задержать дыхание от страха.\n\nИскаженная тварь, сотканная из драконьей Атаны и плоти тысяч. Временная замена, жалкое преддверье тому, что случится после Пробуждения, ОНО уже сейчас вселяло ужас в сердца врагов и союзников.\n\nГлубоко под землей, Аватар Червя содрогнулся.\n\nТАК ОТВЕТЬ ЖЕ. ЭТО СТРАХ, ЧТО Я ОЩУЩАЮ?\n\n\"Нет.\"\n\nТЫ СТОЛКНЕШЬСЯ С НИМ ВНОВЬ. С НИМ, И С НИМИ. ВСЕ ОНИ ПРИДУТ, ДАБЫ\n\nОСТАНОВИТЬ НАС.\n\n...\n\n\"Пусть идут.\"\n\n\"Ворткрест жаждет крови.\"", "aliases": [], "order": 3, "epigraph": "", "epigraphBy": "", "image": "", "caption": "", "createdAt": 1793641859264, "updatedAt": 1793641859264, "updatedBy": null}, "o-mudila-quest": {"title": "О Mudila Quest", "category": "Мир", "summary": "Что такое Mudila Quest, как устроена система MQRP и кто всё это придумал.", "body": "**Mudila Quest** — это тёмное фэнтези про мир [[Термина]], его войны, древние империи, демонов, магов и самых сомнительных подонков, которые когда-либо брались за меч ради чужого золота. И одновременно это собственная настольная ролевая система **MQRP** (Mudila Quest Roleplaying), на которой этот мир и играется.\n\nВесь проект — сеттинг, правила, кодексы, хроники, рассказы и злодеи, о которых вы читаете на этом сайте, — придумал и пишет один человек: очень амбициозный **Мах Москитоз**. В данный момент он временно заперт в Балашихаре, но работу над миром это, как видите, не останавливает.\n\n## Мир\n\nДействие идёт на Срединном Континенте Термины в 383–384 годах Второй Эры. Позади тысячелетия истории: Эпоха Древа и бессмертные эльфы, Анурианская Империя змеелюдов, человеческий [[Антерен]] и его Владыки, Великая Катастрофа, Тёмный Век и [[Война Черной Короны]]. Сейчас Север горит в [[Война Червя|Войне Червя]], на небе висит вторая, кроваво-красная луна, а в тени ждут своего часа [[Круг Проклятых]], вампиры и [[Архидемоны]] [[Бездна|Бездны]].\n\nХорошая точка входа — [[Мерклейд]], [[Хронология]] и раздел «Главные герои».\n\n## Система MQRP\n\nMQRP — система на d20, собранная под этот мир и под игроков, которые хотят сами придумывать своих персонажей, а не выбирать из списка классов.\n\n- **Броски.** Почти всё решает d20 с модификаторами против Класса Сложности: в бою это одна из Защит цели, вне боя — обычно 10. Натуральная 20 — критический успех с усиленным эффектом, натуральная 1 — критический провал. Есть преимущество и помеха.\n- **Четыре характеристики.** Мощь, Ловкость, Разум и Воля. Каждая даёт собственную Защиту и питает Здоровье, Энергию, урон и силу умений.\n- **Пути вместо классов.** Главная фишка системы. Игрок сам создаёт многоступенчатые таланты: у Пути есть название, специализация и таблица из семи уровней, от основной способности до мастерства. Хочешь паладина — собери его из Пути двуручного оружия, Пути исцеляющей магии и Пути тяжёлых доспехов.\n- **Очки роста.** Очки Характеристик и Очки Развития приходят с повышениями. Очки Обучения добываются в мире: у учителей, в книгах, на тренировках, и тратятся на боевые приёмы, заклинания, школы магии и ремёсла.\n- **Бой по фазам.** Раунд делится на Мгновенную, Быструю и Медленную фазы, у каждого персонажа по 2 Очка Действий. Скорость действия решает, в какую фазу его можно совершить.\n- **Броня и Барьер.** Это дополнительные очки здоровья от снаряжения и способностей: Броня держит физику, Барьер — магию и энергию.\n- **Сверхъестественное.** Волшебство со школами Антеренской Конвенции и запретными Тёмными Искусствами, псионика с дисциплинами, магический потенциал от Антимага до Светоча, [[Луна Чародеев]].\n- **Путешествия, отдых и владения.** Походные и лагерные действия, дозоры, ремёсла и алхимия, а под конец — собственные Владения со своими ресурсами, проектами и событиями.\n\nК основным правилам идут дополнения: «Технологии Шифра», «Аугментации», «Основные типы урона» и толстый Кодекс лора, из которого собрана эта вики.\n\n## О сайте\n\n«Кодекс Термины» — вики по миру, собранная из кодексов Маха Москитоза и записей кампании. Тексты статей взяты из оригинальных кодексов почти без изменений, раздел «Сказания» хранит рассказы по миру. ГМ правит статьи прямо на сайте.", "aliases": ["Mudila Quest", "MQRP", "Мах Москитоз"], "order": -10, "epigraph": "", "epigraphBy": "", "image": "", "caption": "", "createdAt": 1793641859264, "updatedAt": 1793641859264, "updatedBy": null}}}</script>
<script>
const CATS=["Мир","История","Расы","Земли","Магия","Вера и ордена","Существа","Бой","Сказания"];
const HERO="Главные герои";
const GROUPS=[HERO,"Силы Пожирателя","Альянс","Великие","Загадочные личности","Внешний космос","Герои былых времён","Древние владыки","Правители нашего дня","Тьма и угрозы","Боги и великие силы"];
const ROUTES=new Set(["","mir","geroi","personazhi","hronika","gm"]);
const RESERVED=new Set(["mir","geroi","gm","personazhi","hronika","settings","sidebar","customize","upgrade","downloads","new","edit"]);
let db=null,user=null,assets=null,canWrite=null,writeRefused=false,live=false;
let articles={},snapMeta={at:0};
let editing=null,filterCat="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().replace(/ё/g,"е").trim();
const isChar=a=>a&&a.kind==="character";
const imgSrc=id=>{if(!id)return null;if(/^images\/[A-Za-z0-9._-]+$/.test(id))return id;if(/^[A-Za-z0-9_-]{8,64}$/.test(id))return "/_blob/"+id;return null};
const imgErr=`onerror="imgFallback(this)"`;
function imgFallback(el){const p=el.getAttribute("src")||"";if(GH&&!el.dataset.raw&&p.startsWith("images/")){el.dataset.raw=1;el.src=`https://raw.githubusercontent.com/${GH.repo}/${GH.branch}/${GH.dir}${p}`}else el.remove()}

/* ---------- снимок для гостей ---------- */
try{const s=JSON.parse($("#snapshot").textContent);articles=s.articles||{};snapMeta={at:s.at||0}}catch{articles={}}

function hash(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
const GLYPH={
 "Мир":'<circle cx="50" cy="50" r="13"/><ellipse cx="50" cy="50" rx="24" ry="8" transform="rotate(-20 50 50)"/>',
 "История":'<path d="M38 32h24M38 68h24M40 32c0 12 20 12 20 18s-20 6-20 18M60 32c0 12-20 12-20 18s20 6 20 18"/>',
 "Расы":'<circle cx="50" cy="38" r="7"/><circle cx="38" cy="60" r="7"/><circle cx="62" cy="60" r="7"/>',
 "Земли":'<path d="M28 66l14-22 8 12 8-16 14 26z"/>',
 "Магия":'<path d="M50 28l5 17 17 5-17 5-5 17-5-17-17-5 17-5z"/>',
 "Вера и ордена":'<path d="M50 26v48M40 38h20M44 74h12"/>',
 "Существа":'<path d="M28 50c8-12 36-12 44 0-8 12-36 12-44 0z"/><circle cx="50" cy="50" r="6"/>',
 "Бой":'<path d="M32 32l36 36M68 32L32 68M30 40l10-10M60 70l10-10"/>',
 "Сказания":'<path d="M50 34c-8-6-18-6-24-4v36c6-2 16-2 24 4 8-6 18-6 24-4V30c-6-2-16-2-24 4zM50 34v36"/>'
};
function sigil(key,cat,title){
  const h=hash(key),n=3+(h%6),rot=(h>>3)%360,r2=22+((h>>7)%8);
  let poly="";for(let i=0;i<n;i++){const a=(rot+i*360/n)*Math.PI/180;poly+=(50+38*Math.cos(a)).toFixed(1)+","+(50+38*Math.sin(a)).toFixed(1)+" "}
  const ticks=Array.from({length:24},(_,i)=>{const a=i*15*Math.PI/180,o=i%2?44:42;return `<line x1="${(50+o*Math.cos(a)).toFixed(1)}" y1="${(50+o*Math.sin(a)).toFixed(1)}" x2="${(50+46*Math.cos(a)).toFixed(1)}" y2="${(50+46*Math.sin(a)).toFixed(1)}"/>`}).join("");
  const inner=GLYPH[cat]||`<text x="50" y="58" text-anchor="middle" font-size="26" font-family="Forum,Georgia,serif" fill="currentColor" stroke="none">${esc((title||"?").slice(0,1))}</text>`;
  return `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><g opacity=".45">${ticks}</g><polygon points="${poly}" opacity=".55"/><circle cx="50" cy="50" r="${r2+8}" opacity=".35"/>${inner}</svg>`;
}
function medallion(a,slug){
  const h=hash(slug),hue=[200,30,350,160,260,45][h%6];
  const ini=(a.title||"?").split(/\s+/).filter(w=>/^[А-ЯЁA-Z]/.test(w)).slice(0,2).map(w=>w[0]).join("")||(a.title||"?")[0];
  return `<svg viewBox="0 0 100 125" aria-hidden="true"><defs><radialGradient id="g${h}" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="hsl(${hue} 35% 38%)"/><stop offset="1" stop-color="hsl(${hue} 30% 12%)"/></radialGradient></defs><rect width="100" height="125" fill="url(#g${h})"/><g fill="none" stroke="hsl(${hue} 40% 75%)" stroke-opacity=".35"><circle cx="50" cy="56" r="34"/><circle cx="50" cy="56" r="28" stroke-dasharray="2 4"/></g><text x="50" y="68" text-anchor="middle" font-family="Forum,Georgia,serif" font-size="32" fill="hsl(${hue} 45% 86%)">${esc(ini)}</text></svg>`;
}
function thumb(a,slug){const src=imgSrc(a.image);if(src)return `<img src="${src}" alt="" loading="lazy" ${imgErr}>`;return isChar(a)?medallion(a,slug):sigil(slug,a.category,a.title)}
function portrait(a,slug){const src=imgSrc(a.image);return `<div class="portrait">${src?`<img src="${src}" alt="${esc(a.title)}" loading="lazy" ${imgErr}>`:medallion(a,slug)}</div>`}

/* ---------- имена, ссылки, разметка ---------- */
function nameIndex(){const m=new Map();for(const[s,a]of Object.entries(articles)){m.set(norm(a.title),s);for(const al of a.aliases||[])if(!m.has(norm(al)))m.set(norm(al),s)}return m}
function translit(s){
  const t={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"shch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya"};
  let r=norm(s).split("").map(c=>t[c]??c).join("").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60)||"statya";
  if(RESERVED.has(r)||r.startsWith("comment-"))r="st-"+r;
  let o=r,i=2;while(articles[o])o=r+"-"+i++;return o;
}
function inline(s,idx){
  s=esc(s);
  s=s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(_,t,l)=>{const sl=idx.get(norm(t)),x=l||t;return sl?`<a class="wl" href="#${sl}">${x}</a>`:`<a class="wl missing" href="#" data-create="${t}" title="Статьи пока нет">${x}</a>`});
  return s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>").replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function blocks(md){
  const out=[];let p=[],l=null,q=[];
  const fp=()=>{if(p.length){out.push({t:"p",v:p.join(" ")});p=[]}},fl=()=>{if(l){out.push({t:"ul",v:l});l=null}},fq=()=>{if(q.length){out.push({t:"q",v:q.join(" ")});q=[]}},f=()=>{fp();fl();fq()};
  for(const raw of String(md||"").split("\n")){const ln=raw.trimEnd();let m;
    if(!ln.trim()){f();continue}
    if(m=ln.match(/^###\s+(.*)/)){f();out.push({t:"h3",v:m[1]});continue}
    if(m=ln.match(/^##?\s+(.*)/)){f();out.push({t:"h2",v:m[1]});continue}
    if(m=ln.match(/^\s*[-*]\s+(.*)/)){fp();fq();(l||(l=[])).push(m[1]);continue}
    if(m=ln.match(/^>\s?(.*)/)){fp();fl();q.push(m[1]);continue}
    if(l&&/^\s{2,}\S/.test(raw)){l[l.length-1]+=" "+ln.trim();continue}
    fl();fq();p.push(ln.trim())}
  f();return out;
}
function render(md){const idx=nameIndex();return blocks(md).map(b=>b.t==="p"?`<p>${inline(b.v,idx)}</p>`:b.t==="ul"?`<ul>${b.v.map(i=>`<li>${inline(i,idx)}</li>`).join("")}</ul>`:b.t==="q"?`<blockquote>${inline(b.v,idx)}</blockquote>`:`<${b.t}>${inline(b.v,idx)}</${b.t}>`).join("\n")}
function linksIn(md){const idx=nameIndex(),s=new Set();for(const m of String(md||"").matchAll(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g)){const x=idx.get(norm(m[1]));if(x)s.add(x)}return s}

function inCat(c){return entries().filter(([,a])=>!isChar(a)&&a.category===c).sort(byOrder)}
function allCats(){const ex=[...new Set(entries().filter(([,a])=>!isChar(a)).map(([,a])=>a.category).filter(c=>c&&!CATS.includes(c)))].sort();return[...CATS,...ex].filter(c=>inCat(c).length)}
function chars(g){return entries().filter(([,a])=>isChar(a)&&(a.group||"Прочие")===g).sort(byOrder)}
function allGroups(){const ex=[...new Set(entries().filter(([,a])=>isChar(a)).map(([,a])=>a.group||"Прочие").filter(g=>!GROUPS.includes(g)))].sort();return[...GROUPS,...ex].filter(g=>chars(g).length)}
function fmtDate(ms){if(!ms)return"";try{return new Date(ms).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}catch{return""}}

function statusPill(s){if(!s)return"";const n=norm(s);const cls=/мерт|уничтож|погиб|раздроб/.test(n)?"dead":/правит|актив|жив|воюет|ведет|вернул/.test(n)?"live":"";return `<span class="pill ${cls}">${esc(s)}</span>`}

let skyStop=null;
function sky(canvas){
  if(skyStop)skyStop();
  const ctx=canvas.getContext("2d");if(!ctx)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);let w=0,h=0,stars=[],raf=0,t0=performance.now();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
    stars=Array.from({length:Math.round(w*h/2600)},()=>({x:rnd()*w,y:rnd()*h,r:rnd()*1.3+.2,p:rnd()*6.28,s:.4+rnd()*1.2}))}
  function moon(x,y,r,core,glow){const g=ctx.createRadialGradient(x,y,r*.2,x,y,r*3.2);g.addColorStop(0,glow);g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3.2,0,7);ctx.fill();
    const c=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);c.addColorStop(0,core[0]);c.addColorStop(1,core[1]);ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
  function draw(now){const t=(now-t0)/1000;ctx.clearRect(0,0,w,h);
    for(const s of stars){const a=.35+.45*Math.sin(s.p+t*s.s);ctx.fillStyle=`rgba(225,232,240,${a})`;ctx.fillRect(s.x,s.y,s.r,s.r)}
    const big=Math.max(26,Math.min(64,w*.05));
    moon(w*.82+Math.sin(t*.05)*8,h*.32+Math.cos(t*.04)*4,big,["#F2F7FA","#9FC4D4"],"rgba(150,200,220,.22)");
    moon(w*.70+Math.cos(t*.07)*12,h*.18+Math.sin(t*.06)*5,big*.32,["#F0A090","#8E2F28"],"rgba(220,80,60,.18)");
    if(!reduce)raf=requestAnimationFrame(draw)}
  size();const ro=new ResizeObserver(()=>{size();if(reduce)draw(t0)});ro.observe(canvas);
  raf=requestAnimationFrame(draw);skyStop=()=>{cancelAnimationFrame(raf);ro.disconnect();skyStop=null};
}

$("#q").addEventListener("keydown",e=>{const it=[...$("#results").querySelectorAll("a[href]")];

/* ---------- редактор ---------- */
function startEdit(slug,title,kind,group){
  const a=slug?articles[slug]:null;
  editing={slug,base:a?.updatedAt||0,tab:"write",confirmDel:false,warn:"",saving:false,uploading:false,
    draft:{kind:a?.kind||kind||"article",title:a?.title||title||"",category:a?.category&&a.category!=="Персонажи"?a.category:"Мир",group:a?.group||group||"Силы Пожирателя",role:a?.role||"",status:a?.status||"",
      summary:a?.summary||"",aliases:(a?.aliases||[]).join(", "),body:a?.body||"",epigraph:a?.epigraph||"",epigraphBy:a?.epigraphBy||"",image:a?.image||"",caption:a?.caption||"",order:a?.order??99}};

}

function selectField(id,label,opts,val,newId,newPh){const custom=val&&!opts.includes(val);return `<label for="${id}">${label}<select id="${id}">${opts.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}<option value="__new" ${custom?"selected":""}>Новый…</option></select><input id="${newId}" type="text" value="${custom?esc(val):""}" placeholder="${newPh}" ${custom?"":"hidden"}></label>`}
function editorHtml(){

  return `<div class="gut"><div class="inner editor view">
    <div class="eyebrow">${isNew?"Новая запись":"Редактирование"}</div>
    <h1>${esc(d.title||"Без названия")}</h1>
    <div class="form">
      ${e.warn?`<div class="notice ${e.warnErr?"err":""}">${e.warn}</div>`:""}

      <div class="row">

        ${ch?selectField("e-group","Группа",groups,d.group,"e-newgroup","Название группы"):selectField("e-category","Раздел",cats,d.category,"e-newcat","Название раздела")}
      </div>
      ${ch?`<div class="row"><label for="e-role">Кто это, одной строкой<input id="e-role" type="text" value="${esc(d.role)}" placeholder="Паладин, оруженосец Лотара"></label><label for="e-status">Состояние<input id="e-status" type="text" value="${esc(d.status)}" placeholder="Жив, мёртв, пропал…"></label></div>`:""}
      <label for="e-summary">Кратко, одной строкой<input id="e-summary" type="text" value="${esc(d.summary)}" placeholder="Что это и почему важно"></label>
      <label for="e-aliases">Другие имена через запятую<input id="e-aliases" type="text" value="${esc(d.aliases)}" placeholder="По ним работают поиск и ссылки"></label>
      <div class="row"><label for="e-epigraph">Эпиграф<input id="e-epigraph" type="text" value="${esc(d.epigraph)}" placeholder="Цитата, с которой начинается статья"></label><label for="e-epigraphBy">Чьи слова<input id="e-epigraphBy" type="text" value="${esc(d.epigraphBy)}" placeholder="Кто это сказал"></label></div>
      <div class="imgfield">
        <div class="thumb">${src?`<img src="${src}" alt="">`:(ch?medallion({title:d.title},"x"+d.title):sigil(d.title||"x",d.category,d.title))}</div>
        <div style="display:grid;gap:8px;flex:1;min-width:200px">
          <span class="status">${ch?"Портрет":"Иллюстрация"}${src?"":" не выбрана, вместо неё рисуется герб"}</span>
          ${(assets||GH)?`<div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn" for="e-file" style="display:inline-block;text-transform:none;letter-spacing:.03em;font-size:12.5px;color:var(--ink)">${e.uploading?"Загружаем…":src?"Заменить картинку":"Загрузить картинку"}<input id="e-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label>${src?`<button class="btn" id="e-noimg" type="button">Убрать</button>`:""}</div>`:`<span class="status">Загружать картинки могут владелец и редакторы вики.</span>`}
          ${!ch?`<input id="e-caption" type="text" value="${esc(d.caption)}" placeholder="Подпись к картинке">`:""}
        </div>
      </div>
      <div>
        <div class="wtabs" role="tablist"><button type="button" role="tab" id="t-w" aria-selected="${e.tab==="write"}">Текст</button><button type="button" role="tab" id="t-p" aria-selected="${e.tab==="prev"}">Предпросмотр</button></div>
        ${e.tab==="write"?`<textarea id="e-body" aria-label="Текст">${esc(d.body)}</textarea>`:`<div class="preview"><article class="prose">${render(d.body)||'<p class="status">Пока пусто.</p>'}</article></div>`}
      </div>
      <div class="hint"><code>## Заголовок</code> раздел · <code>- пункт</code> список · <code>**жирный**</code> · <code>*курсив*</code> · <code>&gt; цитата</code><br><code>[[Казакия]]</code> ссылка на статью · <code>[[Казакия|город магов]]</code> ссылка со своим текстом. Ссылка на статью, которой ещё нет, будет красной, по клику её можно создать.</div>
      <div class="actions">

        ${!isNew?(e.confirmDel?`<span class="confirm">Удалить насовсем? <button class="btn danger" id="e-del2" type="button">Да, удалить</button><button class="btn" id="e-del0" type="button">Нет</button></span>`:`<button class="btn danger" id="e-del" type="button">Удалить</button>`):""}
      </div>
    </div></div></div>`;
}
function rerender(){$("#main").innerHTML=editorHtml();bindEditor()}
function bindEditor(){
  const e=editing;const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn};
  ["#e-category","#e-group"].forEach(id=>{const s=$(id);if(s)s.onchange=()=>{const n=$(id==="#e-category"?"#e-newcat":"#e-newgroup");n.hidden=s.value!=="__new"}});
  on("#k-a",()=>{readForm();e.draft.kind="article";rerender()});on("#k-c",()=>{readForm();e.draft.kind="character";rerender()});
  on("#t-w",()=>{readForm();e.tab="write";rerender()});on("#t-p",()=>{readForm();e.tab="prev";rerender()});
  on("#e-cancel",()=>{editing=null;view()});on("#e-save",()=>save(false));on("#e-overwrite",()=>save(true));
  on("#e-del",()=>{readForm();e.confirmDel=true;rerender()});on("#e-del0",()=>{readForm();e.confirmDel=false;rerender()});on("#e-del2",remove);
  on("#e-noimg",()=>{readForm();e.draft.image="";rerender()});
  const f=$("#e-file");if(f)f.onchange=async()=>{const file=f.files&&f.files[0];if(!file)return;readForm();
    if(file.size>20*1024*1024){e.warn="Картинка больше 20 МБ, выберите поменьше.";e.warnErr=true;return rerender()}
    e.uploading=true;e.warn="";rerender();
    try{if(GH){e.draft.image=await ghUpload(file,e.slug||translit(e.draft.title||"img"))}else{const r=await assets.upload(file,{type:file.type||"image/png"});e.draft.image=r.id}}
    catch(err){e.warn=({too_large:"Картинка слишком большая.",unsupported_type:"Этот формат не подходит, нужен PNG, JPEG, WebP или GIF.",quota_or_state:"Место под картинки закончилось.",rate_limited:"Слишком часто, попробуйте через минуту."})[err?.code]||"Не удалось загрузить картинку.";e.warnErr=true}
    e.uploading=false;rerender()};
}
async function save(force){
  readForm();const e=editing,d=e.draft,ch=d.kind==="character",title=d.title.trim();
  const fail=m=>{e.warn=m;e.warnErr=true;rerender()};
  if(!title)return fail("Нужно название.");
  if(!ch&&!d.category)return fail("Укажите раздел.");
  if(ch&&!d.group)return fail("Укажите группу.");
  const clash=entries().find(([s,a])=>s!==e.slug&&norm(a.title)===norm(title));
  if(clash)return fail(`«${esc(clash[1].title)}» уже есть. <a href="#${clash[0]}">Открыть</a>`);
  if(e.slug&&!force){const cur=articles[e.slug];
    if(!cur)return fail("Эту запись удалили, пока вы её правили. <button class='btn' id='e-overwrite' type='button'>Создать заново</button>");
    if((cur.updatedAt||0)!==e.base)return fail("Кто-то изменил запись, пока вы её правили. Сравните в новой вкладке или сохраните свою версию поверх. <button class='btn' id='e-overwrite' type='button'>Сохранить поверх</button>")}
  const slug=e.slug||translit(title),prev=articles[e.slug||""];
  const me=GH?("gh:"+(gh.login||"ГМ")):(user?await user.id().catch(()=>null):null);
  const doc={kind:d.kind,title,category:ch?"Персонажи":d.category,summary:d.summary.trim(),aliases:d.aliases.split(",").map(x=>x.trim()).filter(Boolean),
    body:d.body.replace(/\r/g,""),epigraph:d.epigraph.trim(),epigraphBy:d.epigraphBy.trim(),image:d.image||"",caption:ch?"":d.caption.trim(),
    order:prev?.order??d.order??99,createdAt:prev?.createdAt||Date.now(),updatedAt:Date.now(),updatedBy:me};
  if(ch){doc.group=d.group;doc.role=d.role.trim();doc.status=d.status.trim()}
  e.saving=true;e.warn="";rerender();
  try{if(GH)await ghWrite(slug,doc);else await db.collection("articles").doc(slug).set(doc);articles[slug]=doc;editing=null;if(route()!==slug)location.hash=slug;else view()}
  catch(err){e.saving=false;
    if(err?.code==="invalid_argument"&&canWrite!==true){writeRefused=true;fail("У вас нет прав на правку. Попросите владельца выдать вам доступ редактора.")}
    else if(err?.code==="quota_exceeded")fail("База вики заполнена. Удалите ненужные записи и попробуйте снова.");
    else fail("Не удалось сохранить: "+esc(err?.message||"нет связи")+". Текст остался в форме.")}
}
async function remove(){const s=editing.slug;try{if(GH)await ghWrite(s,null);else await db.collection("articles").doc(s).delete();delete articles[s];editing=null;location.hash="";view()}catch(err){editing.confirmDel=false;editing.warn="Не удалось удалить: "+esc(err?.message||"нет связи");editing.warnErr=true;rerender()}}


/* ---------- GitHub: чтение и правки через репозиторий ---------- */
const SITE={repo:"selivestoway-beep/selivestoway-beep.github.io",branch:"main"};
const GH=(()=>{if(!location.hostname.endsWith(".github.io"))return null;let parts=location.pathname.split("/").filter(Boolean);if(parts.length&&/\.html?$/i.test(parts[parts.length-1]))parts.pop();const dir=parts.length?parts.join("/")+"/":"";return{repo:SITE.repo,branch:SITE.branch,dir}})();
const GH_KEY="kodeks.gh.token";
const gh={token:"",login:"",err:"",busy:false};
try{gh.token=localStorage.getItem(GH_KEY)||""}catch{}
const DATA_PATH=()=>`${GH.dir}data/articles.json`;
function b64enc(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b){const bin=atob(String(b).replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function ghApi(path,opt={}){
  const r=await fetch(`https://api.github.com/repos/${GH.repo}/${path}`,{...opt,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+gh.token,"X-GitHub-Api-Version":"2022-11-28",...(opt.headers||{})}});
  if(!r.ok){const t=await r.text().catch(()=>"");const e=new Error(r.status+" "+t.slice(0,160));e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
async function ghRead(){
  const j=await ghApi(`contents/${DATA_PATH()}?ref=${GH.branch}&t=${Date.now()}`);
  let text;if(j.content)text=new TextDecoder().decode(b64dec(j.content));else{const r=await fetch(j.download_url+"?t="+Date.now());text=await r.text()}
  return{data:JSON.parse(text),sha:j.sha};
}
async function ghWrite(slug,doc){
  let last;
  for(let i=0;i<3;i++){
    let cur={data:{articles:{}},sha:undefined};
    try{cur=await ghRead()}catch(e){if(e.status!==404)throw e}
    const data=cur.data;data.articles=data.articles||{};
    if(doc)data.articles[slug]=doc;else delete data.articles[slug];
    data.at=Date.now();
    const body={message:(doc?"Правка: ":"Удалено: ")+(doc?.title||articles[slug]?.title||slug),content:b64enc(new TextEncoder().encode(JSON.stringify(data))),branch:GH.branch};
    if(cur.sha)body.sha=cur.sha;
    try{await ghApi(`contents/${DATA_PATH()}`,{method:"PUT",body:JSON.stringify(body)});articles=data.articles;return}
    catch(e){last=e;if(e.status!==409&&e.status!==422)throw e}
  }
  throw last;
}
async function shrink(file){
  if(file.type==="image/gif")return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1200/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/webp",.82));return b&&b.size<file.size?b:file}catch{return file}
}
async function ghUpload(file,slug){
  const blob=await shrink(file);
  const ext=blob.type==="image/webp"?"webp":blob.type==="image/gif"?"gif":blob.type==="image/png"?"png":"jpg";
  const name=`images/${slug}-${Date.now().toString(36)}.${ext}`;
  const bytes=new Uint8Array(await blob.arrayBuffer());
  await ghApi(`contents/${GH.dir}${name}`,{method:"PUT",body:JSON.stringify({message:"Картинка: "+slug,content:b64enc(bytes),branch:GH.branch})});
  return name;
}
function gmHtml(){
  document.title="Вход для ГМа · Кодекс Термины";
  if(!GH)return `<div class="gut"><div class="inner gm"><div class="eyebrow">Вход для ГМа</div><h1>Здесь не нужно</h1><p class="lede">Эта страница работает на сайте GitHub. В вики на claude.ai правки доступны владельцу и редакторам без входа.</p></div></div>`;
  if(gh.token&&gh.login)return `<div class="gut"><div class="inner gm"><div class="eyebrow">Вход для ГМа</div><h1>Вы вошли как ${esc(gh.login)}</h1><p class="lede">Кнопки «Редактировать» и «Новая статья» теперь видны на всех страницах. Каждая правка сохраняется в репозиторий, сайт обновляется у всех примерно через минуту.</p><div class="gmbar"><a class="btn primary" href="#">К вики</a><button class="btn" id="gm-logout" type="button">Выйти</button></div></div></div>`;
  return `<div class="gut"><div class="inner gm"><div class="eyebrow">Вход для ГМа</div><h1>Редактирование вики</h1>
  <p class="lede">Правки сохраняются прямо в репозиторий GitHub. Для входа нужен ключ доступа к нему, его создают один раз.</p>
  <ol>
    <li>Откройте <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>.</li>
    <li>Название любое, срок — какой удобно.</li>
    <li>В «Repository access» выберите «Only select repositories» и отметьте <code>${esc(GH.repo.split("/")[1])}</code>.</li>
    <li>В «Permissions» найдите «Contents» и поставьте «Read and write».</li>
    <li>Нажмите «Generate token», скопируйте ключ и вставьте ниже.</li>
  </ol>
  <p class="status">Если вы не владелец репозитория: владелец добавляет вас в «Settings → Collaborators», а вы создаёте классический ключ на github.com/settings/tokens с правом <code>public_repo</code>.</p>
  ${gh.err?`<div class="notice err">${esc(gh.err)}</div>`:""}
  <div class="form" style="margin-top:var(--s4)"><label for="gm-token">Ключ GitHub<input id="gm-token" type="text" autocomplete="off" placeholder="github_pat_…"></label>
  <div class="gmbar"><button class="btn primary" id="gm-login" type="button" ${gh.busy?"disabled":""}>${gh.busy?"Проверяем…":"Войти"}</button><span class="status">Ключ хранится только в этом браузере.</span></div></div></div></div>`;
}
async function gmLogin(){
  const t=($("#gm-token")?.value||"").trim();if(!t){gh.err="Вставьте ключ.";return view()}
  gh.token=t;gh.busy=true;gh.err="";view();
  try{const repo=await ghApi("");if(!repo.permissions||!repo.permissions.push)throw new Error("У этого ключа нет права записи в репозиторий.");
    const u=await fetch("https://api.github.com/user",{headers:{"Authorization":"Bearer "+t}}).then(r=>r.ok?r.json():{}).catch(()=>({}));
    gh.login=u.login||"ГМ";try{localStorage.setItem(GH_KEY,t)}catch{}
    try{const fresh=await ghRead();articles=fresh.data.articles||articles}catch{}
  }catch(e){gh.token="";gh.err=e.status===401?"Ключ не подошёл. Проверьте, что скопировали его целиком.":e.status===404?"Ключ не видит репозиторий. Проверьте шаг с выбором репозитория.":(e.message||"Не удалось войти.")}
  gh.busy=false;view();
}

/* ---------- запуск ---------- */
view();
(async()=>{
  if(GH){
    try{const r=await fetch(`data/articles.json?t=${Date.now()}`,{cache:"no-store"});if(r.ok){const j=await r.json();if(j&&j.articles){articles=j.articles;snapMeta={at:j.at||0}}}}catch{}
    if(gh.token){try{const u=await fetch("https://api.github.com/user",{headers:{"Authorization":"Bearer "+gh.token}});if(u.ok){gh.login=(await u.json()).login;const fresh=await ghRead();articles=fresh.data.articles||articles}else gh.token=""}catch{}}
    if(!editing)view();return;
  }
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [db,user,assets]=await Promise.all([use("db"),use("user"),use("assets")]);
  viewerChecked=true;
  if(user){try{canWrite=await user.can("data.write")}catch{canWrite=null}}
  if(!db){return view()}
  const timer=setTimeout(()=>{if(!live){$("#banner").hidden=false;$("#bannertext").textContent="База пока не отвечает, показываем сохранённую копию. Страница обновится сама."}},10000);
  db.collection("articles").onSnapshot(snap=>{
    if(snap.metadata.fromCache&&snap.empty)return;
    const next={};for(const d of snap.docs){const x=d.data();if(x&&x.title)next[d.id]=x}
    articles=next;live=true;clearTimeout(timer);
    if(!editing)view();else{$("#banner").hidden=true}
  },err=>{clearTimeout(timer);if(err?.code==="revoked")db=null;view()});
})();
