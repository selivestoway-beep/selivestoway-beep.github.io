  const cr=(R.cr??3)+m+sum("cr"),used=(P.armor?.t||0)+P.items.reduce((s,x)=>s+x.t,0),exc=Math.max(0,used-cr);
  const crWhy=`${R.cr??3} (раса) + Мощь ${m}${tail("cr")}. Несёт Тяжести: ${[P.armor&&P.armor.t?`${P.armor.name} ${P.armor.t}`:"",...P.items.filter(x=>x.t).map(x=>`${x.name} ${x.t}`)].filter(Boolean).join(" + ")||"0"} = ${used}`;

  for(const[k,dk]of[["m","dm"],["l","dl"],["r","dr"],["v","dv"]]){const val=10+eff[k]-(k==="l"?exc:0)+sum("dall")+sum(dk);
    cmp("Защиты",`Защита ${ST_GEN[k]}`,dk,S[dk],val,`10 + ${STN[k]} ${eff[k]}${k==="l"&&exc?` − перегруз ${exc}`:""}${tail("dall")}${tail(dk)}`)}
  if(R.sp!=null){const spv=R.sp+(exc?0:Math.floor(Math.max(0,l)/2))+sum("sp");cmp("Атрибуты","Скорость","sp",S.sp,spv,`${R.sp} (раса) + ${exc?"0 (перегруз)":`Ловкость ${l}/2 = ${Math.floor(Math.max(0,l)/2)}`}${tail("sp")}`)}

/* подставить расчёт в текст листа */
function fixBody(body,K){let b=String(body||"");const w=key=>K.list.find(x=>x.key===key&&x.st!=="ok"&&typeof x.want==="number")?.want;
  const sub=(re,fn)=>{b=b.replace(re,fn)};
  let x;if((x=w("hp"))!=null)sub(/(\*\*ОЗ\*\*\s*:\s*)([\dxх]+)\s*\/\s*([\dxх]+)/i,(_,p)=>`${p}${x}/${x}`);
  const e=w("en");if(e!=null)sub(/(\*\*Энергия\*\*\s*:\s*)([\dxх]+)\s*\/\s*([\dxх]+)(\([\dxх]+\))?/i,(_,p)=>`${p}${e}/${e}`);
  const ar=w("arm");if(ar!=null)sub(/(\*\*Броня\*\*\s*:\s*)([\dxх]+)\s*\/\s*([\dxх]+)/i,(_,p)=>`${p}${ar}/${ar}`);
  const h=w("heal");if(h!=null)sub(/(Рейтинг Исцеления\*\*\s*:)[ \t]*\d*/i,(_,p)=>`${p} ${h}`);
  const kz=w("kz");if(kz!=null)sub(/(\*\*Класс Защиты\*\*\s*[—–:-]\s*)\d+/i,(_,p)=>p+kz);
  const sp=w("sp");if(sp!=null)sub(/(\*\*Скорость\*\*\s*[—–:-]\s*)\d+/i,(_,p)=>p+sp);
  const cr=w("cr"),cu=w("crUsed");if(cr!=null||cu!=null)sub(/(\*\*(?:Переносимый Вес|Нагрузка)\*\*\s*[—–:-]\s*)(\d+)\s*\/\s*(\d+)/i,(_,p,a1,a2)=>`${p}${cu??a1}/${cr??a2}`);
  for(const[n,k]of Object.entries(ST_KEYS)){if(!K.list.some(c=>c.key==="st:"+k&&c.st==="err"))continue;const bs=K.st[k],ef=K.eff[k];
    b=b.replace(new RegExp("(\\*\\*"+n+"\\*\\*\\s*[—–:-]\\s*)(-?\\d+)(\\s*\\(-?\\d+\\))?","i"),(_,p)=>`${p}${bs}${ef!==bs?` (${ef})`:""}`)}
  for(const[k,n]of Object.entries({dm:"Мощи",dl:"Ловкости",dr:"Разума",dv:"Воли"})){const val=w(k);if(val!=null)b=b.replace(new RegExp("(Защита\\s*\\**\\s*"+n+"\\s*\\**\\s*:?\\s*)\\d+","i"),(_,p)=>p+val)}
  const am=w("acm");if(am!=null)sub(/(Атака в ближнем бою\s*[—–:-]\s*)[+\-−]?\d+/i,(_,p)=>p+(am>=0?"+":"")+am);
  const ac=w("acr");if(ac!=null)sub(/(Атака в дальнем бою\s*[—–:-]\s*)[+\-−]?\d+/i,(_,p)=>p+(ac>=0?"+":"")+ac);
  const ors=K.list.find(c=>/вписано число ОР/.test(c.t));if(ors)sub(/(Основные Пути\s*\()[XxХх]+(\s*Очк)/,(_,p,q)=>`${p}${ors.want}${q}`);
  return b;
}

function passFromSheet(body){const S=parseSaid(body),L=["# Паспорт для автопроверки. Строки «Ключ: значение», части через «|».","Раса: ","# своя раса: Раса: Орк | Здоровье 12 | Энергия 2 | Скорость 5 | Вес 3","Уровень: ","Легендарный уровень: "];
  for(const[n,k]of Object.entries(ST_KEYS))L.push(`${STN[k]}: ${S.st[k]?.base??0}`);
  const fromSheet=Object.entries(S.st).filter(([,x])=>x.eff!==x.base).map(([k,x])=>`Бонус: ${STN[k]} ${sgn(x.eff-x.base)} | из листа, укажите источник`);
  L.push("Доп. ОХ: 0","Доп. ОР: 0");
  for(const p of S.paths)L.push(`Путь: ${p.name} | ${p.lvl}`);
  const b=String(body||"");const am=b.match(/\*\*Требования:?\*\*:?\s*Тяжесть\s*(\d+)[\s\S]{0,200}?Класс Защиты\s*\+(\d+)[^\n]*?(\d+)%/i);
  const an=b.match(/\*\*Доспех\*\*\s*[—–:-]\s*([^\n*]+)/i)||b.match(/^[-*]?\s*\*\*([^*]*(?:доспех|латы)[^*]*)\*\*/im);
  if(am)L.push(`Доспех: ${an?an[1].trim():"Доспех"} | КЗ +${am[2]} | Тяжесть ${am[1]} | Броня ${am[3]}%${+am[1]>=3||/тяж[её]л|лат/i.test(an?.[1]||"")?" | тяжёлый":""}`);else L.push("# Доспех: Название | КЗ +3 | Тяжесть 3 | Броня 100% | тяжёлый");
  for(const m of b.matchAll(/^\*\*([^*\n]+)\*\*[^\n]*\n(?:[^\n]*\n){0,4}?[^\n]*Свойства:\*\*[^\n]*Тяжесть\s*(\d+)/gm))L.push(`Предмет: ${m[1].replace(/\s*\+\d+$/,"").trim()} | Тяжесть ${m[2]}`);
  L.push(...fromSheet);L.push("# Ячейка: Кольцо силы | эффект: Нагрузка","# Бонус: Ловкость +1 | Усиление Тела (инфузия)","# Бонус: Мощь +2 | Сверхъестественная Мощь   ← сверхъестественные не идут в точность","# Бонус: Здоровье ×1.5 | Героическая живучесть","# Бонус: Защиты +1 | Путь Авангарда, 2 уровень   ← все Защиты, кроме КЗ","# Бонус: Точность ближняя +4 | оружие Мастерское II");
  return L.join("\n")}


/* лист из Obsidian в разметку вики: каждая строка своим абзацем, вложенные списки плоские */
function sheetMd(b){const out=[];let prev="";const put=(x,kind)=>{if(kind!==prev&&out.length&&out[out.length-1]!=="")out.push("");out.push(x);if(kind==="p"){out.push("");prev=""}else prev=kind};
  for(const raw of String(b||"").replace(/\r/g,"").split("\n")){const t=raw.replace(/<br\s*\/?>/gi,"⟨br⟩").trim();let m;
    if(!t||/^-{3,}$/.test(t)){if(out.length&&out[out.length-1]!=="")out.push("");prev="";continue}
    if((m=t.match(/^#{1,2}\s+(.*)/))){put("## "+m[1],"h");prev="";out.push("");continue}
    if((m=t.match(/^#{3,6}\s+(.*)/))){put("### "+m[1],"h");prev="";out.push("");continue}
    if(t.startsWith("|")){put(t,"t");continue}
    if(/^\*\*[^*]+\*\*$/.test(t)&&!/^\s/.test(raw)){put("### "+t.slice(2,-2),"h");prev="";out.push("");continue}
    if((m=t.match(/^[*-]\s*(\S.*)$/))&&!/^\*\*/.test(t)||(m=t.match(/^-(\*\*.*)$/))){put("- "+m[1],"l");continue}
    put(t,"p")}
  return out.join("\n")}

let siteLog=[];
const LOG_MAX=300,HIST_MAX=30,HIST_BYTES=700000;
const ACT_N={create:"новая статья",edit:"правка",delete:"удалена",revert:"откат",accept:"принято предложение",base:"исходная версия"};
async function meId(){return GH?("gh:"+(gh.login||"ГМ")):(user?await user.id().catch(()=>null):null)}

/* хранилище: на GitHub отдельные зашифрованные файлы data/<путь>.enc.json, в артефакте коллекции базы */
const DPATH=p=>`${GH.dir}data/${p}.enc.json`;
async function ghGetFile(p){
  try{const j=await ghApi(`contents/${DPATH(p)}?ref=${GH.branch}&t=${Date.now()}`);let text;
    if(j.content)text=new TextDecoder().decode(b64dec(j.content));else{const r=await fetch(j.download_url+"?t="+Date.now());text=await r.text()}
    const env=JSON.parse(text);return{obj:env.ct?await decryptData(env,lock.key):env,sha:j.sha}}
  catch(e){if(e.status===404)return{obj:null,sha:undefined};throw e}}
async function ghPutFile(p,obj,sha,msg){const body={message:msg,content:b64enc(new TextEncoder().encode(JSON.stringify(await encryptData(obj,lock.key)))),branch:GH.branch};if(sha)body.sha=sha;return ghApi(`contents/${DPATH(p)}`,{method:"PUT",body:JSON.stringify(body)})}
async function pubGet(p){try{const r=await fetch(`data/${p}.enc.json?t=${Date.now()}`,{cache:"no-store"});if(!r.ok)return null;const env=await r.json();return env.ct?await decryptData(env,lock.key):env}catch{return null}}
const stPath=(kind,id)=>kind==="hist"?`hist/${id}`:kind;
async function stGet(kind,id){
  if(GH)return gh.token?(await ghGetFile(stPath(kind,id))).obj:await pubGet(stPath(kind,id));
  if(!db)return null;try{const s=await db.collection(kind).doc(id||"main").get();return s.exists?s.data():null}catch{return null}}
async function stUpdate(kind,id,fn,msg){
  if(GH){let last;for(let i=0;i<3;i++){const p=stPath(kind,id);const{obj,sha}=await ghGetFile(p);const next=fn(obj);try{await ghPutFile(p,next,sha,msg||"Служебное: "+p);return next}catch(e){last=e;if(e.status!==409&&e.status!==422)throw e}}throw last}
  const ref=db.collection(kind).doc(id||"main");const s=await ref.get();const next=fn(s.exists?s.data():null);await ref.set(next);return next}

function logEntry(slug,prev,doc,meta){return{s:slug,t:(doc||prev)?.title||slug,at:Date.now(),by:meta.by||null,act:meta.act||(doc?(prev?"edit":"create"):"delete"),d:String(doc?.body||"").length-String(prev?.body||"").length,n:meta.note||""}}
function pushVer(o,doc,prev,meta){o=o&&Array.isArray(o.v)?o:{v:[]};
  if(!o.v.length&&prev)o.v.push({at:prev.updatedAt||0,by:prev.updatedBy||null,act:"base",doc:prev});
  o.v.unshift({at:Date.now(),by:meta.by||null,act:meta.act||(doc?(prev?"edit":"create"):"delete"),note:meta.note||"",doc:doc||null});
  o.v=o.v.slice(0,HIST_MAX);while(o.v.length>2&&JSON.stringify(o).length>HIST_BYTES)o.v.pop();return o}
/* единая запись статьи: сама статья, лента и история */
async function commitDoc(slug,doc,meta={}){
  meta.by=meta.by||await meId();const prev=articles[slug];
  if(GH){await ghWrite(slug,doc,meta)}
  else{const ref=db.collection("articles").doc(slug);if(doc)await ref.set(doc);else await ref.delete();
    try{await stUpdate("meta","log",o=>({items:[logEntry(slug,prev,doc,meta),...((o&&o.items)||[])].slice(0,LOG_MAX)}));}catch{}}
  if(doc)articles[slug]=doc;else delete articles[slug];
  try{await stUpdate("hist",slug,o=>pushVer(o,doc,prev,meta),"История: "+((doc||prev)?.title||slug))}catch(e){console.warn("history",e)}
}
async function loadLog(){if(GH)return siteLog;try{const o=await stGet("meta","log");siteLog=(o&&o.items)||[]}catch{}return siteLog}

/* ---------- сравнение текстов ---------- */
function lcsOps(a,b){const n=a.length,m=b.length;let s=0;while(s<n&&s<m&&a[s]===b[s])s++;let e=0;while(e<n-s&&e<m-s&&a[n-1-e]===b[m-1-e])e++;
  const A=a.slice(s,n-e),B=b.slice(s,m-e),N=A.length,M=B.length;let mid=[];
  if(N*M>3e6)mid=[...A.map(v=>({t:"-",v})),...B.map(v=>({t:"+",v}))];
  else{const L=Array.from({length:N+1},()=>new Uint32Array(M+1));for(let i=N-1;i>=0;i--)for(let j=M-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
    let i=0,j=0;while(i<N&&j<M){if(A[i]===B[j]){mid.push({t:"=",v:A[i]});i++;j++}else if(L[i+1][j]>=L[i][j+1])mid.push({t:"-",v:A[i++]});else mid.push({t:"+",v:B[j++]})}
    while(i<N)mid.push({t:"-",v:A[i++]});while(j<M)mid.push({t:"+",v:B[j++]})}
  return[...a.slice(0,s).map(v=>({t:"=",v})),...mid,...a.slice(n-e).map(v=>({t:"=",v}))]}
function wordDiff(x,y){const ops=lcsOps(x.split(/(\s+)/),y.split(/(\s+)/));return ops.map(o=>o.t==="="?esc(o.v):o.t==="-"?`<del>${esc(o.v)}</del>`:`<ins>${esc(o.v)}</ins>`).join("")}
function diffHtml(oldT,newT){const ops=lcsOps(String(oldT||"").split("\n"),String(newT||"").split("\n"));
  if(!ops.some(o=>o.t!=="="))return `<p class="status">Текст статьи не менялся.</p>`;
  const rows=[];let i=0;
  while(i<ops.length){if(ops[i].t==="="){rows.push({k:"eq",v:ops[i].v});i++;continue}
    const dl=[],ad=[];while(i<ops.length&&ops[i].t!=="="){(ops[i].t==="-"?dl:ad).push(ops[i].v);i++}
    const k=Math.min(dl.length,ad.length);for(let j=0;j<k;j++)rows.push({k:"mod",h:wordDiff(dl[j],ad[j])});
    for(const v of dl.slice(k))rows.push({k:"del",v});for(const v of ad.slice(k))rows.push({k:"ins",v})}
  const keep=rows.map((r,j)=>r.k!=="eq"||rows.slice(Math.max(0,j-1),j+2).some(x=>x.k!=="eq"));
  let out="",skip=0;const flush=()=>{if(skip){out+=`<div class="df gap">… ${skip} ${plural(skip,"строка","строки","строк")} без изменений</div>`;skip=0}};
  rows.forEach((r,j)=>{if(!keep[j]){skip++;return}flush();if(r.k==="eq"&&!r.v.trim())return;
    out+=r.k==="mod"?`<div class="df mod">${r.h}</div>`:`<div class="df ${r.k}">${esc(r.v)||"&nbsp;"}</div>`});flush();
  return `<div class="diff">${out}</div>`}
const FIELD_N={title:"Название",summary:"Кратко",aliases:"Другие имена",facts:"Сведения",relations:"Связи",role:"Кто это",status:"Состояние",group:"Группа",category:"Раздел",image:"Картинка",epigraph:"Эпиграф",epigraphBy:"Чьи слова",caption:"Подпись"};
function fieldsDiffHtml(a,b){a=a||{};b=b||{};const rows=[];for(const[k,n]of Object.entries(FIELD_N)){const x=Array.isArray(a[k])?a[k].join(", "):String(a[k]??""),y=Array.isArray(b[k])?b[k].join(", "):String(b[k]??"");if(x!==y)rows.push(`<div class="fd"><span>${n}</span><div>${x.includes("\n")||y.includes("\n")?diffHtml(x,y):wordDiff(x,y)}</div></div>`)}
  return rows.length?`<div class="fds">${rows.join("")}</div>`:""}

/* ---------- предложения правок ---------- */
const PROP_PREFIX="KT1.";
const b64u=bytes=>{let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const b64uDec=str=>{str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const s=atob(str);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function zip(obj){const cs=new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream("deflate-raw"));return new Uint8Array(await new Response(cs).arrayBuffer())}
async function unzip(bytes){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return JSON.parse(await new Response(ds).text())}
async function encodeProp(p){return PROP_PREFIX+b64u(await zip(p))}
async function decodeProps(text){const out=[];for(const m of String(text||"").matchAll(/KT1\.([A-Za-z0-9_-]+)/g)){try{const p=await unzip(b64uDec(m[1]));if(p&&p.v===1)out.push(p)}catch{}}return out}
function makePatch(oldT,newT){const ops=lcsOps(String(oldT||"").split("\n"),String(newT||"").split("\n"));const P=[];
  for(const o of ops){const last=P[P.length-1];if(o.t==="="){if(last&&last[0]==="=")last[1]++;else P.push(["=",1,o.v.slice(0,40)])}else{if(last&&last[0]===o.t)last[1].push(o.v);else P.push([o.t,[o.v]])}}return P}
function applyPatch(text,P){const L=String(text||"").split("\n"),out=[];let i=0;
  for(const op of P){if(op[0]==="="){if((L[i]||"").slice(0,40)!==op[2])return null;for(let k=0;k<op[1];k++)out.push(L[i++])}
    else if(op[0]==="-"){for(const v of op[1]){if(L[i]!==v)return null;i++}}else out.push(...op[1])}
  if(i!==L.length)return null;return out.join("\n")}

  pe.draft=d;return d}

let glossCache=null;
function glossData(){const a=articles.glossariy;const key=a?a.updatedAt:0;if(glossCache&&glossCache.key===key)return glossCache;
  const items=[];for(const b of blocks(a?.body||""))if(b.t==="ul")for(const li of b.v){const m=li.match(/^\*\*([^*]+)\*\*\s*(?:\{([^}]*)\})?\s*[—–-]\s*(.+)$/);if(m){const term=m[1].trim();const forms=[term,...(m[2]||"").split(",").map(x=>x.trim()).filter(Boolean)];items.push({term,forms,def:m[3].trim()})}}
  const alts=[...new Set(items.flatMap(x=>x.forms))].sort((x,y)=>y.length-x.length).map(f=>f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const map=new Map();for(const it of items)for(const f of it.forms)map.set(f,it);
  glossCache={key,items,map,re:alts.length?new RegExp(`(?<![\\p{L}\\d'’])(${alts.join("|")})(?![\\p{L}\\d'’])`,"u"):null};return glossCache}
function glossify(root){const G=glossData();const r=route();if(!G.re||!root||r==="glossariy"||isMech(articles[r])||!articles[r])return;

  for(const pr of scope){const w=document.createTreeWalker(pr,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("a,code,h1,h2,h3,summary,.gl,.sp,.gm-secret,blockquote.epigraph,.tbl")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
    for(const n of nodes){let node=n;
      while(node){const re=new RegExp(G.re.source,"gu");let m,hit=null;while((m=re.exec(node.nodeValue))){const it=G.map.get(m[1]);if(it&&!used.has(it.term)){hit=m;break}}
        if(!hit)break;const it=G.map.get(hit[1]);used.add(it.term);
        const after=node.splitText(hit.index);const rest=after.splitText(hit[1].length);
        const sp=document.createElement("span");sp.className="gl";sp.tabIndex=0;sp.dataset.gt=it.term;sp.textContent=after.nodeValue;after.replaceWith(sp);node=rest}}}}

  d.style.left=Math.max(8,Math.min(window.innerWidth-w-8,r.left+r.width/2-w/2))+"px";d.style.top=(r.bottom+window.scrollY+8)+"px";glTip=d;

async function save(force){
  readForm();const e=editing,d=e.draft,ch=d.kind==="character";
  if(d.kind==="sheet"){d.category=SHEETS;if(!d.title.trim()&&articles[d.hero])d.title="Лист: "+articles[d.hero].title}
  const title=d.title.trim();
  const fail=m=>{e.warn=m;e.warnErr=true;rerender()};
  if(!title)return fail("Нужно название.");
  if(!ch&&!d.category)return fail("Укажите раздел.");
  if(ch&&!d.group)return fail("Укажите группу.");
  const clash=entries().find(([s,a])=>s!==e.slug&&norm(a.title)===norm(title));
  if(clash)return fail(`«${esc(clash[1].title)}» уже есть. <a href="#${clash[0]}">Открыть</a>`);
  if(e.slug&&!force){const cur=articles[e.slug];
    if(!cur)return fail("Эту запись удалили, пока вы её правили. <button class='btn' id='e-overwrite' type='button'>Создать заново</button>");
    if((cur.updatedAt||0)!==e.base)return fail("Кто-то изменил запись, пока вы её правили. Сравните в новой вкладке или сохраните свою версию поверх. <button class='btn' id='e-overwrite' type='button'>Сохранить поверх</button>")}
  const slug=e.slug||translit(title),prev=articles[e.slug||""];
  const me=GH?("gh:"+(gh.login||"ГМ")):(user?await user.id().catch(()=>null):null);
  const doc={kind:d.kind,title,category:ch?"Персонажи":d.category,summary:d.summary.trim(),aliases:d.aliases.split(",").map(x=>x.trim()).filter(Boolean),
    body:d.body.replace(/\r/g,""),epigraph:d.epigraph.trim(),epigraphBy:d.epigraphBy.trim(),image:d.image||"",caption:ch?"":d.caption.trim(),facts:(d.facts||"").replace(/\r/g,"").trim(),relations:(d.relations||"").replace(/\r/g,"").trim(),
    order:prev?.order??d.order??99,createdAt:prev?.createdAt||Date.now(),updatedAt:Date.now(),updatedBy:me};
  if(ch){doc.group=d.group;doc.role=d.role.trim();doc.status=d.status.trim()}
  if(d.kind==="sheet"){Object.assign(doc,{category:SHEETS,hero:d.hero||"",player:(d.player||"").trim(),calc:(d.calc||"").replace(/\r/g,""),review:(d.review||"").replace(/\r/g,"").trim()});
    const rv=doc.review!==(prev?.review||"");doc.reviewSys=rv?RULES_VER:(prev?.reviewSys||RULES_VER);doc.reviewedAt=rv?Date.now():(prev?.reviewedAt||0)}
  e.saving=true;e.warn="";rerender();
  const fp=e.fromProp;try{await commitDoc(slug,doc,{act:prev?"edit":"create"});if(fp){try{await inboxMark(fp,"ok")}catch{}}editing=null;if(route()!==slug)location.hash=slug;else view()}
  catch(err){e.saving=false;
    if(err?.code==="invalid_argument"&&canWrite!==true){writeRefused=true;fail("У вас нет прав на правку. Попросите владельца выдать вам доступ редактора.")}
    else if(err?.code==="quota_exceeded")fail("База вики заполнена. Удалите ненужные записи и попробуйте снова.");
    else if(GH&&err?.status===403)fail("Ключ пускает на сайт, но не даёт права записи. Откройте ключ на github.com/settings/personal-access-tokens, в «Repository permissions» у «Contents» выберите «Read and write» и сохраните. Новый ключ не нужен. Текст остался в форме.")
    else fail("Не удалось сохранить: "+esc(err?.message||"нет связи")+". Текст остался в форме.")}
}
async function remove(){const s=editing.slug;try{await commitDoc(s,null,{act:"delete"});editing=null;location.hash="";view()}catch(err){editing.confirmDel=false;editing.warn="Не удалось удалить: "+esc(err?.message||"нет связи");editing.warnErr=true;rerender()}}


/* ---------- GitHub: чтение и правки через репозиторий ---------- */
const SITE={repo:"selivestoway-beep/selivestoway-beep.github.io",branch:"main"};
const GH=(()=>{if(!location.hostname.endsWith(".github.io"))return null;let parts=location.pathname.split("/").filter(Boolean);if(parts.length&&/\.html?$/i.test(parts[parts.length-1]))parts.pop();const dir=parts.length?parts.join("/")+"/":"";return{repo:SITE.repo,branch:SITE.branch,dir}})();
const GH_KEY="kodeks.gh.token";
const gh={token:"",login:"",err:"",busy:false};
try{gh.token=localStorage.getItem(GH_KEY)||""}catch{}
const DATA_PATH=()=>`${GH.dir}data/articles.enc.json`;
/* закрытая вики: статьи зашифрованы ключом, ключ приходит в ссылке #k=… или вводится вручную */
const KEY_LS="kodeks.key";
const lock={key:"",env:null,state:"loading",err:""};
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function decryptData(env,pass){const k=await deriveKey(pass,b64dec(env.salt));const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64dec(env.iv)},k,b64dec(env.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function encryptData(data,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await deriveKey(pass,salt);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(data)));return{v:1,salt:b64enc(salt),iv:b64enc(iv),ct:b64enc(new Uint8Array(ct))}}
async function unlock(pass){
  const data=await decryptData(lock.env,pass);
  lock.key=pass;lock.state="open";lock.err="";try{localStorage.setItem(KEY_LS,pass)}catch{}
  articles=data.articles||{};siteLog=data.log||[];snapMeta={at:data.at||0};return true;
}
function lockHtml(){
  document.title="Кодекс Термины";
  if(lock.state==="loading")return `<div class="gut"><div class="inner gm gm-min"><p class="status">Открываем кодекс…</p></div></div>`;
  return `<section class="sky gut"><canvas class="skycv" aria-hidden="true"></canvas><div class="inner"><div class="eyebrow">Закрытая вики</div><h1>Кодекс Термины</h1><p class="lede">Кодекс открыт только для своих. Перейдите по ссылке-приглашению или введите ключ.</p>
  <div class="lock-row"><input id="lock-key" type="password" autocomplete="off" spellcheck="false" placeholder="Ключ доступа" aria-label="Ключ доступа"><button class="btn primary" id="lock-go" type="button">Открыть</button></div>
  ${lock.err?`<p class="lock-err">${esc(lock.err)}</p>`:""}</div></section>`;
}
async function tryUnlock(){const v=($("#lock-key")?.value||"").trim();if(!v)return;try{await unlock(v);view()}catch{lock.err="Ключ не подошёл.";view()}}
function b64enc(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b){const bin=atob(String(b).replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function ghApi(path,opt={}){
  const url=`https://api.github.com/repos/${GH.repo}`+(path?"/"+path:"");
  let r;try{r=await fetch(url,{...opt,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+gh.token,...(opt.headers||{})}})}
  catch(e){const x=new Error("NET");x.net=true;throw x}
  if(!r.ok){const t=await r.text().catch(()=>"");const e=new Error(r.status+" "+t.slice(0,160));e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
async function ghRead(){
  const j=await ghApi(`contents/${DATA_PATH()}?ref=${GH.branch}&t=${Date.now()}`);
  let text;if(j.content)text=new TextDecoder().decode(b64dec(j.content));else{const r=await fetch(j.download_url+"?t="+Date.now());text=await r.text()}
  const env=JSON.parse(text);
  return{data:env.ct?await decryptData(env,lock.key):env,sha:j.sha};
}
async function ghWrite(slug,doc,meta){
  let last;
  for(let i=0;i<3;i++){
    let cur={data:{articles:{}},sha:undefined};
    try{cur=await ghRead()}catch(e){if(e.status!==404)throw e}
    const data=cur.data;data.articles=data.articles||{};
    const prevDoc=data.articles[slug];if(doc)data.articles[slug]=doc;else delete data.articles[slug];
    if(meta)data.log=[logEntry(slug,prevDoc,doc,meta),...(data.log||[])].slice(0,LOG_MAX);
    data.at=Date.now();
    const body={message:(doc?"Правка: ":"Удалено: ")+(doc?.title||articles[slug]?.title||slug),content:b64enc(new TextEncoder().encode(JSON.stringify(await encryptData(data,lock.key)))),branch:GH.branch};
    if(cur.sha)body.sha=cur.sha;
    try{await ghApi(`contents/${DATA_PATH()}`,{method:"PUT",body:JSON.stringify(body)});articles=data.articles;siteLog=data.log||siteLog;return}
    catch(e){last=e;if(e.status!==409&&e.status!==422)throw e}
  }
  throw last;
}
async function shrink(file){
  if(file.type==="image/gif")return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1200/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/webp",.82));return b&&b.size<file.size?b:file}catch{return file}
}
async function ghUpload(file,slug){
  const blob=await shrink(file);
  const ext=blob.type==="image/webp"?"webp":blob.type==="image/gif"?"gif":blob.type==="image/png"?"png":"jpg";
  const name=`images/${slug}-${Date.now().toString(36)}.${ext}`;
  const bytes=new Uint8Array(await blob.arrayBuffer());
  await ghApi(`contents/${GH.dir}${name}`,{method:"PUT",body:JSON.stringify({message:"Картинка: "+slug,content:b64enc(bytes),branch:GH.branch})});
  return name;
}
function gmHtml(){
  document.title="Вход для ГМа · Кодекс Термины";
  if(!GH)return `<div class="gut"><div class="inner gm"><div class="eyebrow">Вход для ГМа</div><h1>Здесь не нужно</h1><p class="lede">Эта страница работает на сайте GitHub. В вики на claude.ai правки доступны владельцу и редакторам без входа.</p></div></div>`;
  if(gh.token&&gh.login)return `<div class="gut"><div class="inner gm"><div class="eyebrow">Вход для ГМа</div><h1>Вы вошли как ${esc(gh.login)}</h1><p class="lede">Кнопки «Редактировать» и «Новая статья» теперь видны на всех страницах. Каждая правка сохраняется в репозиторий, сайт обновляется у всех примерно через минуту.</p><div class="gmbar"><a class="btn primary" href="#">К вики</a><button class="btn" id="gm-logout" type="button">Выйти</button></div></div></div>`;
  return `<div class="gut"><div class="inner gm gm-min">
  <input id="gm-token" type="password" autocomplete="off" spellcheck="false" placeholder="сасай 333" aria-label="Код" ${gh.busy?"disabled":""}>
  ${gh.busy?`<p class="status">Проверяем…</p>`:""}${gh.err?`<div class="notice err" style="margin-top:var(--s3)">${esc(gh.err)}</div>`:""}</div></div>`;
}
async function gmLogin(){
  const t=($("#gm-token")?.value||"").replace(/[^\x21-\x7E]/g,"");if(!t){gh.err="";return view()}
  gh.token=t;gh.busy=true;gh.err="";view();
  try{const repo=await ghApi("");if(!repo.permissions||!repo.permissions.push)throw new Error("У этого ключа нет права записи в репозиторий.");
    const u=await fetch("https://api.github.com/user",{headers:{"Authorization":"Bearer "+t}}).then(r=>r.ok?r.json():{}).catch(()=>({}));
    gh.login=u.login||"ГМ";try{localStorage.setItem(GH_KEY,t)}catch{}
    try{const fresh=await ghRead();articles=fresh.data.articles||articles}catch{}
  }catch(e){gh.token="";gh.err=e.net?"Браузер не смог достучаться до api.github.com. Обычно мешает блокировщик рекламы, антивирус или VPN: отключите их для этого сайта или попробуйте другой браузер. Если открыт не сайт selivestoway-beep.github.io, а копия в Claude, вход там не работает.":e.status===401?"Ключ не подошёл. Проверьте, что скопировали его целиком.":e.status===404?"Ключ не видит репозиторий. Проверьте шаг с выбором репозитория.":(e.message||"Не удалось войти.")}
  gh.busy=false;view();
}

/* ---------- запуск ---------- */
view();
(async()=>{
  if(GH){
    const hm=location.hash.match(/^#k=(.+)$/);
    if(hm){lock.key=decodeURIComponent(hm[1]);history.replaceState(null,"",location.pathname+location.search)}else{try{lock.key=localStorage.getItem(KEY_LS)||""}catch{}}
    try{const r=await fetch(`data/articles.enc.json?t=${Date.now()}`,{cache:"no-store"});if(r.ok)lock.env=await r.json()}catch{}
    if(!lock.env){lock.state="locked";lock.err="Не удалось загрузить кодекс. Обновите страницу.";return view()}
    if(lock.key){try{await unlock(lock.key)}catch{lock.state="locked";lock.err=hm?"Ссылка устарела: ключ не подходит.":"";lock.key="";try{localStorage.removeItem(KEY_LS)}catch{}}}else lock.state="locked";
    if(lock.state!=="open")return view();
    if(gh.token){try{const u=await fetch("https://api.github.com/user",{headers:{"Authorization":"Bearer "+gh.token}});if(u.ok){gh.login=(await u.json()).login;const fresh=await ghRead();articles=fresh.data.articles||articles}else gh.token=""}catch{}}
    if(!editing)view();return;
  }
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [db,user,assets]=await Promise.all([use("db"),use("user"),use("assets")]);
  viewerChecked=true;
  if(user){try{canWrite=await user.can("data.write")}catch{canWrite=null}}
  if(!db){return view()}
  const timer=setTimeout(()=>{if(!live){$("#banner").hidden=false;$("#bannertext").textContent="База пока не отвечает, показываем сохранённую копию. Страница обновится сама."}},10000);
  db.collection("articles").onSnapshot(snap=>{
    if(snap.metadata.fromCache&&snap.empty)return;
    const next={};for(const d of snap.docs){const x=d.data();if(x&&x.title)next[d.id]=x}
    articles=next;live=true;clearTimeout(timer);
    if(!editing)view();else{$("#banner").hidden=true}
  },err=>{clearTimeout(timer);if(err?.code==="revoked")db=null;view()});
})();
</script>
