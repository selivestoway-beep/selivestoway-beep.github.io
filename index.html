ир своим присутствием вот уже больше четырёх столетий.\n\nЭто чудовище знакомо Героям Багерта практически с самого начала их истории: впервые они, ещё оригинальным составом, встретились в подземельях Столицы, где оболочкой Бенедикту служило тело знакомого [[Эрих Аскариос|Эриху]] паладина.\n\n## Природа\n\nБудучи особо древним Пожирателем Душ (см. [[Вампиры]]), он (она? оно?) существует в десятках или даже сотнях тел одновременно, фрагментируя собственную сущность. Характер существа значительно разнится от оболочки к оболочке, но тысячи поглощённых личностей делают своё: Бенедикт нестабилен и, не тратя огромное количество сил на самоконтроль, любое более-менее сильное его тело быстро скатывается до невменяемого чудовища.\n\n## Цели\n\nПомогает [[Конрад Селекаф|Конраду Селекафу]] с его планом. По собственным заверениям, намерен полностью избавиться от Голода и прочих недостатков бытия Пожирателем Душ, достигнув наконец абсолютного бессмертия. Поможет ли ему в том Желание, новорождённый Тёмный Повелитель или нечто иное — другой вопрос.\n\nНа время [[Война Червя|Войны Червя]] поддерживает с героями шаткое подобие перемирия, а также охраняет недостроенный Шпиль от любой силы, которая захочет захватить контроль над артефактом.\n\n## Реки Крови\n\nЕго Идея — Реки Крови, дающая Бенедикту полную Власть над любой кровью в пределах двух метров и одиннадцати сантиметров вокруг себя. Комбинация этой силы, мастерства в вампирских техниках и огромных трудностей с его окончательным убийством делает Бенедикта угрозой высочайшего класса, сравнимой с несколькими боевыми магами седьмого ранга.", "aliases": ["Бенедикт", "Элегия", "Владыка Крови"], "order": 3, "image": "images/benedikt.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793633557135, "updatedAt": 1793637826813, "updatedBy": null}, "edmund-govnarion": {"aliases": ["Эдмунд", "император Эдмунд"], "body": "Эдмунд был простым лирийским рыцарем и потерял всё в битве за Скуффеншильд. В лесу он собрал беженцев и ушедших в партизаны солдат, а потом к нему пришёл странный проповедник с горсткой оборванцев. Эдмунд принял их с большим сомнением. Этим проповедником был Пахом.\n\nОн стал одним из пятерых, кто вошёл в тронный зал Дир-Анремайна и сразил Чёрного Короля (см. [[Война Черной Короны]]). После войны он объединил почти весь [[Мерклейд]] в Мерклейдскую Империю и мечтал собрать человечество под одной верой. Империя пережила его лишь на несколько лет.\n\nРодом из Донии. Каждый второй повар герцогства уверяет, что знает его любимый рецепт, и рецепты эти друг другу противоречат. Его потомки правили [[Говнария|Говнарией]] до смерти короля Франца в 383 году.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Герои былых времён", "kind": "character", "order": 1, "role": "Император, герой Войны Чёрной Короны", "status": "Мёртв", "summary": "Лирийский рыцарь, который из вожака партизан стал императором всего запада.", "title": "Эдмунд Говнарион", "updatedAt": 1793633557135, "updatedBy": null}, "nebesnye-tela": {"aliases": ["Солнце", "Луна", "Алый Близнец", "Муна Нераманция", "Завеса", "Луна Чародеев"], "body": "- **Солнце** — Золотая Звезда, Око Творца. Дарует свет и тепло всему миру и, как знали еще древние антеренцы, является его священным центром. В отличие от светила Солнечной Системы, воистину обладает золотым цветом. Полностью состоит из Невозможной Энергии Великого, известного как Сияющий, настоящее солнце этой системы окончательно погибло несколько столетий назад.\n- **Закатон** — Первая планета, находящаяся немногим ближе к Солнцу, чем [[Термина]]. Практически не имеет океанов, большая его часть - огромная пустыня. Выделяется и своими двумя спутниками- т.н. \"низшими звездами\", огромными огненными шарами, движущимися вокруг Закатона, как Луны движутся вокруг Термины. Мудрецам известен как План Земли и Огня.\n- **Термина** — Вторая планета по удаленности от Солнца: прекрасный и многострадальный дом для бесчисленных рас и народов. Именно здесь и развернулась наша история. Планета чуть больше чем на ~15% превышает размерами Землю, однако, будучи в огромной мере полой планетой, сохраняет схожую гравитацию. Обладает плотным полем внутренней реальности, определяющим многочисленные внутренние законы, такие как концепция \"Основ\". Не имея \"ядра\" в классическом понимании, она находится достаточно близко к Солнцу, а Основа Ort генерирует достаточно тепла в Подземном Мире, чтобы планета могла избежать замерзания. Термина обладает тремя крупными континентами: Адон-Тирлейдд на Северном Полюсе; Срединный Континент, разделенный на четыре крупные части; и колоссальный, превосходящий оба предыдущих континента пустынный массив на обратной от Срединного стороне. Цивилизации замечены только на Срединном Континенте. Пространство под Срединным Континентом обладает множеством колоссальных каверн, известных как Великие Полости. Они и сеть соединяющих их тоннелей широко известны как \"Подземный Мир\".\n- **Muna Neramancia** — Также известная как Луна Чародеев - одна из двух лун Термины. Её цикл занимает ровно 37 дней - 1 месяц антеренского календаря. Обладает бледно-голубоватым цветом. Именно из нее многие астроманты черпают свои силы.\n- **Алый Близнец** — Кроваво-красная луна, внезапно появившаяся в небесах Термины в 383 году Второй Эры. Причины тому неизвестны, как и точная природа этого странного объекта. На самом же деле является т.н. Луной-Вампиром, поглощающим вим планет, на орбите которых находится. Поле Реальности Термины блокирует этот эффект.\n- **Иллигарт** — Третья и наиболее мрачная из планет, называемая астрологами Планом Скверны. Старые обсерватории Антерена хранят записи о том, что сия замерзшая планета покрыта колоссальными металлическими конструкциями неизвестного происхождения, но большая часть ее покрыта поглощающими любой свет черными облаками: сверхконцентрированными частицами Элемента Галата. Своими размерами в полтора раза превышает Землю, подробности неизвестны.\n- **Эфия** — Крупнейшая планета этой системы, предположительно полностью состоящая из неизвестного зеленого газа. Иные называют её \"Зеленым Оттенком\", но едва ли понимают природу.\n- **Шивгорот** —  Белый гигант, Пятая планета, покрыта вечными льдами и колоссальными горами, даже самые малые из которых многократно превосходят высочайшие горы Термины. В этом месте завывают лишь холодные ветра, но волшебниками была доказана и призвана жизнь с этой планеты: шивгороты, также называемые ледяными элементалями, происходят именно отсюда. Примерно 60% этой планеты затронуто Элементом Галата.\n- **Амакена** — Огромный, пустынный и полностью оскверненный шар камня и металла.\n\n*— Дегенеративный рисунок больного ДЦП маргинала из Битардии, иллюстрирующий звездную систему. Откуда в Битардии знают астрономию? Хороший вопрос. Следующий вопрос.*\n\n## Завеса, Бездна и еще одна Завеса\n\nВ 3 а.е. от Амакены начинается граница явления, известного как Завеса. Барьер, состоящий из неизвестной формы Таинственной Силы, проявляется во всех известных науке измерениях, фактически отделяя звездную систему от остальной Объективной Реальности, также известной как Внешний Космос.\n\nВ первую очередь благодаря демонологии человечеству стало известно истинное устройство Завесы - как, в том числе, и тот факт, что Завеса на самом деле не одна.\n\nМежду Внутренней и Внешней Завесами находится особенная реальность, известная как [[Бездна]], Эхандар или, в переводе с древневагра'анского, Расколотый Простор. Её законы значительно отличаются от остальной Объективной Реальности, а грань между материей и Таинственной Силой в лучшем случае размыта. В своем чистом виде представляет собой искаженное пространство, заполненное хаотичными бурями магии и нестабильной материи, однако внутри него, огражденные \"пузырями\" из Невозможной Энергии, существуют бесчисленные Осколки - небольшие участки стабильной реальности, зачастую обладающие собственными локальными законами.\n\nОбитатели Бездны широко известны во Внутреннем Плане как демоны.\n\nДабы не осталось путаницы: Внутренняя Завеса разделяет Внутренний План и Бездну, в то время как Внешняя Завеса, как ни странно, разделяет Бездну и Внешний Космос. Таким образом, Внутренний План отделен от Внешнего Космоса сразу двумя Завесами.\n\nТогда как Внутреннюю Завесу, с большим трудом, можно преодолеть специализированными способами по обе стороны, не существует ни одного свидетельства о преодолении Внешней Завесы, равно как и известий о том, чтобы хоть кто-либо, демон или человек, видел её вживую.\n\n## Что такое звезды?\n\nБольшинство звезд, какими мы их знаем, не имеют ничего общего с Солнцем. Не имеют они ни относительно-сферической формы, равно как и не могут называться полноценными \"небесными телами\".\n\nСогласно \"По ту сторону Завесы\" II Высшего Мага Улума аль-Бишкека, звезды представляют собой особые образования Мистической Силы на ткани Завесы, в которых та, предположительно, истончена. Точная причина их образования неизвестна и до сих пор остается предметом споров в научных и оккультных кругах.", "category": "Мир", "createdAt": 1793632093893, "order": 4, "summary": "Солнце, планеты системы, луны Термины, Завеса и природа звёзд.", "title": "Небесные тела", "updatedAt": 1793641859264, "updatedBy": null}, "vampiry": {"aliases": ["Пожиратели Душ", "Бенедикт", "Опустошённые", "Идея Крови"], "body": "Источник: Архивы Инквизиции,\n\nТакже известные как Пожиратели Душ, вампиры - одни из самых опасных созданий, известных во Вторую Эру.\n\nЧудовища, когда-то бывшие людьми. Маги Скверны, заигравшиеся с темными силами до тех пор, пока сами не стали их жертвой. Несчастные, чьи души были вытянуты иным вампиром, а тела искажены и обречены стать частью Сил Тьмы.\n\nКнига Света гласит, что первые вампиры появились во времена падения Антерена, и были первыми затронутыми созданным им Всем Злом Мира. Однако же, даже Инквизиторам известно: эти твари были известны еще до своей золотой эры, Темного Века, и всегда сопровождали человечество. Но именно во времена Золотого Века Осквернения они расплодились, из слухов и легенд превратились в кошмар наяву.\n\nСейчас, после Войны Черной Короны, большая часть могущественных Пожирателей Душ, известных как вампиры-лорды, истреблена, и лишь одно чудовище еще носит этот титул.\n\nПожиратель Душ начинает свой путь как **Опустошенный** — безмозглое, практически бездушное создание, движимое лишь диким голодом. Они рождаются в результате гибели Осквернителей от собственных сил, либо в случае если выпитая жертва вампира не смогла окончательно умереть.\n\nПостепенно Опустошенные набирают силы, поглощая души вместе с плотью своих жертв. Оскверненный Голод двигает их вперед, заставляя искать все новые и новые источники пропитания. [[Инквизиция]] выделяет три ранга Опустошенных:\n\n- **I: Оболочка** — Новообращенное создание, движимое одним-единственным инстинктом. Без контроля со стороны старшего вампира неспособно на хоть сколько-либо сложные действия. Вероятно, будет обладать даже меньшей силой, чем при жизни, за счет своей неуклюжести и безмозглости.\n- **II: Охотник** — Старшая оболочка, восстановившая часть более сложных функций. Куда более дикие и опасные твари, чем Оболочки, в отсутствие сира Охотники будут искать ближайший источник еды, а не стоять на месте. Элемент Галата начинает усиливать их естество, и Охотник с легкостью одолеет обычного человека.\n- **III: Ревенант** — Высшие опустошенные, восстановившие большую часть продвинутых функций. Все еще не полноценная личность, они обладают чем-то наподобие зарождающегося архетипа, основы новообразованной души. Силы Тьмы пропитывают Ревенанта, и он с легкостью разделается с несколькими тренированными солдатами.\n\nПосле многих лет охоты, из бесчисленных фрагментов поглощенных жертв, Опустошенный может развить в себе новую, уникальную личность, полностью возвращая интеллект и значительно возрастая в опасности. Это ознаменует начало его существования как **Вампира**. Это - фундаментально более высокая форма существования, и даже самый слабый Низший Вампир может в одиночку победить Экзекутора. Также, этих созданий делят на три категории:\n\n- **IV: Низший Вампир** — Новорожденный вампир. Начиная с этого ранга, из ряда \"объектов\" или \"животных\" в глазах вампиров он переходит в \"личность\". Практически всегда сир удерживает частичку сущности такого вампира у себя, гарантируя подчинение. Только вернув полную целостность, вампир может перейти к следующему рангу.\n- **V: Пожиратель Душ** — Истинный, свободный вампир. Помимо простого усиления, вампиры этого ранга способны использовать Элемент Галата для ряда особых техник, зависящих от сира и собственного мировосприятия. К таким относят превращение в туман, ходьбу по стенам, подчинение и многое другое. Согласно данным Церкви, Пожиратель Душ этого ранга способен победить нескольких Экзекуторов, работающих вместе.\n- **VI: Высший Вампир** — Могущественное и древнее создание, пожравшее тысячи сильных душ на протяжении сотен лет. Высший Вампир становится угрозой для крупных городов и требует слаженной работы элитных отрядов. Их уровень угрозы определяется не только огромным опытом, невероятными физическими силами и способностью контролировать небольшие армии Опустошенных, но также формированием **Идеи Крови** — особой, могущественной формы Личной Магии, не связанной законами Волшебства.\n\nНаконец, в истории существовало несколько исключений, чьи силы выходят за пределы шестиранговой системы. Экстраординарные существа по меркам экстраординарных существ, они выведены в отдельный тип:\n\n- **VII: Вампир-Лорд** — Высшие Вампиры запредельной мощи, достигшие особого мастерства в вампирских техниках и высочайшего понимания собственной Идеи Крови. К способностям Вампиров-Лордов относят возможность жить в нескольких телах одновременно, реконструировать себя из мельчайших фрагментов, командовать настоящими легионами Опустошенных и даже Вампиров вплоть до V ранга. Любой Вампир-Лорд является угрозой, требующей вмешательства профессиональной армии и всего Ордена Сияющего Меча. На сегодняшний день лишь один Пожиратель Душ занимает этот титул: Вампир-Лорд, известный как **[[Бенедикт Прокул Элегия]]**, чьей Идеей являются **Реки Крови**.\n\nИзвестно, что солнечный свет смертелен только для I и II рангов, а также ощутимо ослабляет III и IV. Более могущественные вампиры способны полностью игнорировать силы Ока Творца.\n\nВопреки расхожему мнению, вампиры **не являются нежитью**. Однако, ни в коем случае нельзя приравнивать их и к обычным живым созданиям: Элемент Галата исказил саму их сущность.\n\nИскусно манипулируя Скверной, вампир может обходиться без воздуха и выживать даже при самых экстремальных температурах.\n\nБлагодаря запредельной адаптации к Элементу Галата, вампир способен интуитивно использовать его для **укрепления**, **усиления** и **восстановления** собственного тела. Это позволяет достаточно могущественному вампиру ударом пробивать доспехи и разрушать каменные стены, обгонять конных всадников и уклоняться от арбалетных болтов - если они не решат просто принять их на сверхъестественно прочную кожу.\n\nНо даже у этих апостолов Скверны есть свой предел, после которого Элемент Галата становится враждебен и для них. При чрезмерном использовании вампирских техник в короткий, и они могут оказаться подвержены Мутациям Галата. По этой причине достаточно древние (либо достаточно безрассудные) вампиры рано или поздно перестают напоминать людей, превращаясь в ужасающие абоминации, что зачастую лишь увеличивает их опасность.\n\nПродвинутые вампирские техники, доступные истинным Пожирателям Душ, можно свести к двум типам: псионическим способностям и \"полезным\" мутациям. Искаженный, нечеловеческий разум древних вампиров естественным образом предрасположен к развитию психосил: достаточно могущественные вампиры с легкостью могут казаться невидимыми, подчинять слабые разумы, контролировать животных, наводить морок, создавать психические проекции и ментальные пространства.\n\nМутации же совершенно непредсказуемы: среди способностей охотники фиксировали возможности превращаться в туман или ужасных зверей, обрастать сверхпрочными наростами, превращать пальцы в бритвенно-острые когти и многое другое.\n\nИмеют вампиры и ряд выраженных слабостей. Таинственные Силы, известные в ряде традиций как **Свет**, естественным образом противостоят этим созданиям.\n\nЛюбые эффекты, полезные против созданий Скверны, помогут против вампира.\n\nПомимо того, чем больше растет могущество вампира, тем большее пропитание становится ему необходимо, пусть увеличивается и время, которое он может без него провести. Новорожденный вампир может не до конца выпивать одного человека в неделю и спокойно развиваться. В то же время, Высший Вампир может обходиться без еды многими месяцами - но после ему потребуется больше десятка жертв, от которых впоследствии останутся только кости.\n\nИзвестно, что наиболее всего вампира насыщает тот тип душ, что напоминает его самого или соответствует его внутренней модели мира. Пожиратель Душ, считающий себя воином, будет скорее заинтересован в поиске достойных противников, которых он съест при победе, нежели пожирании благородных дам.", "category": "Существа", "createdAt": 1793632093893, "order": 2, "summary": "Пожиратели Душ: семь рангов от Опустошённого до Вампира-Лорда.", "title": "Вампиры", "updatedAt": 1793641859264, "updatedBy": null}, "magicheskie-tradicii": {"aliases": ["Академия", "факультеты", "чудеса", "Аль-Хазиф", "Орден Мудрых", "Магия Хаоса"], "body": "Срединный Континент полон самых разных форм чародейства. Ни одна культура не избежала взаимодействия с магией, и многие из них развили собственные способы ей управлять. Столь они многочисленны и разнообразны, что ург'асский шаман и ливенский мистик, верно, и вовсе никогда не согласятся, что занимаются чем-то отдаленно схожим. Перечислять все это — безумная задача. Потому, ниже представлены примеры наиболее распространенных традиций и систем, значительно повлиявших на жизнь Континента.\n\n### Казацкая Волшебная Традиция\n\nМистическая школа, сформированная в Казакии — или же Мерклейдской Ассоциации Магов. Крупнейшее объединение чародеев Запада, Ассоциация выковала свой путь из сплава сотен разрозненных традиций, существовавших до нее. Сотни преследуемых чародеев нашли свое пристанище за Горами Архимага, и спустя полвека, сформулировали из разрозненных надстроек над Антеренской Теорией современные принципы классического волшебства. Конечно, все остальные объединения пока как-то не спешат признавать их \"классическими\", но, казаки верят, это дело времени.\n\nКлючевым принципом Ассоциации служит изречение её основателя — \"Маг не должен служить своей силе\". Именно оно, в том числе, определило, какие традиции в итоге стали шестью основными факультетами Академии:\n\n- **Серенитос**, Факультет Лунной Магии и Астрологии — Старейший факультет академии, основанный Лиореном Арканистом. Изучают сияние Муны Нераманции, одной из лун Термины, и специализируются на чарах холода и иллюзий. Этот же факультет уделяет наибольшее внимание \"общей\" магической теории.\n- **Мистриос**, Факультет Боевой Магии — Второй по старшинству факультет, основанный Ингвил Яростной. Магам Казакии была необходима защита во враждебном к Искусству мире, и Мистриос ответил на эту потребность. Ученики становятся гиперспециализированными военными чародеями, изучая боевые заклинания разных школ и участь применять их в сражении. Обычно, именно среди них ведется набор в Кристальные Рыцари.\n- **Транготеус**, Факультет Элементализма и Геомантии — Основанный Кантаром Дымящимся, этот факультет изучает силы Древа Основ — Огонь, Древо и Небо. Среди учеников ходит традиция полностью сосредотачиваться на одном из стихийных аспектов в ущерб двум остальным, подобно своему основателю. Пользуется дурной репутацией с тех самых пор, как Кантар стал ренегатом и демонопоклонником Пламени Хаоса.\n- **Виктерис**, Факультет Каменной Алхимии и Артефакторики — Созданный Алаундо Каменщиком, этот факультет сосредоточен на изучении тайн лунного камня, особенной породы, происходящей с Луны Чародеев. Ученики являются главными создателями артефактов, катализаторов и прочих магических технологий Казакии. Слабейший факультет в плане самого заклинательства, многие выпускники с трудом выходят за репертуар из десятка удобных чар. Самые... \"особенные\" из учеников стремятся повторить успех Алаундо, заменив большую часть тела на лунный камень и став \"Бескровным\" — практически вечноживущим чародеем, чьи жизненные процессы заменены магическими мерами.\n- **Сарантес**, Факультет Вимтауматургии и Магии Жизни — Молодой факультет, по совместительству самый малочисленный из них. Волшебники изучают Вим — необычную внутреннюю силу, присущую живым существам. Несмотря на репутацию магов крови и безумных ученых, большинство из выпускников Сарантеса — обычные лекари, а само обучение включает в себя познание анатомии и медицины.\n- **Балерикус**, Факультет Демонологии и Противостояния Темным Искусствам — Новейший из факультетов, о котором ходит наибольшее количество самых дурных слухов. Волшебники Балерикуса изучают Бездну и её созданий — демонов. Впрочем, по крайней мере для посторонних, демонологи продолжают утверждать, что делают это лишь для изучения мер противодействия. Нашли дураков, еще-б им кто поверил.\n\n### Магия Башни Слоновой Кости\n\nНа далеком юго-западе, в вечнозеленой Ринне, стоит Башня Слоновой Кости — жемчужина города Анголвена и оплот Ордена Мудрых, старейшей магической организации Запада. Строго говоря, казацкий чародей и волшебник Башни, вероятно, поймут друг друга, если станут обсуждать Искусство: обе традиции во многом являются надстройками над Антеренской Теорией. Перенявшие многие секреты южных алхимиков, адепты Ордена уделяют огромное внимание Первой Науке и элементализму Древа Основ, предпочитая использовать внутреннюю магию, содержащуюся в природных объектах.\n\nПомимо того, философия Башни делает значительно меньше различий между \"магией\" и \"обыденностью\", а ее адепты, почти всегда, столько же маги, сколько и ученые, историки, философы и советники.\n\nЧародеи Казакии нечасто контактируют с Орденом Мудрых, но их редкие встречи обычно не несут в себе вражды. Хотя, у каждого из объединений есть свой взгляд на коллег — мудрецы считают казаков оторванными от реальности фанатиками магии, а казаки, в свою очередь, без стеснения называют Орден Мудрых теоретиками и \"дилетантами широкого профиля\".\n\nМагия — часть мира, как верят мудрецы. Чтобы понять магию, нужно понять мир. Чтобы творить магию, с ним нужно взаимодействовать. Это отражает их подход ко всему: куда чаще члена Ордена можно увидеть как эмиссара в далеких землях или придворного чародея у дворянина, нежели запершегося в башне и изучающего секреты волшбы.\n\nВпрочем, не стоит считать, что в самом чародействе они совершенно посредственны. В сравнении, разве что. И все же, многие лекарства и эликсиры Запада были изобретены именно Орденом, а умелые адепты часто странствуют в компании собственноручно сделанного голема, защищающего мастера в пути.\n\nСчитается, что ряд идей идет из прошлого Ордена — как известно, ряд его со-основателей принадлежал к Конклаву Зеленого Пути из Ведории. Не имея конкретной магической системы (а потому и не упоминаясь в этом тексте, несмотря на свою многочисленность), вэллахани, или друиды, всегда считали мир живым, обладающим своей душой и своими силами.\n\n### Магия Церкви Света (и вопрос чудес)\n\nЧудеса — сложная вещь, особенно когда дело касается пахомианства. С одной стороны, наравне с Казакией, [[Церковь Света]] можно считать крупнейшей магической традицией всего Мерклейда, если не Континента. С другой же, ни один клирик не согласится называть свое искусство \"богомерзким волшебством\", а исторические особенности отношений сделали профессиональные дебаты... проблематичными.\n\nСравнивая чудо с заклинанием, отличие можно увидеть уже в методе его появления. Большинство известных чудес происходят из деяний Святых, догматов веры и подвигов героев древности, канонизированных в учениях Церкви: так, паладинское Благословленное Оружие отсылает к эпизоду из жизни сера Латимера Сияющего Меча, во время одной из битв поднявшего клинок к Солнцу и \"зацепившего луч Его так, что стал он оружьем его\". Прочтение строк из его жития и искренняя вера, судя по всему, действительно позволяет актуализировать историю в магический эффект, но едва ли кто-то знает, каким образом это удалось родоначальнику чуда.\n\nЕще сложнее все становится в тот момент, когда одна и та же история рождает несколько чудес-\"трактовок\". В начале сего текста было упомянуто *\"Святая Астрея обрушивает пламя на армию Врага\"*. Доподлинно известно, что разные клирики способны обратить эту историю как в огненный столп, так и в очищающее пламя, ранящее лишь демонов и тварей Скверны.\n\nС другой же стороны, не увидеть связь с классическими принципами магии может лишь слепой. Творение Чудес истощает мага схожим образом с заклинательством. Для усиления своей магии клирики используют освященные предметы (ну чем не катализаторы?), а с помощью священных благословлений им под силу создавать собственные артефакты. Каким-то удивительным образом, у разных людей проявляется разная склонность к чудесам: ну как будто-бы некий \"Дар\"! Наконец, \"Сила Творца\" — Сияние, приписывается Казакией к аспектам Таинственной Силы. По мнению академиков, \"чудеса\" могут быть иным подходом к построению заклинаний и взаимодействию с магией, но, так или иначе, проявлением той же Силы. Клирики же отвечают, что они могут сколько угодно разбирать последствия чуда, но объяснить само чудо останутся неспособны. Это если сочтут нужным ответить. Дискуссия, обычно, заканчивается немного иначе и быстрее.\n\nКогда-то, почти два с половиной века назад, любой жрец Церкви был, по совместительству, теургом, и сан неизменно был связан с мастерством в чудесах. Столетия относительного мира после Войны Черной Короны значительно снизили стандарты, и разве что каждый десятый рядовой священник будет способен воистину исцелить даже простую рану. Обычно, \"рядовым\" священником он после этого не останется. [[Казакия]] видит простую причину — жрецов Света в любом крупном королевстве может быть почти вдесятеро больше, чем всего населения в стране магии. Глупо ожидать, что каждый среди них будет обладать должным талантом. Лишь к 384 году, с реформами Понтифика Алистера, старые требования начали возвращаться.\n\nГоворя же о самой Церкви, её учение и традиции построены вокруг Замысла Творца, или же Небесного Порядка — истинного состояния мира, о котором поведал Пророку Пахому один из архангелов. Дабы Творец, ушедший из мира из-за его первородного греха, вернулся, слово Творца и истинная вера должны воцариться на всем Континенте.\n\nСами же клирики обычно объясняют свою силу так: Мир имеет истинное, задуманное Творцом состояние — Небесный Порядок. Человек же, в наши дни, живёт в мире, удалённом от этого состояния. Священная история хранит примеры того, как Порядок уже проявлялся в мире, а вера, понимание и воля клирика позволяют вновь актуализировать эти примеры, воплотив Замысел.\n\nБольшинство чудесных историй записаны в Священном Писании — Книге Света. Она описывает основные догматы веры и ключевые истории, а также объясняет пятерых Архангелов, оставшихся после ухода Творца.\n\n- **Аосар, Архангел Мощи** — Первый из ангелов, чье второе имя — Рука Создателя. Он — главнокомандующий небесных воинств. Он ведет героев на праведную войну. Его чудеса, что хранятся в священных книгах, призывают Мощь Света для защиты и наступления.\n- **Иммора, Архангел Истины** — Вторая из ангелов, чье второе имя — Мудрость Создателя. Она — хранительница небесных знаний. Она наставляет ученых на путь к познанию божественных истин. Ее чудеса, что хранятся в священных книгах, проливают Свет на тьму неведения, срывая покровы и очищая от дурмана и колдовства.\n- **Целестина, Архангел Исцеления** — Третья из ангелов, чье второе имя — Милосердие Создателя. Она исцеляет раны мира, и Она укрепляет тела и души страждущих. Ее чудеса, что хранятся в священных книгах, лечат тяжелейшие раны, унимают боль и ограждают от мора.\n- **Ориат, Архангел Правосудия** — Четвертый из ангелов, чье второе имя — Суд Создателя. Он отделяет добро от зла, вознаграждая первое и карая второе, и Он же дарует эту силу другим. Его чудеса, что хранятся в священных книгах, обличают виновных и сковывают врагов.\n- **Ланвэ, Архангел Славы** — Пятый из ангелов, чье второе имя — Посланник Создателя. Он — странник, что доносит Слово Творца миру и воспевает Небеса. Его чудеса, что хранятся в священных книгах, помогают в пути, доставляют послания и вселяют решимость в праведных.\n\n### Магия Аль-Хазифа\n\nКазакия считается магическим сердцем Мерклейда. Могут существовать сотни местячковых традиций и ведьмовских ковенов, насчитывающих три с половиной адепта, но, когда говорят о маге, почти всегда мерклейдцы представляют именно члена Ассоциации.\n\nПримерно то же самое происходит на Восточном Востоке с выходцами из Аль-Хазифа — старой школы колдовства и главного храма Каламоса, одного из трех речных богов Восточной Империи Асаладдинов.\n\nЗакрытость Казакии обеспечена её историей и отношением с Союзными Королевствами. Для Аль-Хазифа же расположение посреди бескрайней пустыне Ал-а-Гидэ — марка престижа. Желающему учиться надлежит пройти Путь Посвящения по пустыне, полагаясь лишь на собственные навыки и ум, и, коль претендент выживает, встречающий привратник впустит его без единого вопроса.\n\nУдобного способа обойти Путь Посвящения у этих магов нет, так что та же особенность служит им неплохой защитой от раздражающих имперских посланников и ревизоров.\n\nКаламос — бог Изменения и Разрушения. Он не дарует чудес, его потомки не сидят на Золотом Троне в столице Империи, но спроси любого адепта Третьего Бога, и любое колдовство по своей природе будет проявлением его аспекта.\n\nТрадиция Аль-Хазифа тесно связана с так называемой \"каламической алхимией\", посвященной трансформации сути вещей: колдун может передать легкость пера стальному доспеху и заклять два листа бумаги так, что написанное на одном из них проявится на другом, даже будь тот на другом конце города.\n\nКлючевой же их специализацией является артефакторика и магия колец — колдуны очень редко плетут заклятья на ходу, предпочитая закладывать Формирование в особые магические предметы. Как считают казаки, для каждого отдельного заклинания они создают сверхспециализированный катализатор.\n\nДемонология также активно практикуется хазифскими колдунами, хотя допускаются к этому только уважаемые и проверенные мастера. Многие сковывающие чары носят имена восточных чародеев, а вершиной мастерства считается умение заключить демона в предмет, сделав источником артефакта.\n\nОбучение разделено на два этапа: пар-селия и кха-селия, что можно перевести как \"низкое учение\" и \"высокое учение\" соответственно. Любой адепт может закончить пар-селию и уйти прочь по собственному пути за собственными же целями. Кха-селия, в свою очередь, требует принесения трех тайных клятв, делающих чародея частью каламического жречества и полноценным участником Аль-Хазифа, чья магия отныне должна помогать общему делу Тайного Храма. Тогда, колдун продолжает свое обучение, получая доступ к тем секретам, которые школа никогда бы не передала постороннему.\n\nИерархия Аль-Хазифа проще казацкой. Ты ученик, пока не закончил пар-селию. Ты колдун, когда сделал это. Ты Первый Чародей, если представляешь Тайный Храм и жречество Каламоса в Империи. Любые прочие детали: заслуги, прохождение кха-селии, ученичество у конкретного мага, предпочитаемая школа и все прочее — определяется знаками отличия, составляющими нерэйбу, сложный традиционный костюм волшебника.\n\n### Симмерийская Магия Путей\n\nМагия выше человека. Она творила историю и меняла судьбы. Как можно считать, что обычный смертный может быть выше подобной силы?\n\nСиммерийские колдуны не пытаются казаться теми, кем не являются. Они стремятся ими стать. Никто из них не мастер, но все они ученики сил, считаемых ими воплощением магической мощи — Драконов Запределья, за пределами Сетлейда более известных как Архидемонов.\n\nИх традицию также называют Магией Пути. Симмерийский волшебник, избрав своего Дракона, следует за ним и перенимает его взгляды, учится воплощать его Власть самым прямым образом. Избрав, к примеру, Дракона Хаоса, адепт будет стремиться понять Разрушение и Пламя, вплести их в каждый аспект своей жизни. И все же, это не слепое служение: главной целью мага остается обретение сопоставимой силы.\n\nУ симмерийцев существует свой собственный аналог понятия Таинственной Силы — восточный термин \"шинбхи\" (дословно - сокрытый свет) происходит из Серой Земли. В их культуре он ассоциируется с тайным знанием, которое можно увидеть в разных источниках: к примеру, в уже упомянутых Драконах.\n\nХотя это достаточно индивидуалистичная традиция, переходящая от наставника к ученику (или же от старшего ученика к младшему), последователи одного Пути нередко формируют храмы, где они могут познавать суть конкретного Дракона совместными усилиями. Драконьи маги также выполняют роль жречества в Симмерии, лишний раз портя репутацию страны в глазах иноземцев: для всех прочих Серая Земля навеки закрепилась в культуре как страна демонопоклонников.\n\nГрань между поклонением и практикой Магии Путей действительно тонка и таинственна. Наверное, это единственная крупная традиция, адепт которой согласится держать демона рядом, в не-скованном виде, и действовать с ним в общих интересах. Правители дозволяют такие союзы, пока это не переходит своих границ: все будут только за, если посланник дракона обучит придворного мага новым техникам или принесет пользу двору, но благосклонность и понимание могут закончиться, если по его совету чародей начнет нарушать порядок в городе.\n\nШесть Драконов Запределья известно в Серой Земле: **Нибурциаз**, Дракон Доминации, что учит видеть законы мира и понимать место каждой вещи; **Гимунх**, Дракон Хитрости, что учит отличать истину от иллюзии и использовать обе себе на пользу; **Шеелитрен**, Дракон Бессмертия, что учит сохранению того, что тебе дорого; **Кха-Деггаравос**, Дракон Хаоса, что посылает испытания и учит разрушению, необходимому для нового начала; **Этекку**, Дракон Тайн, что учит искать силу и смысл в неизвестном и неопределенном; **Ангарэн**, Дракон Жизни, что учит испытывать каждое ощущение, что предлагает мироздание.\n\nКонечно, достичь финального этапа Драконьего Пути никто пока не смог, и самые рьяные последователи обычно заканчивают смертную жизнь превращением в демона-прозелита, Дракон же становится для них уже не учителем, но однозначным владыкой. Останавливает ли это кого-то?\n\nШкола все еще существует и является одной из крупнейших на Континенте. Это ответ.\n\n## Особые случаи\n\n### Магия Круга Проклятых\n\n\"Ищи силу. Все остальное последует.\" — Так можно описать философию объединения, принесшего самые ужасающие из бедствий этому миру.\n\nНазываемые также **осквернителями**, они стремятся взаимодействовать с силой, известной как [[Галат]], Скверна, Губительная Сила или Все Зло Этого Мира — враждебной самому мирозданию магией, разрушающей и искажающей все, до чего сумеет докоснуться.\n\nБолее всего ужасна способность Галата осквернять саму Таинственную Силу, вплетая свою тьму в ее аспекты. Адепт Скверны может быть последователем любой другой традиции, и его колдовство будет ужасающим близнецом оригинала. В конце концов, даже сам адепт однажды ошибется и падет жертвой своей собственной силы — или превратится во что-то куда более извращенное.\n\nНеудивительно, что осквернители считаются худшими, наиболее безумными магами всего мира. Радикальные нигилисты, беспринципные безумцы, апокалиптические мегаломаньяки и чудовища в человеческих телах — даже зная, что их сила не делает исключений, подобные личности тянутся к темному свету Галата.\n\n[[Круг Проклятых]] — единственное известное объединение осквернителей, чьи корни уходят в Первую Эру, времена Антерена. Он был ключевой угрозой цивилизации Мерклейда во времена Войны Черной Короны, и, после своего поражения, рассеялся по всему миру, дожидаясь часа, когда новый Темный Повелитель восстанет, чтобы принести Эру Галата в мир.\n\n### Магия Хаоса\n\n*\"Категории? Традиции? Школы? Ну и ну... досадно, старина! Я считал тебя гораздо умнее. Магия течет везде: внутри и снаружи, внизу и наверху, в материи, духе, прошлогоднем снеге... да даже твоих сапогах! Ты же не делишь воздух по тому, кто им дышит, в конце-то концов. Оставь другим эти скучные условности и формулы — прислушайся к ее течению, позволь ему собраться в тебе и... просто выпусти. Возможно, чуть-чуть направив в нужную сторону. Это ведь так просто! Вот, видите, работае-\"*\n\n*— Казимир Безумный, малефикар, за несколько мгновений до магического катаклизма близ Аттеркопа, превратившего половину жителей деревни в свиноголовых пауков.*\n\nМагия Хаоса — Исключительно редкая магическая традиция, чья суть лежит в отказе от традиций. Предположительно идущая от Лорда Безумия Тивилдормина, эта неподвластная вменяемому человеку дисциплина использует все доступные Таинственные Силы вне зависимости от истока или аспекта для сотворения... чего-то. В не самых запущенных случаях — примерно контролируемое замыслом хаосита, заменяющим адекватное Формирование. Достаточно трудно предугадать, что произойдет в итоге.\n\nСам принцип, по которому работает Магия Хаоса — способ \"сопряжения\" мистических энергий — практически неподвластен здравому рассудку и не может быть повторен обычными академическими магами. Единственным казацким объяснением Магии Хаоса является возможность некоего ковенанта с самим Тивилдормином, чья Власть и позволяет этому невозможному процессу произойти.\n\nК счастью, большинство начинающих адептов Магии Хаоса не переживают первые три-четыре заклинания.\n\nИ слава Творцу.", "category": "Магия", "createdAt": 1793632093893, "order": 2, "summary": "Казакия, Башня Слоновой Кости, чудеса Церкви, Аль-Хазиф, Магия Путей и Магия Хаоса.", "title": "Магические традиции", "updatedAt": 1793641859264, "updatedBy": null}, "iskusstva-boya": {"aliases": ["Формы Эгиды", "боевые стили", "Путь Шторма", "Сокрушение", "Оплот"], "body": "**Кэль Ариатэ** — Также переводимое как Искусство Тысяч, Кэль Ариатэ было военной доктриной Антерена, в которой солдаты функционировали как, в первую очередь, многочисленные отряды защиты и поддержки Магам Истока — основной силе антеренской армии. Адепты Искусства Тысяч активно обучались строевому бою и кооперации: это было путем солдат, а не воинов.\n\n**Формы Эгиды** — Основное боевое искусство Антерена, подходящее скорее сражающемуся отдельно воину, чем бойцу в строю, где большая часть техник просто не может быть использована на полную. Формы Эгиды имели 6 основных стилей, известных и по сей день: огромная часть боевых искусств современности строится на Антеренском наследии.\n\n- **Стиль Сокрушения** — Боевой путь, начало которому было положено Владыкой Даниилом и его Львиными Рыцарями. Приоритизирует тяжелое оружие и, нередко, такие же доспехи, а в бою учит подавлять противника выверенными, могучими ударами. Этот стиль учит не ждать подходящего момента для решающего удара, а создавать его сокрушительным натиском. Несмотря на очевидные плюсы, требует огромной силы, скорости и выносливости, и теряет многие преимущества, если враг перехватит инициативу. Также, техники этого стиля можно назвать несколько предсказуемыми — что едва ли делает их менее опасными.\n- **Стиль Клинка и Посоха** — Стиль, использующий одноручный, легкий меч, который  используется в тандеме с волшебными чарами. Нередко применялся магами, желающими компенсировать присущую их роду занятий слабость в ближнем бою. Его главный плюс: исключительная универсальность и отсутствие явных слабых сторон. Минус вытекает оттуда же: редко адепты этого стиля достигали вершин как в пути меча, так и в колдовских искусствах.\n- **Стиль Оплота** — Стиль, требующий от адепта использования надежного щита, который, в  этой системе мышления, является даже более важным элементом, чем оружие. Беря многое из Формы Древа и эльфийских боевых искусств, философию этого пути можно описать как \"лучшее нападение - это защита\". Контратаки, удары щитом и использование щита, чтобы скрыть направление своих атак: всё это и многое другое известно адептам Оплота. Впрочем, первее всего в этой концепции была, собственно, сама защита: воин этого стиля мог легко и долго сопротивляться даже противнику, превосходящему его числом или навыком. Впрочем, стандартное использование этого стиля крайне реактивно, и если враг не сделает первого шага, с наступлением у адепта будут большие проблемы. В своей философии его можно назвать противоположностью Стиля Сокрушения.\n- **Стиль Ночи и Солнца** — Наиболее \"дуэльный\" из стилей, зачастую используемый с длинным мечом. Основная философия этого стиля — создание условий для одного-единственного удара, который поставит точку в поединке. Используя \"ночь\" - череду уловок, ложных ударов, слабых, прощупывающих оборону противника атак и парирований, адепт этого стиля подготавливает почву и выжидает момента для решающей атаки, в которую вкладывает все доступные силы.\n- **Стиль Горизонта** — Один из двух стилей Форм Эгиды, активно использующих дальний бой. И если для Клинка и Посоха возможности для него создает магия, адепты Горизонта активно применяют стрелковое оружие, прибегая к ближнему бою только как к самой крайней мере. Не стоит списывать этот стиль до простого \"стой как можно дальше и расстреливай врага\". Немалая часть этого стиля посвящена созданию дистанции, уклонениям и искусству стрельбы в движении: постоянная подвижность (подальше от противника) этим стилем не только приветствуется, но и требуется. Минусы стиля очевидны: если у врага все же получается сблизиться, противопоставить ему адепт может немногое.\n- **Стиль Истока** — Стиль, целиком и полностью созданный для боевых магов, рассматривающий волшебство как боевое искусство. Основным и, зачастую, единственным оружием адептов этого стиля была их собственная магия. Также называемый Военным Волшебством, этот стиль обучает применению колдовских сил в бою, умелому и быстрому применению защитных и атакующих чар, а также многому другому. В практике этого стиля маг может руководствоваться принципами иных Форм Эгиды: приоритизируя сокрушительный натиск, защиту и контратаки, уловки или же дальность и подвижность.\n\n## Современные Искусства Человечества\n\nКак было упомянуто ранее, большая часть современных боевых искусств имеет корни в Формах Эгиды: до сих пор называясь тем же именем, большая их часть все еще распространена на Срединном Континенте. Однако, существуют и исключения, придумавшие что-то свое, либо же достаточно изменившие свой первоисточник. О некоторых из них будет упомянуто ниже: чтобы охватить все, понадобится целая книга.\n\n### Мерклейд\n\n### Путь Сияющего Меча\n\nХоть Орден и не имеет \"единого стиля\", большая часть паладинов отдает предпочтение одной из двух Форм: Сокрушению или Оплоту. Формы Эгиды они дополняют чудесами Латимера, наполняя оружие Светом, ограждая себя от злого влияния и посылая вспышки губительной для нечисти силы. Такое смешение стилей быстро выматывает использующего, и ограничено в преимуществе против обычных противников, не связанных с нечистой силой.\n\nПускай нередко паладины путешествуют и сражаются в одиночку, все они обучены групповому бою.\n\nНаиболее сильные духом паладины черпают силу из Священных Клятв: Гейсов, увеличивающих их мощь в обмен на ряд принципов, которым воин будет следовать вовеки веков.\n\n### Кэль Фиретэ\n\nИскусство Очищения, которое исповедуют Экзекуторы, боевое крыло Инквизиции. Эта доктрина учит их использовать любое возможное преимущество: священные артефакты и механические инструменты, уловки и засады, особенности местности и даже эмоциональное состояние противника. \"Честный бой\" для них — иномирная и малознакомая идея, ибо любое сражение с магом по своей природе нечестно.\n\nПочти всегда Экзекуторы работают слаженной группой, в которой каждый занимает свою роль.\n\nКэль Фиретэ достаточно агностично к используемому оружию и зачастую дополняется личными наработками конкретного Экзекутора.\n\nСвою форму Искусства Очищения используют и Эмденские Охотники на Нежить.\n\n### Инланская дуэльная школа\n\nСтиль, основанный вокруг т.н. \"дуэльного меча\" — длинного, удерживаемого одной рукой клинка со сложной, отлично защищающей руку гардой, большая часть веса которого сосредоточена в рукояти ради максимальной управляемости.\n\nПостроенная вокруг быстрых выпадов и хитрых финтов, эта школа многое берет из Стиля Ночи и Солнца.\n\nНередко используется и второстепенное оружие, удерживаемое во второй руке: плащ, баклер или кинжал.\n\nПозднее распространилась дальше на Юг, сыскав большое уважение среди мастеров меча Алькондийских Островов и Золотого Побережья, а так приобретя десятки стилей-ответвлений. Пуристами Инлании большинство из них в лучшем случае считается забавной поделкой, а в худшем - кощунственным свинством.\n\nВ Варлейде схожими принципами руководствуется дуэльная школа Гираны — однако, ее адепты нередко используют во второй руке особый ручной щит с длинным шипом.\n\n### Формы Тьмы\n\nНечестивый боевой стиль, начало которому положил когда-то [[Нэриус Пронзающий]]: один из основателей современного Круга Проклятых и боец легендарной искусности.\n\nНе столько отдельное искусство, сколько подход, этот стиль учит бойца Форм Эгиды искать силу в темнейших эмоциях: ярости, ненависти, жажде крови, жестокой злобе. Даже собственную боль адепты Форм Тьмы превращают в источник могущества.\n\nИстинная мощь Форм Тьмы открывается для обладателей оскверненной крови или иного источника Галата. Питая Скверну внутри себя, такие воины могут достичь небывалой силы и контроля над темной энергией. Однако, как и у всех путей Скверны, у этой дороги лишь один конец.\n\n### Стиль Кристального Меча\n\nБоевое искусство элитных воинов Казакии — Кристальных Рыцарей, доводящих до совершенства Стиль Клинка и Посоха. Вместо принципа \"меч в одной руке, фокусировка в другой\", они используют особое оружие, уже являющееся катализатором волшебства: для них нет разделения между \"боевым искусством\" и \"магией\".  Рыцарей можно назвать своеобразным ответом церковным паладинам. Впрочем, как и [[Серебряные Рыцари]], последователи Гериона быстро выматываются, а исключительная фокусировка на чарах защиты и наступления делает их весьма ограниченными в любых прочих аспектах волшебства.\n\n### Путь Шторма\n\nХасситская интерпретация Стиля Сокрушения, отрицающая тяжелые доспехи в пользу еще большей скорости и подвижности. Этот стиль воплощает собой абсолютное наступление: враг вряд ли сможет что-то тебе сделать, если он мертв.\n\nОтдельным, величайшим мастерам этого стиля и впрямь удается призвать себе на помощь силу Вечного Шторма: к могучим ударам присоединяются волны стального ветра, а их и без того великая скорость лишь усиливается воздушными техниками.\n\n### Танцующий Меч Шема\n\nДревнее искусство, характерное для жителей Великой Степи. Отказываясь от тяжелых доспехов подобно хасситам, шемские мечники используют парные легкие сабли, совершая Танец Ветра — непрекращающийся шквал стремительных атак, совмещаемый с постоянными движениями вокруг противника. Во многом напоминая эльфийскую Форму Небес и Стиль Бури из Варлейда, этот стиль особенно смертоносен против множественных и/или легкобронированных противников.\n\nПримечательно, что шемские воины обычно владеют луком и мечом в равной степени, и уделяют такое же внимание верховому бою, как и пешему.\n\n### Искусство Драконоборцев\n\nРодом из Ринны, этот боевой стиль был создан не для сражений с человекоподобными противниками: его избранный враг — дракониды, вирмы и прочие создания Рода Драконов. Этот стиль держится на двух столпах: досягаемости и подвижности. Резкие, точные выпады длинными, тяжелыми копьями являются основой их боя. Минусы стиля очевидны: сверхспециализированное искусство, он никак не затрагивает бой с иными созданиями, включая гуманоидов.\n\nКрайне редко драконоборцы полагаются на тяжелые доспехи: от драконьих когтей и удара хвостом не спасают даже самые прочные латы, и куда больше ими ценится максимальная возможная мобильность.\n\nЭтот стиль также известен использованием особого оружия: копья драконоборцев, отличающегося длинным лезвием и широкой крестовиной — \"крыльями\" перед его началом.\n\n### Варлейд и Сетлейд\n\nОсновой Имперских боевых искусств также являются Формы Эгиды: в современный век, когда магия стала ощутимо реже, наиболее популярны стили Сокрушения, Оплота, Ночи и Солнца, и Горизонта. Но также варлейдцы причисляют к классическим Формам Эгиды и еще один стиль: Стиль Песчаной Бури.\n\n(Категория будет дополняться по мере актуальности. В Мерклейдской категории тоже упомянуто далеко не все, но тут еще меньше)\n\n### Стиль Песчаной Бури\n\nФорма Эгиды, сочетающая философию Сокрушения с нестандартным для него выбором оружия: адепты этого стиля используют одно легкое оружие — обычно скимитар, дабы ошеломить противника невероятной скоростью. В пару к скимитару обычно берется легкий щит.\n\nВ Кадании имеет свое ответвление как Стиль Змеиной Горы, использующий щит и одноручное копье с \"пламенеющим\" наконечником, нередко смазанное местными токсинами. Учитывая скорость и количество атак, хоть одна да попадет: врагу хватит задевания.\n\n### Стиль Кольца Воды\n\nСтиль религиозных бойцов Сатураса, изначально возникший в небольшой секте, охранявшей паломников на речных путях. Жречеству Сатураса запрещено клинковое оружие, и адепты Кольца Воды сосредоточились на использовании посоха. Дальность, универсальность в бою и вне его, а также дешевизна, законность и легкость в обретении сделали посох избранным оружием многих варлейдцев, и в современные дни Стиль Кольца Воды используется далеко не только своими создателями.\n\nТогда как новички в этом стиле используют только как длинную палку, хватаясь за один конец и с силой атакуя другим, мастера Воды орудуют всеми его концами: крутясь вокруг адепта, посох едва ли не живет своей жизнью, обеспечивая идеальный баланс защиты и досягаемости. Впрочем, это все еще деревянный посох: не стоит ждать от него невозможного.\n\n### Путь Звериного Сердца\n\nИнстинктивный, \"звериный\" стиль, берущий свое начало у варваров Сангмарской Пустоши, что в Голланте. Беря вдохновение из движений древних сангмарских львов, это искусство нередко используется вместо с особым оружием: боевыми когтями.\n\nДикие, звероподобные движения этих воинов, включающие в себя множество резких рывков, часто сбивают врагов с толку, а сочетающие скорость и силу атаки, схожие со стилем Песчаной Бури, превращают секундное замешательство в неминуемую гибель.\n\nОднако, если психологический фактор не срабатывает, этот стиль зачастую проигрывает более \"цивилизованным\" Формам Эгиды.\n\n### Стиль Гаитина\n\nСтиль ассасинов с горы Гаитина, включающий в себя бесчисленное множество хитрых уловок. Настолько же искусство боя, насколько и школа мысли, этот стиль включает в себя изучение скрытности, алхимии ядов и анатомии. Адепты мастерски используют кинжалы, метательные ножи и прочий ряд оружия, которое подходит для скрытого ношения.\n\nСхожие искусства нередко используются самыми разными негодяями, но все они очень-очень плохо подходят для прямого боя с мастером.\n\n### Стиль Алмазного Тела\n\nОсобое искусство, по легенде, созданное легендарным противником с рабством. Не полагайся ни на что, кроме собственного тела: меч может сломаться, доспехи — заржаветь, а любой инструмент отнят рабовладельцем. Но, пока ты жив, твое тело продолжит тебе служить.\n\nАдепты Алмазного Тела закаляют себя тяжелыми тренировками, превращая собственный организм в смертоносное оружие. Одной из их техник является техника Железного Кулака: после бесчисленных ударов по каменным стенам руки адепта становятся способны без всякого вреда для себя дробить камень и вековые деревья.\n\n### Пляска Огненной Крови\n\nЛегендарный валлатрийский стиль, по старой традиции практикуемый только женщинами — они обычно и становятся воинами в Валлатрийском обществе.\n\nВключает в себя использование легкого клинкового оружия и особой смеси, известной как валлатрийская румяна, вызывающей обильное кровотечение при малейшем порезе.\n\nВеличайшим воительницам хватает искусности использовать т.н. \"уруми\" — меч-хлыст, совмещающий бритвенную остроту и огромную дальность поражения.\n\n## Гномьи Искусства Боя\n\nВо многом, гномьи боевые искусства напоминают по своей философии не-магические Формы Эгиды — с поправкой, конечно, на размер. Однако, и в этом обществе существует ряд отличий и особенных решений.\n\nВо-первых, практически каждый гномий воин, вне зависимости от стиля и избранного оружия, уделяет время обучению с оружием, известным как \"доркий\" — пещерный клинок, который можно отнести либо к очень длинному кинжалу, либо к очень короткому мечу. Обычно используемый в паре с щитом, он идеально подходит для боя в узких и тесных туннелях.\n\nКогда дело касается открытых пространств, гномы, напротив, склонны использовать максимально длинное древковое оружие: низкий рост они компенсируют досягаемостью.\n\nВажно отметить: в сравнении с Вечным Королевством и Антереном, гномьи традиции индивидуальных боевых искусств заметно уступают. Однако, они значительно компенсируют это своим мастерством в отрядном бою: используя такие формации как \"Яростный Огонь и Хладный Пепел\" - слаженную работу мастеров Сокрушения и Оплота, бойцы сражаются с многократно большей эффективностью, чем по отдельности.\n\nНемалый акцент также делается на огневой поддержке и использовании автоматонов: вещей, без которых гномья армия практически немыслима. Воистину, они скорее солдаты, чем воины: но солдаты высочайшего качества.\n\nХотя, конечно, это не означает, что среди гномов отсутствуют мастера боя: история (гномья, из-за их политики изоляции) знает достаточно бойцов гаркамму, преследовавших совершенства в Формах Эгиды.\n\nПолуросликов следует упомянуть отдельно: этот народ достиг своего совершенства в простом и удивительно могучем оружии: праще. Именно стрельбу из нее они используют для охраны своих горных пастбищ, а джигиты, спускающиеся во внешний мир, всегда рады показать применимость своего ремесла и в реальном бою.\n\nВторостепенным оружием они используют особый кинжал, являющийся дальним родственником доркия.\n\n## Искусства Боя Адонари\n\n### Паттерны Истинного Меча\n\nОдно из Совершенных Искусств, существовавших во времена Вечного Королевства. Паттерны нельзя назвать простым стилем боя: скорее, наукой войны, позволяющей подобрать идеальное движение, основываясь на количестве, подготовке, вооружении и типе противников, а также особенностях местности. Подбери верную технику — и в одиночку ты одолеешь десятерых, не получив ни единой царапины. Допусти малейшую ошибку в своих суждениях — и твое поражение, либо, по крайней мере, попадание в очень тяжелую ситуацию практически гарантированно.\n\nПаттерны не так полезны в битве один на один: основной целью этой науки было позволить одному превзойти многих. [[Эльфы]], неспособные брать числом, были вынуждены идти по пути совершенства.\n\nНасчитывая более семнадцати тысяч движений и предоставляя конкретный ответ на каждую специфическую ситуацию в сражении, Паттерны Истинного Меча не могут быть выучены короткоживущими расами: их можно назвать величайшим достижением эльфийских рыцарей. В дни Второй Эры Паттерны сохранились лишь как инструмент бессмертных: горстки сохранившихся райтриари и последних адонари. Даже современным ветвям эльфов не хватит срока жизни, чтобы освоить это искусство целиком.\n\n### Эн'Каэ'Та\n\nВторое Совершенное Искусство, практикуемое адонари. Также называемое \"Единый Священный Путь\", Эн'Каэ'Та было родственником и идейной противоположностью Паттернам: ритуализированным искусством поединка.\n\nСей боевой путь учил адептов отрешиться от всего вокруг, сузив мироздание до себя и противника. Достигая сверхъестественной концентрации, воин мог парировать даже молниеносные атаки, отвечая выпадами запредельной точности.\n\nФокус Эн'Каэ'Та был и его главной слабостью: эффективно пользоваться его техниками против нескольких противников если не невозможно, то чрезвычайно трудно.\n\nПомимо того, для максимальной эффективности техник, адепты Эн'Каэ'Та брали на себя Гейс, требовавший взаимного соблюдения воинами сложного кодекса чести — при условии, что противнику и самому не чужда честь. Догматы включали в себя неприемлемость скрытных атак и иных бесчестных тактик, необходимость вооружить безоружного противника, и, что очевидно, сражение лишь один на один. Этот аспект Эн'Каэ'Та зачастую упускается поздними его практиками: критики среди эльфов замечают, что следовать кодексу далеко не столь удобно, когда тебя не ждет возрождение в Древе.\n\nСовременные практики Единого Священного Пути достаточно редки, но многие его техники легли в основы современных боевых искусств.\n\nОба искусства включали в себя три основных Формы: Форму Огня, посвященную владению тяжелой глефой, Форму Древа, посвященную владению мечом и щитом, и Форму Небес, посвященную владению парными клинками\n\n**Форма Огня** учила совершенному использованию досягаемости и разрушительной силы двуручного оружия. Идеальный воин Огня должен всегда держаться вне зоны поражения врага, атакуя его сокрушительными ударами.\n\n- Эта Форма сыскала особое уважение среди аэкларских бойцов, наиболее искусных с длинными копьями и глефами.\n- Эта же философия легла в основу сложного стиля боя змеелюдов (позднее перенятого и нагами для подводного боя), использовавшего их природную мобильность и досягаемость за счет длинного хвоста в совокупности с копьем или трезубцем.\n\n**Форма Древа** являлась воплощением баланса, уча совершенной связи между атакой и защитой. Идеальный воин Древа — стальная крепость, любая попытка поразить которую тут же заканчивается выверенной контратакой.\n\n- Впоследствии, многие аспекты Формы Древа были переняты Домом Митран среди незетари, а лучшими их бойцами — Призрачными Стражами — была создана особая версия этой формы, возводящая оборону в абсолют и дополняющая ее псионическими техниками ограждения.\n\n**Форма Небес** видела преимущество в подвижности — достигая практически сверхъестественной скорости, воин Небес использовал для наступления оба своих клинка, уклоняясь от любой атаки, и в каждом смещении видя возможность для нового выпада. Наиболее редкая форма, Небеса требовали от своего адепта исключительной координации и выносливости: идеальное владение этой Формой не признавало остановки даже на самый краткий миг.\n\n- Среди Незетари, величайшего мастерства в Форме Небес достиг монастырь Векс Раддайт, чьи адепты смогли аугментировать свою мобильность применением телекинеза на самих себе.\n\nВопреки всем современным стереотипам, луки, как и любое дальнобойное оружие, во времена Вечного Королевства считались второ-, а то и третьестепенной вещью. Функции дальнего боя отлично замещало владение Песнью Творения, а в священной дуэли подобные инструменты и вовсе были категорически неприемлемы. Позднее, после Раскола и Увядания, этот принцип радикально переменился: лук стал одним из основных оружий в культуре лунных эльфов, а незетари повсеместно начали использовать арбалеты - лишь чаще после Кризиса Ложной Королевы. [[Райтриари]] здесь достойны отдельного упоминания: почти вся их военная доктрина крутится вокруг дальнего боя.\n\n## Вор Дэтра\n\nОрочье боевое искусство и военная доктрина, обладающая ключевой особенностью: они не изучают её извне, а познают уже вложенные в их генокод навыки.\n\nИзвестны три основные ветви, по которым может пойти развитие орка:\n\n- **Урх'Рокка** — Прирожденные воины, обладающие еще более сильной регенерацией и умением входить в особый боевой транс, позволяющий не чувствовать боли и выходить за обычные пределы тела.\n- **Фар'Рокка** — Стрелки и умелые разведчики, обладающие значительно обостренными чувствами. Иные Фар'Рокка пробуждают в себе особую способность, позволяющую им получить часть знаний и воспоминаний съеденного существа.\n- **Тан'Рокка** — Командиры, обладающие врожденным пониманием военной тактики и стратегии. Неизвестно, каким образом действует эта способность, но к их приказам практически инстинктивно прислушиваются прочие [[Ург'ас]].\n\nВ современные дни, по неизвестным причинам Вор Дэтра медленно развивается, адаптируясь по изменившиеся условия мира. Уже во времена Готлока Разорителя, отметились особые, ранее не встречаемые подвиды:\n\n- **Гаэн'Рокка** — Орки, обладающие врожденным пониманием многочисленных механизмов войны: баллист и таранов, требушетов и многого другого. Стезя, ранее занимаемая только гоблинами, стала проявляться в этом виде Ург'ас вместе с возрастающей \"независимостью\" зеленокровных друг от друга.\n- **Гхол'Рокка** — Искаженные скверным колдовством орки, развивающие в себе врожденное, инстинктивное понимание Магии Галата. Единственный подвид, создаваемый благодаря внешнему воздействию: результат нечестивого союза Готлока и Черного Круга. В настоящее время практически вымерли, а секреты их создания помнят только колдуны Круга Проклятых.\n\nСам же боевой стиль орков достаточно прост и, можно сказать, примитивен: в нем практически нет сложных приемов или хитрых техник, траектория ударов понятна. Однако, примитивен - не значит безопасен. Простоту они компенсируют безумной, нечеловеческой мощью: даже стальные щиты и полные латы нередко ломаются от одного-двух орочьих ударов.\n\nВо времена Войны Черной Короны людям отлично запомнились особые орочьи фальшионы, один удар которыми мог разрубить всадника вместе с лошадью на две части.\n\nНесмотря на огромную природную крепость, некоторые орки используют свою силу, чтобы нацепить на себя как можно больше самых тяжелых доспехов. Такие воины превращаются в ходячие крепости, которых может поразить только самое могучее оружие.", "category": "Бой", "createdAt": 1793632093893, "epigraph": "Враг вряд ли что-то тебе сделает, если он мёртв.", "epigraphBy": "Принцип Пути Шторма", "order": 1, "summary": "Формы Эгиды Антерена и выросшие из них стили людей, гномов и эльфов.", "title": "Искусства Боя", "updatedAt": 1793641859264, "updatedBy": null}, "skverna": {"aliases": ["Галат", "осквернители", "Губительная Сила", "Владыка Скверны"], "body": "Скверна, она же элемент **Галат**, Губительная Сила или «Всё Зло Этого Мира», — магия, враждебная самому мирозданию. Она разрушает и искажает всё, чего касается, и, что хуже всего, умеет осквернять саму Таинственную Силу. Любая традиция в руках осквернителя становится чудовищным близнецом себя.\n\nПо Книге Света, Скверна родилась при падении [[Антерен|Антерена]]. Её связывают с полумифическим **Владыкой Скверны**, Тёмным Повелителем Эры Антерена, и его Легионом Тьмы.\n\n## Осквернители\nИх считают худшими магами мира: нигилисты, безумцы, мегаломаны. Рано или поздно сила берёт своё, и адепт гибнет или превращается в нечто хуже. Погибшие от собственной силы могут стать Опустошёнными, первой ступенью [[Вампиры|вампира]].\n\n## Шрамы и мутации\n[[Люди|Мерклейдцы]] устойчивы к Галату, но если он побеждает, шрамы у них самые страшные. Даже вампиры, использующие Скверну как родную, при перегрузке получают мутации.\n\n## Где ещё\nЦелые планеты системы затронуты Галатом (см. [[Небесные тела]]). Тёмный стиль Форм Тьмы питается им (см. [[Искусства Боя]]). Конечная цель культа — Эра Галата, см. [[Круг Проклятых]].", "category": "Магия", "createdAt": 1793632093893, "order": 3, "summary": "Галат, Губительная Сила: враждебная мирозданию магия, осквернители и их судьба.", "title": "Скверна", "updatedAt": 1793632093893, "updatedBy": null}, "vedoriya": {"aliases": ["Вольные Княжества", "Истар", "Эскаран", "винджен", "Устакол"], "body": "Также известна как Вольные Княжества Ведории или просто Вольные Княжества, в древние времена Темного Века Ведория была раздробленной территорией, за которую практически беспрерывно сражались малые кланы и варварские королевства, рождающиеся и гибнущие каждое десятилетие, по самой меньшей мере.\n\nИ пусть со временем ситуация неспешно стабилизировалась и сама по себе, в конце-концов единство ее было достигнуто только к началу Войны Черной Короны в 113 году Второй Эры, когда, усилиями Конклава, было созвано первое в истории Большое Собрание в Эскаране, на которое были приглашены правители каждого из более-менее влиятельных княжеств.\n\nДоговоры, что были приняты тогда, позволили Ведории выстоять против натиска Черного Короля, а также окончательно утвердили общий уклад, по которому народ живет до сих пор: уклад, гарантирующий как свободу отдельно взятых княжеств, так и общую взаимопомощь в случае любой внешней угрозы.\n\nСреди иноземцев Ведория известна своим суровым и неприветливым климатом — и, как поговаривают злые языки, такими же жителями.\n\nВедорцы, коренные народы этой земли — закаленные жизнью индивидуалисты, отрицающие традиции Союзных Королевств и практически никак не затронутые своим временным членством в Мерклейдской Империи. Пахомославной Церкви и новым порядкам нет места в этом уголке старых времен: загадочная магия и странные духи дремлют здесь на каждом шагу.\n\n## Княжества\n\n- **Истар** — Центральное княжество, чья столица возведена у одноименного озера — крупнейшего во всем Срединном Континенте. Столица Истарского Княжества построена на Антеренских руинах, и это единственное княжество, также имеющее магическую гильдию помимо Конклава.\n- **Устакол** — Одно из крупнейших княжеств, также граничащее с Побережьем Когтя, Устакол известен одними из лучших лучников во всем Мерклейде, а также совершенно непроходимыми лесами. Некоторые говорят, что дух Ведории в Устаколе еще более древний и тяжелый, чем во всех прочих землях. Мало кто говорит, что это должно значить.\n- **Исмирал** — Граничащее со Скотославлем княжество, управляемое Кастагаром Сильным. Исмирал - истерзанная многими войнами земля, принимавшая на себя бесчисленные удары Говнарии. Умелые бойцы, жители Исмирала недолюбливают Союзные Королевства. Как сосед Каалагонским Горам, Исмирал больше других страдает от нашествий пещерных ящеров. В древности известное как Миралука, когда-то это было центром языческого поклонения Небесам и ветру.\n- **Саргот** — Одно из княжеств Залива Когтя, Саргот известен великолепными мореплавателями. Купцы Саргота - одни из немногих видевших побережья Кармина и торговавших с Иверном. Жители Саргота особо почитают море и считаются одними из самых открытых к чужакам.\n- **Дармосс** — Княжество, известное своим Озерным Городом, великолепным речным транспортом и особо гнусными купцами. Дармоссцы известны за свое лодочное дело, интриганство и умение быть полезными всем, оставаясь верными никому.\n- **Ривачег** — Граничащее с Рейклейдскими равнинами, Ривачежское княжество было одним из главных участников Ведорской Войны с Союзными Королевствами. Они отважно сражались против восточных соседей, но стали близким союзником Лигордену после Рейклейдского Восстания. Возможно неосознанно, но за долгую войну и периоды мира союзная культура оставила свой след на культуре Ривачега\n- **Алерот** — Новое княжество, представляющее собой одноименный вольный город, населенный в основном гномами и лесными эльфами, ушедшими из Плотнолесья. Оставив за спиной предрассудки и века изоляции, жители Алерота стремятся влиться в цивилизацию.\n- **Сентир** — Далекое южное княжество близ Земель Коневодов и Теневых Земель, практически весь Сентир покрыт непроходимыми горами и чуть более проходимыми холмами, за что регион носит название Страны Тысячи Гор. Поселения сентирцев расположены в долинах, а живут они кланами. Князем Сентира выбирается глава самого влиятельного из кланов. О сентирцах ходит недобрая молва за их суровый нрав, изоляцию и склонность к клановым войнам в пределах своего же собственного княжества. Сентирское наречие многое подчерпнуло из гномьих языков и мало кем понимается за пределами княжества. Среди сентирцев довольно много гномов.\n- **Вегир** — Самое северное из княжеств, расположенное в негостеприимной Долине Морозного Тумана — регионе на границе с Готтлейдом. Вегиры, за редкими исключениями, Бледные [[Люди]], и славятся как искусные кузнецы. Долина печально известна снежными тиграми, опасными холодами и руинами древних эпох.\n\n### Истар\n\nЦентральное княжество, располагающееся на равнинах у одноименного озера, в древности известного как озеро Лаак. Взглянув на его столицу, трудно поверить, что это Ведория — белокаменные улицы, многоэтажные дома и высокие шпили напоминают об ушедшей эпохе - об Антерене. Воистину, Истарград, местными называемый не иначе как Орн-Истар, возведен на руинах древней цивилизации.\n\nЖемчужина княжества, в него стекаются ресурсы со всех окрестных земель.\n\nЦентр культуры и цивилизации, столичные жители в каком-то смысле противопоставляют себя прочей Ведории.\n\nЕго магическая гильдия - единственная организация заклинателей, существующая в Ведории и никак не связанная с Конклавом. Волшебники Истара малочисленны, но их знания напрямую вытекают из древней магии, а злые языки и вовсе говорят, что своей волшбой они давно подменили князя, либо же просто используют его как марионетку.\n\nОзеро - один из главных источников пропитания и богатства города, и высоко почитается в истарской культуре.\n\nГоворя об истарцах, обычно подразумевают жителей столицы. Злые языки говорят об истарцах как о заносчивых, порочных снобах, презрительно относящихся даже к людям своего же княжества, но из иных поселений. Однако же, в Истар все равно приезжают иноземцы, зная, что только там можно найти редкие книги, товары и мастеров, и уж точно только в нем можно воспользоваться весьма недешевыми услугами чародеев.\n\n### Устакол\n\nВ противовес прогрессивному Истару, раскинувшемуся на открытых равнинах, **Устакол**, покрытый непроходимыми лесами, нередко называют самым “ведорским” по духу княжеством. Здесь люди живут на самой границе с духовным миром, всё ещё чтя **Старый Договор**, заключённый в незапамятные времена, когда первые поселенцы вели жестокую войну с исконными обитателями этой земли.\n\nПредания говорят, что в ту эпоху одна из рейм винджен убила древнего владыку лесных духов. За это братство было навеки проклято и обращено в отряд призрачных всадников, известный как **Дикая Охота**. Это бедствие долгие годы вселяло ужас в сердца людей, но и сами люди не отступили. В конце концов был заключён пакт, чья сила, как верят в Устаколе, сохраняется и поныне.\n\nС тех пор человек имеет в Устаколе своё место, но не всю землю. У духов и древних обитателей леса остаются собственные пределы: не всякая чаща подлежит заселению, не в каждую рощу дозволено входить, и не всякая тропа терпит чужой шаг. Духи этих лесов помнят некогда пролитую кровь, а потому мир здесь держится не на дружбе, но на старой мере, осторожности и соблюдении границ. Конклав же веками пытается если не примирить стороны, то не дать древней вражде вспыхнуть вновь.\n\nПримечательно, что прибрежные города Устакола более \"вольны\" в толковании старых законов и культурой схожи с остальными землями Побережья Когтя.\n\n### Исмирал\n\nОдно из древнейших княжеств, когда-то, еще во времена Темного Века более 400 лет назад, эта земля носила иное имя - Миралука. Среди ныне заболоченных земель возвышается Божественная Башня, когда-то символизировавшая почитание миралужцами Небесных Сфер. Вера в божественных духов, существующих в высших планах, была основой их жизни.\n\nТеперь старая вера практически забыта, как и Поселение Башни.\n\nСами же исмиральцы - мрачный народ, закаленный долгой войной с Союзными Королевствами. О жителях этого княжества часто в шутку говорят, что они сразу же рождаются угрюмыми и слишком уж серьезными.\n\nТреть Исмирала покрыта непроходимыми болотами, хранящими в себе старую историю и бесчисленные опасности.\n\nОни соседствуют с Истарским озером, а границы с Каалагоном обеспечивают их хорошим железом - пусть и ценой частых стычек с обитателями гор и, что хуже, подгорья...\n\n### Саргот\n\nСаргот — самое морское из всех ведорских княжеств, связанное с морской стихией куда теснее прочих. Среди друзей сарготцы славятся лучшими мореходами к западу от Срединного Континента — людьми, видевшими льды Готтлейда, изумрудные острова Ринны и безымянные острова далёкого запада. Среди врагов же они известны иначе: как жестокие морские налётчики, способные ударить по беззащитному берегу и исчезнуть за горизонтом задолго до прибытия войск.\n\nСреди сарготцев нередко встречаются Бледные Люди - исполины Готтлейда, и их кровь, нравы и мореходные обычаи давно смешались с местной жизнью. В самом Сарготе любят говорить, что истинный сарготец выходит в море не ради выгоды и не ради славы, но просто следуя собственной природе — хотя, конечно, редко упускает случай потом приукрасить историю о своём пути.\n\nСуша Саргота сурова и скупа на дары. Холмы, бесплодные равнины и утёсы люди делят здесь с северными гоблинами, ещё более дикими и злобными, чем их сородичи южных земель. Но и ледяное море немногим добрее. Песни сарготских мореплавателей повествуют о сиренах, хищных птицах и, хуже всего, о морских змеях, способных обвиться вокруг корабля и раздавить даже прочнейший из них. И все же, море почитают - оно является источником богатства и жизни Саргота.\n\nО князе Саргота ходит странная молва — в народе говорят, что он бессмертен.\n\n### Дармосс\n\nТакже известный как Речное Княжество, Дармосс известен своим Озерным Городом, что как понятно из названия, возведен прямо на воде. Оттуда, на своих лодках, искусные дармоссцы способны реками добраться практически куда угодно во всей Ведории, и нередко они доставляют товары между княжествами, находящимися на разных концах этих земель.\n\nНе менее редко вышеописанные товары стоят раза в два-три дороже того, что большинство сочтет приемлемым.\n\nВести, товары, люди — все может быть доставлено. Говорят, без Дармосса половина княжеств сидела бы без соли, железа, лекарств и новостей.\n\nНеудивительно, впрочем, что дармоссцев, в некоторых местах, малость недолюбливают. О них говорят как увертливых, вороватых хитрецах, что везде ищут выгоду. Сами дармоссцы сравнивают себя с рекой - текущей, обходящей и просачивающейся по самому удобному пути, а не идущей напролом.\n\nИз всех княжеств, они первыми признали Алерот, с которым заключили множество торговых сделок.\n\nДармоссцы превыше всего чтут речных духов, а лодки занимают особое место в культуре Речного Княжества. Каждая уважающая себя семья имеет хотя бы одну собственную лодку, и у каждой лодки есть имя.\n\nВ Речном Княжестве говорят, что сухопутный может владеть домом, но настоящий дармоссец сперва должен иметь собственную лодку и лишь потом всё остальное.\n\n### Ривачег\n\nОдно из двух княжеств, чьи земли граничат с Союзными Королевствами, Ривачег изрядно настрадался за времена Ведорской Войны. К востоку от Ривачега лежат Рейклейдские Равнины, долгое время бывшие полем для яростных сражений.\n\nНыне же, это княжество активно поддерживает [[Рейклейдское восстание]], а ривачежский князь известен своей дружбой с Бокаверде Лигорденом, с которым не раз сходился на поле боя до восстания опального генерала.\n\nЕще до последней Ведорской войны, княжество было вынуждено приспособиться к вечной угрозе со стороны внешних соседей. Ривачежские всадники, вооруженные тяжелыми саблями, известны своей скоростью и искусностью верхового боя. Этому же княжеству приписывают первое использование известного ведорского оружия: бердыша.\n\nПомимо этого, Ривачег связан древней неприязнью с Истаром - поговаривают, что когда-то ривачежский князь нанес своему истарскому соседу страшное оскорбление, а многие вэллахани ривачежского Конклава особенно насторожены Истарским волшебством.\n\nСам ривачежский народ известен своей вспыльчивостью и горячим характером. Однако, поговаривают, что для заслуживших их доверие ривачежцы становятся надежными друзьями и союзниками.\n\nЕще - и мало кто среди этого народа склонен отрицать очевидное - ривачежцы известны большой любовью к горячительным напиткам.\n\n### Алерот\n\nМаленький уголок земли, лишь с недавних пор числящийся отдельным княжеством. Алерот — вольный город, основанный Странниками Коэндеры, группой лесных эльфов, покинувших [[Каэд Диссен]] в поисках независимости от власти Лесного Короля и Совета Двенадцати, а также двумя крупными гномьими кланами — многими семьями Блуждающего Народа и Кланом Сондрем, вытесненным с Сентирских гор.\n\nПоначалу вынужденное и несколько странное сотрудничество рас, с большим скепсисом воспринимаемых в окрестных землях, в конце-концов взрастило свободное поселение, готовое начать новую жизнь. С большим трудом, на Большом Собрании Конклава в 374 году жители Алерота добились признания со стороны вэллахани и большей части княжеств.\n\nЭта новая жизнь не дается без труда: сентирские горцы воспринимают пригорные территории своих соседей как легкую добычу, сарготские мореплаватели имеют такое же мнение насчет их прибрежных поселений, и только Дармосс, в основном далекий от старых традиций, видит Алерот не как захватчиков древней земли, но новых соседей и ценных партнеров.\n\nКультура Алерота представляет собой странный, но так до конца и не ставший единым целым сплав ведорских верований Сентира, давно перенятых гномами Сондрем, философии Блуждающего Народа и мистических учений аэклари, уникальных для их народа, живущего две жизни. Пока еще трудно предположить, к чему приведет их сосуществование: создадут ли они единую культуру, научатся уважать уклад каждого по отдельности, или же расколются, все-таки не выдержав испытание временем.\n\n### Сентир\n\nСтрана Тысячи Гор, жизнь Сентира лежит в долинах и ущельях, где горные кланы, во многом отличные друг от друга, ведут свой быт. Весьма долгое время Сентир и вовсе нельзя было назвать хоть сколько-то единым княжеством: лишь знакомство с Конклавом после многих ожесточенных стычек с Дармоссом когда-то положило начало долгому пути к включению их в Вольные Княжества.\n\nИмеющие репутацию несколько диковатых горных отшельников, сентирцы ревностно защищают свои долины — в том числе и друг от друга. Стычки и миниатюрные войны между двумя (и более) кланами здесь совершенно не редкость, хотя и заканчиваются они обычно столь же быстро, сколь и начинаются.\n\nПутешественника также может легко отпугнуть языковой барьер: местное наречие, пусть и схожих со Всеобщим корней, имеет немало связей с гномьим языком: испокон веков, часть Блуждающего Народа жила в этих горах на равных правах.\n\nВерования Сентира, затронутые таким соседством, также имеют свои отличия. Как и гномы, Первым Пламенем они именуют ту первородную силу творения, что наделяет Основы мира жизнью. Огонь священен для сентирцев, ибо и дух их есть внутреннее, негасимое пламя.\n\nИздревле жизнь в этом регионе была тяжелой: Страна Тысячи Гор теснее прочих граничит с Землями Теней, и чаще всех своих соседей сентирцы могут обнаружить раскопанные могилы без покойников, или же недавние поля боя без единого трупа: стихийно возникающая нежить здесь является привычной угрозой. Неудивительно, что никто во всей Ведории не ненавидит темное искусство некромантии столь же сильно, как сентирцы.\n\n### Вегир\n\nСамое северное из княжеств, Вегир расположен в Долине Морозного Тумана — одном из самых негостеприимных регионов всего Мерклейда.\n\nВпрочем, Мерклейда ли? До сих пор картографы спорят, какой из сторон Срединного Континента принадлежит эта долина, и не стоит ли на самом деле называть ее самым освоенным и безопасным кусочком Готтлейдских земель.\n\nВегирское лето коротко, а зимы суровы. Кровь Бледных Людей позволяет местным с некоторой легкостью выносить холода, но не долина печально известно далеко не только ими. Многие чудовища, для прочей Ведории живущие в сказках, на самом деле обитают в Долине — ледяные тролли, жестокие морозные духи, ведьмины деревья и многое другое грозит оборвать жизнь любого неосторожного путника.\n\nВегирами заселена лишь часть Долины — ее глубины остаются доменом дикой природы и древних руин, часть из которых принадлежат наследию Антерена, истоки же прочих неизвестны никому.\n\nВысокорослые, светловолосые и бледные вегиры имеют больше общего с жителями Северных Земель, чем своими южным
