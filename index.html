верям и [[Род Гигантов|троллям]]. Самые мирные из ург'ас, пока не голодны. Почти неубиваемы: два сердца, троллья регенерация, полчаса жизни без головы. Редкие кроги, смесь ума орка и тела огра, живут ещё со времён Антерена.", "category": "Расы", "createdAt": 1793632093893, "order": 4, "summary": "Зеленокровные народы: орки, гоблины, огры, когда-то выведенные как рабы и солдаты.", "title": "Ург'ас", "updatedAt": 1793632093893, "updatedBy": null}, "merkleid": {"aliases": ["Западные Земли"], "body": "Мерклейд дословно значит «Западные Земли». Это самая большая из четырёх частей Срединного Континента, и климат здесь самый разный: от тундр северной [[Ведория|Ведории]] до ржавых степей [[Шем|Шема]] и бескрайних болот [[Великая Топь|Великой Топи]].\n\nС севера Мерклейд отрезан Каалагонскими горами, самыми большими на континенте. Единственный крупный проход в Готтлейд закрывает крепость Северного Предела, Хен-Эддельман. На восток ведёт прибрежная полоса к полуострову Рикарда, где стоит Сасай, Город в Центре Мира.\n\n## Четыре большие зоны\n- **Союзные Королевства** на северо-востоке: [[Говнария]], [[Эблания]], княжество Эмден, республика Альконде и молодой Рейклейд.\n- **[[Золотое Побережье]]** на юге от них.\n- **[[Шем]]** с Бескрайней Степью, Ринной и [[Великая Топь|Великой Топью]].\n- **Дальний Запад**, почти целиком занятый княжествами [[Ведория|Ведории]].\n\nОтдельно стоят [[Казакия]] за Горами Архимага, гномий [[Дол-ин-Аурос]], лес [[Каэд Диссен]] и проклятые [[Каэд Фелл|Земли Теней]].\n\n## История в двух словах\nМерклейд вырос на руинах [[Антерен|Антерена]]. После Великой Катастрофы наступил Тёмный Век, а основание Лирии королём Арктором открыло Вторую Эру. Ненадолго почти весь запад объединил Эдмунд Говнарион в [[Война Черной Короны|Войне Чёрной Короны]], но его империя пережила основателя лишь на несколько лет.\n\nСведения актуальны на конец 383 и начало 384 года Второй Эры.", "category": "Мир", "createdAt": 1793632093893, "order": 2, "summary": "Западная и самая большая четверть Срединного Континента, где разворачивается большая часть кампании.", "title": "Мерклейд", "updatedAt": 1793632093893, "updatedBy": null}, "ligorden": {"aliases": ["Железный Маршал", "Лигорден"], "body": "Полководец Годрика II, сосланный после Ведорской Войны. Уважение он заслужил и у своих солдат, и у противников. Когда война кончилась, объявил Нодесские равнины независимыми от [[Говнария|Говнарии]] и [[Эблания|Эблании]]: Рейклейд, «вольная земля». Его поддержали ветераны обеих сторон и ривачежский князь (см. [[Ведория]]).\n\nПеред лицом [[Война Червя|Войны Червя]] Маршал заключил мир с королём и Понтификом и снова повёл ветеранов в бой. По последним сведениям, он пропал или погиб, а с ним и цвет рейклейдского воинства.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Правители нашего дня", "kind": "character", "order": 6, "role": "Железный Маршал Рейклейда", "status": "Пропал", "summary": "Опальный полководец, объявивший Нодесские равнины свободной землёй.", "title": "Бокаверде Лигорден", "updatedAt": 1793633557135, "updatedBy": null}, "gnomy": {"aliases": ["гаркамму", "полурослики", "Блуждающий Народ", "Дальваг", "дварфы"], "body": "Сами себя гномы зовут гаркамму. Это слово значит сразу «рождённый глиной», «оживлённый огнём» и «слово». Средний рост около 140–145 см, но гномы крепче и сильнее людей. Живут около двухсот лет.\n\nГлавное их отличие — сверхъестественный слух. Гном слышит ручей за сотни метров и находит дорогу в полной темноте. В их языке смысл слова меняется от интонации, часть которой человек просто не слышит.\n\nБорода у гномов — дело культуры, а не природы. Про бороды у гномьих женщин лучше не говорить вообще. Алкоголь на гномов почти не действует, похмелья у них нет, а вкус спиртного они ощущают иначе.\n\n## Вера\nВ центре гномьей мысли две первостихии: холодная глина тела и мира и Первое Пламя, дающее дух. Почитают **Совершенных Предков**, чьё пламя пережило глиняный сосуд. Есть и вторая, более старая традиция: всё в мире есть Звук Сотворения, а Истинное Имя вещи — её точное звучание.\n\n## Дальваг\nСлово значит одновременно дом, город, крепость и королевство. Известны три великих Дальвага: живой [[Дол-ин-Аурос]], потерянный Этередайн (см. [[Каэд Фелл]]) и Безымянный, о котором мудрецы молчат.\n\n## Народы\n- **Золотые гномы** Дол-ин-Ауроса, с кожей цвета бледного золота и тёмными волосами.\n- **Блуждающий Народ**, серебряные гномы с серебряными глазами. Без дома, странствуют и торгуют. Делают рунные фонари для Эмдена.\n- **Глубинные гномы** Подземья и островного королевства Гортоэн. Отлично видят в темноте, но слепнут на солнце.\n- **Полурослики**, живущие айлами в горных долинах. Время от времени кого-то из них охватывает жажда приключений, и его зовут «джигитом». Любят еду и большие шляпы.\n- **Тёмные гномы Асгарота** в Эшленде, демонопоклонники Жёлтого Пламени.", "category": "Расы", "createdAt": 1793632093893, "epigraph": "Из айла путник может уйти мёртвым, но не голодным.", "epigraphBy": "Присказка полуросликов", "order": 2, "summary": "Гаркамму, народ с необычайным слухом, Дальвагами и верой в Первое Пламя.", "title": "Гномы", "updatedAt": 1793632093893, "updatedBy": null}, "velikaya-top": {"aliases": ["Топь", "Загнивающие Земли", "Драконья Гниль", "саутваны"], "body": "Болото больше Плотнолесья, существующее с самых старых хроник Тёмного Века. Всё в Топи живёт и меняется: уснувший у дерева путник может проснуться со мхом на одежде, а то и на лице. Составлять справочник местной природы бесполезно, через полвека он устареет.\n\nНаселяют Топь болотники: изгнанники, чародеи-отступники, беглые преступники и еретики со всего запада, а с ними саутваны, прямоходящие болотные ящеры, для которых Топь священна. Алхимиков сюда манят уникальные травы (см. [[Алхимия]]), исследователей — слухи о погребённых руинах цивилизации Шем'Тола.\n\nВ 383 году город Знак Амара эвакуировали, потому что долина начала проваливаться под землю, а сама Топь то наступала на степь, то отступала. Странное место.\n\n## Загнивающие Земли\nАлые равнины, покрытые гнилостными грибами и руинами, заражённые **Драконьей Гнилью**, болезнью тела и духа, связанной с Гниющим (см. [[Демоны]]). Лечения нет. Сюда паломничают только безумные культисты, и человеческий облик они сохраняют недолго. Как ни странно, Гниль сдерживает сама Топь: её постоянно меняющаяся жизнь не даёт заразе приспособиться.", "category": "Земли", "createdAt": 1793632093893, "order": 10, "summary": "Живое болото юга, где всё меняется, и Загнивающие Земли Гниющего за ним.", "title": "Великая Топь", "updatedAt": 1793632093893, "updatedBy": null}, "hronologiya": {"aliases": ["История", "таймлайн", "Вторая Эра"], "body": "Даты Второй Эры обозначаются как В.Э.\n\n## Эра Древа\nПервые [[Эльфы]] живут бессмертными на Адон-Тирлейдде. Увядание Древа Вечности кончает эпоху и приводит к Расколу эльфийского народа.\n\n## Первая Эра, Эра Владык\n- Упавшая Звезда и Источник, Владыки поднимают людей против эльфов.\n- Расцвет [[Антерен|Антерена]] и четыре эльфийские войны.\n- Ночь Расколотой Горы и рождение [[Каэд Фелл|Земель Теней]].\n- Великая Катастрофа и Война Владык с Легионом Тьмы.\n\n## Тёмный Век\nОколо 120–170 лет хаоса, чудовищ и войн кланов. Это же Золотой Век Осквернителей, когда разрастается [[Круг Проклятых]].\n\n## Вторая Эра\n- **0 В.Э.** Король Арктор основывает Лирию. Отсчёт Второй Эры.\n- **113–117.** [[Война Черной Короны|Война Чёрной Короны]] против Бандуриана. Эдмунд Говнарион, Пророк Пахом, сэр Латимер.\n- **118.** Основана [[Церковь Света]].\n- После войны — Мерклейдская Империя Эдмунда, которая быстро распадается на Союзные Королевства.\n- **322.** Парад Туманов, Земли Теней поглощают Рейтенорн.\n- **333.** Четвёртый Поход Очищения, Архимаг Казакион основывает [[Казакия|Казакию]].\n- **Около 333.** Появляются Горы Архимага, ландшафт [[Говнария|Говнарии]] меняется.\n- Ведорская Война Союзных Королевств с [[Ведория|Ведорией]], потом восстание Рейклейда под Железным Маршалом.\n- **383.** Смерть короля Франца от Синей Чумы, Второе Прикосновение Небес и приход к власти Понтифика Алистера. В небе появляется Алый Близнец. Начинается [[Война Червя]].", "category": "История", "createdAt": 1793632093893, "order": 0, "summary": "Главные эпохи и события от Эры Древа до Войны Червя.", "title": "Хронология", "updatedAt": 1793632093893, "updatedBy": null}, "zveroracy": {"aliases": ["холхоры", "ящеролюды", "змеелюды", "пикси", "феи"], "body": "Зверорасы — реликты эпохи до Антерена, когда в мире жили сотни дивных народов. Ниже только те, что ещё заметны на континенте.\n\n## Холхоры\nКабанолюды чуть выше человека, покрытые щетиной, с гривой игл на спине. Живут племенами на Севере и восточном побережье [[Мерклейд|Мерклейда]]. Очень территориальны. Верят, что дух есть у всего, а выше всех стоит Свиной Дух.\n\n## Вил'Зигур\nЯщеролюды, потомки затонувшего континента Зигур. Быстрые и ловкие, могут десятки минут не дышать. Их разум устроен так иначе, что чужие менталисты на них почти не действуют. Живут варварскими племенами в Подземье и [[Великая Топь|Топи]]. Отдельно от них в Топи живут саутваны, болотные ящеры.\n\n## Змеелюды\nОдна из древнейших рас, доживают до 600 лет. Когда-то правили Анурианской Империей. Чувствуют иначе: без вспышек, но очень долго. Помнят абсолютно всё, что запомнили. Почти вымерли и мечтают возродить Империю. Бывают со змеиным хвостом (вай-шиа) или с ногами (вай-ша).\n\n## Пикси\nФеи размером с ладонь. Появляются сами собой там, где много магии, и живут ради сиюминутных желаний: меняют местами тапки, а иногда приманивают к деревне чудовищ, чтобы посмотреть, что будет. Ценна только их пыльца.", "category": "Расы", "createdAt": 1793632093893, "order": 7, "summary": "Холхоры, ящеролюды, змеелюды, пикси и другие реликтовые народы.", "title": "Зверорасы и прочие", "updatedAt": 1793632093893, "updatedBy": null}, "antieren": {"aliases": ["Первая Эра", "Эра Владык", "Владыки", "Даниил Мидранмар", "Великая Катастрофа"], "body": "Антерен — крупнейшая человеческая цивилизация в истории, когда-то державшая почти весь Срединный Континент. Время от его основания до падения называют Первой Эрой или Эрой Владык.\n\n## Начало\nПо архивам [[Райтриари|райтриари]], люди были созданы эльфийским Институтом как раса слуг. Всё изменила Упавшая Звезда, оставившая после себя Источник. Пятеро людей научились черпать из него Невозможную Энергию и стали для человечества живыми богами, Владыками. Они повели людей в Войну Непокорства и вытеснили эльфов за Каалагон.\n\n## Владыки и войны\nСреди Владык известны Даниил Мидранмар, родоначальник Стиля Сокрушения, и Леонид, автор «Единой Теории Волшебства» (см. [[Таинственная Сила]]). Антерен четыре раза воевал с райтриари. Четвёртая, Война Источника, длилась около века и закончилась тем, что Даниил в дуэли раздробил Камень Душ Короля-Бога. Однажды обе стороны всё же сражались вместе: против аватары Короля Мёртвых в Ночь Расколотой Горы (см. [[Каэд Фелл]]).\n\n## Падение\nЭру завершила Великая Катастрофа, о природе которой спорят до сих пор. С ней связано рождение [[Скверна|Скверны]] и Война Владык с Легионом Тьмы. Потом наступил Тёмный Век.\n\n## Что осталось\nПочти все крупные города [[Мерклейд|Мерклейда]] стоят на восстановленных руинах Антерена и соединены его дорогами, которые никто не умеет повторить. От Антерена идут язык антерин, календарь с месяцами по 37 дней, Формы Эгиды (см. [[Искусства Боя]]) и основы современной магии.", "category": "История", "createdAt": 1793632093893, "order": 1, "summary": "Величайшая человеческая цивилизация Первой Эры, которой правили пятеро Владык.", "title": "Антерен", "updatedAt": 1793632093893, "updatedBy": null}, "lyudi": {"aliases": ["человек", "мерклейдцы", "хасситы", "нейды", "сетийцы", "симмерийцы"], "body": "Люди живут в среднем около 75 лет и обычно не имеют особых сверхъестественных даров. Зато развиваются они поразительно быстро: самая молодая раса успела построить великие империи, разрушить их и начать заново. Себя люди хвалят за «непоколебимый дух», старшие расы зовут их тараканами, которые переживут конец света.\n\nПо архивам [[Райтриари|райтриари]], людей когда-то создали эльфы как расу слуг.\n\n## Народы\n- **Мерклейдцы.** Большинство на западе. Светлокожие, наследники центральных земель [[Антерен|Антерена]]. Устойчивы к [[Скверна|Скверне]], но если она всё же берёт своё, шрамы у них самые страшные.\n- **Варлейдцы.** Народ Солнца с востока, темнокожие и выносливые.\n- **Сетийцы.** Невысокие жители юга, [[Шем|Шема]] и Топи. Их с трудом берут яды.\n- **Нейды.** Светловолосые люди Ринны с чуть заострёнными ушами. Слабы здоровьем, но остро чувствуют Таинственную Силу. Каждому, по поверью, суждена особая судьба.\n- **Хасситы.** Исполины Штормового Залива, лучшие мореходы и одни из лучших воинов. Ценят свободу превыше всего и не нарушают клятв (см. [[Золотое Побережье]]).\n- **Бледные Люди Севера.** Двухметровые готтлейдцы с почти бесцветной кожей. Невероятно живучи и не боятся мороза.\n- **Пепельные Люди Симмерии.** Серокожие жители Сетлейда с лиловыми, красными или жёлтыми глазами. Не болеют, не боятся жара и имеют славу демонопоклонников.\n- **Валлатрийцы.** Алокожие, с чешуйками на плечах. Быстрые, почти не болеют и почитают живую драконицу Валатреллен Красную.", "category": "Расы", "createdAt": 1793632093893, "order": 1, "summary": "Самая многочисленная и самая молодая раса континента и её народы.", "title": "Люди", "updatedAt": 1793632093893, "updatedBy": null}, "kaed-fell": {"aliases": ["Земли Теней", "Туман Смерти", "Эмден", "Расколотая Гора", "Этередайн"], "body": "Земли Теней — шрам Первой Эры в самом центре [[Мерклейд|Мерклейда]]. Всё, что умирает в Тумане Смерти, возвращается: люди, звери, насекомые. Даже деревья здесь — своя форма нежити. Отогнать туман могут только рунные фонари гномов Эмдена, и то ненадолго.\n\n## Происхождение\nПосреди Тумана стоит **Расколотая Гора**, когда-то Этередайн, величайшее королевство [[Гномы|гномов]]. По хроникам [[Райтриари|райтриари]], Серебряный Царь Этередайна с помощью скелета Древнего Дракона позволил воплотиться в мире аватаре Короля Мёртвых, Гхолдрету. Его туман убивал всё живое и даже разъедал металл. Против него единственный раз вместе вышли люди и эльфы, Владыка Даниил и Король-Бог. Победу одержали, но центральные земли стали непригодны для жизни. Блуждающий Народ рассказывает ту же историю как легенду о злом боге Безымянном.\n\n## Туман отвечает\nСеребряная Мастерская подозревает, что у Тумана есть воля. Любая попытка вырубить или выжечь лес вызывает ответ: мертвецы собираются в орды, а граница расширяется. В 322 году бургомистр Рейтенорна поджёг лес, а после отбитого вторжения город оказался далеко за границей Тумана.\n\n## Эмден\nМаленькое княжество к западу от Эббелунда — щит Союзных Королевств от мертвецов. Мёртвых здесь не хоронят, поселения строят для обороны, а люди удивительно веселы. Власть во многом у Серебряной Мастерской и её Охотников.", "category": "Земли", "createdAt": 1793632093893, "epigraph": "Я не видел, что Туман сделал с остальными, и, видит Творец, надеюсь никогда их больше не увидеть.", "epigraphBy": "Отчёт второй экспедиции Серебряной Мастерской, 257 г. В.Э.", "order": 7, "summary": "Земли Теней в центре Мерклейда, покрытые Туманом Смерти, где всё умершее восстаёт.", "title": "Каэд Фелл", "updatedAt": 1793632093893, "updatedBy": null}, "bezdna": {"aliases": ["Эхандар", "Расколотый Простор", "Осколки"], "body": "Бездна, она же Эхандар или, по-древневагра'ански, Расколотый Простор, — измерение между Внутренней и Внешней Завесой (см. [[Небесные тела]]). Граница между материей и Таинственной Силой здесь почти стёрта.\n\nВ чистом виде Бездна — это искажённое пространство с бурями магии и нестабильной материей. Внутри него, в пузырях Невозможной Энергии, держатся **Осколки**: небольшие куски стабильной реальности со своими законами. Осколки пронумерованы, и у крупнейших есть хозяева.\n\nОбитатели Бездны известны как [[Демоны|демоны]]. Больше 70% Простора принадлежит одному из семи Архидемонов. Кроме них, в Бездне лежит Дворец-Вне-Времён, королевство лунных [[Эльфы|эльфов]] Таулендина, отбитое когда-то у Ониксового Трона.\n\n## Несколько известных Осколков\n- 16 — Чёрная Цитадель Дрем, Ониксового Лорда.\n- 67 — Бессолнечные Земли, Короля Мёртвых.\n- 88 — Великий Архив, Хранителя Тайн.\n- 170 — Жёлтое солнце Пламени Хаоса.\n- 230 — Сады Ощущений Алой Звезды.\n- 301 — Моровые Ямы Гниющего.\n- 333 — Царство Страха, домен забытого Архидемона.", "category": "Мир", "createdAt": 1793632093893, "order": 5, "summary": "Расколотый Простор между двумя Завесами: родина демонов, разбитая на Осколки.", "title": "Бездна", "updatedAt": 1793632093893, "updatedBy": null}, "alhimiya": {"aliases": ["Архистихии", "зелья", "Первая Наука", "Братство Алхимиков"], "body": "Алхимия — наука об Истинных Путях Вещей. Познай Путь вещи, и познаешь её суть; измени Путь, и изменишь саму вещь. Её практикуют в каждой культуре, и для одних это ремесло (золото, сплавы, эликсиры), для других — философия внутреннего преобразования, а для третьих — предок волшебства.\n\n## Школы\n- **Мерклейдская**, она же Возрождённая: многое восстановлено из антеренских руин. Порох, клей, духи, крепкий алкоголь, зелья. Братство Алхимиков придумало Архистихии, Орден Мудрых — Перчатки Преобразования, [[Казакия]] использует звёздную пыль и астральные кристаллы для големов.\n- **Алхимия Топи** почти целиком о живом: зелья, мази, яды и наркотики [[Великая Топь|Великой Топи]]. Отсюда же искусство гомункулов.\n- **Каламическая** школа Аль-Хазифа: перенос свойств одной вещи на другую, например лёгкости пера на стальной доспех.\n- **Симмерийская**, драконья: внутренняя алхимия медитаций, крови вирмов и пилюль, чтобы стать Драконоподобным.\n\n## Шесть Архистихий\n- **Люмера**, Свет: жар, огонь, молния, солнце.\n- **Умбра**, Тень: холод, лунный свет, ночь.\n- **Сиэла**, Поток: вода, ветер, шторм, свобода.\n- **Арда**, Форма: земля, камень, металл, кристаллы.\n- **Виеса**, Жизнь: вим, плоть, кровь, растения.\n- **Сфира**: призрачное и эфирное, чистая магическая энергия.\n\nСвязь с Основами — в статье [[Древо Основ]].", "category": "Магия", "createdAt": 1793632093893, "epigraph": "Познай Путь вещи, и ты познаешь её Суть. Измени Путь, и ты изменишь саму вещь.", "epigraphBy": "Учитель Миррдина эт-Анголвена", "order": 4, "summary": "Первая Наука о Путях вещей: школы континента и шесть Архистихий.", "title": "Алхимия", "updatedAt": 1793632093893, "updatedBy": null}, "eogan": {"aliases": ["Лорд Глубин", "Предвестник"], "body": "Предвестник Пожирателя и главный полководец его армии в [[Война Червя|Войне Червя]]. Его Легион Голодных опустошил Агдею и Лирию. Сила его дарована Червём: доспех, раны, затягивающиеся сами собой, и связь с повелителем.\n\nВ 383 году вернувшийся Владыка Даниил Мидранмар нанёс ему поражение. Червь, по слухам, считает, что Эоган не использовал и шестой части своих сил.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Тьма и угрозы", "kind": "character", "order": 4, "role": "Предвестник Пожирателя, Лорд Глубин", "status": "Активен", "summary": "Полководец Червя, ведущий Легион Голода.", "title": "Эоган", "updatedAt": 1793633557135, "updatedBy": null}, "neryus": {"aliases": ["Нэриус"], "body": "Кровожадный убийца и заклинатель теней. В ряде источников его называют вампиром. Он не хотел ни служить старому Тёмному Повелителю, ни становиться новым: ему нужна была только кровь. Его ветвь [[Круг Проклятых|Круга]] зовут Потрошителями, а его боевой подход стал Формами Тьмы (см. [[Искусства Боя]]).\n\nПосле [[Война Черной Короны|Войны Чёрной Короны]] он бесследно исчез. Самые верные ассасины ждут, что во второй Золотой Век Осквернителей его багровая тень вернётся.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Тьма и угрозы", "kind": "character", "order": 2, "role": "Основатель Братства Крови", "status": "Неизвестно", "summary": "Ассасин и заклинатель теней, единственный из основателей Круга, чья смерть не подтверждена.", "title": "Нэриус Пронзающий", "updatedAt": 1793633557135, "updatedBy": null}, "shem": {"aliases": ["Степь", "Ринна", "битардцы", "Бескрайняя Степь"], "body": "Шем никогда не входил в Мерклейдскую Империю и северянину кажется другим миром.\n\n## Бескрайняя Степь\nЕё называют Ржавой Пустошью: трава и редкие деревья здесь цвета ржавого металла. Живут здесь сетийцы (см. [[Люди]]), и далеко не все кочевники.\n- **Битардцы**: сахи ведут людей по степи, а правят из единственного города Унар-Ачар. Где два битардца, там три мнения и один кулак.\n- **Тхемерцы** строят глиняные дома у рек и славятся керамикой.\n- **Кетерцы** разводят быков; кража коровы равна объявлению войны семье.\n- Орды **Думсора**, сплочённые гоблинские племена.\n- Союз трёх городов в Земле Коневодов.\n\nМногие народы верят в Отца-Небо, для них птицы священны, а Подземье нечисто. Битардцы кладут на землю куриную голову для Земной Головы. Водятся здесь клювастые твари, быстрее любой лошади, и шестилапые паучьи обезьяны.\n\n## Ринна\nЗелёная, почти тропическая Страна Заката за Драконьими горами. Риннцы считают себя прямыми наследниками [[Антерен|Антерена]], говорят на антерине и ждут возвращения Владык; правит Наместник Богов. Пахомианство здесь не прижилось. Отсюда родом нейды и драконоборцы. В городе Анголвене стоит Башня Слоновой Кости, оплот Ордена Мудрых (см. [[Магические традиции]]).\n\n## Великая Топь и Загнивающие Земли\nСм. [[Великая Топь]].", "category": "Земли", "createdAt": 1793632093893, "order": 9, "summary": "Южная часть Мерклейда: ржавая Бескрайняя Степь, тропическая Ринна и Загнивающие Земли.", "title": "Шем", "updatedAt": 1793632093893, "updatedBy": null}}}</script>
<script>
const CATS=["Мир","История","Расы","Земли","Магия","Вера и ордена","Существа","Бой"];
const GROUPS=["Персонажи партии","Герои былых времён","Древние владыки","Правители нашего дня","Тьма и угрозы","Боги и великие силы"];
const ROUTES=new Set(["","mir","personazhi","hronika"]);
const RESERVED=new Set(["mir","personazhi","hronika","settings","sidebar","customize","upgrade","downloads","new","edit"]);
let db=null,user=null,assets=null,canWrite=null,writeRefused=false,live=false;
let articles={},snapMeta={at:0};
let editing=null,filterCat="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().replace(/ё/g,"е").trim();
const isChar=a=>a&&a.kind==="character";
const imgSrc=id=>id&&/^[A-Za-z0-9_-]{8,64}$/.test(id)?"/_blob/"+id:null;

/* ---------- снимок для гостей ---------- */
try{const s=JSON.parse($("#snapshot").textContent);articles=s.articles||{};snapMeta={at:s.at||0}}catch{articles={}}

/* ---------- гербы ---------- */
function hash(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
const GLYPH={
 "Мир":'<circle cx="50" cy="50" r="13"/><ellipse cx="50" cy="50" rx="24" ry="8" transform="rotate(-20 50 50)"/>',
 "История":'<path d="M38 32h24M38 68h24M40 32c0 12 20 12 20 18s-20 6-20 18M60 32c0 12-20 12-20 18s20 6 20 18"/>',
 "Расы":'<circle cx="50" cy="38" r="7"/><circle cx="38" cy="60" r="7"/><circle cx="62" cy="60" r="7"/>',
 "Земли":'<path d="M28 66l14-22 8 12 8-16 14 26z"/>',
 "Магия":'<path d="M50 28l5 17 17 5-17 5-5 17-5-17-17-5 17-5z"/>',
 "Вера и ордена":'<path d="M50 26v48M40 38h20M44 74h12"/>',
 "Существа":'<path d="M28 50c8-12 36-12 44 0-8 12-36 12-44 0z"/><circle cx="50" cy="50" r="6"/>',
 "Бой":'<path d="M32 32l36 36M68 32L32 68M30 40l10-10M60 70l10-10"/>'
};
function sigil(key,cat,title){
  const h=hash(key),n=3+(h%6),rot=(h>>3)%360,r2=22+((h>>7)%8);
  let poly="";for(let i=0;i<n;i++){const a=(rot+i*360/n)*Math.PI/180;poly+=(50+38*Math.cos(a)).toFixed(1)+","+(50+38*Math.sin(a)).toFixed(1)+" "}
  const ticks=Array.from({length:24},(_,i)=>{const a=i*15*Math.PI/180,o=i%2?44:42;return `<line x1="${(50+o*Math.cos(a)).toFixed(1)}" y1="${(50+o*Math.sin(a)).toFixed(1)}" x2="${(50+46*Math.cos(a)).toFixed(1)}" y2="${(50+46*Math.sin(a)).toFixed(1)}"/>`}).join("");
  const inner=GLYPH[cat]||`<text x="50" y="58" text-anchor="middle" font-size="26" font-family="Forum,Georgia,serif" fill="currentColor" stroke="none">${esc((title||"?").slice(0,1))}</text>`;
  return `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><g opacity=".45">${ticks}</g><polygon points="${poly}" opacity=".55"/><circle cx="50" cy="50" r="${r2+8}" opacity=".35"/>${inner}</svg>`;
}
function medallion(a,slug){
  const h=hash(slug),hue=[200,30,350,160,260,45][h%6];
  const ini=(a.title||"?").split(/\s+/).filter(w=>/^[А-ЯЁA-Z]/.test(w)).slice(0,2).map(w=>w[0]).join("")||(a.title||"?")[0];
  return `<svg viewBox="0 0 100 125" aria-hidden="true"><defs><radialGradient id="g${h}" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="hsl(${hue} 35% 38%)"/><stop offset="1" stop-color="hsl(${hue} 30% 12%)"/></radialGradient></defs><rect width="100" height="125" fill="url(#g${h})"/><g fill="none" stroke="hsl(${hue} 40% 75%)" stroke-opacity=".35"><circle cx="50" cy="56" r="34"/><circle cx="50" cy="56" r="28" stroke-dasharray="2 4"/></g><text x="50" y="68" text-anchor="middle" font-family="Forum,Georgia,serif" font-size="32" fill="hsl(${hue} 45% 86%)">${esc(ini)}</text></svg>`;
}
function thumb(a,slug){const src=imgSrc(a.image);if(src)return `<img src="${src}" alt="" loading="lazy" onerror="this.remove()">`;return isChar(a)?medallion(a,slug):sigil(slug,a.category,a.title)}
function portrait(a,slug){const src=imgSrc(a.image);return `<div class="portrait">${src?`<img src="${src}" alt="${esc(a.title)}" loading="lazy">`:medallion(a,slug)}</div>`}

/* ---------- имена, ссылки, разметка ---------- */
function nameIndex(){const m=new Map();for(const[s,a]of Object.entries(articles)){m.set(norm(a.title),s);for(const al of a.aliases||[])if(!m.has(norm(al)))m.set(norm(al),s)}return m}
function translit(s){
  const t={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"shch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya"};
  let r=norm(s).split("").map(c=>t[c]??c).join("").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60)||"statya";
  if(RESERVED.has(r)||r.startsWith("comment-"))r="st-"+r;
  let o=r,i=2;while(articles[o])o=r+"-"+i++;return o;
}
function inline(s,idx){
  s=esc(s);
  s=s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(_,t,l)=>{const sl=idx.get(norm(t)),x=l||t;return sl?`<a class="wl" href="#${sl}">${x}</a>`:`<a class="wl missing" href="#" data-create="${t}" title="Статьи пока нет">${x}</a>`});
  return s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>").replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function blocks(md){
  const out=[];let p=[],l=null,q=[];
  const fp=()=>{if(p.length){out.push({t:"p",v:p.join(" ")});p=[]}},fl=()=>{if(l){out.push({t:"ul",v:l});l=null}},fq=()=>{if(q.length){out.push({t:"q",v:q.join(" ")});q=[]}},f=()=>{fp();fl();fq()};
  for(const raw of String(md||"").split("\n")){const ln=raw.trimEnd();let m;
    if(!ln.trim()){f();continue}
    if(m=ln.match(/^###\s+(.*)/)){f();out.push({t:"h3",v:m[1]});continue}
    if(m=ln.match(/^##?\s+(.*)/)){f();out.push({t:"h2",v:m[1]});continue}
    if(m=ln.match(/^\s*[-*]\s+(.*)/)){fp();fq();(l||(l=[])).push(m[1]);continue}
    if(m=ln.match(/^>\s?(.*)/)){fp();fl();q.push(m[1]);continue}
    if(l&&/^\s{2,}\S/.test(raw)){l[l.length-1]+=" "+ln.trim();continue}
    fl();fq();p.push(ln.trim())}
  f();return out;
}
function render(md){const idx=nameIndex();return blocks(md).map(b=>b.t==="p"?`<p>${inline(b.v,idx)}</p>`:b.t==="ul"?`<ul>${b.v.map(i=>`<li>${inline(i,idx)}</li>`).join("")}</ul>`:b.t==="q"?`<blockquote>${inline(b.v,idx)}</blockquote>`:`<${b.t}>${inline(b.v,idx)}</${b.t}>`).join("\n")}
function linksIn(md){const idx=nameIndex(),s=new Set();for(const m of String(md||"").matchAll(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g)){const x=idx.get(norm(m[1]));if(x)s.add(x)}return s}

/* ---------- данные ---------- */
const entries=()=>Object.entries(articles);
const byOrder=(x,y)=>(x[1].order??99)-(y[1].order??99)||x[1].title.localeCompare(y[1].title,"ru");
function inCat(c){return entries().filter(([,a])=>!isChar(a)&&a.category===c).sort(byOrder)}
function allCats(){const ex=[...new Set(entries().filter(([,a])=>!isChar(a)).map(([,a])=>a.category).filter(c=>c&&!CATS.includes(c)))].sort();return[...CATS,...ex].filter(c=>inCat(c).length)}
function chars(g){return entries().filter(([,a])=>isChar(a)&&(a.group||"Прочие")===g).sort(byOrder)}
function allGroups(){const ex=[...new Set(entries().filter(([,a])=>isChar(a)).map(([,a])=>a.group||"Прочие").filter(g=>!GROUPS.includes(g)))].sort();return[...GROUPS,...ex].filter(g=>chars(g).length)}
function fmtDate(ms){if(!ms)return"";try{return new Date(ms).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}catch{return""}}
async function names(ids){ids=[...new Set(ids.filter(Boolean))];if(!ids.length||!user)return{};try{return await user.profiles(ids)}catch{return{}}}
const canW=()=>!!db&&live&&canWrite!==false&&!writeRefused;
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c}
function statusPill(s){if(!s)return"";const n=norm(s);const cls=/мерт|уничтож|погиб|раздроб/.test(n)?"dead":/правит|актив|жив|воюет|ведет|вернул/.test(n)?"live":"";return `<span class="pill ${cls}">${esc(s)}</span>`}
function stag(html,i){return html.replace(/^<(\w+)/,`<$1 style="--i:${i}"`)}

/* ---------- небо ---------- */
let skyStop=null;
function sky(canvas){
  if(skyStop)skyStop();
  const ctx=canvas.getContext("2d");if(!ctx)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);let w=0,h=0,stars=[],raf=0,t0=performance.now();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
    stars=Array.from({length:Math.round(w*h/2600)},()=>({x:rnd()*w,y:rnd()*h,r:rnd()*1.3+.2,p:rnd()*6.28,s:.4+rnd()*1.2}))}
  function moon(x,y,r,core,glow){const g=ctx.createRadialGradient(x,y,r*.2,x,y,r*3.2);g.addColorStop(0,glow);g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3.2,0,7);ctx.fill();
    const c=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);c.addColorStop(0,core[0]);c.addColorStop(1,core[1]);ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
  function draw(now){const t=(now-t0)/1000;ctx.clearRect(0,0,w,h);
    for(const s of stars){const a=.35+.45*Math.sin(s.p+t*s.s);ctx.fillStyle=`rgba(225,232,240,${a})`;ctx.fillRect(s.x,s.y,s.r,s.r)}
    const big=Math.max(26,Math.min(64,w*.05));
    moon(w*.82+Math.sin(t*.05)*8,h*.32+Math.cos(t*.04)*4,big,["#F2F7FA","#9FC4D4"],"rgba(150,200,220,.22)");
    moon(w*.70+Math.cos(t*.07)*12,h*.18+Math.sin(t*.06)*5,big*.32,["#F0A090","#8E2F28"],"rgba(220,80,60,.18)");
    if(!reduce)raf=requestAnimationFrame(draw)}
  size();const ro=new ResizeObserver(()=>{size();if(reduce)draw(t0)});ro.observe(canvas);
  raf=requestAnimationFrame(draw);skyStop=()=>{cancelAnimationFrame(raf);ro.disconnect();skyStop=null};
}

/* ---------- статья ---------- */
async function pageHtml(slug){
  const a=articles[slug],ch=isChar(a);
  document.title=a.title+" · Кодекс Термины";
  const back=entries().filter(([s,x])=>s!==slug&&linksIn(x.body).has(slug)).map(([s,x])=>[s,x.title]).sort((p,q)=>p[1].localeCompare(q[1],"ru"));
  const nm=await names([a.updatedBy]);const who=a.updatedBy?(nm[a.updatedBy]?.name||"участник"):"первая версия";
  const sib=ch?chars(a.group||"Прочие"):inCat(a.category);const k=sib.findIndex(([s])=>s===slug);
  const prev=sib[k-1],next=sib[k+1];
  const words=String(a.body||"").split(/\s+/).length,mins=Math.max(1,Math.round(words/180));
  const src=imgSrc(a.image);
  const banner=ch?"":`<div class="hero-art">${src?`<img src="${src}" alt="${esc(a.caption||a.title)}">`:`<div class="mark">${sigil(slug,a.category,a.title)}</div>`}</div>`;
  const info=`<aside class="info">${ch?portrait(a,slug):(src&&a.caption?`<div class="caption">${esc(a.caption)}</div>`:"")}<div class="body">
      <h3>${esc(a.title)}</h3><dl>
      ${ch&&a.role?`<div><dt>Кто это</dt><dd>${esc(a.role)}</dd></div>`:""}
      ${ch&&a.status?`<div><dt>Состояние</dt><dd>${statusPill(a.status)}</dd></div>`:""}
      <div><dt>${ch?"Группа":"Раздел"}</dt><dd>${ch?`<a href="#personazhi">${esc(a.group||"Прочие")}</a>`:`<a href="#mir" data-cat="${esc(a.category)}">${esc(a.category)}</a>`}</dd></div>
      ${(a.aliases||[]).length?`<div><dt>Также известно как</dt><dd class="tags">${a.aliases.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</dd></div>`:""}
      ${back.length?`<div><dt>Упоминается в</dt><dd class="backlinks">${back.map(([s,t])=>`<a href="#${s}">${esc(t)}</a>`).join("")}</dd></div>`:""}
      <div><dt>Последняя правка</dt><dd>${esc(fmtDate(a.updatedAt))}<br><span class="status">${esc(who)}</span></dd></div>
    </dl></div></aside>`;
  return `${banner}<div class="gut"><div class="inner page" style="${ch?"padding-top:var(--s6)":""}">
    <article class="${ch?"":"page-head"}">
      <div class="eyebrow">${esc(ch?(a.group||"Персонаж"):a.category)}</div>
      <h1>${esc(a.title)}</h1>
      ${a.summary?`<p class="lede">${esc(a.summary)}</p>`:""}
      <div class="readtime">${mins} мин чтения</div>
      ${a.epigraph?`<blockquote class="epigraph">${esc(a.epigraph)}${a.epigraphBy?`<cite>${esc(a.epigraphBy)}</cite>`:""}</blockquote>`:""}
      ${canW()?`<div class="actions"><button class="btn" id="editbtn" type="button">Редактировать</button></div>`:""}
      <div class="prose">${render(a.body)}</div>
      ${prev||next?`<nav class="pager" aria-label="Соседние статьи">${prev?`<a href="#${prev[0]}"><span>Назад</span><b>${esc(prev[1].title)}</b></a>`:""}${next?`<a class="next" href="#${next[0]}"><span>Дальше</span><b>${esc(next[1].title)}</b></a>`:""}</nav>`:""}

let sel=-1;
$("#q").addEventListener("input",e=>{
  const q=norm(e.target.value),box=$("#results");if(!q){box.hidden=true;return}
  const hits=[];for(const[s,a]of entries()){const t=norm(a.title);let sc=t.startsWith(q)?5:t.includes(q)?4:(a.aliases||[]).some(x=>norm(x).includes(q))?3:norm(a.role).includes(q)?2:(norm(a.summary)+" "+norm(a.body)).includes(q)?1:0;if(sc)hits.push([sc,s,a])}
  hits.sort((x,y)=>y[0]-x[0]||x[2].title.localeCompare(y[2].title,"ru"));sel=-1;
  box.innerHTML=hits.slice(0,10).map(([,s,a])=>`<a href="#${s}"><span class="r-cat">${esc(isChar(a)?"Персонаж":a.category)}</span>${esc(a.title)}<span class="r-sum">${esc(a.role||a.summary||"")}</span></a>`).join("")||`<a tabindex="-1"><span class="r-sum">Ничего не нашлось</span></a>`;box.hidden=false;

$("#q").addEventListener("keydown",e=>{const it=[...$("#results").querySelectorAll("a[href]")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!it.length)return;sel=(sel+(e.key==="ArrowDown"?1:-1)+it.length)%it.length;it.forEach((x,i)=>x.classList.toggle("sel",i===sel))}
  if(e.key==="Enter"&&it.length){location.hash=it[Math.max(sel,0)].getAttribute("href");closeSearch()}
  if(e.key==="Escape")closeSearch()});

function startEdit(slug,title,kind){
  const a=slug?articles[slug]:null;
  editing={slug,base:a?.updatedAt||0,tab:"write",confirmDel:false,warn:"",saving:false,uploading:false,
    draft:{kind:a?.kind||kind||"article",title:a?.title||title||"",category:a?.category&&a.category!=="Персонажи"?a.category:"Мир",group:a?.group||"Персонажи партии",role:a?.role||"",status:a?.status||"",
      summary:a?.summary||"",aliases:(a?.aliases||[]).join(", "),body:a?.body||"",epigraph:a?.epigraph||"",epigraphBy:a?.epigraphBy||"",image:a?.image||"",caption:a?.caption||"",order:a?.order??99}};
  view();
}
function readForm(){
  const d=editing.draft;
  for(const k of["title","summary","aliases","body","epigraph","epigraphBy","caption","role","status"]){const el=$("#e-"+k);if(el)d[k]=el.value}
  const c=$("#e-category");if(c)d.category=c.value==="__new"?$("#e-newcat").value.trim():c.value;
  const g=$("#e-group");if(g)d.group=g.value==="__new"?$("#e-newgroup").value.trim():g.value;
}
function selectField(id,label,opts,val,newId,newPh){const custom=val&&!opts.includes(val);return `<label for="${id}">${label}<select id="${id}">${opts.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}<option value="__new" ${custom?"selected":""}>Новый…</option></select><input id="${newId}" type="text" value="${custom?esc(val):""}" placeholder="${newPh}" ${custom?"":"hidden"}></label>`}
function editorHtml(){
  const e=editing,d=e.draft,isNew=!e.slug,ch=d.kind==="character";
  document.title=(isNew?"Новая статья":"Правка: "+d.title)+" · Кодекс Термины";
  const cats=[...new Set([...CATS,...entries().filter(([,a])=>!isChar(a)).map(([,a])=>a.category)])].filter(Boolean);
  const groups=[...new Set([...GROUPS,...entries().filter(([,a])=>isChar(a)).map(([,a])=>a.group)])].filter(Boolean);
  const src=imgSrc(d.image);
  return `<div class="gut"><div class="inner editor view">
    <div class="eyebrow">${isNew?"Новая запись":"Редактирование"}</div>
    <h1>${esc(d.title||"Без названия")}</h1>
    <div class="form">
      ${e.warn?`<div class="notice ${e.warnErr?"err":""}">${e.warn}</div>`:""}
      ${isNew?`<div class="seg" role="group" aria-label="Тип записи"><button type="button" id="k-a" aria-pressed="${!ch}">Статья</button><button type="button" id="k-c" aria-pressed="${ch}">Персонаж</button></div>`:""}
      <div class="row">
        <label for="e-title">${ch?"Имя":"Название"}<input id="e-title" type="text" value="${esc(d.title)}" placeholder="${ch?"Например, Эрих Аскариос":"Например, Сасай"}"></label>
        ${ch?selectField("e-group","Группа",groups,d.group,"e-newgroup","Название группы"):selectField("e-category","Раздел",cats,d.category,"e-newcat","Название раздела")}
      </div>
      ${ch?`<div class="row"><label for="e-role">Кто это, одной строкой<input id="e-role" type="text" value="${esc(d.role)}" placeholder="Паладин, оруженосец Лотара"></label><label for="e-status">Состояние<input id="e-status" type="text" value="${esc(d.status)}" placeholder="Жив, мёртв, пропал…"></label></div>`:""}
      <label for="e-summary">Кратко, одной строкой<input id="e-summary" type="text" value="${esc(d.summary)}" placeholder="Что это и почему важно"></label>
      <label for="e-aliases">Другие имена через запятую<input id="e-aliases" type="text" value="${esc(d.aliases)}" placeholder="По ним работают поиск и ссылки"></label>
      <div class="row"><label for="e-epigraph">Эпиграф<input id="e-epigraph" type="text" value="${esc(d.epigraph)}" placeholder="Цитата, с которой начинается статья"></label><label for="e-epigraphBy">Чьи слова<input id="e-epigraphBy" type="text" value="${esc(d.epigraphBy)}" placeholder="Кто это сказал"></label></div>
      <div class="imgfield">
        <div class="thumb">${src?`<img src="${src}" alt="">`:(ch?medallion({title:d.title},"x"+d.title):sigil(d.title||"x",d.category,d.title))}</div>
        <div style="display:grid;gap:8px;flex:1;min-width:200px">
          <span class="status">${ch?"Портрет":"Иллюстрация"}${src?"":" не выбрана, вместо неё рисуется герб"}</span>
          ${assets?`<div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn" for="e-file" style="display:inline-block;text-transform:none;letter-spacing:.03em;font-size:12.5px;color:var(--ink)">${e.uploading?"Загружаем…":src?"Заменить картинку":"Загрузить картинку"}<input id="e-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label>${src?`<button class="btn" id="e-noimg" type="button">Убрать</button>`:""}</div>`:`<span class="status">Загружать картинки могут владелец и редакторы вики.</span>`}
          ${!ch?`<input id="e-caption" type="text" value="${esc(d.caption)}" placeholder="Подпись к картинке">`:""}
        </div>
      </div>
      <div>
        <div class="wtabs" role="tablist"><button type="button" role="tab" id="t-w" aria-selected="${e.tab==="write"}">Текст</button><button type="button" role="tab" id="t-p" aria-selected="${e.tab==="prev"}">Предпросмотр</button></div>
        ${e.tab==="write"?`<textarea id="e-body" aria-label="Текст">${esc(d.body)}</textarea>`:`<div class="preview"><article class="prose">${render(d.body)||'<p class="status">Пока пусто.</p>'}</article></div>`}
      </div>
      <div class="hint"><code>## Заголовок</code> раздел · <code>- пункт</code> список · <code>**жирный**</code> · <code>*курсив*</code> · <code>&gt; цитата</code><br><code>[[Казакия]]</code> ссылка на статью · <code>[[Казакия|город магов]]</code> ссылка со своим текстом. Ссылка на статью, которой ещё нет, будет красной, по клику её можно создать.</div>
      <div class="actions">
        <button class="btn primary" id="e-save" type="button" ${e.saving||e.uploading?"disabled":""}>${e.saving?"Сохраняем…":"Сохранить"}</button>
        <button class="btn" id="e-cancel" type="button">Отмена</button>
        ${!isNew?(e.confirmDel?`<span class="confirm">Удалить насовсем? <button class="btn danger" id="e-del2" type="button">Да, удалить</button><button class="btn" id="e-del0" type="button">Нет</button></span>`:`<button class="btn danger" id="e-del" type="button">Удалить</button>`):""}
      </div>
    </div></div></div>`;
}
function rerender(){$("#main").innerHTML=editorHtml();bindEditor()}
function bindEditor(){
  const e=editing;const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn};
  ["#e-category","#e-group"].forEach(id=>{const s=$(id);if(s)s.onchange=()=>{const n=$(id==="#e-category"?"#e-newcat":"#e-newgroup");n.hidden=s.value!=="__new"}});
  on("#k-a",()=>{readForm();e.draft.kind="article";rerender()});on("#k-c",()=>{readForm();e.draft.kind="character";rerender()});
  on("#t-w",()=>{readForm();e.tab="write";rerender()});on("#t-p",()=>{readForm();e.tab="prev";rerender()});
  on("#e-cancel",()=>{editing=null;view()});on("#e-save",()=>save(false));on("#e-overwrite",()=>save(true));
  on("#e-del",()=>{readForm();e.confirmDel=true;rerender()});on("#e-del0",()=>{readForm();e.confirmDel=false;rerender()});on("#e-del2",remove);
  on("#e-noimg",()=>{readForm();e.draft.image="";rerender()});
  const f=$("#e-file");if(f)f.onchange=async()=>{const file=f.files&&f.files[0];if(!file)return;readForm();
    if(file.size>20*1024*1024){e.warn="Картинка больше 20 МБ, выберите поменьше.";e.warnErr=true;return rerender()}
    e.uploading=true;e.warn="";rerender();
    try{const r=await assets.upload(file,{type:file.type||"image/png"});e.draft.image=r.id}
    catch(err){e.warn=({too_large:"Картинка слишком большая.",unsupported_type:"Этот формат не подходит, нужен PNG, JPEG, WebP или GIF.",quota_or_state:"Место под картинки закончилось.",rate_limited:"Слишком часто, попробуйте через минуту."})[err?.code]||"Не удалось загрузить картинку.";e.warnErr=true}
    e.uploading=false;rerender()};
}
async function save(force){
  readForm();const e=editing,d=e.draft,ch=d.kind==="character",title=d.title.trim();
  const fail=m=>{e.warn=m;e.warnErr=true;rerender()};
  if(!title)return fail("Нужно название.");
  if(!ch&&!d.category)return fail("Укажите раздел.");
  if(ch&&!d.group)return fail("Укажите группу.");
  const clash=entries().find(([s,a])=>s!==e.slug&&norm(a.title)===norm(title));
  if(clash)return fail(`«${esc(clash[1].title)}» уже есть. <a href="#${clash[0]}">Открыть</a>`);
  if(e.slug&&!force){const cur=articles[e.slug];
    if(!cur)return fail("Эту запись удалили, пока вы её правили. <button class='btn' id='e-overwrite' type='button'>Создать заново</button>");
    if((cur.updatedAt||0)!==e.base)return fail("Кто-то изменил запись, пока вы её правили. Сравните в новой вкладке или сохраните свою версию поверх. <button class='btn' id='e-overwrite' type='button'>Сохранить поверх</button>")}
  const slug=e.slug||translit(title),prev=articles[e.slug||""];
  const me=user?await user.id().catch(()=>null):null;
  const doc={kind:d.kind,title,category:ch?"Персонажи":d.category,summary:d.summary.trim(),aliases:d.aliases.split(",").map(x=>x.trim()).filter(Boolean),
    body:d.body.replace(/\r/g,""),epigraph:d.epigraph.trim(),epigraphBy:d.epigraphBy.trim(),image:d.image||"",caption:ch?"":d.caption.trim(),
    order:prev?.order??d.order??99,createdAt:prev?.createdAt||Date.now(),updatedAt:Date.now(),updatedBy:me};
  if(ch){doc.group=d.group;doc.role=d.role.trim();doc.status=d.status.trim()}
  e.saving=true;e.warn="";rerender();
  try{await db.collection("articles").doc(slug).set(doc);articles[slug]=doc;editing=null;if(route()!==slug)location.hash=slug;else view()}
  catch(err){e.saving=false;
    if(err?.code==="invalid_argument"&&canWrite!==true){writeRefused=true;fail("У вас нет прав на правку. Попросите владельца выдать вам доступ редактора.")}
    else if(err?.code==="quota_exceeded")fail("База вики заполнена. Удалите ненужные записи и попробуйте снова.");
    else fail("Не удалось сохранить: "+esc(err?.message||"нет связи")+". Текст остался в форме.")}
}
async function remove(){const s=editing.slug;try{await db.collection("articles").doc(s).delete();delete articles[s];editing=null;location.hash="";view()}catch(err){editing.confirmDel=false;editing.warn="Не удалось удалить: "+esc(err?.message||"нет связи");editing.warnErr=true;rerender()}}

/* ---------- запуск ---------- */
view();
(async()=>{
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [db,user,assets]=await Promise.all([use("db"),use("user"),use("assets")]);
  viewerChecked=true;
  if(user){try{canWrite=await user.can("data.write")}catch{canWrite=null}}
  if(!db){return view()}
  const timer=setTimeout(()=>{if(!live){$("#banner").hidden=false;$("#bannertext").textContent="База пока не отвечает, показываем сохранённую копию. Страница обновится сама."}},10000);
  db.collection("articles").onSnapshot(snap=>{
    if(snap.metadata.fromCache&&snap.empty)return;
    const next={};for(const d of snap.docs){const x=d.data();if(x&&x.title)next[d.id]=x}
    articles=next;live=true;clearTimeout(timer);
    if(!editing)view();else{$("#banner").hidden=true}
  },err=>{clearTimeout(timer);if(err?.code==="revoked")db=null;view()});
})();
</script>
</body></html>
