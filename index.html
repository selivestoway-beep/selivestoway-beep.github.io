<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Кодекс Термины</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ночное небо с двумя лунами открывает кодекс; ниже спокойные «листы» на туманном фоне, колонка статьи ~68 знаков и карточка сведений справа */
:root{
  --bg:#ECEEE9; --surface:#F8F9F6; --ink:#262C2F; --muted:#646E6C; --line:#D2D7D1;
  --accent:#3B6878; --accent-soft:#DDE7E7; --gold:#9C7A32; --ember:#A5473D;
  --night:#172030; --night-2:#0E1420; --night-ink:#E6EBEE; --night-muted:#A9B4BE;
  --shadow:0 1px 2px rgba(30,40,45,.06),0 8px 24px rgba(30,40,45,.07);
  --f-display:"Forum","Cormorant Garamond",Georgia,serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:36px;--s7:56px;--s8:88px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181B; --surface:#1B2125; --ink:#DCE1DD; --muted:#919C99; --line:#2C3539;
  --accent:#8DBBC7; --accent-soft:#21303A; --gold:#D0AF68; --ember:#E08573;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181B; --surface:#1B2125; --ink:#DCE1DD; --muted:#919C99; --line:#2C3539;
  --accent:#8DBBC7; --accent-soft:#21303A; --gold:#D0AF68; --ember:#E08573;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.65;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1200px;margin:0 auto}

/* Шапка */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:var(--s4);padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px;color:var(--gold);flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:6px;white-space:nowrap}
.tabs a:hover{color:var(--ink);background:var(--accent-soft)}
.tabs a.cur{color:var(--ink)}
.tabs a.cur::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;border-radius:2px;background:var(--gold);animation:grow .35s var(--ease)}
@keyframes grow{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.search{flex:1 1 200px;position:relative;min-width:0;max-width:360px;margin-left:auto}
.search input[type=text]{width:100%;font:inherit;font-size:14.5px;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:11;animation:drop .18s var(--ease)}
@keyframes drop{from{opacity:.3;transform:translateY(-4px)}to{opacity:1;transform:none}}
.results a{display:block;padding:10px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.results a:last-child{border-bottom:0}
.results a:hover,.results a.sel{background:var(--accent-soft)}
.r-cat{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-right:6px}
.r-sum{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.btn{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.03em;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s,transform .15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--ember);border-color:var(--ember)}
.btn.rnd{display:inline-flex;align-items:center;gap:6px}.btn.rnd svg{width:15px;height:15px}
@media (max-width:1360px){.btn.rnd span{display:none}.btn.rnd{padding:8px 10px}}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.banner{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:14px}
.banner .inner{padding-block:8px}

/* Звёздное небо */
.sky{position:relative;background:linear-gradient(180deg,var(--night-2),var(--night));color:var(--night-ink);overflow:hidden;isolation:isolate}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.sky .inner{padding-block:var(--s8) var(--s7)}
.sky .eyebrow{color:var(--gold)}
.sky h1{color:var(--night-ink)}
.sky p{color:var(--night-muted)}
.sky .lede{color:#C9D2D8;font-style:normal}
.sky .lede em{color:var(--night-ink)}
.sky.small .inner{padding-block:var(--s6) var(--s5)}

/* Общие тексты */
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,5.2vw,58px);line-height:1.04;margin:var(--s2) 0 var(--s4);text-wrap:balance;letter-spacing:.005em}
.lede{font-size:18.5px;color:var(--muted);margin:0 0 var(--s5);max-width:62ch;font-style:italic}
h2.sec{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:0 0 var(--s4);display:flex;align-items:baseline;gap:var(--s3)}
h2.sec small{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
section.block{padding-block:var(--s7) 0}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Анимация смены вида */
.view{animation:rise .45s var(--ease)}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}

/* Путь чтения */
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s4);counter-reset:step}
.step{position:relative;display:block;padding:var(--s4) var(--s4) var(--s4) 56px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}
.step::before{counter-increment:step;content:counter(step);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font-family:var(--f-display);font-size:17px;display:grid;place-items:center}
.step b{display:block;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15}
.step span{font-size:14px;color:var(--muted);line-height:1.45;display:block;margin-top:4px}
.step:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}

/* Карточки разделов и статей */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s4)}
.card{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card .sig{flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.card .sig img{width:100%;height:100%;object-fit:cover}
.card .sig svg{width:40px;height:40px}
.card b{display:block;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15}
.card small{display:block;color:var(--muted);font-size:14px;line-height:1.45;margin-top:3px}
.card .meta{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
.chip:hover{color:var(--ink);border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tag{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.filters{margin:var(--s5) 0}

/* Персонажи */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--s4)}
.person{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.person:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.portrait{aspect-ratio:4/5;max-width:100%;background:var(--night);color:var(--night-ink);position:relative;overflow:hidden;display:grid;place-items:center}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 22%;transition:transform .5s var(--ease)}
.person:hover .portrait img,.person:hover .portrait svg{transform:scale(1.04)}
.portrait svg{width:100%;height:100%;transition:transform .5s var(--ease)}
.person .txt{padding:var(--s3) var(--s4) var(--s4)}
.person b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1}
.person small{display:block;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:4px}
.pill{display:inline-block;margin-top:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.dead{border-color:var(--ember);color:var(--ember)}
.pill.live{border-color:var(--accent);color:var(--accent)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,190px);gap:var(--s4);overflow-x:auto;padding-bottom:var(--s3);scroll-snap-type:x mandatory}
.strip .person{scroll-snap-align:start}

/* Статья */
.hero-art{position:relative;height:clamp(150px,22vw,230px);background:var(--night);color:var(--night-ink);overflow:hidden}
.hero-art img{width:100%;height:100%;object-fit:cover;opacity:.92;animation:fadein .8s var(--ease)}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.hero-art .mark{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);opacity:.6}
.hero-art .mark svg{position:static;width:min(220px,50%);height:auto;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,color-mix(in srgb,var(--bg) 85%,transparent))}
@keyframes fadein{from{opacity:.3}to{opacity:.92}}
.page{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:var(--s7);align-items:start;padding-block:0 var(--s8)}
.page-head{margin-top:calc(-1 * var(--s6));position:relative;z-index:1}
article{min-width:0;max-width:68ch}
.epigraph{margin:0 0 var(--s5);padding:var(--s3) 0 var(--s3) var(--s5);border-left:2px solid var(--gold);font-style:italic;font-size:18px;color:var(--ink)}
.epigraph cite{display:block;margin-top:6px;font-style:normal;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.prose h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15;margin:var(--s6) 0 var(--s3);text-wrap:balance}
.prose h2::after{content:"";display:block;width:44px;height:2px;margin-top:8px;background:var(--gold);border-radius:2px}
.prose h3{font-size:18px;margin:var(--s5) 0 var(--s2)}
.prose p{margin:0 0 var(--s4)}
.prose>p:first-of-type::first-letter{font-family:var(--f-display);float:left;font-size:3.4em;line-height:.82;padding:6px 8px 0 0;color:var(--gold)}
.prose ul{margin:0 0 var(--s4);padding-left:22px}
.prose li{margin-bottom:7px}
.prose li::marker{color:var(--gold)}
.prose blockquote{margin:0 0 var(--s4);padding:var(--s2) var(--s4);border-left:2px solid var(--gold);color:var(--muted);font-style:italic}
a.wl{color:var(--accent);text-decoration-style:solid}
a.wl.missing{color:var(--ember);text-decoration-style:dotted}
.actions{display:flex;gap:var(--s2);flex-wrap:wrap;margin:0 0 var(--s5)}
.readtime{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:var(--s4)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s7);padding-top:var(--s5);border-top:1px solid var(--line)}
.pager a{display:block;text-decoration:none;color:var(--ink);padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .2s,transform .2s var(--ease)}
.pager a:hover{border-color:var(--accent);transform:translateY(-2px)}
.pager span{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pager b{font-family:var(--f-display);font-weight:400;font-size:20px}
.pager .next{text-align:right;grid-column:2}
aside.info{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14.5px;box-shadow:var(--shadow);margin-top:var(--s5)}
aside.info .portrait{aspect-ratio:4/5}
aside.info .body{padding:var(--s4)}
aside.info h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 var(--s3);line-height:1.15}
aside.info dl{margin:0;display:grid;gap:var(--s3)}
aside.info dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
aside.info dd{margin:2px 0 0}
aside.info .tags{display:flex;flex-wrap:wrap;gap:5px}
.backlinks a{display:block;line-height:1.55}
.caption{font-size:13px;color:var(--muted);font-style:italic;padding:8px var(--s4) 0}

/* Хроника */
.timeline{position:relative;max-width:760px;margin:0 auto;padding:var(--s6) 0 var(--s8)}
.timeline::before{content:"";position:absolute;left:19px;top:var(--s6);bottom:var(--s8);width:2px;background:linear-gradient(var(--gold),var(--line))}
.era{position:relative;padding-left:56px;margin-bottom:var(--s6)}
.era::before{content:"";position:absolute;left:10px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);box-shadow:0 0 0 5px var(--bg)}
.era h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 var(--s3);line-height:1.1}
.era p{margin:0 0 var(--s3)}
.era ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2)}
.era li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:var(--s3) var(--s4);transition:border-color .2s,transform .2s var(--ease)}
.era li:hover{border-color:var(--accent);transform:translateX(3px)}
.era li strong{font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--gold);letter-spacing:.04em;margin-right:6px}

/* Последние правки */
.recent ol{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.recent li{display:flex;gap:var(--s3);align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.recent time{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:100px}

/* Редактор */
.editor{max-width:920px;padding-block:var(--s6) var(--s8)}
.form{display:grid;gap:var(--s4)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
label{display:grid;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text],select,textarea{font:inherit;font-family:var(--f-body);font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{font-family:var(--f-mono);font-size:14px;line-height:1.6;min-height:420px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{font-family:var(--f-mono);font-size:12px;border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.imgfield{display:flex;gap:var(--s4);align-items:center;flex-wrap:wrap;padding:var(--s3);border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.imgfield .thumb{width:96px;height:96px;border-radius:8px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:none}
.imgfield .thumb img{width:100%;height:100%;object-fit:cover}
.imgfield .thumb svg{width:70px;height:70px}
.hint{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:var(--s3);line-height:1.75;text-transform:none;letter-spacing:0}
.hint code{background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.wtabs{display:flex;gap:4px}
.wtabs button{font-family:var(--f-mono);font-size:12px;padding:6px 12px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px 8px 0 0;cursor:pointer}
.wtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);border-bottom-color:var(--surface)}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:var(--s5);min-height:420px}
.notice{padding:var(--s3) var(--s4);border-radius:8px;border:1px solid var(--gold);background:var(--accent-soft);font-size:14.5px}
.notice.err{border-color:var(--ember)}
.confirm{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;font-size:14px}
.empty{max-width:62ch;padding-block:var(--s8)}
footer{border-top:1px solid var(--line);padding-block:var(--s5);font-size:13px;color:var(--muted)}
footer .inner{display:flex;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
footer a{color:var(--muted)}
.gm{max-width:640px;padding-block:var(--s6) var(--s8)}
.gm ol{padding-left:22px;line-height:1.7}
.gm code{font-family:var(--f-mono);font-size:13px;background:var(--accent-soft);padding:1px 6px;border-radius:4px}
.gmbar{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-top:var(--s4)}

<script type="application/json" id="snapshot">{"at": 1793641935464, "articles": {"lotar": {"aliases": [], "body": "Прежний Генерал [[Орден Сияющего Меча|Ордена Сияющего Меча]]. При нём Лорд Северного Предела относился к паладинам так тепло, что предлагал построить прецепторию прямо в Поселении у Стены (см. [[Говнария]]).\n\nПогиб во время [[Война Червя|Войны Червя]]. Командование Орденом после него приняла [[Мериден]], бывшая его правой рукой во времена восстания Эдвина.\n\nЭту статью стоит дополнить тем, что знают о Лотаре игроки.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Правители нашего дня", "kind": "character", "order": 4, "role": "Прежний Генерал Ордена Сияющего Меча", "status": "Погиб", "summary": "Генерал паладинов, при котором Орден дружил даже с Лордом Северного Предела.", "title": "Лотар", "updatedAt": 1793637826813, "updatedBy": null}, "demony": {"aliases": ["Архидемоны", "экзотай", "дьяволы", "Король Мёртвых", "Ониксовый Лорд", "Пламя Хаоса"], "body": "Также известны как Экзо'тай (дословно, ант. Иные Духи).\n\nОбитатели иного измерения, известного как [[Бездна]], Расколотый Простор или, среди самих демонов — Эхандар. На протяжении долгой истории обоих миров контакты между Реальностью и Бездной имели неоднозначные формы: волшебники заключали с ними взаимо(и не очень)выгодные договоры, Церковь приравнивала их к Архиврагу, а иные культуры почитали их как богов.\n\nДаже в отрыве от культурных предубеждений, демоны — существа фундаментально иной природы. Энергия Бездны — их родная стихия и первооснова, из которой состоят их тела. Человек может состоять из плоти, крови, костей и бесчисленного множества иных деталей, демон же — существо магии. Она нужна им, как человеку нужен воздух. Материя для них сугубо вторична.\n\nЭто является одной из причин, по которой так сложно экзотай воплотиться в Реальности — колоссальное количество магической энергии необходимо, чтобы их форма из Энергии Бездны не распалась на мельчайшие частицы. Большинство демонов, стремящихся остаться в Реальности на длительный срок, пытаются прибегнуть к одержимости или инкарнации — созданию собственной материальной оболочки.\n\nВпрочем, по этой же причине практически любой демон имеет внушительное превосходство над человеком в мистических искусствах — и даже без этого, обладает биологическим бессмертием.\n\nКуда больше людей экзотай склонны зацикливаться на одной-единственной идее: в том лежит и источник их силы, и слабости. Демон-воин, вероятно, потратит тысячелетия на достижение вершин боевого искусства, а демон, чьей сутью является ярость, никак не будет скован ограничениями человеческих эмоций: смертный даже представить не сможет те чувства, что способно испытать такое существо. С другой же стороны, некоторых демонов из-за этой же особенности можно назвать несколько предсказуемыми.\n\nПредположительно, каждый демон обладает (либо имеет потенциал развить) собственной Личной Магией - выражением собственного естества и амбиций. Она может быть схожа или даже одинакова в пределах одного демонического вида - но если отдельный его представитель вырастет в силе, его [[Личная Магия]] почти наверняка последует.\n\nИменно из-за обладания Личной Магией демоны-волшебники являются огромной редкостью: к чему учиться воссоздавать сверхъестественные эффекты, если ты являешься их источником?\n\n### Категории демонов\n\nДемоны не равны: разница в силах между слабейшим и сильнейшим из них столь колоссальна, что не может быть выражена известными человеку словами. Большинством разумных по обе стороны Завесы применяется следующая категоризация:\n\n- **Низшие Демоны** — Слабейшие из обитателей Простора, низшие демоны разнятся от бесов и иных демонов-слуг, до солдат вроде тэйн'рэ. Не стоит обманываться частью \"Низшие\" - большинство из них являются достаточной угрозой даже для обученного бойца. Далеко не все из Низших Демонов разумны - в этот тип входит и множество т.н. демонических зверей.\n- **Старшие Демоны** — Этот тип можно назвать \"верхней границей\" того, чем может являться обычный демон. Могущественные создания, они во всем превосходят своих \"младших\" сородичей.\n- **Высшие Демоны** (Также известны как \"Дьяволы\" среди Инквизиции и Пахомославной Церкви в целом) — Если \"Низшие\" и \"Старшие\" Демоны могут быть видом, то термин \"Высший\" всегда относится к конкретному демону. Высший Демон - уникальное создание, возвысившееся благодаря благосклонности одного из Повелителей Бездны или собственным тысячелетним трудам. От любого из Дьяволов можно ожидать великой силы, хитрости, древнего опыта и впечатляющего постижения собственной Личной Магии. Сильнейшие из дьяволов могут с легкостью одолеть одного-двух магистров в прямом сражении.\n- **Демоны-Лорды** — Титул и состояние одновременно, Демоном-Лордом может называться только тот, кто подчинил своей воле и связал себя с одним из Осколков. Это не просто власть - такое владение значительно приумножает силы своего повелителя, не говоря уже о том, что окончательно Демон-Лорд может быть убит только в пределах собственного Осколка. Для этих созданий практически невозможно воплотиться в Реальности, и это великое благо для всех ее жителей - даже слабейший Демон-Лорд является угрозой для целых королевств. Технически, будь Демон-Лорд человеческим волшебником, звание Высшего Мага ему было бы выдано практически с порога.\n\nОсобняком от них стоит отдельная категория, \"подняться\" до которой естественным образом считается невозможным.\n\n- **Архидемоны** — Демонические Боги, Истинные Повелители Бездны. Их Власть кончается там, где начинается Власть другого Архидемона. Они повелевают целыми системами Осколков, в их услужении десятки Демонов-Лордов. Никому неизвестны методы становления Архидемоном, но появление каждого такого навсегда меняет весь Расколотый Простор. На сегодняшний день существует семь Архидемонов: Ониксовый Лорд, Король Мертвых, Господин в Маске, Пламя Хаоса, Хранитель Тайн, Алая Звезда и Гниющий. Первые три из них носят звание Изначальных, ибо их существование известно с самых ранних времен Бездны.\n\n## Архидемоны\n\nКак было сказано ранее, каждый Архидемон является созданием, чье могущество едва ли может быть осознано величайшими из смертных. Божеств Простора можно назвать не столько личностями, сколько мировыми силами Бездны — лишь в исключительных случаях они делают что-либо напрямую, предпочитая действовать через своих бесчисленных подчиненных.\n\nК настоящему моменту, больше 70% Бездны находится под управлением одного из Семерых.\n\n### Ониксовый Лорд\n\nПервый из Изначальных; Бог Тирании; Повелитель Цепей на Ониксовом Троне; Одальрик, Король Королей.\n\nБесчисленными именами обладает древнейший и, как считают многие, наиболее могущественный из богов Бездны. Его Власть — Доминация, и десятки тысячелетий Он желает распространить её над всем миром.\n\nЕго центральными владениями считается Черная Цитадель Дрем, 16 Великий Осколок.\n\nЕго культистами нередко становятся жаждущие порядка: дворяне, судьи, рыцари и многие прочие: к нему стекаются те, кто стремятся обрести власть, либо приумножить её. Одни желают узреть Эру Черного Солнца и абсолютный порядок, что она принесет. Другие желают силы, что дарует его ковенант: пусть жалкие крохи Доминации позволяют лишь кратковременно подчинить кого-то похожего на себя, великие жрецы способны устанавливать нерушимые законы и сковывать саму материю и энергию.\n\nЗавершением Его пути считается Эра Черного Солнца — день, когда Бездна и Реальность будут объединены волей единого Бога, и все встанет на свои места согласно Его замыслу. Нередко его культистов путают с Наследниками Скверны — ветвью Круга Проклятых, желающей схожего исхода, но во главе со Владыкой Скверны. Немудрено и то, что эти группы являются страшными противниками.\n\nСвященным месяцем Ониксового Лорда называют Месяц Золотой Кроны, священным цветом — черный, а священным оружием — булаву.\n\n### Король Мертвых\n\nПервая Нежить, Отец Некромантии, Владыка Призраков, Дарующий Вечность.\n\nСреди всех Архидемонов, влияние на Реальность Второго из Изначальных заметно куда больше прочих. Нежить, Живущие в Смерти — Его творение, Его проклятье, и Его же дар всему миру.\n\nЕго Власть — Нежизнь, отрицание самой концепции Смерти. В зависимости от трактовки Его священных книг можно сказать, что Король Мертвых не ненавидит жизнь: скорее даже наоборот. Однако, ее предначертанную завершенность Он считает первородным изъяном самого Мироздания.\n\nИ этот изъян будет исправлен.\n\nЕго культистами обычно становятся те, кто ищут вечной жизни. Некроманты, в незапамятные времена получившие из Его рук Морнгоэт, используют крупицы его Власти, дабы подчинять себе потоки некротики, повелевать нежить и, в конце-концов, свершить Ритуал Вечной Ночи, что позволит им стать Высшими Демонами Короля — личами.\n\nКороль милостив. Его искусство — некромантию — могут практиковать не только те, кто возносит Ему молитвы. Любой практик вечного искусства уже считается заключившим Ковенант, и любой из них, идя по собственному пути, выполняет свою роль глашатая Его эры.\n\nЗавершением его пути именуют Вечную Эру — Эру, в которой вся жизнь мироздания будет заменена на некротическую силу, а Смерть окажется забыта.\n\nЕго владения — Бессолнечные Земли, 67 Осколок.\n\nЕго священный месяц — Извечная Тень, священное оружие — коса, а священный цвет — бирюзовый.\n\n### Господин в Маске\n\nОтец Лжи, Заключающий Договоры, Отступник, Обманщик, Сбежавший Бог.\n\nМноголикий повелитель, наиболее загадочный для обитателей обеих сторон Завесы. В зависимости от точки зрения, его именуют как сильнейшим, так и слабейшим из Архидемонов.\n\nГосподин в Маске не имеет своего царства, у него нет \"собственных\" видов демонов, а его Власть неизвестна.\n\nХодит легенда, что когда-то он правил ослепительным золотым городом, что был величайшим из Осколков. Однако, заключив сделку с самой Бездной, он избавился от всех ограничений, прав и обязанностей Архидемона — теперь, свободнее ветра, он волен ходить сквозь Завесу, как человек переходит порог собственного дома.\n\nОн не имеет своих культов и не дарует Власти, а фракции Простора, присягнувшие ему, можно считать без пяти минут вольными демонами. Не участвует он обычно и ни в политике Бездны, ни в делах Реальности.\n\nНо изредка, он может явиться пред заинтересовавшим его существом, будь то человек, демон или что угодно иное. Он может предложить сделку, и, без сомнения, дарует желаемое, но плата, какой бы никчемной она ни показалось, *трижды успеет напомнить о себе.*\n\nОн не имеет священного месяца, оружия или цвета — если те и были когда-то, сейчас они давно забыты.\n\nОднако, длительное время его позицию занимал демон-лорд, известный как Королева Ночи. Её доменом были тени, ночь, обман и тайны. Она правила в Лесу Вечнотени, 123 Осколке, и ее культистами часто становились шпионы, ассасины, воры и прочие скрытные хитрецы. Ее Властью была Тень, а священным оружием - кинжал.\n\nК концу четвертого века Второй Эры по летоисчислению Континента, Королева Ночи была повержена силами Ониксового Лорда и Пламени Хаоса в ходе неудавшейся попытки захватить высшую власть в Просторе.\n\n### Пламя Хаоса\n\nЖелтый Огонь Ярости, Предвестник Перерождения, Повелитель Огня, Солнце-Что-Сожжет-Мир.\n\nМироздание полно изъянов. По своей природе, мир жесток и несправедлив, а его обитатели обречены на бесконечные страдания. Есть лишь один способ исправить это: сжечь его дотла, и дать родиться новой, лучшей реальности. И Пламенем, что исполнит эту роль, будет Желтый Огонь.\n\nЧетвертый из Семи, Пламя Хаоса, на самом деле, многим моложе ряда своих \"коллег\": появившийся в Антеренскую Эру, в ужасающие сроки Желтое Солнце достигло впечатляющего могущества, уступая только двоим из действующих Изначальных.\n\nЕго Власть — Пламя Разрушения, способно расплавить материю и дух, саму ткань реальности. Один взгляд на истинно-проявленный желтый огонь вселяет безумие в узревших.\n\nЕго культистами нередко становятся борцы с несправедливостью, искатели перемен, отчаявшиеся и мечтающие о новом, лучшем мире. Путь, которым они идут, разрушит всё — но, в конце-концов, это даст возможность новому началу.\n\nЕго царство названо в честь него самого, ибо весь 170 Осколок занимает сияющее желтое солнце, видимое из каждого подчиненного Ему Осколка.\n\nЗавершением его пути именуют Новую Эру — момент после окончательного разрушения старого мира, в котором Мироздание будет переопределено и воссоздано в лучшем, полном надежды виде.\n\nЕго священный месяц - Огненная Песнь, его священный цвет как-то очевиден, его священное оружие - пламенеющий меч.\n\n### Хранитель Тайн\n\nБледный Дракон Туманов, Похититель Гнозиса, Умбральный Парадокс.\n\nИстина — ложь. Мир, в своей фундаментальной природе — сплетение мысли и веры всех своих обитателей, и прошлое, формируя мышление настоящего, определяет будущее. Знание убивает потенциал.\n\nХранитель Тайн намеренно стремится скрыть историю и многие знания, оставляя дорогу для появления новых. Он отрицает концепцию универсальной истины, давая дорогу новым интерпретациям, каждую из которых он стремится узреть.\n\nЕго последователи собирают и скрывают знание, порционно оставляя лишь то, что только подстегнет любопытство нашедших, либо намеренно замещая истину дезинформацией. Иные же стремятся обрести уникальное для себя знание, закрыв дорогу к нему для остальных. К его культистам можно отнести также верящих в свободу воли и непредсказуемость.\n\nОдин из слабейших Архидемонов, чья Власть — Сокрытие — достаточно ограничена в сравнении с остальными, он, по легенде, обрел свой титул, обыграв предыдущего Пятого Архидемона — Лорда Тивилдормина — в состязании разума. Он практически не участвует в Войнах Бездны, увлеченный своим великим деланием.\n\nЕму принадлежит 88 Осколок - Великий Архив, окруженный Невозможным Лабиринтом.\n\nЗавершением его пути называют Эру Туманов — абсолютной неопределенности, обладающей бесконечным потенциалом.\n\nЕго цвет - темно-синий, месяц - Покров Туманов, а оружие - посох.\n\n### Алая Звезда\n\nПутеводная Звезда, Госпожа Излишеств, Алый Владыка, Тысяча Ликов Желания, Немесса.\n\nМир — это опыт. С самого момента нашего появления своими чувствами мы взаимодействуем с бесконечным морем возможностей: испытанное формирует нас, делает теми, кто мы есть. Мы существуем, чтобы чувствовать.\n\nАлая Звезда учит чувствовать всё, что существует, существовало и может существовать. Боль и удовольствие, созидание и разрушение, веселье и тоску, спокойствие и ярость. Почувствуй всё возможное, во всех возможных формах, ибо в этом и есть смысл жизни.\n\nВопреки стереотипам о законченных сибаритах и их \"бесконечных развратных оргиях\", адепты Немессы и близко не ограничиваются этой категорией: люди искусства и ученые, гедонисты, воины и авантюристы, стремящиеся познать всю свою сферу... в конце-концов, идейные сенсаты, стремящиеся воистину почувствовать и пережить вообще всё, что только можно и нельзя.\n\nЕё Власть позволяет управлять эмоциями и ощущениями, а вершины владения ею дают возможность изменять даже собственное тело: внешность, пол, способности — все может быть искажено, открывая возможность к новому опыту.\n\nЕё Эра уже наступила: иди и насладись всем тем многообразием, которое предлагает мир. Любая завершенность иного Архидемона лишь ограничит бескрайнее море потенциального опыта, и потому противоречит идее Алой Звезды.\n\nИстинная форма Немессы освещает 230 Осколок, известный как Сады Ощущений.\n\nЕе цвет - алый, её месяц - Путеводная Звезда, а оружие - открытая ладонь, способная прикоснуться к чему угодно.\n\n### Гниющий\n\nПастырь Отверженных, Мегенред Благословляющий, [[Драконья Гниль]], Один из Пары, Зловонная Мать.\n\nЖизнь прекрасна. Она завораживает одним своим существованием, принимает бесчисленные формы. Но не все её виды принимаются остальными. То, что они называют уродством, мерзостью, болезнью и проклятьем — то, что имеет все те же желания и право жить, люди изгоняют, \"лечат\" и ненавидят.\n\nНо не бойся. Ты не один. Гниющий всегда готов раскрыть свои объятия, кем бы ты ни был. Он простит всё и примет всех: прими себя и других и ты. И в единстве, любое испытание можно преодолеть.\n\nСамый молодой из Архидемонов, существующий приблизительно шесть столетий. Неизвестно, что предшествовало чему: зарождение драконьей гнили и Загнивающих Земель ли породило Пастыря Отверженных, или же его появление отразилось этим шрамом на теле планеты. Известно одно: уже сейчас он силен и имеет свое собственное видение.\n\nЕго культисты: отверженные и неизлечимо больные, порицаемые и немощные, но также лекари и алхимики, а также идеалисты, верящие в возможность мирового единства.\n\nВсе они объединились вокруг его Власти — Гнили.\n\nМегенред царствует в 301 Осколке - Моровых Ямах.\n\nЗавершением его Пути можно считать Эру Единства, когда все будут поражены Драконьей Гнилью, и сама концепция \"отверженности\" перестанет существовать.\n\nЕго цвета - зеленый и багровый, его месяц - Последнее Торжество, а священного оружия он не имеет.\n\n### Архидемоны Прошлого\n\n### Тивилдормин, Повелитель Безумия\n\nБезумный Лорд, Бог Любопытства, Владыка Многих Цветов, Волшебник Страны Чудес.\n\nИстина — ложь. Хранитель Тайн, об этом, конечно, уже говорил, но в своих убеждениях он вовсе не был оригинален.\n\nХотя, несомненно, это неправда. Или просто небольшое семантическое заблуждение, ведь Ложь — это то, что мы принимаем за Истину, а настоящая Истина скрывается за трехсот тридцати тремя дверями. Её умело прячут, но если вооружить себя Любопытством, каждую из этих дверей можно вскрыть...\n\nШутка. Конечно же, никакой Истины попросту нет: есть только Ложь, и она становится Истиной, когда кто-то в нее достаточно верит. Ложь рождается Воображением, а значит, Воображение — Истина. Это очень простой ответ, но ты, несомненно, его не понял. Просто думаешь, что понял.\n\nИ вообще, не ищи Истину в ответах: она в вопросах. Да, друг мой, вопрос куда важнее ответа — ответ ставит точку в нашей истории, а вопрос эти истории рождает. Ответ рождает правило, а каждое правило однажды было или будет нарушено.\n\nВышенаписанное смысла не имеет, поищи его в другом месте. Или не ищи, если есть более интересные идеи. Интерес и Любопытство — первее всего! Или на этом месте было что-то иное?\n\nТолько самые мудрые пойдут Истинным Путем. Ну и пускай себе идут. У \"культистов\" Тивилдормина же есть куда более важные дела, чем называть какой-то путь истинным: особенно когда им доступна Власть — Хаос — что позволяет плести Таинственную Силу в нечто по-настоящему интересное.\n\nИ вовсе никто никому не проигрывал, а взял заслуженный отпуск. Страна Чудес — 228 Осколок, говорят, очень хороша в это время года.\n\nГоворят, однажды Тивилдормин придумал, как должна выглядеть его Эра. Придумал — и никому так и не рассказал. Только ухмыляется довольно.\n\nСвященные цвета — все. Священный месяц отсутствует, но однажды Владыка решил нагло присвоить себе 37 день каждого. Оружие? Пусть будет рогатка.\n\n### Зел-Крийан, Архидемон Жестокости\n\nАрхидемон, упивавшийся болью и называвший ее смыслом самого существования: главным чувством, на контрасте с которым познается реальность. Его культ был узаконен Анурианской Империй и подошел к концу, когда Зел-Крийан был повержен и поглощен Алой Звездой.\n\nЕго наследие — Корона Агонии, венец с обращенными вовнутрь шипами, стократ амплифицирующие боль носителя и распространяющие ее на километры вокруг.\n\n### Фи'ран, Архидемон Раскола\n\nАрхидемон, действовавший во времена Анурианской Империи. Его Властью была Энтропия, и его культисты когда-то стремились принести конец упорядоченной структуре Бездны и Реальности. Могущественный Архидемон, как ни странно, пал не в войнах себе подобных: он, как гласит легенда, был сражен безымянным героем.\n\nНапоминание о нем — Распадающееся Царство, переживший своего владельца 19 Осколок, представляющий собой мириады парящих посреди пустоты и вечно раскалывающихся островов.\n\n### Даграззанд, Архидемон Ярости\n\nМогущественный Архидемон, на момент поражения бывший одним из старейших правителей Бездны. Воинственное и ужасающее чудовище, он попросту не мог быть побежден в прямом бою иначе как чем-то воплощающим его же концепт больше его самого. Его Власть, как и он сам, была поглощена разгорающимся Желтым Пламенем.\n\nНапоминанием о нем служит Уничтожитель, двуручная секира, позволяющая носителю обращаться в форму ужасающего демона — Тени Даграззанда.\n\n### Тут, Архидемон Былого\n\nТаинственный Архидемон, действовавший в ранние времена Империи Вагра'ан более двадцати пяти тысяч лет назад. Его Властью была Память, манипуляция ею и создание объектов, пространств и сущностей из воспоминаний.\n\nНесмотря на великую Власть, он был одним из слабейших Архидемонов, и оказался побежден Дагроззандом.\n\nНапоминание о нем — Зеркала Былого, хранящие в себе отпечатавшиеся участки прошлого. Существует тысяча и еще два таких зеркала, и они высоко ценятся среди ученых, археологов и просто любителей искусства: картины на них обычно запечатлены интересные.\n\n### Архидемон Страха\n\nДревний Архидемон, факт существования которого подтверждает лишь несколько ненадежных легенд. Согласно им, этот безымянный повелитель был, на самом деле, Четвертым из Изначальных, зародившихся в одно время с самим Расколотым Простором. Совместными усилиями Трех, он был уничтожен.\n\nЕго Имя, Власть и любые подробности давно забыты и стерты Хранителем Тайн, а единственным напоминанием о нем служит 333 Осколок — Царство Страха, домен холодного, зеленого огня.", "category": "Существа", "createdAt": 1793632093893, "order": 1, "summary": "Экзо'тай, обитатели Бездны, их категории и семь Архидемонов.", "title": "Демоны", "updatedAt": 1793641859264, "updatedBy": null}, "tainstvennaya-sila": {"aliases": ["магия", "волшебство", "Дар", "заклинания", "Личная Магия"], "body": "Как известно любому правоверному пахомианину, любимым занятием образованных волшебников является наложение проклятий, поедание детей и договоры со злыми демонами.\n\nЧеловек, знакомый с адептами магии не по стереотипам Церкви — и не по деятельности Круга Проклятых, столь услужливо эти стереотипы подтверждающего, — конечно, знает, что это не так. Более всего на свете образованные чародеи любят спорить, что же, в конце концов, является магией.\n\nОтветов на этот вопрос, пожалуй, лишь немногим меньше, чем практиков самой магии: как показывает история, огонь может одинаково ярко гореть в руках воззвавшего к Основе Ort или процитировавшего строки \"Святая Астрея обрушивает пламя на армию Врага\". Притом последний свои деяния магией конечно не назовет — разве что предварительно приписав \"святая\" в начале.\n\nТогда, спрашивается, что такое магия?\n\nНекоторые практики ответили бы: \"Искусство влиять на Реальность собственной Волей\", многозначительно подняв палец вверх. Другие бы ответили: при таком широком определении, даже крестьянин, набравшийся сил от сытного обеда и волей заставивший свое тело пойти и вскопать поле — вполне себе состоявшийся чародей.\n\nТогда вопрос можно повторить: что же такое магия?\n\nК концу четвертого века Второй Эры общепринятого ответа так и не появилось. Однако, с разной степенью успеха, многие пытались. Теории рождались, отбраковывались временем, а их сохранившиеся и, нередко, неправильно понятые фрагменты ложились в основу следующих теорий.\n\nВ этом тексте вопрос магии будет рассмотрен преимущественно с тех сторон, которые доказали свою полезность. Читателю же следует самому судить, что из этого ближе к истине.\n\n## Таинственная Сила\n\nСчитается, что сам термин \"Таинственная Сила\" был введен в фундаментальном (и лишь частично восстановленном) труде антеренской эпохи, широко известном в академических кругах как *\"Единая Теория Волшебства\"*. И хотя происхождение самого термина остаётся предметом споров, именно этот труд, приписываемый одному из Владык Антерена — Леониду, — определил, что именно мы им называем и по сей день.\n\nМагия реальна — с этим трудно поспорить. Призывая огненные дожди, иллюзорные дворцы и мистические барьеры, адепты обращаются к неким силам: как любят напоминать алхимики, ничто не возникает без причины и источника.\n\nМногие практики с этим согласятся: клирики Церкви скажут, что взывают к Сиянию Творца; геоманты и вэллахани Конклава подтвердят, что имеют дело с токами Основ Мира; демонопоклонники признают, что направляют могущественные силы своих покровителей из Бездны. До *\"Единой Теории\"* подобные концепции, как правило, рассматривались раздельно.\n\nАвтор трактата не опровергает этого полностью. Действительно, ставить между вышеперечисленным знак равенства стал бы лишь безумец. Что Леонид вывел, так это ряд схожих качеств и паттернов, которые можно отследить практически в каждой такой \"'энергии\". Антеренские эксперименты по накоплению, проведению и преобразованию различных Сил, а также создание ряда экстраординарно-сложных формул, практически агностичных к призываемой магии привели его к созданию понятия Таинственной Силы как общей категории для сил, задействованных в магических явлениях.\n\nИспытывая свои трудности с объяснением экстраординарных случаев, эта теория всё равно была принята Антереном и подавляющим большинством его современных наследников — то есть, волшебниками всего Континента.\n\nПозднее, эти идеи радикализировались в виде казацкого *\"Трактата о Единой Силе\"* Лиорена Арканиста, который тот презентовал в год своего становления первым магистром. Отталкиваясь от идей Владыки Леонида, Лиорен считал Таинственную Силу не общей категорией, а единой реальной силой, различные проявления которой определяются её Аспектами. От них, в свою очередь, зависит специфика применения: к примеру, обладающая аспектом Огня Основа Ort будет идеально подходить для воздействия, связанного с пламенем — запитать же схожие чары Лунным Светом, (если вообще выйдет) получится лишь с катастрофической потерей эффективности. И, как подтвердила практика, таким же шансом аномальных последствий. Считаясь практически общепринятой среди казацких академиков, в иных традициях такая школа мысли пока не получила широкого признания.\n\nСогласно Антеренской Теории *(так её называют в Казакии, чтобы не путать Единую Теорию и Теорию Единой Силы)* каждый вид магии происходит от определенного Источника Волшебства. Так, используя [[Древо Основ]], можно сказать что Ort, Deo и Aias берут свое начало в т.н. Сердце Мира — отсюда и успехи в их преобразовании. Она, в свою очередь, никак не объясняет, откуда Источники получают свою способность такую силу производить.\n\nСогласно же Теории Единой Силы, Источники не столько генерируют, сколько преломляют Таинственную Силу, исходящую из некой \"точки начала\", наделяя собственными Аспектами.\n\nВопрос же изначального происхождения Таинственной Силы относится к списку \"Задач Тысячелетия\" Казакии, предоставление проверяемого ответа на любую из которых практически гарантирует аудиенцию с архимагом и звание Высшего.\n\nС момента основания города-государства, правда, ни одну из них никто так и не решил.\n\n## Принципы Чародейства\n\nЕсли бы Таинственная Сила никак не влияла на мир, никому она была бы не нужна. Или, в лучшем случае, изучали бы её куда как менее активно.\n\nОднако, как подтверждает история, магия проявляет себя в мире бесчисленными способами, и самым эффектным и знакомым обывателю из них, конечно, остаётся чародейство, волшебство, колдовство — словом, возможность творить заклинания. Но что для этого нужно?\n\nДавайте попытаемся ответить с точки зрения того же обывателя. Конечно же, настоящему волшебнику нужен Дар — неизменно с большой буквы. Полезен будет посох, палочка, фокус или любой другой катализатор. И, конечно, сами заклинания, которые магу предстоит творить. Каждую из этих вещей можно разобрать по отдельности.\n\n### \"Дар\" и одаренность\n\nС **Даром** все, конечно, сложнее уже с первой буквы. Согласно антеренским открытиям, если вы это читаете, кем бы вы ни были, вы, вероятно, этим \"Даром\" все же наделены, и, поздравляем, можете стать чародеем. Вопрос в том, сколько на это уйдет времени и сил, и какой результат это даст. У подавляющего большинства уйдет десятилетие, чтобы развить простейшую чувствительность к магии — и это без учета времени на формальное магическое образование, для которого такая особенность, по сути, необходима с первых практических занятий. Другие, в свою очередь, попадают в Казакию, нечаянно спалив родовое поместье во время шока.\n\nЧто является определяющим фактором — доподлинно неизвестно до сих пор. Высокая одаренность иногда является наследственной чертой, но у двоих магистров вполне может родиться и \"ноль\". Дар может вспыхнуть на грани жизни и смерти, но в большинстве случаев этого не происходит. Он может происходить из склада ума, но даже одна [[Казакия]] знает ряд гениальных чародеев-теоретиков с никудышными способностями. Склонности к определенной Таинственной Силе могут чаще проявляться в группах, живущих на активно затронутых ею территориях, вплоть до обретения Личной Магии — но ученые пока не знают, считать ли это тем же феноменом.\n\nВопрос природы одаренности и ее культивации также относится к Задачам Тысячелетия. Увы, наиболее усердные исследователи этой проблемы нередко обнаруживают себя на кострах храмовников или Инквизиции за опыты над людьми.\n\n### Заклинания и их анатомия\n\nДар позволяет волшебнику творить **заклинания**. Но что такое заклинание? Чародей вскидывает руки вверх, закатывает глаза, произносит нараспев \"Аллаби Никхтас!\" и, распустив пальцы веером, выпускает сноп огненных молний. Почему-то, когда то же самое идеально повторяет обыватель, ничего (в лучшем случае) не выходит. Но не стоит сразу винить в этом только отсутствие \"Дара\".\n\nСперва стоит разобрать заклинание на основные составляющие. Их, *в классической волшебной теории*, три.\n\n- **Прикосновение** — в процессе которого маг собирает и, так или иначе, берет контроль над необходимой ему Таинственной Силой.\n- **Формирование** — в котором сырому потенциалу задаются намерение и структура.\n- **Воплощение** — в котором выпущенное волшебство проявляется в Реальности.\n\nЗаклинание, обычно, весьма строго описывает необходимые шаги для каждого пункта, дабы достичь четко определенного результата. Само _ощущение_ магии — вещь на редкость субъективная: даже последователи одной традиции могут совершенно по-разному воспринимать контакт с Таинственной Силой. Мастеру, разработавшему собственные чары, приходится изрядно потрудиться, прежде чем другой маг сумеет воспроизвести тот же эффект, и объяснить здесь нужные слова и жесты — самая легкая часть. Долгое время считалось, что маг должен быть способен идеально визуализировать эффект заклинания. Конечно же, когда внутри Казакии маги начали активнее контактировать друг с другом, оказалось, что добрая половина из них и вовсе не использует в своей практике воображаемые зрительные образы!\n\nНекоторые великолепные чары умерли вместе со своими авторами, так и оставшись \"непереведенными\". Иные заклинания, целиком зависящие от личности и опыта создателя, называются уникальными чарами, и переведенными оказаться не могут вовсе.\n\nЖесты, \"Аллаби Никхтас\", экзотические благовония и особое состояние ума — всё это может быть инструментом, \"опорой\" для любой из частей колдовства. Отклонись от предписанного — и пеняй на себя. Из этого, впрочем, совершенно не следует, что заклинание невозможно изменить.\n\nК примеру, сложная техника, известная как *\"Ускоренная Инкантация\"*, заключается в том, чтобы, ценой некоторого ослабления эффекта и увеличенных потерь, значительно сократить процесс Формирования. Напротив, иным ученикам приходится сознательно расширять шаги или добавлять новые, чтобы создать то, на что у умелого адепта уйдут секунды, фраза и пара эффектных жестов. Конечно, мудрый маг легко увидит в такой технике возможность усилить и без того хорошее заклинание, пожертвовав временем.\n\nВыученное заклинание — далеко не только вбитые в подкорку мозга слова и оставшиеся в мышечной памяти жесты. Лишь в полной мере освоив путь от доступа к Силе до заданного магического результата, маг может считать чары изученными.\n\n### Посохи и прочие друзья чародея\n\nРедкий волшебник обойдется без надежного и увесистого посоха, элегантной и удобной палочки, укрепленной мистическим камнем рукавицы — словом, артефакта, связь которого с деятелями Искусства успела стать культурным элементом.\n\nСреди непосвященных ходит два популярных мнения: либо такие предметы используются скорее для вида и удобства ради, выполняя функцию скорее эстетическую; либо же маг и вовсе не может сотворить ни искорки, если лишить его такого артефакта.\n\nВторой миф можно развеять сразу: конечно, даже без катализатора, маг действительно способен сотворить заклинание. С другой стороны, воин тоже может выйти на поле боя без оружия, а лесорубу, при должной решимости, под силу кулаками повалить не самое крепкое дерево. Ровно настолько разумно, как и звучит.\n\nОтчего же такие артефакты столь радикально меняют дело? \"Единая Теория Волшебства\" имеет свой ответ. *Таинственная Сила*, её виды, не зря отделяются автором от огня, камня, дуновения ветра или течения воды — и, соответственно, наблюдаемых форм материи. Не приравнивается она и к так называемой энергии и её разновидностям. Сила, по заверениям автора, существует в ином слое бытия, взаимосвязанном с, грубо говоря, \"материальным планом\". Дабы заклинание возымело эффект, его нужно проявить, *воплотить* в Реальности, и для того, насколько известно, необходим медиум. Наши тела, как показала практика, выполняют эту роль... с оговорками.\n\nВо-первых, проводя магию целиком и полностью через самого себя, маг открывает себя куда большему риску, связанному с воздействием Таинственной Силы. Не один и не два пироманта стали обладателями обугленных пальцев из-за собственных ошибок, и не просто так стал широко известен \"синдром кристаллизации\", возникающий при неумелом использовании лунной магии.\n\nВо-вторых, наличие катализатора попросту дает огромное количество способов усилить себя. Правильная древесина, тщательно настроенный кристалл-амплификатор, дополнительные компоненты — и палочка сфокусирует искру, способную зажечь лишь свечу, в стрелу огня, коей под силу превратить человека в живой факел! Если же в катализаторе окажется еще и артефакт-накопитель Силы, процесс Прикосновения к ней станет куда доступнее. Воплощая же Силу через себя, маг работает лишь с тем, чем обладает сам, и, за редкими исключениями... результат не впечатляет. Такую способность можно натренировать, как любой навык, но в девяноста девяти случаях из ста куда эффективнее просто воспользоваться инструментом.\n\nКонечно, сам по себе великолепный катализатор не превратит вас в великолепного мага. Он может сфокусировать и амплифицировать воплощенную Силу, содержать резервуар энергии, иметь иные полезные свойства, но базисом для всего этого все еще служит сам маг. Да и заклинания за него классические модели творить не будут, хотя иные посохи могут вмещать в себе одну или несколько матриц Формирования.\n\nЕще сложнее ситуацию делает тот факт, что великолепный артефакт, созданный заслуженным мастером, может совершенно не подойти одному из двух магов одинаковой, казалось, специализации. Артефакторы отмечают, что эффективность орудия в огромной мере зависит от так называемой \"синхронизации\" с инструментом и его составляющими. Являются ли ее причины сугубо психологическими, или же имеют под собой иную основу — как и многое в этом тексте, предмет активных споров среди волшебников. По той же причине, любой качественный артефакт обычно изготавливается на заказ под конкретного пользователя. Иные говорят, что еще лучше делать собственное орудие самостоятельно, но далеко не все готовы уделить время и силы процессу.\n\n### Об опасностях Искусства\n\nМагов боятся. Магов ненавидят. Пред магами благоговеют. Волшебство способно на вещи, невообразимые обычному человеку — и не всегда они случаются по умыслу волшебника. Столь немногие достигают вершин чародейства далеко не только и не столько из-за редкости Дара, ведь его совершенствование само по себе является тяжелейшей дорогой.\n\nМагия опасна для самого чародея: каждый этап заклинательства истощает тело и разум. Сторонники мистицизма считают, что для взаимодействия с внешней Таинственной Силой адепт использует собственную — внутреннюю духовную силу. Не рассчитав сил и применив заклятье значительно выше себя, маг может инстинктивно вложить слишком много \"себя\" в процесс, после чего, в худшем случае, умереть или остаться калекой до конца дней.\n\nМагия опасна для всего вокруг: немало вещей могут пойти не так во время творения чар. Ошибись в Формировании, и то, что должно было быть потоком пламени, превратит тебя в оживший факел. Ошибись в Прикосновении, и потока не выйдет вовсе — либо вместе с целью он поглотит целый дом. А допустив оплошность в Воплощении, чародей рискует вызвать *аномалию* — непредсказуемое явление, возникающее в результате излишней Таинственной Силы, воплощенной в реальности вне заклинания.\n\nАномалия не обязательно произойдет в ближайшие секунды: к примеру, на месте сражения нескольких пиромантов однажды вполне может появиться стихийно возникший огненный элементаль. Конечно, подавляющее большинство аномалий почти безвредно: быть может, одной ночью над полем будут светиться яркие огоньки, или вода во всех контейнерах поблизости обратится в лед. В основном, такие эффекты сами собой распадаются за считанные дни или даже часы. Впрочем, худшие из них способны исказить целые регионы на многие века вперед — то мы знаем из наследия магических битв Антерена, последствия которых до сих пор отражаются в современности.\n\n\"Убирать за собой\", очищая остаточную активную Силу — такое же правило этикета для уважающего себя чародея, как правила приличного приема пищи на знатном приеме для дворян. Следуют ему, конечно, далеко не многие: иные не умеют, иные не считают нужным, а другим попросту лень.\n\nВажно отметить, что ничего из этого не должно отвратить искателей от Искусства. Путь опасен — как и любой другой, ведущий к великой силе и познанию. И все же, следует помнить:\n\nВраг начинающего мага — недостаток знаний, великого — уверенность в том, что он знает все. Магам посередине, как водится, еще труднее: их нередко преследуют оба этих врага в равной мере.\n\n### Личная Магия\n\nНекоторые создания наделены особыми силами. Не потому что они их изучили или получили свыше, но... Справедливо будет сказать, к концу четвертого века Второй Эры никто так до конца и не разобрался. Так или иначе, Личной Магией называют особые способности, тесно связанные со своим обладателем и нередко выходящие за привычные в академических кругах рамки.\n\nЧеловек может родиться в месте, где когда-то бушевали аномалии Ort. Удивительным образом, без всякого магического образования или намека на полноценный Дар — даже на простейшие заклятья у него уходят месяцы — он умеет контролировать огонь. Сей навык для него столь естественен, что на просьбу объяснить процесс Формирования и Воплощения его действа он только глупо пожимает плечами.\n\nДругой человек может родиться в обычной семье, на обычной земле, и за жизнь не встретить ни одного чародея (пока не повстречал казацких исследователей). Его отец был рыбаком, и он им тоже является с самого детства. По странной причине, ровно в десяти метрах от себя он чувствует любого окуня (и только окуня!) с совершенной точностью.\n\nТретий, и имя его известно многим — Годрик II Говнарион, обладал полным иммунитетом к любым ядам. Выяснилось это, как гласит молва, только после сто пятнадцатой попытки его отравить, и неизвестно, была ли эта способность у него всегда, или проявилась именно из-за десятков неудачных.\n\nВолшебники бьются головой о стену, стремясь систематизировать и объяснить подобные феномены. Одни пытаются назвать это альтернативным проявлением Дара. Другие считают сам Дар формой Личной Магии, позволяющей творить магию обычную. Иные еще не высказались, но тоже имеют собственные сложные теории.\n\nТакже эта категория печально известна как та, куда исследователи сваливают все то, что неудобно классифицировать иными способами.", "category": "Магия", "createdAt": 1793632093893, "epigraph": "Враг начинающего мага — недостаток знаний, великого — уверенность в том, что он знает всё.", "epigraphBy": "Казацкая присказка", "order": 1, "summary": "Что такое магия, Дар, заклинание, катализатор и Личная Магия.", "title": "Таинственная Сила", "updatedAt": 1793641859264, "updatedBy": null}, "kazakiya": {"aliases": ["Казакион", "Мерклейдская Ассоциация Магов", "Горы Архимага", "Академия"], "body": "Казакия, также известная как Мерклейдская Ассоциация Магов — небольшой город-государство за Горами Архимага и крупнейшее объединение волшебников известного Континента. Возникла она всего полвека назад, в 333 году Второй Эры, в ходе Четвертого Похода Очищения — мероприятия, которое [[Церковь Света]] планировала завершить окончательным искоренением магии, но которое, по причинам весьма очевидным, ныне вспоминает без особой гордости.\n\nОснователем государства считается загадочный [[Архимаг Казакион]]. Явившись в Новую Пахомию в день объявления Похода, он предложил Церкви прекратить преследование волшебников, а после вполне ожидаемого отказа занял Священный Город, созвал туда магов со всего Запада и, когда объединенная армия Союзных Королевств явилась восстановить порядок, окружил город возникшей за один день горной цепью. Сражения так и не произошло. С тех пор Горы Архимага остаются если не убедительным аргументом в пользу дипломатии, то по крайней мере гарантией полной изоляции. Сквозь немногочисленные тоннели, ущелья и контролируемые телепорты армии уж точно не пройти.\n\nНи чародеям, ни секретным службам Королевств так и не удалось найти ни единого упоминания о Казакионе до 333 года. Не отметился он и после, как правитель: запершись в созданной на месте собора башне, он целиком уступил управление Совету Магистров — лучших волшебников Ассоциации. Сам же он, несмотря на свой практически божественный авторитет, никак не участвует в жизни организации, и лишь немногие видели его вживую после тех событий.\n\nЗа пятьдесят лет существования Казакия успела превратиться из убежища для преследуемых магов в полноценный научный и образовательный центр. Казацкая Академия обучает одаренных со всего Мерклейда — в том числе детей тех дворян, которые публично осуждают колдовство несколько громче, чем следовало бы человеку, недавно оплатившему обучение собственного наследника.\n\nКлючевым принципом Ассоциации считается изречение Казакиона *\"маг не должен служить своей силе\"*. Волшебство  должно быть результатом знания, дисциплины и контроля, а не поклонения, сделки или зависимости от непознаваемого источника. По этой причине отношение Ассоциации к демонопоклонникам, осквернителям и иным любителям получить могущество наиболее быстрым способом обычно не отличается особой терпимостью.\n\nОтношения Казакии с Союзными Королевствами долгое время оставались холодными, но за последние десятилетия Ассоциация постепенно вышла из изоляции. Особенно заметно это стало в 383 году, когда Совет Магистров впервые официально вступил во внешний военный союз, присоединившись к борьбе против Пожирателя во время Войны Червя.", "category": "Земли", "createdAt": 1793632093893, "epigraph": "Маг не должен служить своей силе.", "epigraphBy": "Архимаг Казакион", "order": 3, "summary": "Город-государство магов за Горами Архимага, основанный загадочным Казакионом в 333 году.", "title": "Казакия", "updatedAt": 1793641859264, "updatedBy": null}, "drakony": {"aliases": ["драконы", "виверны", "Валатреллен"], "body": "Первые [[Эльфы]] угасли и ныне забыты даже большей частью собственных потомков. [[Гайаны]] — разрушены в войнах столь древних, что их забыли даже первые расы, либо же спят вечным сном. Но никогда мир не забудет наиболее могущественных своих первенцев, избранных [[Aias]]: драконов.\n\nВесь род этих созданий происходит от Древних Драконов, именуемых также Высшими или Первородными. Настолько же стихийные существа, насколько и звери, они существовали в двух мирах одновременно и частично игнорировали законы обоих.\n\nНе огненное дыхание и не могучие крылья являлись величайшей силой Древних Драконов: их оружием была Власть над Небесами, превращавшая взмах их крыльев в бушующий ураган, удар хвоста — в разящую молнию, а дыхание — в смерть.\n\nЧешуя Бессмертия искажала ход времени вокруг этих созданий, даруя им вечную жизнь и сопротивление даже к чужой Власти. Гарантированно проломить её могло лишь оружие из звездного металла. Поистине, они были Избранными этого мира, совершенными организмами, не знавшими себе равных.\n\nДоподлинно неизвестно, что привело к концу их Эры: быть может, война между ними самими, а возможно — вмешательство силы, что мудрецы не в состоянии даже представить.\n\nТак или иначе, в современные дни доподлинно известно лишь об одной представительнице этой расы: [[Валатреллен Красная]], живое божество из далекого Сетлейда, что спит долгим сном под охраной принятого ей народа.\n\n## Низшие Драконы\n\nПрямые потомки Древних Драконов, в сравнении со своими предками они — немощные вырожденцы. И даже так, едва ли человечество знает противника страшнее низших, или цветных драконов.\n\nНазываемые также Каалагонскими Вивернами, они получили это имя за счет того, что большая часть сохранившихся низших драконов обитают именно в Каалагонских Горах.\n\nПрактически утратив свою Власть, они обычно идут по пути стихийной адаптации, сродняясь с силами, с которыми они часто контактируют. В этом они чем-то напоминают троллей, хотя причина тому и неизвестна.\n\nРезультатом этой адаптации становится появление Цвета, определяющего тип их дыхания и особенности физиологии. Основными цветами считаются Красные (огнедышащие), Синие (морские змеи) и Желтые (песчаные драконы).\n\nВ отличие от своих предков, Цветные Драконы лишены бессмертия, хотя с тем же успехом могли бы им и обладать: их жизненный срок исчисляется тысячелетиями.\n\nКак и Высшие, они крайне разумны и способны к ментальному контакту, хотя и редко прибегают к этой технике в отношении прочих рас: к чему разговаривать со скотом-однодневкой?\n\n## Вирмы\n\nВ эту категорию относят разнообразных созданий, имеющих отношение к драконьему роду, но недостойных называться настоящими драконами.\n\n- Виверны — Наиболее распространенный вид крылатых драконидов, обитающий в гористых местностях. Тогда как драконы редки и величественны, эти твари столь распространены в некоторых регионах, что охота на них становится частью национальной культуры — [[Ринна]] тому пример. При этом, виверны исключительно быстры и опасны, а их кровь — ценный магический компонент.\n- Дрейки — Широкая категория нелетающих драконидов, в основном населяющая Ринну и Варлейд. Разнятся от охотящихся стаями велоцирапторов до могучих тираннозавров.\n- Псевдодраконы — Ужасающие, практически полностью слепые чудовища Подземного Мира, мощью сравнимые с Цветными Драконами и способные выдыхать ужасную кислоту.\n- Драконьи Черепахи — громадные панцирные создания, нередко достигающие размеров крупного дома. Встречаются только в Варлейде.\n- И многие другие виды, которые будут однажды упомянуты в отдельной статье.", "category": "Расы", "createdAt": 1793632093893, "order": 6, "summary": "Древние Драконы, их выродившиеся потомки и вирмы.", "title": "Род Драконов", "updatedAt": 1793641859264, "updatedBy": null}, "konklav": {"aliases": ["вэллахани", "друиды", "Рощи", "Шесть Истин", "Вааленполь", "винджен", "духи"], "body": "Древнее объединение адептов Дикой Магии, известных на ведорском наречии как *вэллахани* (ед.ч - вэллахан), основанное во времена Темного Века.\n\nНа риннский манер адептов Конклава также часто называют *друидами*.\n\nКонклав ставит для себя две основных задачи: защиту Природы и ее баланса, а также защиту и поддержку Ведорской земли: ее свободы, самобытности и всех народов, проживающих на ней.\n\nВэллахани можно назвать духовными лидерами для Княжеств: наставниками, советниками, лекарями и мудрецами, однако же главной их задачей является роль посредников между людьми и миром духов.\n\nУчение Конклава имеет нерушимую основу — Шесть Истин, которые разделяют правду от лжи и определяют лад мира. За пределами этих принципов, все прочие аспекты учения — как именно заботиться о Мире, как поддерживать ладное течение, какова роль духа и человека, и много другое — определяет для себя отдельно взятый вэллахан.\n\n## Устройство Конклава\n\n### Священные Рощи\n\nСакральные места для вэллахани и всей Ведории, Рощи основываются вокруг природных Мест Силы — за редкими исключениями, столпов Живого Камня. Каждая Роща выполняет роль святилища и места для обрядов, но также и пристанища для каждого вэллахана - Странника или Смотрителя Рощи. В них же происходят важные собрания - как в пределах одного Круга или Рощи, так и имеющие значимость для всего Конклава.\n\nОтдельно упоминают **[[Эскаран]]** — нечто среднее между Рощей и священным городом, это место возведено вокруг величайшего столпа и является центром токов мистической силы Ведории. Лишь в Эскаране могут проводиться Великие Собрания, на которые должны явиться не только Архидруиды, но и каждый вызванный князь, ибо дела, обсуждаемые на них, касаются всей Ведорской Земли.\n\nПрактически каждая Роща включает в себя несколько +- обязательных структур:\n\n- **Сердце Рощи** — центр и самое сакральное из мест в Роще, в котором располагается Место Силы. Это - главная святыня, к которой не допускается кто попало. Здесь же проводятся самые важные из обрядов Рощи, обращающиеся к силе самого Живого Камня.\n- **Круг Собраний** — Открытое место для советов, суда, обрядов, сезонных празднеств и встреч с просителями.\n- **Места Служения** — Сады лекарственных растений и дома самих лекарей, священные источники, площадки для обучения, мастерские, камни памяти умерших и многое другое.\n- **Внешний участок** — Пространство на границе Рощи, в первую очередь включающее жилища для странствующих вэллахани и иных временных жителей.\n\nРедкие Рощи бывают закрытыми для посещения мирянами, однако большинство из них принимают просителей и гостей. Таким образом, во внешних участках некоторых Рощ может образоваться нечто вроде настоящих поселений.\n\nДля обычного ведорца, Роща - это место исцеления, убежища и справедливого суда, совета и возможности узнать больше о собственной земле.\n\n### Круги\n\nКак уже упоминалось, учение Конклава имеет шесть основополагающих принципов: Живой Земли, Течения, Завершения, Связи, Сути и Баланса. Имеет оно и цели — защиту Ведорской Земли и уклада самого мира. Однако конкретные детали, вытекающие из этих основ - своеобразные \"ветви\" учения, разнятся для каждого вэллахана. В случае, если определенное понятие, род деятельности или территориальная привязка к конкретной Роще набирает достаточное количество последователей, такое течение начинают называть Кругом.\n\nНе \"организация внутри организации\", но, скорее, группа схожих взглядов, Круги даже не обязательно должны быть территориально где-то расположены. Таким образом, отдельный вэллахан может быть частью нескольких Кругов.\n\nК примеру, вэллахани, считающих верным путем странствие по всей Ведорской земле и посильную помощь в делах на пути, причисляют к Кругу Странников. Тех же, кто посвящает себя заботе о конкретной святыне — Смотрителями Рощи. Наконец, сосредоточившихся на поддержании и защите самой системы Живого Камня именуют адептами Круга Камней.\n\nК Кругам же относят и определенные взгляды на магические традиции Конклава. Как таковой, Зеленый Путь не имеет единой магической системы - разве что передаваемые от учителя к ученику или записываемые в Рощах обряды. Отдельные искусства, черпающие силу из Древа Основ, также являются личными наработками отдельных вэллахани — либо достоянием Кругов.\n\n### Архидруиды и власть в Конклаве\n\nСреди Конклава трудно выделить конкретных лидеров. В пределах Рощ, наибольшим влиянием обладают старейшие и наиболее мудрые из вэллахани — **старейшины**. В пределах собраний в Эскаране, вес имеют слова посланников из каждой крупной Рощи и старейшин самого Эскарана. Но более всех прочих, уважением пользуются те немногие, заслужившие титул **Архидруида**.\n\nСтановление Архидруидом — не вопрос силы, признания вэллахани, основания собственного Круга или создания Рощи. Это вопрос тяжелейшего (и всегда уникального) испытания, кульминацией которого становится признание **Старшим Духом** — одним из величайших, практически полубожественных созданий, обитающих на Ведорской Земле. Метка этого признания навеки остается с Архидруидом и значительно поднимает вес его слова для людей и духов.\n\nАрхидруиды — не однозначные лидеры Конклава, но сила, мудрость и духовная значимость практически всегда гарантируют, что их голос будет услышан любым, к кому они обратятся. В Эскаране, Архидруиды составляют ключевую часть совета старейшин.\n\n## Учение Конклава\n\n**Принцип Живой Земли**\n\nМир жив. У него есть Сердце, ток, память, рост, пределы, боль и исцеление.\n\nМир не принадлежит никому.\n\nЧеловек, гном, дух и кто либо еще — часть Мира, но не его хозяин.\n\nВласть князя не может быть выше истинного пути земли.\n\nДаже великий дух не является богом, но частью течения мира.\n\nВсякая магия есть вмешательство в живую ткань мира.\n\nМудрость вэллахана в том, чтобы не ломать течение эссенции мира, а направлять его без увечья.\n\n**Принцип Течения**\n\nМир движется, его Эссенция находится в вечном Пути. Его истинно-верное состояние — ладное течение. Сей Путь не должен быть нарушен, удержан или искажен. Жизнь держится на движении, а не застое. Всякая порча есть нарушение истинного Течения по Древу Основ.\n\n**Принцип Завершения**\n\nПустота — часть мира. Конец необходим для нового начала, без него Течение превращается в застой. Но то, что должно уходить в Пустоту в свой срок, не должно быть ввергнуто туда прежде времени. Все, что ушло в Пустоту, рано или поздно вернется вновь.\n\n**Принцип Связи**\n\nВсе связано, ничто не существует само по себе.\n\nЧто ранено в корне, отзовется в ветви, что исцелено в ветви, облегчит корень.\n\nНельзя ранить часть мира, не задев целого, и нельзя исцелить целое, не коснувшись его частей.\n\n**Принцип Сути**\n\nВсе связано, но все имеет свой образ, место и сущность. Мудрость вэллахана — не только в том, чтобы видеть связь вещей, но и в том, чтобы различать их и понимать суть каждой в отдельности.\n\n**Принцип Баланса**\n\nНичто не должно брать сверх меры, после которой причиняется вред целому.\n\nНичто не должно уходить в крайность, что есть начало порчи.\n\n### Вааленполь —Путь Света\n\nУникальная традиция и метод самопознания/совершенствования для адептов Конклава. В самой упрощенной форме, Вааленполь является метафорическим путешествием адепта по Древу Основ, в процессе которого тот переживает некий преобразующий опыт и возвращается в точку начала, готовый к повторению цикла.\n\nКак течение Мира, истинный Вааленполь бесконечен - Свет уходит в Пустоту, дабы в ней же разгореться вновь.\n\nВааленполь может применяться практически к любому действию — через него, как призму, можно смотреть как на весь жизненный путь, так и отдельно взятое путешествие или метод рефлексии над некой проблемой.\n\nАдепт начинает, достигая состояния **Пустоты** — освобождения, незаполненности, внутреннего молчания и готовности к новому началу.\n\nВ Пустоте адепт принимает необходимость отпустить старую форму себя и перестает цепляться за известное: словом, готовится измениться по-настоящему, а не обрастить старое слоем нового.\n\nЗатем, в абсолютной Пустоте, он достигает зарождения внутреннего **Света** — \"пробуждения\", зачатия Намерения и живой воли, или, в каком-то смысле, вдохновения.\n\nВ **Огне** намерению придается форма. Свет есть намерение, Огонь же закаляет это намерение, проверяет его истинность и способность адепта выдержать Путь.\n\nВ Огне проходят суровые тренировки и испытания, где отсеивается всё мимолётное, ложное и слабое. Здесь вэллахан учится стойкости, мере, собранности и умению не отступать от узнанной истины.\n\nБез Огня Свет остается вдохновением, что быстро погаснет.\n\nВ **Древе** индивидуальная форма становится частью большего. Понимание и формирование связи с миром и его обитателями, создание устойчивых условий, осознание последствий собственного решения, всё это — Deo. Намерение, не растворяясь во внешнем мире, идет ему во благо, и мир помогает адепту в ответ.\n\nВ **Небесах**, вэллахан, наконец, может полностью осознать, что с ним произошло, какой путь был пройден и каков был его смысл. Какие ошибки совершены, и что изменилось в его собственной картине мира. Со взглядом с Небес адепт достигает понимания, и это понимание необходимо для исправления ошибок, достижения результата и, в конце-концов, освобождения.\n\nЗатем, в конце этого цикла Вааленполя, адепт возвращается в **Пустоту**. Путь признается пройденным, но ничего еще не закончено: мир бескраен, а вслед за каждым концом идет новое начало.", "category": "Вера и ордена", "createdAt": 1793632093893, "order": 3, "summary": "Вэллахани, друиды Ведории: Рощи, Шесть Истин, Вааленполь и духи.", "title": "Конклав Зеленого Пути", "updatedAt": 1793641859264, "updatedBy": null}, "giganty": {"aliases": ["гиганты", "тролли", "энты", "Гайаны", "великаны"], "body": "Мудрейшим известно, что великанский род происходит от всемогущих Гайанов — одной из Первых Рас, стоявших наравне с Первыми Эльфами и Древними Драконами. Каменные Колоссы, они были абсолютным проявлением Ort: живой силой формования и разрушения.\n\nЕсли где-то в мире и остался хоть один из них, сейчас он погружен в вечный сон, сравнимый со смертью.\n\nИх потомки населяли мир в самые разные его эпохи, принимая самые разные формы, но всех их объединял великий рост и поражающая воображение мощь.\n\n## Гиганты\n\nДревнейшие из потомков Гайанов, наделенные великой силой и мудростью. Не имея по своей природе окончательного жизненного срока, они могли тысячелетиями бродить по миру, прежде чем, потеряв к нему всякий интерес, обратиться каменными деревьями.\n\nВ мире почти не осталось истинных великанов, но каждый из них — исполин по крайней мере пятиметрового роста, наделенный, помимо всего прочего, ужасающей физической силой.\n\nИх разум чужд человеческому, они мыслят и понимают мир совершенно иначе. Ментализм с тем же успехом мог бы и совершенно не работать на этих колоссах.\n\nОгромное значение для великанов имели их глаза — магический объект по своей природе, они позволяли им видеть не только на несколько измерений больше, чем воспринимает человеческое сознание, но и познавать саму Суть вещей одним взглядом.\n\nВторым их сокровищем была их Речь. Гиганты не вели записей, отдавая великое значение устной традиции. Они не говорили лжи, и величайшим их мастерам были открыты Слова Силы, вносящие Истину в реальность.\n\nРазговор был для них священным действом, что могло продолжаться целыми годами: далеко не обязательно ради какой-то великой цели, но просто самого акта беседы ради.\n\nМиру известны циклопы — гиганты, \"проклятые\" или \"благословленные\" лишь одним оком, которое, впрочем, было наделено еще большими силами, чем обычные глаза великанов. Как гласят записи Анурианской Империи, древние циклопы вымирали уже к моменту ее зарождения, но были способны вносить Слова Силы одним лишь взглядом.\n\n## Энты\n\nПотомки Гайанов, имеющие большее родство с современными деревьями, нежели с каменными. Почти не встречаемые иначе как в древнейших лесах, до Войны Червя и присоединения Лесного Королевства к силам Альянса энты считались то ли полностью вымершими, то ли изначально не существовавшими созданиями.\n\nВоистину напоминающие ожившее древо, они были наделены прочной корой и силой срастаться с местностью, пуская свои корни на многие десятки метров вокруг. Большая часть из них погибла в ходе Войны.\n\n## Тролли\n\nОдичавшие и наиболее распространенные великаны, тролли известны практически в любой культуре Срединного Континента. Причиной тому считается их величайшая сила — Адаптация.\n\nСеребряная кровь тролля позволяет им принять черты и силы любой местности, в какой бы они ни поселились: горный тролль обретет каменную шкуру; речной тролль
