Всё то, что умирает в нем, рано или поздно вернется: люди, животные, насекомые... даже деревья в Каэд Фелле представляют собой отдельную форму нежити. Единственная вещь, способная отогнать туман — рунные фонари гномов Эмдена, но даже они не спасут навсегда.\n\nГоворят, история Народа неразрывно связана с Расколотой Горой. [[Гномы]] — скрытный народ, а когда речь заходит об истории, представители Блуждающего Народа превосходят в этом качестве даже своих родичей с Золотой Горы. Но даже из их уст Мастерской удалось узнать, что когда-то Расколотая Гора посреди Каэд Фелл была землей Этередайна — якобы крупнейшего из гномьих королевств, что превосходило даже [[Дол-ин-Аурос]]. И было их богатство столь великим, что Безымянный — злой бог их пантеона, явился в мир в обличье костяного дракона Гхолдретта, и тень от его крыльев превратила когда-то прекрасные земли в край искаженного бессмертия.\n\nНеизвестно, сколь много правды в этой истории, но редкие экспедиции, вернувшиеся из Тумана, докладывали о руинах антеренских городов в глубинах Каэд Фелла. Подобраться еще ближе к Расколотой Горе пока не получалось ни у кого.\n\nХудшие опасения Мастерской предполагают, что Туман может иметь собственную волю. Каждая попытка вырубить проклятый лес, очистить пораженные земли или еще как-либо навредить им в крупном масштабе всегда вызывает ответную реакцию: до того недвижимый Туман Смерти выходит из-за границ Каэд Фелл, обычно пассивные мертвецы собираются в орды... и Край Теней неизменно разрастается, забирая у живых очередной клочок земли.\n\nИзвестнейшим из таких случаев стала попытка сжечь лес полностью: в 322 году Второй Эры бургомистр Рейтенорна, с поддержкой Ордена Неугасимого Пламени (и рискуя головой за связи с демонопоклонниками) поджег громадный его участок, что, как показалось в начале, подействовало даже на крупнейшие из мертвых деревьев... но затем привело к крупнейшему из зафиксированных вторжений нежити, затронувшему даже прочие Союзные Королевства. Когда же волну проклятых удалось отбить, с ужасом люди обнаружили, что город был далеко за границей Тумана...", "category": "Земли", "createdAt": 1793632093893, "epigraph": "Я не видел, что Туман сделал с остальными, и, видит Творец, надеюсь никогда их больше не увидеть.", "epigraphBy": "Отчёт второй экспедиции Серебряной Мастерской, 257 г. В.Э.", "order": 7, "summary": "Земли Теней в центре Мерклейда, покрытые Туманом Смерти, где всё умершее восстаёт.", "title": "Каэд Фелл", "updatedAt": 1793641859264, "updatedBy": null}, "bezdna": {"aliases": ["Эхандар", "Расколотый Простор", "Осколки"], "body": "Бездна, она же Эхандар или, по-древневагра'ански, Расколотый Простор, — измерение между Внутренней и Внешней Завесой (см. [[Небесные тела]]). Граница между материей и Таинственной Силой здесь почти стёрта.\n\nВ чистом виде Бездна — это искажённое пространство с бурями магии и нестабильной материей. Внутри него, в пузырях Невозможной Энергии, держатся **Осколки**: небольшие куски стабильной реальности со своими законами. Осколки пронумерованы, и у крупнейших есть хозяева.\n\nОбитатели Бездны известны как [[Демоны|демоны]]. Больше 70% Простора принадлежит одному из семи Архидемонов. Кроме них, в Бездне лежит Дворец-Вне-Времён, королевство лунных [[Эльфы|эльфов]] Таулендина, отбитое когда-то у Ониксового Трона.\n\n## Несколько известных Осколков\n- 16 — Чёрная Цитадель Дрем, Ониксового Лорда.\n- 67 — Бессолнечные Земли, Короля Мёртвых.\n- 88 — Великий Архив, Хранителя Тайн.\n- 170 — Жёлтое солнце Пламени Хаоса.\n- 230 — Сады Ощущений Алой Звезды.\n- 301 — Моровые Ямы Гниющего.\n- 333 — Царство Страха, домен забытого Архидемона.", "category": "Мир", "createdAt": 1793632093893, "order": 5, "summary": "Расколотый Простор между двумя Завесами: родина демонов, разбитая на Осколки.", "title": "Бездна", "updatedAt": 1793632093893, "updatedBy": null}, "alhimiya": {"aliases": ["Архистихии", "зелья", "Первая Наука", "Братство Алхимиков"], "body": "*\"— ...заканчивая же сию тему: ты узнал и, я верю, запомнил, что все в Мире происходит из единых Врат...*\n\n*— Не дам солгать, учитель, сами вы некогда говорили, что это — лишь теория Антерена.*\n\n*— И я не стал бы рассказывать тебе теорий, в которые бы не верил сам. Мы вернемся к этому вопросу - эта часть сейчас не столь важна. Ты узнал и, я надеюсь, понял: всё в Мире взаимосвязано, но все обладает собственной сутью. Все движется, ничто не стоит на месте. Познай суть вещи и ее связи — и тебе откроются тайны ее Пути.*\n\n*— Верно, конечно, и обратное?*\n\n*— Безусловно. Познай Путь вещи — и ты познаешь её Суть. Измени Путь — и ты изменишь саму вещь. На том мы смело можем подвести итог: алхимия — наука об Истинных Путях Вещей, сколь многогранны бы ни были трактовки этого выражения.\"*\n\n— Диалог юного Миррдина эт-Анголвена с учителем.\n\n## Пути Алхимии, Основные школы Континента\n\nАлхимия — воистину великое искусство. Начать стоит с того факта, что, в том или ином виде, алхимию и ее практиков можно встретить в каждой культуре Срединного Континента.\n\nКонечно, вряд ли уважаемый эрудит Братства Алхимиков, орочий знахарь, ведорский вэллахан-зельевар, незетари Дома Вейерес и имперский философ Сатураса согласятся, что занимаются единым делом — однако каждый из них, так или иначе, касается одной из сфер Первой Науки.\n\nОдни могут воспринимать алхимию как чистое ремесло. Фокусируясь на преобразовании материи, они стремятся разбогатеть на превращении свинца в золото, создании уникального сплава или целебного эликсира, обладающего сверхконцентрированной сущностью вим.\n\nДля других это — в первую очередь философия. Великое Делание есть путь внутреннего преобразования, а \"золото\", конечный этап — состояние души. Для иных же алхимическая теория помогает на пути магии — не зря в иных кругах алхимию называют предком волшебства.\n\nКонечно же, далеко не все алхимические традиции фокусируются лишь на чем-то одном: немногие видят свое искусство лишь как \"ремесло\" или \"философию\".\n\n### Мерклейдская Алхимия\n\nНаиболее известные практики: [[Орден Мудрых]], Братство Алхимиков, [[Казакия]]\n\nОсновная ветвь западной алхимии, практикуемая большинством адептов в Союзных Королевствах, дальнем Западе и на островах [[Альконде]].\n\nИными называется Возрожденной Алхимией, так как немалый объем базовых знаний был восстановлен по находкам из антеренских руин.\n\nКак ни странно, многие атрибуты современного алхимика — витиеватый мистицизм, скрытность, желание достичь Врат Начала и, таким образом, абсолютного познания, — появились уже в современную же Эру. Родоначальники же сего учения — антеренские алхимики — ставили фокус на манипуляции материей, создании эликсиров и прочих исключительно практических дисциплинах.\n\nПоистине многим обязаны мерклейдцы своим алхимикам: умение особым образом обрабатывать и проявлять Сущность металлов; создавать порох, клей, духи и многие другие радости жизни; варить целый ассортимент необходимых любому приключенцу зелий и, в конце-концов, создавать высокоградусный алкоголь — всё это заслуги алхимиков этой школы.\n\nПри всей двойственности своей репутации, Братству Алхимиков все научное сообщество обязано изобретением теории Шести Архистихий, вскоре разошедшейся по большей части Срединного Континента.\n\nАдепты Ордена Мудрых, в свою очередь, известны за создание Перчаток Преобразования, позволяющих направлять энергию стихийных самоцветов для трансмутации или элементарного контроля.\n\nВ то же время, Казацкие чародеи полностью встроили многие алхимические наработки в свою магическую систему, в процессе научившись использовать для преобразования энергию звездной пыли, а астральные кристаллы применять для оживления големов и многочисленных механизмов.\n\n### Алхимия Великой Топи\n\nВетвь алхимии, зародившаяся на далеком юге Мерклейда: в бескрайних болотах Великой Топи. Как известно, культура Топей состоит наполовину из еретиков, изгнанников и беглецов со всей западной половины Континента — и местная система алхимии не стала исключением. Однако, еще до интеграции бесчисленных пришлых наработок, коренные народы обладали своим собственным видением.\n\nАлхимия Топей лишь чуть менее чем полностью фокусировалась на свойствах живого: многие Сущности адепты открывали в неисчислимых растениях и частях животных своей удивительной родины. [[Великая Топь]] может похвастать запредельным множеством самых разнообразных рецептов зелий, мазей, ядов, смесей и, конечно же, наркотиков, распространяемых оттуда по всему Континенту. Великолепно.\n\nПо легенде, именно с дальнего Юга пришло до сих пор весьма остро воспринимаемое искусство создания гомункулов.\n\n### Каламическая школа\n\nВосточная традиция, получившая свое имя от Каламоса — третьего Речного Бога, активно почитаемого на просторах Империи и покровительствующего, в том числе, адептам предмета нашего разговора.\n\nЕсли между мерклейдскими школами и можно провести значимые параллели, то варлейдская же ветвь Первой Науки разительно отличается своей теорией и практикой.\n\nТогда как западные школы можно назвать, в первую очередь, наукой или ремеслом, алхимики Каламоса, первоначально — волшебники.\n\nИх главным достижением можно назвать высочайший уровень манипуляции Сущностями, позволяющий передать свойство одного объекта другому: так, говорят, восточный волшебник может передать легкость пера стальному доспеху. На практике, конечно, искусство это сложно в освоении и требует значительных затрат времени и энергии, но эффект, тем не менее, впечатляет.\n\nЭту традицию как зеницу ока берегут чародеи Аль-Хазифа.\n\n### Симмерийская Алхимия\n\nИзвестная также как \"драконья алхимия\", это малоизученное искусство значительно отличается от всех прочих ветвей — как, собственно, сама Симмерия отличается от прочего мира.\n\nИскусство сие протекает преимущественно не во внешнем мире, а внутри самого адепта. С помощью медитаций, крови вирмов, пилюль, тяжелых упражнений и дыхательных практик алхимики Серой Земли стремятся стать Драконоподобными — особым, возвышенным видом созданий, приближенным к Вечности древних драконов.\n\nИ хотя презренным рекко (сим. - иностранец) только предстоит узреть величие прошедшего Драконий Путь до конца, алхимия Симмерии не лишена результатов: ходят слухи, что иные адепты способны культивировать способность к сопротивлению стихиям, сверхъестественные чувства и даже огненное дыхание. Да и в конце-то концов, здоровый образ жизни еще никому не вредил.\n\n## Архистихии\n\nАрхистихии — категории и своеобразные \"пантеоны\" стихий, описывающие их по характерному признаку, нежели источнику. Шесть общепринятых среди большинства алхимиков Архистихий описывают окружающий мир меж Началом и Завершенностью. Сама эта концепция зародилась в Братстве Алхимиков и, к концу четвертого века В.Э., принята в большей части Срединного Континента.\n\n**Люмера** — Также читаемая как Свет и Сияние, Люмера воплощает собою яркие и наполненные энергией элементы. К проявлениям этой Архистихии относят жар, огонь, молнии, свет Солнца и звезд, а также многое другое.\n\n**Умбра** — Или же Тень, сия Архистихия проявляется в поглощении и отражении света Люмеры. Холод, свет Луны и темнота ночи — примеры проявлений Умбры.\n\n**Сиэла** — Иначе произносимая как Поток или, реже, Небеса, эта Архистихия воплощает легкость, изменчивость, бесформенность и свободу. Ее Сущность проявляется в текущей воде, порыве ветра, бушующем шторме и многих схожих вещах.\n\n**Арда** — Также называемая Стазис, Форма или Земля, Арда воплощает стабильность, тяжесть, форму и постоянство. Ее Сущность можно узреть в земле и камне, металле и кристаллах, а также многом подобном им.\n\n**Виеса** — Архистихия, воплощающая собой саму Жизнь и то, что ей наделено. Её сущность наиболее всего проявляется в присущей всему живому энергии - Вим. Иные находят её в плоти и крови, растениях и иной органике.\n\n**Сфира** — Наиболее мистическая из Архистихий, воплощающая собой призрачные и эфирные элементы. Её Сущность труднее всего узреть, но она проявляется в воплощенной Атане, призрачных субстанциях и чистых магических энергиях.", "category": "Магия", "createdAt": 1793632093893, "epigraph": "Познай Путь вещи, и ты познаешь её Суть. Измени Путь, и ты изменишь саму вещь.", "epigraphBy": "Учитель Миррдина эт-Анголвена", "order": 4, "summary": "Первая Наука о Путях вещей: школы континента и шесть Архистихий.", "title": "Алхимия", "updatedAt": 1793641859264, "updatedBy": null}, "eogan": {"kind": "character", "title": "Эоган", "category": "Персонажи", "group": "Силы Пожирателя", "role": "Предвестник Пожирателя, Лорд Глубин", "status": "Активен", "summary": "Рыцарь Заммаза, Избранный Пожирателя, первый в Легионе Голода.", "body": "Рыцарь Заммаза, Избранный [[Пожиратель|Пожирателя]], Предвестник. Первый в Легионе Голода.\n\nКогда герои столкнулись с ним впервые, Эоган лишь недавно пробудился от долгого сна. Ослабленный и командующий жалкими сотнями, уже тогда он оказался смертельным противником, обратившим отряд в бегство.\nВ считанные недели, снежным комом, его армия прокатилась по северу [[Мерклейд|Мерклейда]], превращая Долину Скотии в пустоши Глубин. За месяц он стал одним из самых страшных врагов, угрожавших Срединному Континенту.\n\n## Прошлое\n\nВ прошлом — антеренский улучшенный человек, ветеран эльфийских войн и один из предателей человечества, последовавших за Тёмным Злым. Не найдя покоя даже после разрушившей обе стороны Войны Владык, в глубинах под Дир-Ангардтом он встретил забытое божество, подарившее ему право и обязанность начать собственную войну.\n\nДолгое время считал таинственного покровителя голосом запечатанного Тёмного Владыки и верил, что служит ему по собственной воле. В конце концов маска была сорвана Героями Багерта, открывшими истинное имя Червя — но к тому моменту у Эогана не осталось никакого выбора. Влияние Пожирателя было слишком велико.\n\nСтановление Предвестником окончательно сковало судьбу, которую Эоган принял как долг: в конце концов он признал, что в этой войне может исполниться и его собственное желание.\n\n## Взгляды и сила\n\nИскренне презирает своего покровителя, и это чувство лишь возросло после становления Предвестником. Считает Червя и всех прочих высших сущностей в душе такими же смертными, как и все остальные: сорви маску, и почти не найдёшь отличий.\n\nБудучи Предвестником, черпает Невозможную Энергию напрямую от Пожирателя и способен использовать его Власть для управления такой магией. Уже это делает Эогана армией из одного человека, эффективно бессмертным против любого конвенционального оружия.\n\nОдарён клинком, известным как Ворткрест.", "aliases": ["Лорд Глубин", "Предвестник", "Предвестник Пожирателя"], "order": 11, "image": "images/eogan.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793633557135, "updatedAt": 1793637826813, "updatedBy": null}, "neryus": {"aliases": ["Нэриус"], "body": "Кровожадный убийца и заклинатель теней. В ряде источников его называют вампиром. Он не хотел ни служить старому Тёмному Повелителю, ни становиться новым: ему нужна была только кровь. Его ветвь [[Круг Проклятых|Круга]] зовут Потрошителями, а его боевой подход стал Формами Тьмы (см. [[Искусства Боя]]).\n\nПосле [[Война Черной Короны|Войны Чёрной Короны]] он бесследно исчез. Самые верные ассасины ждут, что во второй Золотой Век Осквернителей его багровая тень вернётся.", "category": "Персонажи", "createdAt": 1793633557135, "group": "Тьма и угрозы", "kind": "character", "order": 2, "role": "Основатель Братства Крови", "status": "Неизвестно", "summary": "Ассасин и заклинатель теней, единственный из основателей Круга, чья смерть не подтверждена.", "title": "Нэриус Пронзающий", "updatedAt": 1793633557135, "updatedBy": null}, "shem": {"aliases": ["Степь", "Ринна", "битардцы", "Бескрайняя Степь"], "body": "Больше любого из королевств, Шем — самая южная из частей Мерклейда. Никогда не принадлежавший Мерклейдской Империи, для северянина из Королевств Шем может показаться другим миром: природа, земля и культуры, называющие его домом, значительно отличаются от всего привычного.\n\nБольшая часть Шема лучше известна под своими многочисленными вторыми именами: Бескрайняя Степь, Ржавая Пустошь, Рыжая Пустыня... Действительно, оказавшись посреди Шема, путник увидит раскинувшиеся вокруг равнины, поросшие травой цвета ржавого металла. Немногочисленные, одинокие деревья зачастую обладают схожим же цветом.\n\nПроживающие здесь люди — сетийцы (дословно с антерина — южане), отличающиеся более низким ростом, иным разрезом глаз, темными волосами и, нередко золотисто-оливковой кожей.\n\nЖителю Королевств, вероятно, все сетийцы представляются не иначе как кочевниками, верхом не только передвигающимися, но также принимающими пищу, спящими и справляющими нужды. В перерывах между поездками сидит у костра в Степи и поет странные песни. Знакомые с битардцами также добавят, что неизменно пытается что-то украсть.\n\nКонечно, это лишь полуправда. Несомненно, отношение к частной собственности — и возможности её позаимствовать — отличается между двумя культурами, но далеко не все народы Шема ведут кочевой образ жизни. Да и не все они — битардцы.\n\nСахи битардцев ведут своих людей по степи, пока их представители правят в Унар-Ачаре — единственном городе \"государства\". Как известно, где два битардца — там три мнения и один кулак.;\n\nУ речных долин строят дома из глины тхемерцы, выращивая зерно, ловя рыбу и славясь великолепной керамикой;\n\nКетерцы разводят быков в центральном Шеме. Передвигаются огромными общинами, и стадо для них — богатство, транспортная система, пища и политический капитал. Миролюбивый народ, но кража коровы у любого из них равна объявлению войны целой семье;\n\nСеверо-восточные холмы облюбовали орды Думсора — гоблинские племена, куда более сплоченные и организованные здесь, чем их родичи в Золотом Побережье.\n\nУ западных побережий, на севере Шема, также известном как Земля Коневодов, и вовсе раскинулся союз трех городов — Карасая, Эрдея и Алчисея.\n\nЕще пара десятков народов просто никому особенно не нужны, чтобы их за что-то запомнить.\n\nМногие народы Шема объединяет вера в Небо — или Отца-Небо, среди тех культур, что наделяют его человеческими чертами. Специфика зависит от конкретного народа, но ветер и птицы, его создания, считаются священными для многих. Точно также, для многих народов подземные глубины считаются пристанищем всего нечистого, так как там не дует ветер. Суо-Хачэ, демон из шемской мифологии, прячется от взгляда Неба именно в Подземье.\n\nДругие верят и в Земную Голову — мать всего сущего на земле. По древней традиции битардцы кладут на землю отрубленную куриную голову и просят её о дарах. Говорят, тот, кто пройдет мимо такой головы, ничего не попросив, будет тем, у кого что-то и заберут, чтобы исполнить другие желания.\n\nКак и любой другой регион, Шем не свободен от чумы демонопоклонников: Алая Звезда и Гниющий пользуются здесь наибольшим почтением.\n\nФауна Шема своеобразна. В сердца путников вселяет ужас крик т.н. \"клювастых тварей\" — громадных и очень агрессивных нелетающих птиц, бегающих быстрее любой лошади. Приручить что-то подобное — мечта любого всадника, хотя мечты сбываются далеко не для каждого из них.\n\nВеликие орлы, гоблинские варги, иглоспины и прочие создания нередко встречаются тут, замещая привычных северянину животных. Птицы считаются священными животными для многих народов, и те же битардцы, к примеру, принципиально не употребляют их в пищу. С другой стороны, шемские овцы, также пользуясь немалым почтением, используются ради всего, что могут предоставить: мяса, молока и шерсти.\n\nАпогеем странностей становятся паучьи обезьяны, имеющие шесть лап и добывающие еду, шатая ветки деревьев.\n\n## Ринна\n\nС другой стороны, не весь Шем — Степь, и не все шемцы даже похожи на сетийцев. Западнее Рыжей Пустыни и севернее Великой Топи расположилась отделенная Драконьими Горами страна, известная как Ринна. На первый взгляд во многом напоминающая уклад Союзных Королевств, Страна Заката, тем не менее, может показаться обычному северянину еще более чужеродной.\n\nНикогда не являясь частью Мерклейдской Империи, риннцы видят свои прямые истоки в Антерене — общем предке человеческой цивилизации Континента. Себя жители королевства видят наследниками Эры Владык, и правит государством не иначе как Наместник Богов, дожидающийся возвращения истинных повелителей.\n\nВместе с тем, является Наместник и верховным жрецом Каст Аумареи (с антерина — Культ Повелителей). Пахомианство в этих землях не прижилось ни в каком виде — и это, наряду с сохранившимся в качестве основного языка антерином, служит источником недопониманий, если выходцы из Союзных Королевств встречаются с людьми этих земель.\n\n*(Примечание: несмотря на то, что государственным языком считается антерин, уважаемый исследователь Университета, потративший десятилетия на изучение Высокого Языка, вероятно, очень удивится, когда поймет только каждое третье слово в местном трактире.)*\n\nНедопонимания, впрочем, встречались с терпимостью большую часть истории: подвиги драконоборца Риордана и его помощь Эдмунду, военный триумф фейдмара Ригеллиона против Готлока Разорителя и многое другое укрепили отношения между цивилизациями. А еще до Ринны слишком далеко ехать, чтобы объявить Поход Очищения.\n\nСама Ринна представляет собой зеленый, граничащий с тропиками край, обладающий совершенно немыслимой фауной: Драконьи Горы были названы так за совершенно неприличное количество виверн, а стаи двуногих вирмов вселят в риннца куда больший страх, чем абстрактные \"волки\".\n\nЭта особенность также привела к появлению особого сословия драконоборцев — странствующих рыцарей, чье Искусство Оружия тесно связано с узнаваемым длинным \"крестовым копьем\".\n\nИз Ринны происходит раса людей, известных как нейды (с антерина - высшие), считающиеся в стране более высоким сословием. Обладая от природы слабым здоровьем и такой же физической силой, они известны сильной связью с Таинственной Силой, а также чуть заостренной формой ушей. Их век короче человеческого, но принято считать, что каждому из них уготована особая судьба.\n\nИменно здесь, в городе Анголвене, находится Башня Слоновой Кости: оплот светлого Ордена Мудрых, учрежденного Миррдином эт-Анголвеном, алхимиком и спутником Эдмунда. В нем, с позволения Наместника, открыто практикуется волшебство, алхимия и многие другие тайные искусства, однако каждый волшебник Ринны должен применять свою силу на благо страны.", "category": "Земли", "createdAt": 1793632093893, "order": 9, "summary": "Южная часть Мерклейда: ржавая Бескрайняя Степь, тропическая Ринна и Загнивающие Земли.", "title": "Шем", "updatedAt": 1793641859264, "updatedBy": null}, "erih-askarios": {"kind": "character", "title": "Эрих Аскариос", "category": "Персонажи", "group": "Главные герои", "role": "Один из Героев Багерта", "status": "", "summary": "", "body": "Статья о персонаже появится позже.", "aliases": ["Эрих"], "order": 1, "image": "", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "iden-bitardskii": {"kind": "character", "title": "Иден Битардский", "category": "Персонажи", "group": "Главные герои", "role": "Один из Героев Багерта", "status": "", "summary": "", "body": "Статья о персонаже появится позже.", "aliases": ["Иден"], "order": 2, "image": "", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "reltandir-illantar": {"kind": "character", "title": "Релтандир Иллантар", "category": "Персонажи", "group": "Главные герои", "role": "Один из Героев Багерта", "status": "", "summary": "", "body": "Статья о персонаже появится позже.", "aliases": ["Релтандир"], "order": 3, "image": "", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "ditrih-iz-bagerta": {"kind": "character", "title": "Дитрих из Багерта", "category": "Персонажи", "group": "Главные герои", "role": "Один из Героев Багерта", "status": "", "summary": "", "body": "Статья о персонаже появится позже.", "aliases": ["Дитрих"], "order": 4, "image": "", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "tavglaas": {"kind": "character", "title": "Тав'глаас", "category": "Персонажи", "group": "Главные герои", "role": "Один из Героев Багерта", "status": "", "summary": "", "body": "Статья о персонаже появится позже.", "aliases": ["Тавгла'ас", "Тавглаас"], "order": 5, "image": "", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "golodnye": {"kind": "character", "title": "Голодные", "category": "Персонажи", "group": "Силы Пожирателя", "role": "Заражённые Синей Чумой", "status": "", "summary": "Люди, изменённые божественной болезнью Пожирателя.", "body": "Создания, изменённые воздействием божественной болезни [[Пожиратель|Пожирателя]] — Синей Чумой.\nПохожие на ходячих мертвецов, Голодные живее всех живых, и жаждут живой плоти.\n\nБольшинство затронутых Синей Чумой теряет рассудок, превращаясь в яростных зверей, ведомых песнью Червя.\nИх способности едва ли меняются трансформацией, но отсутствие страха смерти превращает их в страшных противников.\n\nКак и все создания Глубин, Голодные страшатся огня и не любят прямой солнечный свет.", "aliases": ["Голодный", "Синяя Чума"], "order": 1, "image": "images/golodnye.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "golodnye-kapitany": {"kind": "character", "title": "Голодные-Капитаны", "category": "Персонажи", "group": "Силы Пожирателя", "role": "Командиры Голодных", "status": "", "summary": "Голодные, сохранившие разум и ставшие психическим узлом для своих отрядов.", "body": "Не все заражённые одинаково безмозглы. Редкие избранные способны сохранить свой интеллект: жестокий, лишённый всего человеческого, направленный лишь на дело Священной Войны.\n\nСогласно изучениям Казацких чародеев, Капитаны выполняют роль психического узла, повышающего боевую координацию приставленных к ним сил. Обычные [[Голодные]], бездумные чудовища, превращаются в дисциплинированных солдат, сражаясь вместе со своими командирами.\n\nНередко именно они получают лучшее снаряжение из возможных, и не вступают в бой самостоятельно без самой острой нужды — стоит убить Капитана, и эффект стремительно пропадёт.", "aliases": ["Капитаны"], "order": 2, "image": "images/golodnye-kapitany.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "golodnye-rycari": {"kind": "character", "title": "Голодные-Рыцари", "category": "Персонажи", "group": "Силы Пожирателя", "role": "Тяжёлая пехота Червя", "status": "", "summary": "Голодные, отдавшиеся Голоду и мутировавшие в чудовищ сильнее орков.", "body": "Сила Пожирателя растёт, его божественная болезнь развивается. Голод — его священный дар, его священное проклятье. Утоляя его, Голодный становится ближе к Глубинам, Царству Создателя.\n\nОтринувшие разум, отдавшиеся на волю Голода, они становятся Рыцарями — мутировавшими, ужасающими чудовищами, чья сила превосходит орков, а естественное оружие способно соревноваться с гномьей сталью.\n\nТяжёлая пехота армии Червя, Рыцари с лёгкостью могут одолеть десяток обычных солдат.\nИх звериная ярость, впрочем, является их же главной слабостью. Даже [[Голодные-Капитаны|Капитан]] не способен превратить эту тварь в солдата.", "aliases": ["Рыцари Голода"], "order": 3, "image": "images/golodnye-rycari.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "golodnye-ohotniki": {"kind": "character", "title": "Голодные-Охотники", "category": "Персонажи", "group": "Силы Пожирателя", "role": "Крылатые Ужасы", "status": "", "summary": "Лёгкие летающие Голодные, новая мутация времён Войны Червя.", "body": "Божественная болезнь Червя — впечатляющее оружие. Пожиратель спит, и образы его снов принимают формы: созданий Глубин, новых [[Голодные|Голодных]]...\n\nТвари, названные также Крылатыми Ужасами — одна из новых форм, в которую Голодные начали мутировать уже в ходе [[Война Червя|Войны Червя]].\nСтремительные, лёгкие создания, они парят над армиями, пикируя на врагов или забрасывая их метательным оружием с небес.\n\nОни неспособны похвастать живучестью или выносливостью, но впечатляющая скорость и ловкость более чем покрывают их недостатки.\nДаже когда сражение проиграно, Крылатые Ужасы могут улететь в самые дальние уголки поля боя, выжидая удобного момента для последней диверсии.", "aliases": ["Крылатые Ужасы", "Охотники"], "order": 4, "image": "images/golodnye-ohotniki.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "derokku": {"kind": "character", "title": "Дерокку", "category": "Персонажи", "group": "Силы Пожирателя", "role": "Конечная стадия Голодных-Рыцарей", "status": "", "summary": "Сильнейшие рядовые бойцы Легиона Голода, к счастью для Альянса, редкие.", "body": "Не существует твари более опасной среди рядовых бойцов Легиона Голода, чем дерокку. Конечная стадия эволюции [[Голодные-Рыцари|Рыцарей]], они — живые машины войны, во всём превосходящие своих низших сородичей.\n\nУдивительно, но даже их разум частично возвращается к своим хозяевам: в такой же извращённой форме, как и тактический гений [[Голодные-Капитаны|Капитанов]], и в менее проявленной форме, но их присутствие оказывает такой же эффект на окружающих чудовищ.\n\nВ прямом бою может показаться, что дерокку лишены недостатков: они ужасающе быстры, способны тягаться силой со стальным големом, а их природная броня защищает лучше полных лат. Пожалуй, это действительно так: один на один, это сильнейший боец Глубин.\n\nОднако, они чрезвычайно прожорливы и агрессивны: стоит задержаться бою, и сожраны будут ближайшие Голодные. Альянс спасает их редкость: разве что один из тысячи Рыцарей может развиться до дерокку.", "aliases": ["Дерроку"], "order": 5, "image": "images/derokku.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "obitateli-glubin": {"kind": "character", "title": "Обитатели Глубин", "category": "Персонажи", "group": "Силы Пожирателя", "role": "Род Глубин", "status": "", "summary": "Существа из разломов, никогда не бывшие людьми.", "body": "Они зарождаются там, где завеса между Царством [[Пожиратель|Пожирателя]] и реальным пространством тонка. Тысячи тысяч созданий выбираются из разломов, медленно бредя вперёд, к ближайшему источнику тепла и жизни.\n\nДаже один человек легко может убить десяток, но на смену придёт сотня.\n\nИногда они говорят знакомыми голосами. Не стоит их слушать.\n\nВ отличие от [[Голодные|Голодных]] они — не люди и никогда не были ими.", "aliases": ["Род Глубин"], "order": 6, "image": "images/obitateli-glubin.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "umbralnye-kolossy": {"kind": "character", "title": "Умбральные Колоссы", "category": "Персонажи", "group": "Силы Пожирателя", "role": "Живая артиллерия Глубин", "status": "", "summary": "Многометровые чудовища, обстреливающие врага Глубинными Снарядами.", "body": "Живая артиллерия Глубин, эти чудовища приходят в наш мир из чёрных разломов. Достигая десятков метров в длину, они медленно плетутся вслед за хаотичным роем [[Голодные|Голодных]], обстреливая противников Глубинными Снарядами.\n\nТам, где взрывается подобное оружие, холодное пламя Червя продолжит питаться теплом, пока не останется ничего.\n\nНеповоротливые и медлительные, они всё ещё остаются опасным противником вблизи: обычного человека Колосс с лёгкостью может просто раздавить.", "aliases": ["Колоссы"], "order": 7, "image": "images/umbralnye-kolossy.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "goddhi": {"kind": "character", "title": "Годдхи", "category": "Персонажи", "group": "Силы Пожирателя", "role": "Творения нечестивой алхимии Сжасс Тара", "status": "", "summary": "Хищники, способные принять облик и память сожранного человека.", "body": "Не все твари Червя созданы ЕГО волей. Смертные слуги Пожирателя, взявшие силу Глубин в свои руки, способны сотворить нечто отвратительное даже для своих войск.\n\nСоздание нечестивой алхимии Сжасс Тара, годдха зарождается внутри подвергнутого ужасным ритуалам человека, принуждённого к каннибализму. В конце концов, нечто напоминающее пиявку прогрызает путь себе наружу, и вскоре вырастает до человекоподобной формы.\n\nНеуклюжие и медлительные годдхи могут показаться лёгким противником, но не стоит обманываться, это — опаснейший хищник. Почти неуязвимые для обычного оружия, они способны стремительным рывком преодолевать короткие расстояния, а ряды острейших клыков прорезают металл.\n\nОпасней всего их плевок: на большинство созданий он действует как мощный паралитический яд, после срабатывания которого годдха в мгновенье ока подбегает к жертве, чтобы вгрызться в беззащитную плоть.\n\n## Подмена\n\nНо, как ни странно, эти создания — не воины и не солдаты. Их главная способность — умение принять облик сожранного человека. Вместе с тем, они получают все его воспоминания и навыки. Эффективно заместить цель после этого — тривиальная задача.\n\nДаже магическое обнаружение с трудом обходит их маскировку. Однако героями Багерта обнаружилась удивительная слабость: жемчуг жжёт их кожу, заставляя терять личину.", "aliases": ["Годдха"], "order": 8, "image": "images/goddhi.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "amongehet": {"kind": "character", "title": "Амонгехет", "category": "Персонажи", "group": "Силы Пожирателя", "role": "Первый из дерокку, полководец Легиона Голода", "status": "Повержен при Винтерстейне", "summary": "Сильнейший боец и худший полководец Червя.", "body": "Первый из [[Дерокку|дерокку]] и один из полководцев Легиона Голода, краткое время занимавший титул Избранного. Достигая почти четырёх метров в высоту, он возвышался над любым из Голодных, а его мощь, подпитанная Невозможной Энергией, выходила за анатомические пределы. Прямой удар Амонгехета мог пробить даже укреплённые ворота замка.\n\nЕго кровожадность и боевое безумие стали причиной ключевых поражений Легиона Голода: в Битве за Багерт именно он завёл войска в ловушку Альянса и позволил сокрушить армию с двух сторон. Во Второй Агдебургской Битве он бросил командование, дабы добыть голову вражеского командира, и — хотя многие списывают это на чудо — тот сумел ранить его и бежать.\n\nНаконец, Битва при Винтерстейне положила конец Амонгехету: измотанный продолжительным сражением, он попался в телепортационную ловушку и сразился один на один с Герионом, Клинком Звёзд. В судьбоносной дуэли самый сильный боец и самый отвратительный полководец Червя был повержен.\n\nВ той же битве Амонгехет сразил [[Архонт Нумиратрас|Нумиратраса]], Архонта Войны гномов.", "aliases": [], "order": 9, "image": "images/amongehet.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "kandri-hish": {"kind": "character", "title": "Кандри Хиш", "category": "Персонажи", "group": "Силы Пожирателя", "role": "Полководец Легиона Голода, ученица Сжасс Тара", "status": "Командует Легионом", "summary": "Волшебница, которая выигрывает бой задолго до того, как он начнётся.", "body": "Одна из последних полководцев Легиона Голода и, наравне с покойными Креданом Лартом и Тахемом Дэргом, ученица чародея, известного как Сжасс Тар.\n\nДолгое время была главой Культа Червя в Восточной Империи, где практически осуществила план по подмене императора [[Годдхи|годдхой]]. Благодаря усилиям Героев Багерта наследники были спасены, а сама она убита... как тогда казалось.\n\nСейчас она занимает место убитого [[Амонгехет|Амонгехета]] и координирует силы всего Легиона Голода, являясь прямой его противоположностью: вместо подавляющего наступления предпочитает выигрывать бой задолго до того, как тот начнётся, минимально вмешиваясь в сам ход сражения. Под её командованием армии Глубин перешли в оборону и накопление сил, продолжая регулярно совершать бесчисленные диверсии.\n\nКаждый из генералов Альянса вынужден признать, что подобному противнику предпочли бы сразу нескольких Амонгехетов.\n\n## Взгляды и сила\n\nВ отличие от наставника, следовала учению Культа Червя по собственной воле, считая само индивидуальное существование ошибкой и причиной страданий. Ранняя жизнь героям пока неизвестна, как и причины таких взглядов.\n\nПо признанию самого Сжасса — одна из самых талантливых и, потенциально, сильнейших волшебниц Термины. Великолепно владеет магией Жёлтого и Синего Святилищ, совмещая эту науку с алхимией Глубин.\n\nРазработала продвинутую версию годдх, не разрастающихся до полноценной особи, а функционирующих как мозговой паразит, контролирующий разум цели.", "aliases": ["Кандри"], "order": 10, "image": "images/kandri-hish.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "kostante-delattre": {"kind": "character", "title": "Костанте Делаттре", "category": "Персонажи", "group": "Альянс", "role": "Адамантовый Маршал Эблании", "status": "Командует", "summary": "Бывший капитан королевской гвардии, ставший высшим военачальником Эблании.", "body": "Адамантовый Маршал — высшее военное звание, о котором большинство эбланцев не смеет даже мечтать. Костанте Делаттре, в прошлом капитан королевской гвардии, тоже не мечтал. Но удивительные события в ходе охоты на Культ Червя как-то сами собой привели к удивительному же исходу.\n\nС ранних лет службы зарекомендовал себя решимостью, находчивостью и преданностью [[Дерзерт II Удачливый|Дерзерту]]. Его военную философию отлично передаёт его же фраза: «Внезапность, быстрота, натиск!»\n\nЛюбой бой предпочитает выигрывать с минимальным количеством потерь, и предпочтёт тактически отступить, приняв поражение в битве, чтобы затем перегруппироваться и выиграть войну.\n\nВ ранние дни Альянса имел множество противников, подозревавших его в излишнем фаворитизме интересам [[Эблания|Эблании]]. Однако не раз и не два он доказывал, что в [[Война Червя|Войне Червя]] сражается в первую очередь за человечество: людским войнам стоит подождать, пока не закончится война против чудовищ.\n\nЗлые языки говорят, что дворянин он фальшивый, и двадцать лет назад въехал в Новый Лоран с поддельными документами. Когда, спустя многие годы его верной службы, особо старательный секретарь всё же докопался до истины и принёс Дерзерту прямые тому доказательства, тот, как известно, ответил только одно: «Ну и что?»", "aliases": ["Делаттре", "Адамантовый Маршал", "Костанте Деллатре"], "order": 1, "image": "images/kostante-delattre.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "meriden": {"kind": "character", "title": "Мериден", "category": "Персонажи", "group": "Альянс", "role": "Генерал Ордена Сияющего Меча, Избранная Света", "status": "Ведёт Жёлтое Знамя", "summary": "Паладин, принявшая командование Орденом после гибели Лотара.", "body": "Паладин [[Орден Сияющего Меча|Сияющего Меча]] и, до недавнего времени, рыцарь-командор Западного Бастиона. Мериден была правой рукой прошлого Генерала, [[Лотар|Лотара]], во времена восстания Эдвина. После гибели Генерала взяла на себя командование остатками ордена и в конце концов была официально провозглашена его следующей предводительницей.\n\nВнеся критический вклад в ряд побед Альянса, полностью заслужила право считаться одной из главнокомандующих: в данный момент руководит Жёлтым Знаменем, ведя остатки паладинов, храмовников и значительную часть говнарских войск.\n\n## Избранная Света\n\nЕё известность возросла десятикратно в ходе битвы при Винтерстейне, когда столп священного света ударил посреди поля боя, создав первую прореху в затмивших Солнце тучах Глубин. Из этого столпа та вышла совершенно преобразившейся и, когда одна из стен считалась потерянной, в одиночку держала оборону бреши до прибытия подкреплений.\n\nБлагословлённый клинок, святое Сияние и великая миссия были дарованы новой Избранной Света, о появлении которой вскоре узнает весь Мерклейд. [[Понтифик Алистер]] никак не прокомментировал появление нового Избранного. Пока что.\n\nЗлые языки называют её отстранённой фанатичкой, говорящей с голосами в голове. Мериден не смущают подобные речи: она делает то, что должно. Союзники и недоброжелатели сходятся в одном: она стремится как можно скорее покончить с Легионом Голода, будто это лишь камень на пути, а за ним поджидает иная, многим большая угроза.\n\nБлагодаря её силам в отвоёванных городах Альянс может создавать Золотые Маяки, отгоняющие прочь заражение Глубин.", "aliases": ["Генерал Ордена", "Мериден Генерал Ордена"], "order": 2, "image": "images/meriden.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "saansibart": {"kind": "character", "title": "Саансибарт", "category": "Персонажи", "group": "Альянс", "role": "Царь сейрентри, Огненный Рассвет", "status": "В рядах Альянса", "summary": "Древний царь змеиных эльфов, вернувшийся в мир из рабства Чёрного Святилища.", "body": "Древний правитель Эры Древа, Саансибарт Огненный Рассвет был царём сейрентри — далёкой ветви «змеиных» [[Эльфы|эльфов]], живших вне Адон-Тирлейдда. Восставший против тиранической Анурианской Империи, он десятилетиями сопротивлялся силе, считавшейся когда-то неостановимой.\n\nВ конце концов он был сражён чародеем, известным как Ашра-Кет. Душа царя была превращена в страшного слугу Чёрного Святилища — Ночного Всадника, и в этом обличье он был вынужден служить змеелюдам даже тысячелетия спустя после падения Империи.\n\nВмешательство Героев Багерта — ещё до того, как они прославились под этим именем — позволило расколоть его оковы. Вместо того чтобы обрести заслуженный покой, правитель адамантовой хваткой уцепился за жизнь и вернулся в ставший чужим для него мир. После путешествия по миру в поисках своего народа он присоединился к [[Война Червя|Войне Червя]]. Любые его планы, какими бы они ни были, возможны только когда Пожиратель будет повержен.\n\n## Характер\n\nВысокомерный и честолюбивый, Саансибарт не считает себя «бывшим» царём. Отсутствие царства — временный и, после смерти Червя, исправимый недостаток. При всех своих недостатках Саансибарт обещает справедливый мир представителям любых рас, что последуют за ним, а немногие заслужившие его уважение знают царя и с другой стороны.\n\nОстальные вынуждены терпеть его в рядах Альянса по крайней мере из-за силы: помощь виверн и шторм алых молний никогда не будут лишними на поле боя.\n\nВ древности Саансибарт заключил союз с Хелсетом против общего врага. Сперва используя друг друга в собственных нуждах, в конце концов царь сейрентри стал самым близким к «другу» эльфом для Вечного Змея. Ковенант с ним даёт ему власть над низшими драконидами и Мистические Глаза с неизвестными свойствами.", "aliases": ["Саанзибарт", "Огненный Рассвет", "царь Саансибарт"], "order": 3, "image": "images/saansibart.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "vsevedushchii": {"kind": "character", "title": "Всеведущий", "category": "Персонажи", "group": "Великие", "role": "Внешний Бог, Луна Чародеев", "status": "", "summary": "Великий, который проявляется в мире как Луна Чародеев.", "body": "Загадочный Внешний Бог, пришедший в этот мир вместе с первым Звездопадом. Несмотря на завесу тайны, окружающую цели Великих, можно отметить, что любое его вмешательство обычно преследует цели сохранения и развития цивилизации.\n\nПроявляется в материальном мире как Луна Чародеев — один из спутников [[Термина|Термины]], долгое время остававшийся её единственной луной. Многие лунные культы неосознанно почитают это создание как бога.\n\nСреди волшебников, не знающих о Всеведущем, Луна считается одним из сильнейших источников магии, а также родиной лунного камня: холодного кристалла, имеющего крепкую связь с Таинственной Силой. В казацкой традиции к аспектам лунного волшебства относят Холод, Тайну и Отражение. Иные традиции, зачастую более примитивного толка, используют Луну как источник предсказаний. Эффективность их методик до сих пор не была доказана.\n\n## Избранные и Предвестник\n\nЕго Избранные — Рыцари Лунного Света, наделённые могущественной способностью к ясновидению и силой призывать призрачный клинок из космической энергии. Каждый из них отличался адамантовым чувством предназначения и личным стремлением, поставленным выше себя самого. История отмечает, что способностью призывать лунный меч какое-то время обладал [[Эрих Аскариос|Эрих]], один из Героев Багерта.\n\nЕго Предвестник — [[Архимаг Казакион]], бессменный лидер Мерклейдской Ассоциации Магов. Знанием об этом обладают лишь избранные единицы.", "aliases": ["Всеведующий", "Луна Чародеев"], "order": 1, "image": "images/vsevedushchii.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "tot-kto-nablyudaet": {"kind": "character", "title": "Тот-Кто-Наблюдает", "category": "Персонажи", "group": "Великие", "role": "Внешний Бог", "status": "", "summary": "Бесформенное присутствие, после вмешательства которого исчезает то, что коснулось тайного знания.", "body": "Один из Великих, пришедших с первым Звездопадом. Бесформенное присутствие, предпочитающее показывать себя как немигающие глаза в темноте.\n\nИз троих пришедших реже всех вмешивается в дела смертных — по крайней мере, теми способами, которые люди способны осознать. С другой стороны, как показала история Героев Багерта, в редких случаях он напрямую обращает своё собственное внимание.\n\nЕго конкретные цели неизвестны, но в большинстве случаев его вмешательство заканчивается исчезновением чего-то, прикоснувшегося к тайному знанию: отдельные личности, группы и целые цивилизации исчезали на протяжении истории.\n\n## Служители\n\nЕго немногочисленные адепты обычно одиночки, сохраняющие строжайшую секретность. В тех редких случаях, когда их раскрывают, невежественные иноверцы обычно принимают их за демонопоклонников — не то чтобы те стремились их разубедить.\n\nКрупнейшей фракцией служителей Наблюдателя можно назвать незетарский Малый Дом Ланнарок, чей лидер стремился вернуть своему народу бессмертие. Каждый адепт служит ему по-своему, и каждый получает свою награду взамен: есть у Наблюдателя своя магия или нет, но обычно вместо неё служители получают иное — знания, нередко потерянные и забытые всем прочим миром.\n\nЕго Избранные не имеют ни названия, ни определённой высшей цели. Они получают свою силу после прямого взгляда Великого, а после остаются одни: впрочем, каждого из них преследует осознание, что любое их дело отныне служит его планам.\n\nЕго Предвестник — Второй Высший Маг, Улум аль-Бишкек, заточённый глубоко под Симродом.", "aliases": ["Наблюдатель"], "order": 2, "image": "images/tot-kto-nablyudaet.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "pozhiratel": {"kind": "character", "title": "Пожиратель", "category": "Персонажи", "group": "Великие", "role": "Всепожирающий Червь, слабейший из Великих", "status": "Пробуждается", "summary": "Незаконченный Великий, ведущий войну на уничтожение с цивилизацией Термины.", "body": "Также известный как Всепожирающий Червь, он — слабейший из троих, что пришли со Звездопадом. Незаконченный Великий, Пожиратель представляет собой скорее запредельно могущественного зверобога, чем истинное Внешнее Божество.\n\nВопреки своему статусу, он активнее всего вмешивается в дела мира: практически вырвавшись из заключения в Анур-Цеттаге, с помощью своих порождений и Предвестника он ведёт войну на уничтожение с цивилизацией Термины, стремясь вознестись окончательно и воплотить свою единственную цель — пожрать всё сущее.\n\n## Глубины и Чума\n\nЕго истинная сущность пребывает в Глубинах — собственном мире грёз, пока ещё недостаточно сформированном, чтобы стать настоящей реальностью, но порождающем отвратительный [[Обитатели Глубин|Род Глубин]]. Его основной метод проявления — Синяя Чума, передающаяся через сны и превращающая людей в [[Голодные|Голодных]].\n\nКульт Червя — искусственная религия, сфабрикованная оккультистом, что хотел использовать его в своих нуждах. Организация переросла своего основателя и сейчас является пристанищем отверженных и законченных нигилистов, видящих само индивидуальное существование как источник всех бед. Червю нет дела до их идеологии, но он всё равно дарует своим инструментам магию Глубин: казацкие волшебники определяют её аспекты как Воду, Сны и Поглощение.\n\n## Избранные и Предвестник\n\nЕго Избранные — Пробуждённые Голодные: заражённые Чумой, но вернувшие самосознание и индивидуальность. Они знают, что это временный дар, ведь однажды Червь поглотит всё, и всё станет единым.\n\nЕго Предвестник — [[Эоган]], Лорд Глубин, бывший рыцарь Заммаза, ныне полководец Легиона Голода.", "aliases": ["Червь", "Всепожирающий Червь", "Культ Червя"], "order": 3, "image": "images/pozhiratel.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "siyayushchii": {"kind": "character", "title": "Сияющий", "category": "Персонажи", "group": "Великие", "role": "Внешний Бог, почитаемый как Творец", "status": "", "summary": "Великий, чьё Око светит над Терминой и чьи эмиссары несут Небесный Порядок.", "body": "Также почитаемый в Мерклейде как Творец, Сияющий более всех прочих оправдывает название «Внешний Бог»: лишь единицам, знающим о его истинной природе, известно, что он пребывает за пределами Завес Внутреннего Плана, а его основное царство лежит в просторах Внешнего Космоса.\n\nЕго эмиссары — ангелы Небесного Бастиона — появились в Системе Галата сравнительно недавно, ближе к началу Второй Эры.\n\n## Небесный Порядок\n\nЕго цели ясны как день: все миры и их цивилизации должны следовать Замыслу, также известному как Небесный Порядок. За пределами Завес многочисленные миры уже живут согласно этим законам, и цель эмиссаров — присоединить к ним Термину.\n\nЕго основным проявлением является Солнце, также называемое Оком Творца. Вместе с прибытием эмиссаров умирающая звезда системы, предположительно, была замещена источником его Невозможной Энергии, и отныне свет Золотого Светила губителен для противников Небесного Порядка, к примеру нежити (см. [[Небесные тела]]).\n\nЕго культам нет нужды скрываться: в Мерклейде эту роль выполняет [[Церковь Света]], а клирики творят чудеса, призывая Сияние, его силу. Казацкие чародеи смогли определить его аспекты как Свет и Жизнь, но третий, очевидно должный присутствовать, ускользает от них: возможности Золотых Чудес всё ещё продолжают удивлять даже самых сведущих мудрецов.\n\n## Избранные и Предвестник\n\nЕго Избранные — Сосуды Света, наделённые золотой кровью и впечатляющим контролем над Сиянием. Одновременное существование [[Святой Латимер|Святого Латимера]] и [[Пророк Пахом|Пророка Пахома]], которым приписывались такие особенности, ставит под сомнение либо невозможность существования более чем одного Избранного, либо принадлежность одного из них к этому славному титулу.\n\nЕго Предвестник неизвестен и, если вообще существует, должен находиться где-то во Внешнем Космосе.", "aliases": ["Творец", "Око Творца"], "order": 4, "image": "images/siyayushchii.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "konrad-selekaf": {"kind": "character", "title": "Конрад Селекаф", "category": "Персонажи", "group": "Загадочные личности", "role": "Создатель Шпиля Огня и Неба", "status": "Неизвестно", "summary": "Возможно, древнейшее существо на Термине, мечтающее о мире без богов.", "body": "Загадочный человек(?), стоящий за проектом Шпиля Огня и Неба. Впервые повстречался героям как Константинас, Апостол Метаморфоз, и в этой роли успел показать себя незаменимым членом миссии Светоносцев. На самом деле являлся главной причиной появления Искажения.\n\nЕго цель — создать мир без богов, отданный в руки человечества. Исполнить его мечту должен [[Нихилос]] — пока ещё не рождённый искусственный Повелитель, что осквернит саму природу Божественности и объявит первопричиной мироздания Элемент Галата.\n\nСам Конрад отлично понимает, насколько это безумное решение: но если ответ Первого Королевства действительно верен, это не должно изменить человечество до неузнаваемости. А даже если изменит, ему, кажется, нет до этого дела.\n\n## Герои Багерта\n\nПрактически достиг своей цели в предыдущем цикле, но рождение Нихилоса было остановлено [[Эрих Аскариос|Эрихом]], чьё Желание обратило время вспять. С тех пор он исключительно заинтересован Героями Багерта, видя в них ответ, способный противостоять его собственному.\n\nНе считает себя или свой план «добрым», «злым» или «безусловно правильным». Если за его стремлением и ответом Первого Королевства стоит достаточная сила, чтобы его воплотить, значит, оно правдиво. Так же он смотрит и на позицию героев.\n\n## Маски\n\nЧеловек или нет, он является, возможно, древнейшим существом на Термине. Под разными «масками» влиял на человеческую историю в разные периоды. Героям Багерта известно о его ролях антеренского Наместника Селувиса и основателя инланского Братства Алхимиков.\n\nСудя по всему, был знаком с [[Архимаг Казакион|Архимагом Казакионом]] задолго до начала этой истории. Обучал Миррдина эт-Анголвена, не имевшего никакого представления об истинной личности своего Наставника.", "aliases": ["Конрад", "Константинас", "Селекаф"], "order": 1, "image": "images/konrad-selekaf.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "nihilos": {"kind": "character", "title": "Нихилос", "category": "Персонажи", "group": "Загадочные личности", "role": "Четвёртый Тёмный Повелитель, Осквернение Божественной Воли", "status": "Ещё не рождён", "summary": "Искусственный Повелитель, который должен поставить Скверну на место первопричины мира.", "body": "Четвёртый Тёмный Повелитель, творение [[Конрад Селекаф|Конрада Селекафа]]. Истинные масштабы его власти неизвестны, но, ещё не родившись по-настоящему, он был источником Искажения в Иверне.\n\nПо словам Конрада, Нихилос заложен в саму конструкцию Шпиля, и вместе с загаданным Желанием он получит доступ к сущности [[Термина|Термины]].\n\n## Эра Галата\n\nЭра Галата, предначертанная Нихилосом, означает изменение самой Вселенной: Элемент [[Скверна|Галата]] встанет на место мировой Первопричины, нарушив сам принцип существования Великих. Противостояние Света и Тьмы завершится, ознаменовав эру людей: без возможности для богов и без нужды в Тёмных Повелителях.\n\n## Неизбежность\n\nДважды был близок к актуализации: в предыдущем цикле, когда Шпиль Огня и Неба обратил время вспять, и в Иверне, когда Герои Багерта вовремя отключили почти полностью заражённого им Мудреца.\n\nОднако, как говорит Селекаф, Скверна избрала его Четвёртым Повелителем, и рождение Нихилоса предопределено самой Судьбой: не «если», но «когда». Только уничтожив его после мига рождения, Нихилоса действительно получится остановить.\n\nТаким образом, это последний и, вероятно, самый опасный враг, который ожидает Героев Багерта в конце пути.", "aliases": ["Осквернение Божественной Воли", "Четвёртый Тёмный Повелитель"], "order": 2, "image": "images/nihilos.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "smert": {"kind": "character", "title": "Смерть", "category": "Персонажи", "group": "Внешний космос", "role": "Внешний Бог посмертия", "status": "Вернулась в мир", "summary": "Великий, который следит за тем, чтобы души доходили до своей Смертной Судьбы.", "body": "Внешний Бог, чьё влияние распространилось на Термину в далёкие времена Звездопада. Почти не присутствовал в Системе Галата лично, работая по схожей с [[Сияющий|Сияющим]] методике, и обеспечивал функциональность системы посмертий.\n\nТакже обеспечивала протекцию смертным душам от сомнительной участи быть просто стащенными кем-нибудь на пути к Смертной Судьбе или от драконовских условий некоторых посмертий. Многие демоны-лорды были бы совершенно не против получить вашу душу на веки вечные за пончик, но увы: согласно правилам, максимально возможный срок для таких договоров ограничивается тридцатикратной средней продолжительностью жизни расы с возможностью добровольного продления контракта. Каким-то образом Смерть обладала силой эти правила поддерживать.\n\n## Изгнание и возвращение\n\nБыл практически изгнан своим высшим жрецом, Кором Ансеем, во времена падения его родной страны. Договор с Королём Мёртвых и осквернение священной Косы Смерти критически ослабили её влияние на Термину, но деяния Героев Багерта в Кор'Пуле позволили Смерти вернуться в мир.\n\n## Сделка с героями\n\nБлагодаря договору с [[Архимаг Казакион|Архимагом Казакионом]] предоставляет Героям Багерта возможность возрождения, требуя за это неизвестные монеты из-за пределов этой вселенной. Архимаг даже предоставил четыре таких заранее, ну что за человек!\n\nГде-то во Внешнем Космосе имеет собственного Избранного с какой-то там задачей.\n\nСмерть пообещала Героям Багерта, что, когда всё закончится, лично переправит их сперва в посмертие, если это будет релевантно, а затем и на Смертную Судьбу. Наверное, не то обещание, с исполнением которого те хотят её торопить.", "aliases": [], "order": 2, "image": "images/smert.webp", "caption": "", "epigraph": "", "epigraphBy": "", "createdAt": 1793637826813, "updatedAt": 1793637826813, "updatedBy": null}, "rejklejd": {"title": "Рейклейд", "category": "Земли", "summary": "Нодесские равнины между Говнарией и Эббелундом, объявленные «вольной землёй» Железным Маршалом Лигорденом.", "body": "Нодесские равнины всего какие-то полвека назад были частью огромной и, по большей части, никому толком не нужной территории между западной Говнарией и Эббелундом. Земли эти делили между собой оба королевства и несколько свободных княжеств, не имевших, толком, никакого влияния и значимости.\n\nПоявление Гор Архимага изменило как ландшафт, так и ситуацию: для обеих стран равнины стали одним из немногих прямых путей друг к другу. Еще сильнее дело изменилось после окончания Ведорской Войны, когда сосланный Годриком II полководец [[Бокаверде Лигорден]], также известный как Железный Маршал, объявил эти территории независимыми как от Говнарии, так и от Эблании — ибо, как он сказал, они были достаточно предоставлены сами себе, и теперь осталось это лишь подтвердить законодательно. Теперь же земли внезапно понадобились обоим соседям. Как, вероятно, заметили бы сами рейклейдцы, несколько поздновато.\n\nЕго восстание было поддержано многими ветеранами войны с обеих сторон: в ходе сражений на стороне Франца Железный Маршал завоевал уважение как своих подчиненных, так и противников. Местные власти также согласились с его идеалами, и так появился Рейклейд — \"вольная земля\".\n\nНичего, впрочем, не продлилось долго. Прежде чем оба государства прислали армии для подавления непокорных, [[Война Червя]] прокатилась по Северу. В тяжелые времена, Маршал заключил временный мир с королем и Понтификом, и ветераны ведорских войн вновь взялись за оружие.\n\nПо актуальным сведениям, Лигорден, предположительно, пропал или погиб в ходе Войны, и цвет местного воинства вместе с ним. Судьба вольных городов Рейклейда застыла до победы над Пожирателем, но многие считают, что времена независимости подходят к концу...", "aliases": ["Нодесские равнины", "Рейклейдское восстание"], "order": 30, "epigraph": "", "epigraphBy": "", "image": "", "caption": "", "createdAt": 1793641859264, "updatedAt": 1793641859264, "updatedBy": null}, "emden": {"title": "Княжество Эмден", "category": "Земли", "summary": "Самое маленькое из Союзных Королевств и щит Запада от Тумана Смерти и орд нежити Каэд Фелла.", "body": "Самый маленький из крупных участников Союзных Королевств, Эмден практически окружен горами к западу от Эббелунда. Мрачное и изолированное местечко, княжество не может похвастаться ни плодородными землями, ни впечатляющими богатствами гор, ни какой-либо чертой, которая позволила бы этой земле стоять в одном ряду с Говнарией и Эбланией. Во многом, существует оно только за счет гуманитарной и денежной помощи со стороны соседей... которую те, как ни странно, всегда выплачивают по первой же просьбе.\n\nМногие годы это княжество является щитом для Союзных Королевств, закрывающим их от бесчисленных орд нежити и Тумана Смерти, наводнившего [[Земли Теней]] и даже самые скупые из правителей Запада осознают — падет Эмден, и мертвецы станут уже их проблемой.\n\nУправляемое Вальдемаром V, княжество состоит из двух крупных городов - столицы, Эмденбурга, и приозерного города Готиланса. До 322 года Второй Эры существовал и третий город, Рейтенорн, однако после Парада Туманов тот был поглощен Землями Теней и, предположительно, пал.\n\nОткрытой тайной является и то, что огромная власть здесь сосредоточена в руках Серебряной Мастерской: формально церковной организацией, на практике — независимым от Понтифика объединением, занимающимся изучением и борьбой с Каэд Феллом. Охотники Мастерской — группировка экзекуторов, присягнувшая им, и ее члены воспринимаются обществом со смесью уважения и страха.\n\nЭмденцы привыкли жить близко к стране, где ничто не может умереть. Традиция хоронить мертвецов здесь будет воспринята безумием, а каждое поселение строится с учетом обороны от восставшей орды, вышедшей из туманного леса.\n\nРедкие путешественники, заглядывающие в Эмден, обнаруживают совершенно по-неуместному веселый народ, воспринимающий как бытовые детали то, что многим покажется концом времен.\n\nПомимо людей, на территории Эмдена проживает наибольшее число представителей Блуждающего Народа — также иногда именуемого серебряными гномами. Именно они обеспечивают охотников Серебряной Мастерской разгоняющими Туман фонарями, и из них же состоит орден Искоренителей — скрытное и таинственное объединение охотников на нежить, сведущих в загадочном искусстве гномьей артефакторики. Все эти факторы привели к тому, что гномья вера также прижилась на этих землях.", "aliases": ["Эмден", "Серебряная Мастерская", "Эмденбург", "Искоренители"], "order": 31, "epigraph": "", "epigraphBy": "", "image": "", "caption": "", "createdAt": 1793641859264, "updatedAt": 1793641859264, "updatedBy": null}, "era-dreva": {"title": "Эра Древа", "category": "Сказания", "summary": "Рассказ об Азериане Аманетиле, первом чародее Вечного Народа, и его братьях Таулендине и Элане во времена войны эльфов с Анурианской Империей.", "body": "## Глава I\n\n— Ну, как там было-то... А! Перед осадой эльфийской крепости, интендант - лугалю: лугаль, у нас-с провис-сии только на пол войс-ска. А лугаль в ответ: отлично, значит в атаку - по возвращению на всех хватит.\n\n— Я действительно тебя ненавижу. Всей душой.\n\nНад Тейрн-Арагондом шел снег. Белые хлопья медленно падали на капюшон закутавшемуся в шерстяной плащ юноше, чьи изумрудные глаза с легкостью выдавали в нем по крайней мере каплю крови правящего рода Аманетил. Куда меньше благородную кровь в нем выдавало совершенно по не-благородному раздраженное выражение лица.\n\nНад Тейрн-Арагондом шел снег. Летом.\n\n— Как же так, господин? — наигранно оскорбился Толдир, смахивая с наплечника снег, — Вы же сами сказали: что угодно, что отвлекло бы...\n\n— Значит, я беру свои слова назад. А теперь иди и...\n\n— И...?\n\nЭльф призадумался. Шел десятый год его принудительного управления крепостью, что находилась на холме аккурат посередине долины Арагонд, и до сих пор он не совсем понимал, зачем ему эти солдаты и чем их занять. Несмотря на то, что идущая сейчас война началась задолго до его рождения - и, вероятно, не закончится даже после совершенно не планируемой смерти, за все десятилетие единственной битвой у Тейрн-Арагонда была та, в которой оружие было бессильно.\n\n— ...Тренировка. Да, иди-ка займись своими бойцами.\n\n— Опять, господин?\n\n— Снова.\n\nИсполнив идеальный, по собственному мнению, поклон, капитан гарнизона удалился с крепостной стены, кажется, ничуть не опечаленный произошедшим. Вынужденный правитель крепости даже немного завидовал этой его особенности. Попробуй тут сохрани хорошее расположение духа, когда за последний день над Арагондом успели смениться дождь, ураган, буря, гроза, градобитие, снегопад и - как раз к этому моменту терпение трагического героя подходило к концу - дождь из лягушек, пару часов назад сменившийся очередным снегопадом.\n\nНет-нет, во имя Древа, Адон-Тирлейдд не был одним из тех мест искаженной реальности, что, коль верить слухам, остались на Эстренлейде после имперской войны с Саансибартом. Точно также, не была Вечная Земля затронута и природными катаклизмами, что могли бы вызвать подобное бешенство стихий.\n\nНеобразованные идиоты были вольны строить любые догадки, но лишь он один здесь обладал должной компетентностью, чтобы поставить четкий диагноз:\n\n— Чары... — Уже в третий раз произнес в пустоту Азериан, недовольно прищурившись. Несомненно, это были чары - и его экспертизы хватало даже на определение конкретного воздействия. Ритуал Сшивания Небес - мощный пример желтой магии, позволяющий проецировать погодные условия из далеких регионов в область действия. И, учитывая колебания Силы, творится он на внушительном расстоянии от границ Царства Древа...\n\n— Господин? — Раздался вновь голос со стороны лестницы, бесцеремонно прерывая мысленный процесс.\n\n— А? Ты еще здесь?\n\n— За что нижайше прошу прощения. Но, я все же сочту нужным уточнить...\n\n— Ближе к делу, Толдир.\n\n— Вы действительно ничего не можете сделать с... ну... этим?\n\n— Например? Это заклятье, идиот. И оно будет действовать до тех пор, пока чародей не истощит свои силы, от чего имперцев спасает целый обоз с эликсирами, либо пока его кто-то не прервет - и что-то я не помню, когда запрет Ура на вылазки за границу успел спасть.\n\nАзериан готов был поклясться, что это объяснение он уже пытался вдолбить кому-то из солдат - кажется, как раз-таки Толдиру. Удивительная привычка - считать, что что-то изменится, если спросить достаточное количество раз.\n\n— Ну, так-то оно так... но вы ведь Певец, в конце-то концов! Когда же так бывало, что Песнь не справлялась с вражеским наваждением?\n\nЮноша недовольно поморщился. Если бы не то, что разговоры с Толдиром были одним из единственных способов убить время - солдат рангом ниже он считал чем-то средним между ожившей цифрой в графе \"численность гарнизона\" и инструментом - этот эльф давно узнал бы о себе много нового.\n\n— Нет. На то... есть причины. Разговор закончен, можешь быть...\n\n— А если... ну, вашим, хитрым способом? — Подойдя чуть ближе и заговорщицки понизив голос, поинтересовался капитан.\n\nПервое время Азериан смотрел на него с некоторым недоверием - не послышалось ли ему, что умная мысль воплотилась в слова благодаря Толдировым-то устам. Что тут скрывать, причина, по которой эльф так легко определил чары, была проста - в его силах было сотворить такие же. Ведь каждому известно, хочешь обернуть заклятье вспять - повтори его наоборот. С ритуалами, между прочим, срабатывает точно также. А ведь после можно и угостить чешуйчатых поганцев их же подарком... На лице чародея появилась мечтательная улыбка.\n\nА затем он с силой треснул капитана тростью.\n\n— Ай! За что, господин?\n\nЗдесь важно заметить, что боль Толдир в таких ситуациях искусно изображал уже который год. Капитан гарнизона искренне надеялся, что злополучный день, когда Азериан поймет, что удары трости никак не пробивают эльфийский доспех, никогда не настанет.\n\n— За то что раздражаешь. И лицо глупое. И вопросы идиотские задаешь. Напомнить, по какой причине я здесь сижу почти десять лет?\n\nТолдир сделал понимающее лицо. Он явно забыл.\n\nОднако же, в отличие от него, ни дня не проходило, когда Азериан не вспоминал бы слова Данахира ур-Аманетила - не вспоминал бы, как отреагировал правитель Великого Дома на преподнесенные ему на блюдечке секреты величайшего оружия врага.\n\nТо, каким образом они получены - детали. Кого интересуют детали?\n\nКак оказалось, Данахира ур-Аманетила. Так, указом своего отца и повелителя, первый чародей Вечного Народа отправился в один из самых далеких, пограничных регионов Царства - приносить хоть какую-то пользу с полным запретом на использование нового искусства до тех пор, пока его царственное величие не решит, что эльфам следует делать с новыми знаниями.\n\nВпервые Азериан смог в полной мере оценить, сколь долго его народ решает вопросы.\n\n— Ступай уже прочь. И... скажи остальным, что это скоро прекратится - ни один безумец не будет тратить столько сил ради этой проклятой долины и рассудка её проклятых жителей.\n\n— Так точно, господин! — Ответил обнадеженный Толдир и отправился, наконец, выполнять приказ.\n\nОднако ни в считанные часы, ни днем после, ни в хоть сколько-то приемлемое \"скоро\" колдовская осада не прекратилась - кем бы ни был тот маг-жрец, что нацелился на Арагонд, он явно готов был потратить столько сил ради этой проклятой долины - или чтобы выманить её защитников.\n\nТо, что поначалу было чем-то средним между малым раздражающим фактором для Азериана и невеликой помехой жителям долины, имело все шансы превратиться в природный катаклизм. Кем бы ни был проклятый волшебник имперцев, он знал свое дело - и, как донесли разведчики, четко понимал свою цель.\n\n— ...Вероятно, услышали о кампании Иллантар, господин. Знают, что наши силы сейчас сосредоточены у берегов Эдрегата - вот и осмелели.\n\nВечером третьего дня Азериан сидел в собственных покоях, крупнейшим - и наиболее часто используемым элементом которых был рабочий стол с удобным креслом. Оно, вместе с бокалом вина, составляло один из последних рубежей обороны эльфийского рассудка.\n\n— Гениально, Толдир! Я бы не догадался. Еще новости? Быть может, небо синее? Проклятье, почему вообще войска объединенных Домов не позаботились о защите? Бессмертие в голову ударило? Фаргот...\n\n— Так никто и подумать не мог, что они обогнут Рэйс Харнайт. А повелитель Фаргот, если верить слухам, в этой кампании не участвует...\n\n— Estead! Кого они вообще поставили Первым Воителем? Если бы кто-либо спросил меня...\n\n— Господин, вас бойцы о другом спрашивают. Что мы собираемся делать с колдовством этим? Планируем вылазку?\n\n— Этого от нас и ждут, идиот! Мы не можем сражаться вне границ Царства, я не могу рассеять это Песнью, а приказ Ура не дает мне \"искажать силы мира\", и потому...-\n\nВдруг яркая вспышка за окном на мгновенье ослепила обоих собеседников. Инстинктивно дернувшийся юноша ослабил хватку, и бокал с вином устремился прямо к полу. Во все стороны полетели осколки и красные брызги.\n\nНа какое-то время повисло напряженное молчание.\n\n— Мне понадобится пять драгоценных камней высшего качества, благовоние Мириэль и медная чаша. Собери по капле крови с каждого солдата, смешай и добавь вина.\n\nКапитан, опешив, склонил голову.\n\n— Господин, вы... нарушите запрет на колдовство?\n\n— Вовсе нет. Силы *этого* мира искажать я не буду.\n\nК ночи все было готово: капитан обыскал всю крепость, но, и это несколько возвысило его в глазах Азериана, нашел все необходимое. Когда же с \"принеси-подай\" было покончено, чародей строго наказал каждому бойцу сидеть в крепости и не высовываться до тех пор, пока он не скажет обратного.\n\n— Даже, пожалуй, дважды подряд: от вас, идиотов, я ожидаю чего угодно. Повторюсь, закрываете окна, двери, и сидите тихо. Получится - к утру мы будем свободны от этой мерзости.\n\n— А... а если не получится? — Спросила безымянная лучница. Не то чтобы она и впрямь не имела имени - просто она была не Толдиром, а это было единственным именем среди солдат, которое маг удосужился запомнить.\n\n— Это будут мои проблемы. Потом, конечно, ваши... — Азериан задумчиво почесал подбородок. — Но уже меня это к тому моменту касаться не будет. Всё, сгинь!\n\nИ, хвала дисциплине эльфийского войска, солдаты исполнили приказ. Вскоре внутренний двор крепости практически опустел - лишь ритуальные принадлежности, чародей и переминающийся с ноги на ногу капитан гарнизона.\n\n— Этот приказ следует исполнить и с первого раза.\n\n— Да так-то оно так... Вы уверены, что моя помощь не потребуется, господин?\n\n— Потребуется. Ты очень мне поможешь своим материальным отсутствием.\n\nОтчего-то уходящий воин показался Азериану даже несколько опечаленным. Странный он. Но это уж точно не то, чем следовало забивать голову. Нет, сейчас её не следовало забивать вообще ничем.\n\nПодготовка ритуальных принадлежностей - самое то, чтобы очистить сознание. Достав из-за пояса нож, странным жестом Азериан очертил пред собой линию, после чего как-бы переступил за неё. Все прочие мысли остались где-то там, в ином мире - том, что за пределами ритуала.\n\nВот чаша, наполненная кровью и вином. Едва коснувшись лезвием обсидианового ножа собственной ладони, чародей сделал неглубокий надрез. Однако, прежде чем первая капля упала вниз..\n\n— Энро.\n\nСлово - и капля застыла в воздухе. Азериан обвел рукой чашу - замкнул волшебный круг. После, начав то ли напевать, то ли нашептывать заклятья, на ткани самого воздуха он вырезал сложные печати, и лезвие оставляло за собой след голубоватого пламени.\n\n— Зора, Занра, Зарайа!\n\nКровь в чаше начала закипать.\n\n— Эккару, приди, Ульдреккан!\n\nГорсть камней полетела в кипящую кровь. Вспышка вывернула ночь наизнанку - и ужасная участь постигла бы того, кто, не стерпев, моргнул бы хоть на мгновенье.\n\nИз чаши поднялось нечто - туманная фигура с лицом-пустотой и пятью глазами-самоцветами. Создание, привычное к иному существованию - к миру хаотичной магии. Голос его был чуждым всему смертному - словно звон кристаллов о стекло - но нельзя было дрогнуть, и каждая фраза должна была соответствовать ритуалу:\n\n— Кто ты?\n\n— **Мне имя Ульдреккан, о презреннейший из носящих плоть.**\n\n— Кому служишь?\n\n— **Тебе, гнусный колдун.**\n\n— Что можешь дать?\n\n— **Укажу иной цвет, обучу высшему счёту, изничтожу любого чародея.**\n\n— Найдёшь того, кто шьёт небеса?\n\n— **Найду. И принесу гибель.**\n\n— Я даровал тебе глаза - пять камней. Пусть увидят цель. Иди же, убей - и вернись в Запределье немедля.\n\n“**Да будет так.**” — ответ прозвенел внутри черепа. Свет полоснул, и яркая точка сорвалась в небо, следуя за потоками искаженной Силы.\n\nВ этот раз не пришлось даже торговаться - похоже, камни были выбраны на славу. Трижды проведя ритуал Очищения, Азериан с чистой совестью направился в покои. Вероятно, даже если вражеский колдун это переживет, действовать ему придется уже куда как менее нагло - понимая, что противник способен на контратаку. Лишь перед самым уходом тот повернулся и, хлопнув себя по лбу:\n\n— Можете выходить... Можете выходить. Идиоты.\n\nВот теперь день был официально закончен.\n\n## Глава 2\n\nВопреки наиболее оптимистичным ожиданиям, Азериана разбудили не радостные крики, восхваляющие его имя. Вопреки наихудшим, Азериан вообще проснулся.\n\nВ любом из случаев, лучи Сияющей Звезды светили ему прямо в глаза - а значит, вражеский колдун прекратил - либо колдовать, либо вовсе существовать.\n\nУже на выходе из покоев маг столкнулся с кем-то из слуг - совсем молодой эльф, одетый в зеленые цвета, выглядел, отчего-то, и сам слегка позеленевшим и испуганным - заикаясь, он довольно быстро заговорил:\n\n— Г-господин? Вам просили передать...\n\n— Благодарность? Весьма кстати.\n\n— И-имперское войско... Оно у наших стен. Двадцать пять тысяч, говорит, численность! Почти все - урк'ас!\n\nВот как. Похоже, с ответными шутками враг оказался не в ладах. И все же, два с половиной десятка тысяч?\n\n— Раза в четыре больше, чем доносили разведчики... Вот и сражайся потом с портальными чародеями. Так, а от меня вам что надо? Воевать разучились? Иссякли ковенанты? Боевые действия я поручал Толдиру - он полезный идиот, так пусть оправдывает первую половину этого звания.\n\n— Капитан лишь надеялся, что вы поможете...\n\n— Могу морально поддержать. Я маг, а не солдат. Волшебство - даже если бы на мне не лежал запрет - слабо подходит для прямого применения в баталиях.\n\n— К примеру, чем-то вроде того, чем вы сразили их чародея?\n\n— Где моя трость, слуга?\n\nПискнув, посланник убежал прочь. Одной проблемой меньше - вторая же куда серьезней. Несмотря на собственное показное безразличие, чародей примерно понимал: даже с союзными стихийными духами и парой никудышных Певцов в крепости, так просто от осаждающих не избавиться. Конечно, урк'ас - эту мерзотную новинку Белого Святилища - нельзя сравнить с первоклассными легионерами Империи, но сражение выдастся долгим и тяжелым... Пойти книжку почитать, что-ли?\n\nВот уже практически тысячелетие продолжается великая война эльфийского царства с Анурианской Империей - могущественной силой, контролирующей практически весь известный мир. Три четверти Эстренлейда, треть Адон-Тирлейдда; десятки покоренных видов, учитывая новости - по крайней мере три созданных их алхимиками. Около миллиона бойцов, если считать по всему Легиону, величайшие военные кампании, включая древнюю Войну Богоубийц. В теории - ужасающий противник, против которого нет шанса ни у одной из известных сил.\n\nНа практике же... На практике, как ни разу эльфы не могли победить Империю за пределами своих границ, еще ни разу за всю войну имперцы не углубились даже на километр в Вечное Царство - и происходившее сейчас на стенах отлично показывало почему.\n\nБлагословление Древа - практически обещанная победа для эльфийского народа: до тех пор, пока бой идет на их территории. Взирая на происходящее с вершины донжона, Азериан наблюдал, как не знающие усталости воины наносят бесчисленные удары быстрее чем поспевал взгляд. Эльфийским лукам не нужны были снаряды - сам ветер превращался в могучие стрелы, разбрасывавшие врагов - или пронзающие их насквозь, в зависимости от нужды. Даже сами стены крепости, спетой в реальность когда-то одним из Первых Эльфов, изменялись так, чтобы по ним невозможно было взобраться или приставить лестницы.\n\nЭльф довольно ухмыльнулся. Насколько же, должно быть, взбесил Ульдреккан колдуна, что тот повел свои войска в столь самоубийственную атаку? Не надеялся ли он, что сила Древа иссякнет на столь далекой границе? Или, может Белые наделали урк'ас с излишком? Нет, наверное нет - первые имперцы уже начали отступать.\n\nКонечно, в его силах было отдать приказ - и большая часть выживших не доберется до спасительного ущелья. Но... Наверное, сегодня у него хорошее настроение, впервые за долгое, долгое время.\n\nНо вот, стоило имперцам протрубить отступление, и им вторил уже иной рог. На мгновенье Азериан даже не поверил собственным ушам - не иллюзия ли?\n\nВскочив с места, эльф со всей спешкой бросился на стены.\n\nСловно по волшебству, расступались в стороны деревья леса Каэд Финрон, мимо которого сейчас бежали вражеские войска - и первыми из сведенных путей вылетели тысячи метких стрел.\n\nВезде бы чародей узнал это искусство, и везде бы он вспомнил этот звук. Настроение отчего-то резко ухудшилось - вдвое более, когда за своей спиной он услышал шелест ветра.\n\n— Здорово выглядишь, братец. Погодка сегодня хорошая, не правда ли?\n\n— Хорошая, отрицать не буду. — Ответил Азериан после глубокого вздоха, не оборачиваясь - смотря лишь за тем, как выезжающие из леса всадники кавалерийским натиском врезаются в отступающие ряды противника. — Но возможно будет дождь. Ты здесь что забыл, Таулендин?\n\nНаконец, он повернулся. Десять лет - не срок для эльфа, так было ли удивительным то, что даже изумрудный, расшитый серебром плащ беловолосого не изменился - не говоря уже ни о внешности, ни о выражении лица, отчего-то вызывавшем в маге
